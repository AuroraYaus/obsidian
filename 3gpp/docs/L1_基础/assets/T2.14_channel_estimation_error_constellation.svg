<text x="663" y="246" font-size="12" text-anchor="middle" class="free" fill="#AD1457">误判：落入相邻判决区</text>
<text x="670" y="476" font-size="12" text-anchor="middle" class="free">残余相位把整片星座旋转约 18°；幅度残差扩大散布 → 越界误判</text>
<rect x="60" y="520" width="380" height="100" rx="6" fill="#FFFFFF" stroke="#3F51B5" stroke-width="1.4"/>
<text x="76" y="542" font-size="14" text-anchor="start" class="free" font-weight="bold" fill="#3F51B5">为什么 256QAM 更敏感</text>
<text x="76" y="566" font-size="13" text-anchor="start" class="free">256QAM 归一化星座间距 d_min ≈ 0.15（2/√170）</text>
<text x="76" y="590" font-size="13" text-anchor="start" class="free">估计偏差超过 d_min/2 ≈ 0.08 即硬判决翻转</text>
<text x="76" y="612" font-size="13" text-anchor="start" class="free">相位残差 → 旋转；幅度残差 → 缩放</text>
<rect x="480" y="520" width="380" height="100" rx="6" fill="#FFFFFF" stroke="#00897B" stroke-width="1.4"/>
<text x="496" y="542" font-size="14" text-anchor="start" class="free" font-weight="bold" fill="#00897B">诊断字段（接收机）</text>
<text x="496" y="566" font-size="13" text-anchor="start" class="free">pilot residual 与 data EVM 分开记录</text>
<text x="496" y="590" font-size="13" text-anchor="start" class="free">Ĥ 幅相 heatmap：按 PRB × 符号展开</text>
<text x="496" y="612" font-size="13" text-anchor="start" class="free">频域条纹 → 插值问题；时域条纹 → Doppler</text>
<text x="450" y="642" font-size="12" text-anchor="middle" class="free">仿真验证：同时跑 perfect 与 practical 两条曲线，差值即信道估计损失</text>
