<?xml version="1.0" encoding="UTF-8"?>
<!--
  @file    T2.14_channel_estimation_error_constellation.svg
  @brief   理想估计 vs 欠采样估计（快速衰落 + 稀疏 DM-RS）均衡后星座对比：相位残差旋转、幅度残差缩放、判决翻转
  @date    2026-08-04
  @note    ① 左面板：理想估计（低速/高密度 DM-RS），均衡后点紧贴发送星座，全部正确判决；
② 右面板：欠采样估计（快速衰落），残余相位把整片星座旋转约 18°，个别点越过判决边界 → 误判；
③ 空心圆 = 发送星座参考位置；实心点 = 均衡后接收点；
④ 底部：256QAM 敏感性与接收机诊断字段。
-->
