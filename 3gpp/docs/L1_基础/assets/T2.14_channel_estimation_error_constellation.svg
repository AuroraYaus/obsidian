<text x="450" y="58" font-size="12" text-anchor="middle" class="free">Ĥ 幅度误差 → 星座缩放；Ĥ 相位误差 → 星座旋转；快衰落 + 稀疏 DM-RS 时插值跟不上 → 判决错误</text>
