<!--
@file    T2.11_csi_measurement_report_loop.svg
@brief   CSI 测量→报告→调度闭环（环形布局）：CSI-RS 发送、UE 信道/干扰测量、
         SINR→CQI 计算、PUCCH/PUSCH 上报、gNB 调度与下一次 PDSCH 传输，
         中心为 CQI 错误率目标，底部为协议强制与实现自由度边界
@date    2026-08-04
@note    条款依据：TS 38.211 §7.4.1.5（CSI-RS 序列/端口/密度）、
         TS 38.214 §5.2.2.4（CSI-IM）、§5.2.3/5.2.4（PUSCH/PUCCH 上报）、
         §5.2.2.1（CQI 错误率目标 0.1 / 0.00001）、TS 38.215 §5.1.6（CSI-SINR）。
         闭环语义：测量 → 计算 → 上报 → 调度 → 传输 → 再测量。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" width="960" height="680">
<rect width="960" height="680" fill="#ffffff"/>
<style>
.title { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 19px; font-weight: bold; fill: #1A237E; }
.stitle { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 15px; font-weight: bold; fill: #1A237E; }
.label { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 14px; fill: #222; }
.small { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 12px; fill: #546E7A; }
.mono { font-family: "DejaVu Sans Mono", monospace; font-size: 13px; fill: #37474F; }
.node { fill: #E8EAF6; stroke: #283593; stroke-width: 1.4; }
.node-b { fill: #FBE9E7; stroke: #B71C1C; stroke-width: 1.4; }
.ringarc { stroke: #5C6BC0; stroke-width: 2; fill: none; }
.center { fill: #FFF8E1; stroke: #F9A825; stroke-width: 2; }
.band-l { fill: #E8EAF6; stroke: #283593; stroke-width: 1.2; }
.band-r { fill: #EDE7F6; stroke: #6A1B9A; stroke-width: 1.2; }
</style>

<text x="480" y="30" text-anchor="middle" class="title">CSI 测量→报告→调度闭环</text>
<text x="480" y="54" text-anchor="middle" class="small">链路自适应：CSI-RS 测量 → SINR/CQI 计算 → PUCCH/PUSCH 上报 → gNB 调度 MCS → 下一次 PDSCH</text>

<rect x="386" y="86" width="188" height="78" rx="12" class="node"/>
<text x="480" y="110" text-anchor="middle" class="label">① gNB 发送 CSI-RS</text>
<text x="480" y="130" text-anchor="middle" class="small">TS 38.211 §7.4.1.5</text>
<text x="480" y="148" text-anchor="middle" class="small">序列 r(m)、端口 3000+、密度 ρ</text>

<rect x="581" y="194" width="170" height="78" rx="12" class="node"/>
<text x="666" y="218" text-anchor="middle" class="label">② UE 测量</text>
<text x="666" y="238" text-anchor="middle" class="small">CSI-RS 估信道</text>
<text x="666" y="256" text-anchor="middle" class="small">CSI-IM 测干扰（§5.2.2.4）</text>

<rect x="581" y="409" width="170" height="78" rx="12" class="node"/>
<text x="666" y="433" text-anchor="middle" class="label">③ UE 计算 SINR→CQI</text>
<text x="666" y="453" text-anchor="middle" class="small">CSI-SINR 定义 §5.1.6</text>
<text x="666" y="471" text-anchor="middle" class="small">映射＝UE 自由度</text>

<rect x="395" y="516" width="170" height="78" rx="12" class="node-b"/>
<text x="480" y="540" text-anchor="middle" class="label">④ UE 上报 CSI</text>
<text x="480" y="560" text-anchor="middle" class="small">PUCCH：周期/半持续</text>
<text x="480" y="578" text-anchor="middle" class="small">PUSCH：非周期（DCI 触发）</text>

<rect x="209" y="409" width="170" height="78" rx="12" class="node"/>
<text x="294" y="433" text-anchor="middle" class="label">⑤ gNB 调度器</text>
<text x="294" y="453" text-anchor="middle" class="small">CQI→MCS 与目标码率</text>
<text x="294" y="471" text-anchor="middle" class="small">PMI/RI→预编码/层数</text>

<rect x="209" y="194" width="170" height="78" rx="12" class="node"/>
<text x="294" y="218" text-anchor="middle" class="label">⑥ PDSCH+下次 CSI-RS</text>
<text x="294" y="238" text-anchor="middle" class="small">按新 MCS 传数据</text>
<text x="294" y="256" text-anchor="middle" class="small">UE 均衡→软解调→译码</text>

<path d="M569.9,117.5 A240 240 0 0 1 640.6,161.7" class="ringarc"/>
<polygon points="640.6,161.7 628.4,157.4 635.0,150.0" fill="#5C6BC0"/>
<path d="M716.4,298.3 A240 240 0 0 1 716.4,381.7" class="ringarc"/>
<polygon points="716.4,381.7 713.5,369.0 723.4,370.7" fill="#5C6BC0"/>
<path d="M640.6,518.3 A240 240 0 0 1 569.9,562.5" class="ringarc"/>
<polygon points="569.9,562.5 579.1,553.4 582.9,562.6" fill="#5C6BC0"/>
<path d="M390.1,562.5 A240 240 0 0 1 319.4,518.3" class="ringarc"/>
<polygon points="319.4,518.3 331.6,522.6 325.0,530.0" fill="#5C6BC0"/>
<path d="M243.6,381.7 A240 240 0 0 1 243.6,298.3" class="ringarc"/>
<polygon points="243.6,298.3 246.5,311.0 236.6,309.3" fill="#5C6BC0"/>
<path d="M325.7,156.1 A240 240 0 0 1 397.9,114.5" class="ringarc"/>
<polygon points="397.9,114.5 388.3,123.3 384.9,113.9" fill="#5C6BC0"/>

<circle cx="480" cy="340" r="95" class="center"/>
<text x="480" y="320" text-anchor="middle" class="stitle" fill="#F57F17">CQI 错误率目标</text>
<text x="480" y="342" text-anchor="middle" class="mono">≤ 0.1（table1/2/4）</text>
<text x="480" y="362" text-anchor="middle" class="mono">≤ 0.00001（table3）</text>
<text x="480" y="384" text-anchor="middle" class="small">SINR→CQI 映射＝UE 自由度</text>

<rect x="60" y="620" width="400" height="50" rx="8" class="band-l"/>
<text x="76" y="640" class="label" fill="#283593">协议强制：CSI-RS 结构、报告字段/格式/周期/触发、测量定义</text>
<text x="76" y="660" class="small">TS 38.211 §7.4.1.5 · TS 38.214 §5.2 · TS 38.215 §5.1</text>

<rect x="500" y="620" width="400" height="50" rx="8" class="band-r"/>
<text x="516" y="640" class="label" fill="#6A1B9A">接收机实现自由度：均衡算法、SINR 估计器、CQI 映射、LLR 缩放</text>
<text x="516" y="660" class="small">ZF / MMSE / IRC 选择 · 平滑与粒度 · PMI 搜索</text>
</svg>
