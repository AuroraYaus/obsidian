<?xml version="1.0" encoding="UTF-8"?>
<!--
  @file    T2.0_time_frequency_four_views.svg
  @brief   同一 OFDM 符号的四种视角：频域线谱 / 时域波形 / 星座 / 资源网格
  @date    2026-08-04
  @note    N=4、QPSK 教学例（X_k = {1+j, -1-j, 1-j, -1+j}）。四个面板描述同一组
           复数符号 X_k 的不同投影：线谱看幅度、波形看叠加、星座看复数位置、
           资源网格看时间×频率的二维承载。依据 T2.1 基准图规格。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img">
  <title>同一 OFDM 符号的四种视角</title>
  <rect width="960" height="640" fill="#ffffff"/>
  <style>
    .title { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 18px; font-weight: bold; fill: #111; }
    .label { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 14px; fill: #222; }
    .small { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 12px; fill: #555; }
    .mono { font-family: monospace; font-size: 12px; fill: #333; }
    .axis { stroke: #444; stroke-width: 1.2; }
  </style>
  <text x="480" y="30" text-anchor="middle" class="title">同一 OFDM 符号的四种视角（N=4、QPSK）</text>
  <text x="480" y="52" text-anchor="middle" class="small">X_k = {1+j, -1-j, 1-j, -1+j}：四种视角看的是同一组符号，只是投影不同</text>

  <!-- 面板 A：频域线谱（左 60..470, 75..350） -->
  <rect x="60" y="75" width="400" height="275" rx="8" fill="#F4FAF8" stroke="#00897B" stroke-width="1.3"/>
  <text x="82" y="102" class="label" font-weight="bold" fill="#00695C">A 频域：X(k) 每个子载波一个符号</text>
  <text x="82" y="122" class="small">线谱高度 = 幅度 |X_k|（QPSK 全相等）；颜色 = 符号所在象限</text>
  <line x1="100" y1="310" x2="440" y2="310" stroke="#90A4AE" stroke-width="1.2"/>
  <line x1="150" y1="260" x2="150" y2="310" stroke="#00897B" stroke-width="14"/>
  <line x1="220" y1="260" x2="220" y2="310" stroke="#7B1FA2" stroke-width="14"/>
  <line x1="290" y1="260" x2="290" y2="310" stroke="#B65B2E" stroke-width="14"/>
  <line x1="360" y1="260" x2="360" y2="310" stroke="#C2185B" stroke-width="14"/>
  <text x="150" y="250" text-anchor="middle" class="mono">1+j</text>
  <text x="220" y="250" text-anchor="middle" class="mono">-1-j</text>
  <text x="290" y="250" text-anchor="middle" class="mono">1-j</text>
  <text x="360" y="250" text-anchor="middle" class="mono">-1+j</text>
  <text x="150" y="326" text-anchor="middle" class="small">f₀</text>
  <text x="220" y="326" text-anchor="middle" class="small">f₁</text>
  <text x="290" y="326" text-anchor="middle" class="small">f₂</text>
  <text x="360" y="326" text-anchor="middle" class="small">f₃</text>
  <text x="265" y="342" text-anchor="middle" class="small">频率 f</text>

  <!-- 面板 B：时域波形（右 490..900, 75..350） -->
  <rect x="500" y="75" width="400" height="275" rx="8" fill="#F4F6FA" stroke="#1565C0" stroke-width="1.3"/>
  <text x="512" y="102" class="label" font-weight="bold" fill="#0D47A1">B 时域：x(t) 全部子载波叠加的波形（IFFT 合成）</text>
  <text x="512" y="122" class="small">IFFT 合成（实部）：每个时刻是全部 X_k 的叠加，实际发射的波形</text>
