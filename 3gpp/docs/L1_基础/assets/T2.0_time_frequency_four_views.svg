    <text x="520" y="326" text-anchor="middle" class="small">t=0</text>
  <text x="870" y="326" text-anchor="middle" class="small">t=T_u</text>
  <text x="700" y="342" text-anchor="middle" class="small">时间 t</text>

  <!-- 面板 C：星座（左 60..470, 370..610） -->
  <rect x="60" y="370" width="400" height="240" rx="8" fill="#FDF8F4" stroke="#B65B2E" stroke-width="1.3"/>
  <text x="82" y="397" class="label" font-weight="bold" fill="#BF360C">C 复平面：每个 X_k 是一个复数点</text>
  <text x="82" y="417" class="small">X_k 的位置（幅度+相位）决定它在时域波形里的贡献</text>
  <line x1="130" y1="505" x2="400" y2="505" stroke="#B0BEC5" stroke-width="1"/>
  <line x1="265" y1="430" x2="265" y2="580" stroke="#B0BEC5" stroke-width="1"/>
  <line x1="130" y1="505" x2="400" y2="505" stroke="#B0BEC5" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="265" y1="430" x2="265" y2="580" stroke="#B0BEC5" stroke-width="1" stroke-dasharray="5,5"/>
  <circle cx="310" cy="455" r="5" fill="#00897B"/>
  <circle cx="220" cy="555" r="5" fill="#7B1FA2"/>
  <circle cx="310" cy="555" r="5" fill="#B65B2E"/>
  <circle cx="220" cy="455" r="5" fill="#C2185B"/>
  <text x="322" y="452" class="mono">X₀=1+j</text>
  <text x="198" y="572" class="mono">X₁=-1-j</text>
  <text x="322" y="572" class="mono">X₂=1-j</text>
  <text x="186" y="452" class="mono">X₃=-1+j</text>
  <text x="265" y="598" text-anchor="middle" class="small">实部 I（同相）／虚部 Q（正交）</text>

  <!-- 面板 D：资源网格（右 490..900, 370..610） -->
  <rect x="500" y="370" width="400" height="240" rx="8" fill="#F8F4FD" stroke="#7B1FA2" stroke-width="1.3"/>
  <text x="512" y="397" class="label" font-weight="bold" fill="#4A148C">D 资源网格：时间 × 频率的二维承载</text>
  <text class="small"><tspan x="512" y="417">横轴 = 符号（时间）、纵轴 = 子载波（频率）</tspan><tspan x="512" y="436">每格一个 RE 装一个 X_k</tspan></text>
  <g>
