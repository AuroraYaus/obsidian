<?xml version="1.0" encoding="UTF-8"?>
<!-- @file    T2.12_2x2_mimo_channel_model.svg -->
<!-- @brief   2×2 MIMO 每 RE 接收模型：层符号 x0/x1 经信道矩阵 H（2×2）混合加噪声 n，
             得到接收观测 y0/y1；对角线元素为目标路径、交叉元素为层间干扰。 -->
<!-- @date    2026-08-04 -->
<!-- @note    教学示意图，数值取自 T2.12 讲义数值示例：H=[[1,0.3],[0.2,0.9]]，x=[1,−1]^T，
             无噪声时 y=[0.7,−0.7]^T。h_ji 表示第 i 根发射（层）到第 j 根接收天线的信道增益。
             语义色系（本节自定）：发送层=靛蓝，接收观测=紫，目标/对角线项=青绿，
             干扰/交叉项=橙，噪声=灰蓝。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560">
<rect width="960" height="560" fill="#ffffff"/>
<style>
.title { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 19px; font-weight: bold; fill: #111; }
.label { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 14px; fill: #222; }
.small { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 12px; fill: #555; }
.mono { font-family: monospace; font-size: 13px; fill: #333; }
.arrowline { stroke: #546E7A; stroke-width: 1.6; }
.txbox { fill: #E8EAF6; stroke: #3949AB; stroke-width: 1.4; rx: 5; }
.rxbox { fill: #F3E5F5; stroke: #6A1B9A; stroke-width: 1.4; rx: 5; }
.hframe { fill: #FAFAFA; stroke: #37474F; stroke-width: 1.8; rx: 6; }
.hdiag { fill: #B2DFDB; stroke: #00796B; stroke-width: 1.4; }
.hcross { fill: #FFE0B2; stroke: #EF6C00; stroke-width: 1.4; }
.nbox { fill: #ECEFF1; stroke: #607D8B; stroke-width: 1.2; rx: 4; }
.legendbox { fill: #fff; stroke: none; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#546E7A"/>
  </marker>
</defs>

<text x="480" y="30" text-anchor="middle" class="title">2×2 MIMO 每 RE 接收模型：y = Hx + n</text>
<text x="480" y="54" text-anchor="middle" class="small">每个 RE 上，2 个发送层经 2×2 信道矩阵混合，每根接收天线收到"目标信号 + 层间干扰 + 噪声"</text>

<!-- 发送列 -->
<text x="130" y="88" text-anchor="middle" class="label">发送层</text>
<rect x="50" y="100" width="160" height="64" class="txbox"/>
<text x="130" y="124" text-anchor="middle" class="label" fill="#3949AB">层符号 x0</text>
<text x="130" y="148" text-anchor="middle" class="mono">x0 = 1</text>
<rect x="50" y="230" width="160" height="64" class="txbox"/>
<text x="130" y="254" text-anchor="middle" class="label" fill="#3949AB">层符号 x1</text>
<text x="130" y="278" text-anchor="middle" class="mono">x1 = -1</text>

<!-- 信道矩阵 -->
<text x="520" y="78" text-anchor="middle" class="label">信道矩阵 H（每 RE 变化）</text>
<rect x="400" y="90" width="240" height="210" class="hframe"/>
<rect x="410" y="120" width="105" height="72" class="hdiag"/>
<rect x="525" y="120" width="105" height="72" class="hcross"/>
<rect x="410" y="215" width="105" height="72" class="hcross"/>
<rect x="525" y="215" width="105" height="72" class="hdiag"/>
<text x="462" y="152" text-anchor="middle" class="mono" fill="#00695C">h00 = 1</text>
<text x="462" y="174" text-anchor="middle" class="small" fill="#00695C">目标</text>
<text x="577" y="152" text-anchor="middle" class="mono" fill="#E65100">h01 = 0.3</text>
<text x="577" y="174" text-anchor="middle" class="small" fill="#E65100">干扰</text>
<text x="462" y="247" text-anchor="middle" class="mono" fill="#E65100">h10 = 0.2</text>
<text x="462" y="269" text-anchor="middle" class="small" fill="#E65100">干扰</text>
<text x="577" y="247" text-anchor="middle" class="mono" fill="#00695C">h11 = 0.9</text>
<text x="577" y="269" text-anchor="middle" class="small" fill="#00695C">目标</text>
<text x="520" y="324" text-anchor="middle" class="small">行 = 接收天线；列 = 发送层；h_ji：第 i 层到第 j 根接收天线的增益</text>

<!-- 接收列 -->
<text x="865" y="88" text-anchor="middle" class="label">接收观测</text>
<rect x="790" y="100" width="160" height="64" class="rxbox"/>
<text x="870" y="124" text-anchor="middle" class="label" fill="#6A1B9A">观测 y0</text>
<text x="870" y="148" text-anchor="middle" class="mono">y0 = 0.7</text>
<rect x="790" y="230" width="160" height="64" class="rxbox"/>
<text x="870" y="254" text-anchor="middle" class="label" fill="#6A1B9A">观测 y1</text>
<text x="870" y="278" text-anchor="middle" class="mono">y1 = -0.7</text>

<!-- 束线：发送 → 矩阵 -->
<line x1="210" y1="132" x2="380" y2="132" class="arrowline"/>
<line x1="380" y1="132" x2="380" y2="156" class="arrowline"/>
<line x1="380" y1="156" x2="400" y2="156" class="arrowline" marker-end="url(#arrow)"/>
<line x1="210" y1="262" x2="380" y2="262" class="arrowline"/>
<line x1="380" y1="262" x2="380" y2="251" class="arrowline"/>
<line x1="380" y1="251" x2="400" y2="251" class="arrowline" marker-end="url(#arrow)"/>
<!-- 束线：矩阵 → 接收 -->
<line x1="640" y1="156" x2="640" y2="132" class="arrowline"/>
<line x1="640" y1="132" x2="790" y2="132" class="arrowline" marker-end="url(#arrow)"/>
<line x1="640" y1="251" x2="640" y2="262" class="arrowline"/>
<line x1="640" y1="262" x2="790" y2="262" class="arrowline" marker-end="url(#arrow)"/>

<!-- 噪声 -->
<rect x="850" y="26" width="90" height="36" class="nbox"/>
<text x="895" y="50" text-anchor="middle" class="small">噪声 n0</text>
<line x1="895" y1="62" x2="895" y2="100" class="arrowline" marker-end="url(#arrow)"/>
<rect x="850" y="356" width="90" height="36" class="nbox"/>
<text x="895" y="380" text-anchor="middle" class="small">噪声 n1</text>
<line x1="895" y1="356" x2="895" y2="294" class="arrowline" marker-end="url(#arrow)"/>

<!-- 底部公式与图例 -->
<text x="480" y="426" text-anchor="middle" class="label">每根接收天线看到的是"混合结果"，必须用整个 H 才能分离两层：</text>
<text x="480" y="452" text-anchor="middle" class="mono"><tspan fill="#00796B">y0 = h00·x0</tspan><tspan fill="#EF6C00"> + h01·x1</tspan><tspan fill="#607D8B"> + n0 = 1·1 + 0.3·(-1) = 0.7（无噪声）</tspan></text>
<text x="480" y="476" text-anchor="middle" class="mono"><tspan fill="#00796B">y1 = h10·x0</tspan><tspan fill="#EF6C00"> + h11·x1</tspan><tspan fill="#607D8B"> + n1 = 0.2·1 + 0.9·(-1) = -0.7（无噪声）</tspan></text>
<rect x="330" y="506" width="18" height="14" class="legendbox" fill="#B2DFDB" stroke="#00796B"/>
<text x="356" y="518" class="small">目标路径（对角线 h00, h11）</text>
<rect x="560" y="506" width="18" height="14" fill="#FFE0B2" stroke="#EF6C00"/>
<text x="586" y="518" class="small">层间干扰（交叉项 h01, h10）</text>
<rect x="800" y="506" width="18" height="14" fill="#ECEFF1" stroke="#607D8B"/>
<text x="826" y="518" class="small">噪声 n0, n1</text>
</svg>
