<rect x="350" y="480" width="530" height="74" rx="6" fill="#FFFFFF" stroke="#AD1457" stroke-width="1.4"/>
<text x="368" y="500" font-size="13" text-anchor="start" class="free" font-weight="bold" fill="#AD1457">欠采样判据（插值失效边界）</text>
<text x="368" y="524" font-size="12" text-anchor="start" class="free">频域：相干带宽 B_c &lt; 2×Δk×SCS → 频域欠采样</text>
<text x="368" y="546" font-size="12" text-anchor="start" class="free">时域：相干时间 T_c &lt; Δl×T_sym → 时域欠采样</text>
<text x="350" y="580" font-size="13" text-anchor="start" class="free" font-weight="bold">插值器选项（接收机实现自由度）</text>
<text x="350" y="598" font-size="12" text-anchor="start" class="free">线性插值：简单，但假设强；DFT 插值：时域加窗截断</text>
<text x="350" y="620" font-size="12" text-anchor="start" class="free">MMSE/Wiener：最优，但需信道统计与矩阵求逆</text>
<text x="228" y="660" font-size="12" text-anchor="middle" class="free">实色 = 导频位置（已得 Ĥ_LS）；空白 = 待插值的数据 RE</text>
