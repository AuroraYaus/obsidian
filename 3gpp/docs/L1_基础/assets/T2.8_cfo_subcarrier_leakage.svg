<text x="480" y="34" text-anchor="middle" class="free" font-size="17" fill="#111" font-weight="bold">CFO 破坏子载波正交性：FFT 采样点偏移与频谱泄漏（ICI）</text><text x="480" y="60" text-anchor="middle" class="free" font-size="12" fill="#555">每个子载波的频谱是 sinc 形状，FFT 在整数倍 Δf 处采样；频偏 ε 使整条谱偏移 ε·Δf，采样点不再对齐零点</text><defs><path id="sinc0" d="M-165,-24.1916 L-163.68,-24.3385 L-162.36,-24.3911 L-161.04,-24.3474 L-159.72,-24.2061 L-158.4,-23.9662 L-157.08,-23.6268 L-155.76,-23.1877 L-154.44,-22.6487 L-153.12,-22.0103 L-151.8,-21.2732 L-150.48,-20.4385 L-149.16,-19.5076 L-147.84,-18.4824 L-146.52,-17.3652 L-145.2,-16.1585 L-143.88,-14.8652 L-142.56,-13.4889 L-141.24,-12.033 L-139.92,-10.5018 L-138.6,-8.89952 L-137.28,-7.231 L-135.96,-5.50127 L-134.64,-3.71569 L-133.32,-1.87995 L-132,6.11226e-14 L-130.68,1.91793 L-129.36,3.86735 L-128.04,5.84155 L-126.72,7.83359 L-125.4,9.83632 L-124.08,11.8424 L-122.76,13.8444 L-121.44,15.8347 L-120.12,17.8056 L-118.8,19.7492 L-117.48,21.6577 L-116.16,23.5231 L-114.84,25.3375 L-113.52,27.0929 L-112.2,28.7814 L-110.88,30.3952 L-109.56,31.9265 L-108.24,33.3676 L-106.92,34.711 L-105.6,35.9493 L-104.28,37.0752 L-102.96,38.0818 L-101.64,38.9623 L-100.32,39.7102 L-99,40.3193 L-97.68,40.7835 L-96.36,41.0972 L-95.04,41.2553 L-93.72,41.2527 L-92.4,41.0849 L-91.08,40.7477 L-89.76,40.2374 L-88.44,39.5508 L-87.12,38.6849 L-85.8,37.6373 L-84.48,36.4061 L-83.16,34.9898 L-81.84,33.3876 L-80.52,31.5989 L-79.2,29.6238 L-77.88,27.4629 L-76.56,25.1172 L-75.24,22.5883 L-73.92,19.8784 L-72.6,16.99 L-71.28,13.9264 L-69.96,10.6911 L-68.64,7.28847 L-67.32,3.72304 L-66,-2.49129e-13 L-64.68,-3.875 L-63.36,-7.89585 L-62.04,-12.056 L-60.72,-16.3484 L-59.4,-20.7656 L-58.08,-25.2997 L-56.76,-29.9426 L-55.44,-34.6856 L-54.12,-39.5198 L-52.8,-44.4357 L-51.48,-49.424 L-50.16,-54.4745 L-48.84,-59.5773 L-47.52,-64.7219 L-46.2,-69.8978 L-44.88,-75.0941 L-43.56,-80.3001 L-42.24,-85.5046 L-40.92,-90.6965 L-39.6,-95.8647 L-38.28,-100.998 L-36.96,-106.085 L-35.64,-111.115 L-34.32,-116.076 L-33,-120.958 L