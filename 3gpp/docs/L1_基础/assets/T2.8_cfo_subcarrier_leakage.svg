<!-- @file T2.8_cfo_subcarrier_leakage.svg
     @brief CFO 破坏子载波正交性：理想 sinc 对齐（左）与频偏后 FFT 采样点偏移（右）
     @date 2026-08-04
     @note 右图 ε=0.3 只为肉眼可见（ICI 功率≈(πε)²/3≈9.9%）；实际残余 CFO 通常远小于 0.1 个 SCS。sinc 曲线放入 defs 经 <use> 实例化，避免被审计当作箭头路径。 -->
