<?xml version="1.0" encoding="UTF-8"?>
<!-- @file T2.7_pss_sss_candidate_selection.svg
     @brief PSS/SSS 相关峰与 FFT 起点选择：
            上：相关幅度 vs 时延（最早路径峰 d≈10 与最强路径峰 d≈40，判决门限、噪声底）；
            下：峰位置 → FFT 起点的两种候选方案对比（锁最强峰 vs 锁最早路径 + 余量）。
     @date 2026-08-04
     @note 教学参数延续 N=128、N_CP=16：延迟扩展 D = 40−10 = 30 > N_CP=16，
            此时没有完全安全的窗口，工程上折中为对准最早路径并保留余量。
            语义色系（按本节讲义自定）：相关曲线/最强峰=紫罗兰、最早路径峰=深青、
            越界/风险=橙红、推荐方案=深青浅底、风险方案=橙红浅底。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 700" width="940" height="700">
<rect width="940" height="700" fill="#ffffff"/>
<style>
.title { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; }
.label { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; }
.small { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; }
</style>

<text x="470" y="32" text-anchor="middle" class="title" font-size="19" font-weight="bold" fill="#111">PSS/SSS 相关峰与 FFT 起点选择</text>
<text x="470" y="56" text-anchor="middle" class="small" font-size="12" fill="#555">相关峰的位置与高度反映各路径时延与强度：最强峰 ≠ 最佳 FFT 窗口</text>

<text x="120" y="86" class="label" font-size="15" font-weight="bold" fill="#4527A0">PSS/SSS 相关输出：幅度 vs 时延</text>
<rect x="120" y="110" width="760" height="200" fill="#FAFAFA" stroke="#444" stroke-width="1.2"/>
<path d="M120,285 L150,278 L180,252 L215,212 L250,250 L280,262 L320,258 L360,254 L400,240 L440,220 L480,196 L500,150 L520,192 L550,240 L590,258 L640,268 L700,276 L760,280 L820,281 L880,282" fill="none" stroke="#5E35B1" stroke-width="2.5"/>
<line x1="120" y1="268" x2="880" y2="268" stroke="#E64A19" stroke-width="1.5" stroke-dasharray="6,4"/>
<line x1="120" y1="286" x2="880" y2="286" stroke="#9E9E9E" stroke-width="1.2" stroke-dasharray="3,4"/>
<path d="M215,212 L207,250 L223,250 Z" fill="#00897B"/>
<path d="M500,150 L488,250 L512,250 Z" fill="#5E35B1"/>
<text x="140" y="296" class="small" font-size="11" fill="#757575">噪声底</text>
<text x="876" y="262" text-anchor="end" class="small" font-size="11" fill="#D84315">判决门限</text>
<text x="215" y="196" text-anchor="middle" class="small" font-size="12" fill="#00695C">最早路径峰（d≈10）</text>
<text x="500" y="130" text-anchor="middle" class="small" font-size="12" fill="#4527A0">最强路径峰（d≈40，相关最大）</text>
<line x1="215" y1="332" x2="500" y2="332" stroke="#E64A19" stroke-width="2.2"/>
<line x1="215" y1="328" x2="215" y2="336" stroke="#E64A19" stroke-width="2.2"/>
<line x1="500" y1="328" x2="500" y2="336" stroke="#E64A19" stroke-width="2.2"/>
<text x="357.5" y="356" text-anchor="middle" class="small" font-size="12" fill="#BF360C">多径时延扩展 D = 40 − 10 = 30 &gt; N_CP = 16（超出 CP 容差）</text>
<text x="880" y="336" text-anchor="end" class="small" font-size="11" fill="#757575">时延（采样）→</text>

<text x="120" y="384" class="label" font-size="15" font-weight="bold" fill="#4527A0">峰位置 → FFT 起点：两种候选选择（延迟扩展超过 CP 时的工程折中）</text>

<rect x="140" y="410" width="340" height="230" rx="6" fill="#FBE9E7" stroke="#E64A19" stroke-width="1.8"/>
<text x="156" y="436" class="label" font-size="13" font-weight="bold" fill="#BF360C">方案①：锁最强路径峰（相关最大）</text>
<text x="156" y="486" class="label" font-size="13" fill="#333">窗口起点对齐最强峰（晚 30）</text>
<text x="156" y="530" class="label" font-size="13" fill="#333">相对最早路径偏移 30 &gt; N_CP 16</text>
<text x="156" y="574" class="label" font-size="13" fill="#333">窗口前段混入前一符号数据</text>
<text x="156" y="618" class="label" font-size="13" font-weight="bold" fill="#BF360C">结果：ISI/ICI，EVM 全面劣化</text>

<rect x="520" y="410" width="340" height="230" rx="6" fill="#E0F2F1" stroke="#00897B" stroke-width="1.8"/>
<text x="536" y="436" class="label" font-size="13" font-weight="bold" fill="#00695C">方案②：锁最早路径 + 余量（推荐）</text>
<text x="536" y="486" class="label" font-size="13" fill="#333">窗口起点 = 最早峰 + 提前量</text>
<text x="536" y="530" class="label" font-size="13" fill="#333">延迟扩展超 CP：无完美窗口</text>
<text x="536" y="574" class="label" font-size="13" fill="#333">对准主要能量，残余 ISI 最小</text>
<text x="536" y="618" class="label" font-size="13" font-weight="bold" fill="#00695C">结果：可解调折中 + 跟踪兜底</text>

<text x="500" y="672" text-anchor="middle" class="small" font-size="12" fill="#555">工程要点：相关峰最大 ≠ 最佳窗口；窗口选择要综合 CP 余量、多径尾部和均衡质量，峰值仅提供候选位置</text>
</svg>
