<?xml version="1.0" encoding="UTF-8"?>
<!-- @file    T2.16_layer_mapping_ports.svg -->
<!-- @brief   码字→层→天线端口映射流程（NR 下行示例）：泳道 A 为 1 码字分 2 层，
             泳道 B 为 2 码字分 4 层；层→端口为恒等映射，端口数=层数，天线数可大于端口数。 -->
<!-- @date    2026-08-04 -->
<!-- @note    教学示意图。串接规则取自 TS 38.211 表 7.3.1.3-1；层→端口恒等映射取自
             TS 38.211 §7.3.1.4（抽取件中该公式为 OLE 图片，图中 y(p_λ)=x(λ) 为文本近似恢复）；
             DL 端口集合由 DCI Antenna ports 字段确定（TS 38.212 §7.3.1.2.2）。
             语义色系（本节自定）：码字=靛蓝，层=深青，端口=橙，天线=石板灰。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660">
<rect width="960" height="660" fill="#ffffff"/>
<style>
.title { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 19px; font-weight: bold; fill: #111; }
.label { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 14px; fill: #222; }
.small { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 12px; fill: #555; }
.mono { font-family: monospace; font-size: 13px; fill: #333; }
.arrowline { stroke: #546E7A; stroke-width: 1.6; }
.cwbox { fill: #E8EAF6; stroke: #3949AB; stroke-width: 1.4; rx: 5; }
.layerbox { fill: #E0F7FA; stroke: #00838F; stroke-width: 1.4; rx: 5; }
.portbox { fill: #FFF3E0; stroke: #EF6C00; stroke-width: 1.4; rx: 5; }
.antbox { fill: #ECEFF1; stroke: #546E7A; stroke-width: 1.2; rx: 3; }
.gridline { stroke: #B0BEC5; stroke-width: 1; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#546E7A"/>
  </marker>
</defs>

<text x="480" y="30" text-anchor="middle" class="title">码字→层→天线端口映射（NR 下行示例）</text>
<text x="480" y="54" text-anchor="middle" class="small">上层：1 个码字分 2 层（串接交错）；下层：2 个码字分 4 层。层→端口为恒等映射，端口数 = 层数</text>

<text x="40" y="88" class="label">泳道 A：1 个码字 → 2 层 → 2 端口</text>

<!-- 泳道 A：码字 -->
<rect x="40" y="108" width="170" height="64" class="cwbox"/>
<text x="125" y="132" text-anchor="middle" class="label" fill="#3949AB">码字 cw0</text>
<text x="125" y="154" text-anchor="middle" class="mono">d(0) d(1) d(2)…</text>
<line x1="210" y1="140" x2="300" y2="140" class="arrowline" marker-end="url(#arrow)"/>
<text x="255" y="126" text-anchor="middle" class="small">串接</text>

<!-- 泳道 A：层 -->
<rect x="300" y="108" width="340" height="64" class="layerbox"/>
<line x1="470" y1="108" x2="470" y2="172" class="gridline"/>
<text x="385" y="132" text-anchor="middle" class="label" fill="#00838F">层 x0</text>
<text x="385" y="154" text-anchor="middle" class="small">d(0) d(2) …</text>
<text x="555" y="132" text-anchor="middle" class="label" fill="#00838F">层 x1</text>
<text x="555" y="154" text-anchor="middle" class="small">d(1) d(3) …</text>
<line x1="640" y1="140" x2="700" y2="140" class="arrowline" marker-end="url(#arrow)"/>
<text x="670" y="126" text-anchor="middle" class="small">恒等</text>

<!-- 泳道 A：端口 -->
<rect x="700" y="108" width="220" height="64" class="portbox"/>
<line x1="810" y1="108" x2="810" y2="172" class="gridline"/>
<text x="755" y="132" text-anchor="middle" class="label" fill="#EF6C00">端口 p0</text>
<text x="755" y="154" text-anchor="middle" class="small">端口号 1000</text>
<text x="865" y="132" text-anchor="middle" class="label" fill="#EF6C00">端口 p1</text>
<text x="865" y="154" text-anchor="middle" class="small">端口号 1001</text>

<!-- 泳道 A：天线 -->
<line x1="755" y1="172" x2="755" y2="206" class="arrowline" marker-end="url(#arrow)"/>
<line x1="865" y1="172" x2="865" y2="206" class="arrowline" marker-end="url(#arrow)"/>
<rect x="700" y="206" width="220" height="48" class="antbox"/>
<line x1="755" y1="206" x2="755" y2="254" class="gridline"/>
<line x1="810" y1="206" x2="810" y2="254" class="gridline"/>
<line x1="865" y1="206" x2="865" y2="254" class="gridline"/>
<text x="727" y="232" text-anchor="middle" class="mono">ant0</text>
<text x="782" y="232" text-anchor="middle" class="mono">ant1</text>
<text x="837" y="232" text-anchor="middle" class="mono">ant2</text>
<text x="892" y="232" text-anchor="middle" class="mono">ant3</text>
<text x="480" y="272" text-anchor="middle" class="small">预编码/天线虚拟化：2 个端口 → 4 根物理天线（对 UE 透明）</text>

<text x="40" y="300" class="label">泳道 B：2 个码字 → 4 层 → 4 端口</text>

<!-- 泳道 B：码字 -->
<rect x="40" y="320" width="170" height="64" class="cwbox"/>
<line x1="40" y1="352" x2="210" y2="352" class="gridline"/>
<text x="125" y="344" text-anchor="middle" class="label" fill="#3949AB">码字 cw0</text>
<text x="125" y="376" text-anchor="middle" class="label" fill="#3949AB">码字 cw1</text>
<line x1="210" y1="336" x2="300" y2="336" class="arrowline" marker-end="url(#arrow)"/>
<line x1="210" y1="368" x2="300" y2="368" class="arrowline" marker-end="url(#arrow)"/>

<!-- 泳道 B：层 -->
<rect x="300" y="320" width="340" height="64" class="layerbox"/>
<line x1="385" y1="320" x2="385" y2="384" class="gridline"/>
<line x1="470" y1="320" x2="470" y2="384" class="gridline"/>
<line x1="555" y1="320" x2="555" y2="384" class="gridline"/>
<text x="342" y="344" text-anchor="middle" class="label" fill="#00838F">层 x0</text>
<text x="342" y="368" text-anchor="middle" class="small">来自 cw0</text>
<text x="427" y="344" text-anchor="middle" class="label" fill="#00838F">层 x1</text>
<text x="427" y="368" text-anchor="middle" class="small">来自 cw0</text>
<text x="512" y="344" text-anchor="middle" class="label" fill="#00838F">层 x2</text>
<text x="512" y="368" text-anchor="middle" class="small">来自 cw1</text>
<text x="597" y="344" text-anchor="middle" class="label" fill="#00838F">层 x3</text>
<text x="597" y="368" text-anchor="middle" class="small">来自 cw1</text>
<line x1="640" y1="352" x2="700" y2="352" class="arrowline" marker-end="url(#arrow)"/>

<!-- 泳道 B：端口 -->
<rect x="700" y="320" width="220" height="64" class="portbox"/>
<text x="810" y="344" text-anchor="middle" class="label" fill="#EF6C00">端口 p0 – p3</text>
<text x="810" y="368" text-anchor="middle" class="small">DM-RS 端口 1000–1003</text>
<line x1="810" y1="384" x2="810" y2="418" class="arrowline" marker-end="url(#arrow)"/>

<!-- 泳道 B：天线 -->
<rect x="700" y="418" width="220" height="48" class="antbox"/>
<line x1="755" y1="418" x2="755" y2="466" class="gridline"/>
<line x1="810" y1="418" x2="810" y2="466" class="gridline"/>
<line x1="865" y1="418" x2="865" y2="466" class="gridline"/>
<text x="727" y="444" text-anchor="middle" class="mono">ant0</text>
<text x="782" y="444" text-anchor="middle" class="mono">ant1</text>
<text x="837" y="444" text-anchor="middle" class="mono">ant2</text>
<text x="892" y="444" text-anchor="middle" class="mono">ant3</text>
<text x="480" y="490" text-anchor="middle" class="small">4 层 → 4 端口（层数 = 端口数）；物理天线数可大于端口数</text>

<text x="480" y="526" text-anchor="middle" class="small">串接规则（TS 38.211 表 7.3.1.3-1 第 2 行）：x0(i)=d(2i)、x1(i)=d(2i+1)，每层符号数 M_layer = M_symb/2</text>
<text x="480" y="550" text-anchor="middle" class="small">层→端口恒等映射（TS 38.211 §7.3.1.4）：y(p_λ)=x(λ)，λ=0…υ−1（抽取件中该公式为 OLE 图片，此处为文本近似恢复）</text>
<text x="480" y="574" text-anchor="middle" class="small">端口集合 {p0,…,p_υ−1} 由 DCI 的 Antenna ports 字段确定（TS 38.212 §7.3.1.2.2）；UL 复用同一张表最多 4 层（§6.3.1.3）</text>
<text x="480" y="598" text-anchor="middle" class="small">NR 下行最多 8 层（TS 38.214 §5.1.1.1）；DL 预编码对 UE 透明，UL 预编码 W 由 TPMI 显式指示（TS 38.211 §6.3.1.5）</text>
</svg>
