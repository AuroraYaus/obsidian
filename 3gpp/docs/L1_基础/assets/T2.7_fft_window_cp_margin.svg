<?xml version="1.0" encoding="UTF-8"?>
<!-- @file T2.7_fft_window_cp_margin.svg
     @brief 三种 FFT 起点（A/B/C）与 CP 容差、多径污染区的时序关系图：
            教学参数 N=128、N_CP=16、多径时延 D=10，安全起点区间 [m0-6, m0]。
     @date 2026-08-04
     @note 比例：1 采样 = 4 px。窗口 A 起点在安全区间左边界（余量 0）；
            窗口 B 完全对齐 T_u（余量 6）；窗口 C 越出符号边界 9 采样。
            语义色系（按本节讲义自定）：有用数据区=紫罗兰、CP/保护=深青、
            多径污染/越界=橙红、干净余量=青绿、相邻符号=中性灰。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 540" width="940" height="540">
<rect width="940" height="540" fill="#ffffff"/>
<style>
.title { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; }
.label { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; }
.small { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; }
</style>

<text x="470" y="32" text-anchor="middle" class="title" font-size="19" font-weight="bold" fill="#111">三种 FFT 起点 vs CP 容差与多径时序</text>
<text x="470" y="56" text-anchor="middle" class="small" font-size="12" fill="#555">教学参数：N = 128、N_CP = 16、多径时延 D = 10；安全起点区间 = [m0−6, m0]（干净余量区）</text>

<text x="192" y="84" text-anchor="middle" class="small free" font-size="11" fill="#555">0</text>
<text x="256" y="84" text-anchor="middle" class="small free" font-size="11" fill="#555">16</text>
<text x="768" y="84" text-anchor="middle" class="small free" font-size="11" fill="#555">144</text>
<text x="880" y="84" text-anchor="middle" class="small free" font-size="11" fill="#555">160</text>
<line x1="192" y1="90" x2="192" y2="98" stroke="#888" stroke-width="1.2"/>
<line x1="256" y1="90" x2="256" y2="98" stroke="#888" stroke-width="1.2"/>
<line x1="768" y1="90" x2="768" y2="98" stroke="#888" stroke-width="1.2"/>
<line x1="880" y1="90" x2="880" y2="98" stroke="#888" stroke-width="1.2"/>

<rect x="80" y="100" width="112" height="44" fill="#F5F5F5" stroke="#9E9E9E" stroke-width="1.2"/>
<rect x="192" y="100" width="64" height="44" fill="#E0F2F1" stroke="#00897B" stroke-width="1.5"/>
<rect x="256" y="100" width="512" height="44" fill="#EDE7F6" stroke="#5E35B1" stroke-width="1.5"/>
<rect x="768" y="100" width="112" height="44" fill="#F5F5F5" stroke="#9E9E9E" stroke-width="1.2"/>
<text x="136" y="126" text-anchor="middle" class="label" font-size="13" fill="#424242">符号 N−1</text>
<text x="512" y="126" text-anchor="middle" class="label" font-size="13" fill="#4527A0">T_u（有用区间）</text>
<text x="824" y="126" text-anchor="middle" class="label" font-size="13" fill="#424242">符号 N+1</text>

<rect x="192" y="100" width="40" height="44" fill="#FFCCBC" stroke="#E64A19" stroke-width="1.5" opacity="0.9"/>
<rect x="232" y="100" width="24" height="44" fill="#B2DFDB" stroke="#00695C" stroke-width="1.5" opacity="0.9"/>

<line x1="232" y1="162" x2="256" y2="162" stroke="#00695C" stroke-width="2.2"/>
<line x1="232" y1="158" x2="232" y2="166" stroke="#00695C" stroke-width="2.2"/>
<line x1="256" y1="158" x2="256" y2="166" stroke="#00695C" stroke-width="2.2"/>
<text x="244" y="184" text-anchor="middle" class="small free" font-size="11" fill="#00695C" font-weight="bold">FFT 起点安全区间 [m0−6, m0]</text>

<rect x="80" y="236" width="112" height="32" fill="#F5F5F5" opacity="0.5" stroke="#9E9E9E" stroke-width="1"/>
<rect x="192" y="236" width="64" height="32" fill="#E0F2F1" opacity="0.5" stroke="#9E9E9E" stroke-width="1"/>
<rect x="256" y="236" width="512" height="32" fill="#EDE7F6" opacity="0.5" stroke="#9E9E9E" stroke-width="1"/>
<rect x="768" y="236" width="112" height="32" fill="#F5F5F5" opacity="0.5" stroke="#9E9E9E" stroke-width="1"/>
<rect x="232" y="236" width="24" height="32" fill="#E0F2F1" opacity="0.7" stroke="#00897B" stroke-width="2" stroke-dasharray="7,3"/>
<rect x="256" y="236" width="488" height="32" fill="#E0F2F1" opacity="0.7" stroke="#00897B" stroke-width="2" stroke-dasharray="7,3"/>
<text x="64" y="256" text-anchor="end" class="label free" font-size="13" fill="#333">候选 A</text>
<text x="264" y="256" class="label" font-size="13" fill="#00695C">A：起点 m0−6 —— 安全边界，余量 0</text>

<rect x="80" y="276" width="112" height="32" fill="#F5F5F5" opacity="0.5" stroke="#9E9E9E" stroke-width="1"/>
<rect x="192" y="276" width="64" height="32" fill="#E0F2F1" opacity="0.5" stroke="#9E9E9E" stroke-width="1"/>
<rect x="256" y="276" width="512" height="32" fill="#EDE7F6" opacity="0.5" stroke="#9E9E9E" stroke-width="1"/>
<rect x="768" y="276" width="112" height="32" fill="#F5F5F5" opacity="0.5" stroke="#9E9E9E" stroke-width="1"/>
<rect x="256" y="276" width="512" height="32" fill="#EDE7F6" opacity="0.7" stroke="#5E35B1" stroke-width="2" stroke-dasharray="7,3"/>
<text x="64" y="296" text-anchor="end" class="label free" font-size="13" fill="#333">候选 B</text>
<text x="264" y="296" class="label" font-size="13" fill="#4527A0">B：起点 m0 —— 推荐，余量 6</text>

<rect x="80" y="316" width="112" height="32" fill="#F5F5F5" opacity="0.5" stroke="#9E9E9E" stroke-width="1"/>
<rect x="192" y="316" width="64" height="32" fill="#E0F2F1" opacity="0.5" stroke="#9E9E9E" stroke-width="1"/>
<rect x="256" y="316" width="512" height="32" fill="#EDE7F6" opacity="0.5" stroke="#9E9E9E" stroke-width="1"/>
<rect x="768" y="316" width="112" height="32" fill="#F5F5F5" opacity="0.5" stroke="#9E9E9E" stroke-width="1"/>
<rect x="292" y="316" width="476" height="32" fill="#FBE9E7" opacity="0.7" stroke="#E64A19" stroke-width="2" stroke-dasharray="7,3"/>
<rect x="768" y="316" width="36" height="32" fill="#FBE9E7" opacity="0.7" stroke="#E64A19" stroke-width="2" stroke-dasharray="7,3"/>
<text x="64" y="332" text-anchor="end" class="label free" font-size="13" fill="#333">候选 C</text>
<text x="302" y="332" class="label" font-size="13" fill="#BF360C">C：起点 m0+9 —— 越界 9 采样，混入符号 N+1</text>

<rect x="160" y="408" width="688" height="84" rx="6" fill="#FAFAFA" stroke="#9E9E9E" stroke-width="1.2"/>
<rect x="176" y="432" width="26" height="16" fill="#EDE7F6" stroke="#5E35B1" stroke-width="1.2"/>
<text x="212" y="446" class="small" font-size="11" fill="#333">T_u 有用区间（128 采样）</text>
<rect x="440" y="432" width="26" height="16" fill="#E0F2F1" stroke="#00897B" stroke-width="1.2"/>
<text x="476" y="446" class="small" font-size="11" fill="#333">CP（16 采样）</text>
<rect x="176" y="468" width="26" height="16" fill="#FFCCBC" stroke="#E64A19" stroke-width="1.2"/>
<text x="212" y="482" class="small" font-size="11" fill="#333">多径污染区 [0,10)：符号 N−1 延迟副本</text>
<rect x="440" y="468" width="26" height="16" fill="#B2DFDB" stroke="#00695C" stroke-width="1.2"/>
<text x="476" y="482" class="small" font-size="11" fill="#333">干净余量区 [10,16)：可安全放置起点</text>

<text x="470" y="522" text-anchor="middle" class="small" font-size="12" fill="#555">注：A 提前 6 采样（余量 0，抗漂移差）；B 完全对齐 T_u（余量 6）；C 延后 9 采样，窗口尾部 9 个采样取自符号 N+1，循环卷积破坏</text>
</svg>
