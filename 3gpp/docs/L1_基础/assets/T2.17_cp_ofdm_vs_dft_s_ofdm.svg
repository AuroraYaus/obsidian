<line x1="602.0" y1="85.4" x2="602.0" y2="220" class="pkline"/>
<circle cx="602.0" cy="85.4" r="5" fill="#BF360C"/>
<text x="618" y="88" text-anchor="start" class="small" fill="#BF360C">峰值</text>
<text x="665" y="255" text-anchor="middle" class="small">随机叠加产生尖峰（本例 PAPR ≈ 9.5 dB）→ 功放需要更大回退</text>

<line x1="60" y1="370" x2="900" y2="370" class="dash"/>

<!-- ============ 行 2：DFT-s-OFDM（青绿 = 低 PAPR） ============ -->
<text x="100" y="412" class="lrow" fill="#00796B">DFT-s-OFDM（上行 transform precoding）</text>
<rect x="60" y="428" width="190" height="44" rx="5" fill="#FFF3E0" stroke="#E65100" stroke-width="1.4"/>
<text x="155" y="455" text-anchor="middle" class="box">调制符号 X_k（频域）</text>
<line x1="250" y1="450" x2="290" y2="450" class="arrow" marker-end="url(#arw)"/>
<rect x="290" y="428" width="140" height="44" rx="5" fill="#E0F2F1" stroke="#00796B" stroke-width="1.4"/>
<text x="360" y="455" text-anchor="middle" class="box">M 点 DFT 扩展</text>
<line x1="430" y1="450" x2="470" y2="450" class="arrow" marker-end="url(#arw)"/>
<rect x="470" y="428" width="90" height="44" rx="5" fill="#ECEFF1" stroke="#455A64" stroke-width="1.4"/>
<text x="515" y="455" text-anchor="middle" class="box" font-weight="bold">IFFT</text>
<line x1="560" y1="450" x2="600" y2="450" class="arrow" marker-end="url(#arw)"/>

<line x1="600" y1="620" x2="900" y2="620" class="axis"/>
