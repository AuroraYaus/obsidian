<?xml version="1.0" encoding="UTF-8"?>
<!--
@file    T2.17_cp_ofdm_vs_dft_s_ofdm.svg
@brief   CP-OFDM 与 DFT-s-OFDM 的发送链路与 PAPR 对比
@date    2026-08-04
@note    docs/L1_基础/T2.17_OFDM_PAPR_power_amplifier.md 配套图 2。
         语义色：橙 = 高 PAPR 行（CP-OFDM，威胁语义）；青绿 = 低 PAPR 行（DFT-s-OFDM）。
         上：CP-OFDM 直接 IFFT，128 载波随机叠加 → 尖峰（本例 PAPR ≈ 9.5 dB）；
         下：DFT-s-OFDM（TS 38.211 §6.3.1.4）先 M 点 DFT 扩展，QPSK 符号幅度恒定
         → 包络平坦（PAPR 接近 0 dB）。曲线由 numpy 合成，注释手绘。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720">
<rect width="960" height="720" fill="#ffffff"/>
<style>
.title { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 19px; font-weight: bold; fill: #111; }
.sub { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 12px; fill: #555; }
.lrow { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 15px; font-weight: bold; }
.box { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 12px; fill: #222; }
.small { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 12px; fill: #444; }
.tiny { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 11px; fill: #666; }
.axis { stroke: #444; stroke-width: 1.2; }
.dash { stroke: #9e9e9e; stroke-width: 1.2; stroke-dasharray: 6,5; }
.cp { stroke: #E65100; stroke-width: 2.4; fill: none; stroke-linejoin: round; }
.dft { stroke: #00796B; stroke-width: 2.8; fill: none; stroke-linejoin: round; }
.pkline { stroke: #BF360C; stroke-width: 1.6; stroke-dasharray: 5,4; }
.arrow { stroke: #607D8B; stroke-width: 1.8; fill: none; }
</style>
<defs>
<marker id="arw" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 z" fill="#607D8B"/>
</marker>
</defs>

<text x="480" y="30" text-anchor="middle" class="title">CP-OFDM 与 DFT-s-OFDM 的 PAPR 对比</text>
<text x="480" y="52" text-anchor="middle" class="sub">下行 CP-OFDM：调制符号直接 IFFT → 随机叠加产生尖峰；上行 DFT-s-OFDM：先 DFT 扩展 → 近似单载波 → 包络平坦</text>

<!-- ============ 行 1：CP-OFDM（橙 = 高 PAPR） ============ -->
<text x="100" y="102" class="lrow" fill="#E65100">CP-OFDM（下行默认波形）</text>
<rect x="60" y="118" width="190" height="44" rx="5" fill="#FFF3E0" stroke="#E65100" stroke-width="1.4"/>
<text x="155" y="145" text-anchor="middle" class="box">调制符号 X_k（频域）</text>
<line x1="250" y1="140" x2="290" y2="140" class="arrow" marker-end="url(#arw)"/>
<rect x="290" y="118" width="110" height="44" rx="5" fill="#ECEFF1" stroke="#455A64" stroke-width="1.4"/>
<text x="345" y="145" text-anchor="middle" class="box" font-weight="bold">IFFT</text>
<line x1="400" y1="140" x2="430" y2="140" class="arrow" marker-end="url(#arw)"/>

<line x1="430" y1="220" x2="900" y2="220" class="axis"/>
