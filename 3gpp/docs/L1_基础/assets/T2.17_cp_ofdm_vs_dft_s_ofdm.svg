<text x="750" y="545" text-anchor="middle" class="small" fill="#00796B">QPSK 符号幅度恒定 → 包络平坦（PAPR 接近 0 dB）</text>
<text x="750" y="655" text-anchor="middle" class="small">DFT 扩展 → 近似单载波 → 回退小、功放效率高</text>

<text x="480" y="692" text-anchor="middle" class="tiny">协议依据：TS 38.211 §6.3.1.4（DFT 扩展，仅上行、单层）；§6.3.1.2 表 6.3.1.2-1：π/2-BPSK 仅在 transform precoding 使能时可用</text>
</svg>
