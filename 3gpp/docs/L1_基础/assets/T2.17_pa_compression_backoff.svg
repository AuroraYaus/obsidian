<text x="480" y="684" text-anchor="middle" class="tiny">EVM 与 ACLR 是协议验收面：TS 38.104 §6.5.2（EVM ≤ 17.5%/12.5%/8%/3.5%，按调制阶数）与 §6.6.3.2（ACLR ≥ 45 dB）</text>
<text x="480" y="702" text-anchor="middle" class="tiny">回退量、DPD、PA 模型属发射机实现自由度，协议不规定；接收端把残余失真折算成额外噪声估计 LLR</text>
