<text x="480" y="30" text-anchor="middle" class="title">功放非线性：1 dB 压缩点与回退</text>
<text x="480" y="52" text-anchor="middle" class="sub">输出随输入增大而压缩；工作点与 P1dB 之间的余量（回退）决定 EVM、ACLR 与功放效率的折中</text>

