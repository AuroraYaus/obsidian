<!--
@file    T2.17_pa_compression_backoff.svg
@brief   功放 AM-AM 非线性、1 dB 压缩点与回退；以及频谱再生（ACLR）与星座失真（EVM）后果
@date    2026-08-04
@note    docs/L1_基础/T2.17_OFDM_PAPR_power_amplifier.md 配套图 3。
         语义色：橙 = 失真/饱和/压缩点；青绿 = 工作点/回退/理想参考；灰蓝 = 中性元素。
         主图：Rapp 模型 AM-AM（a=0.9, p=1.5），P1dB 输入 0.671、输出低 1 dB，
         工作点输入 0.35 → 回退 ≈ 5.7 dB。右侧：带外再生（ACLR）与星座压缩（EVM）。
         曲线由 numpy 合成，注释手绘。
-->
