<text x="150" y="206" text-anchor="start" font-size="10" fill="#1565c0">传输起点（保护带后）</text>
<text x="770" y="206" text-anchor="end" font-size="10" fill="#1565c0">传输终点（保护带前）</text>
<text x="460.0" y="224" text-anchor="middle" font-size="12" fill="#1565c0" font-weight="bold">B_tx = N_sc x Delta_f，约 18 MHz（LTE: 1200 x 15 kHz）</text>
<text x="40" y="265.0" text-anchor="start" font-size="14" fill="#c62828" font-weight="bold">子载波带宽</text>
<text x="40" y="283.0" text-anchor="start" font-size="11" fill="#78909c">Delta_f</text>
