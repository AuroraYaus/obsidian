<text x="308.0" y="298" text-anchor="end" font-size="10" fill="#c62828">f_c + k Delta_f</text>
<text x="331.0" y="298" text-anchor="start" font-size="10" fill="#c62828">f_c + (k+1) Delta_f</text>
<text x="320.5" y="314" text-anchor="middle" font-size="12" fill="#c62828" font-weight="bold">Delta_f = 15 kHz（仅占 B_channel 的 1/1333 = 0.075%）</text>
<text x="450.0" y="334" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">B_channel 及其内保护带，包含 B_tx = N_sc x Delta_f，Delta_f 为最小频域单位</text>
<text x="450.0" y="360" text-anchor="middle" font-size="12" fill="#555">接收端只解调 B_tx 内子载波 | 保护带不承载数据 | Delta_f 远小于 B_channel（1/1333），故称窄带子载波</text>
