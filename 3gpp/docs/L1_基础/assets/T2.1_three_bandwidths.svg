<text x="110" y="118" text-anchor="start" font-size="10" fill="#546e7a">f_low（分配下界）</text>
<text x="810" y="118" text-anchor="end" font-size="10" fill="#546e7a">f_high（分配上界）</text>
<text x="460.0" y="138" text-anchor="middle" font-size="12" fill="#37474f" font-weight="bold">B_channel = 20 MHz（运营商频谱牌照）</text>
<text x="40" y="177.0" text-anchor="start" font-size="14" fill="#1565c0" font-weight="bold">传输带宽</text>
