<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" width="960" height="650">
<rect width="960" height="650" fill="#ffffff"/>
<style>
.title { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 19px; font-weight: bold; fill: #111; }
.label { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 14px; fill: #222; }
.small { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 12px; fill: #555; }
.mono { font-family: monospace; font-size: 13px; fill: #333; }
.axis { stroke: #444; stroke-width: 1.2; }
.grid { stroke: #d0d0d0; stroke-width: 1; stroke-dasharray: 5,5; }
.carrier { stroke: #1565C0; stroke-width: 2.2; fill: none; }
.baseband { stroke: #2E7D32; stroke-width: 3; fill: none; stroke-linejoin: round; }
.modulated { stroke: #C62828; stroke-width: 2.2; fill: none; }
.bitbox { stroke-width: 1.1; rx: 4; }
</style>
<defs>
  <path id="sineCycle" d="M0,0 C6.7,-35 13.3,-35 20,0 C26.7,35 33.3,35 40,0"/>
</defs>
<text x="480" y="32" text-anchor="middle" class="title">连续载波、基带包络与 BPSK 调制后波形</text>
<text x="480" y="54" text-anchor="middle" class="small">同一时间轴上比较：载波本身连续运行，信息通过符号包络改变已调波形的相位</text>

<line x1="150" y1="145" x2="890" y2="145" class="axis"/>
<line x1="150" y1="310" x2="890" y2="310" class="axis"/>
<line x1="150" y1="475" x2="890" y2="475" class="axis"/>
<text x="34" y="138" class="label">连续载波</text>
<text x="34" y="156" class="mono">c(t)</text>
<text x="34" y="303" class="label">基带包络</text>
<text x="34" y="321" class="mono">a(t)</text>
<text x="34" y="468" class="label">已调波形</text>
<text x="34" y="486" class="mono">s(t)=a(t)c(t)</text>

<line x1="150" y1="82" x2="150" y2="532" class="grid"/>
<line x1="270" y1="82" x2="270" y2="532" class="grid"/>
<line x1="390" y1="82" x2="390" y2="532" class="grid"/>
<line x1="510" y1="82" x2="510" y2="532" class="grid"/>
<line x1="630" y1="82" x2="630" y2="532" class="grid"/>
<line x1="750" y1="82" x2="750" y2="532" class="grid"/>
<line x1="870" y1="82" x2="870" y2="532" class="grid"/>

<g class="carrier">
  <use href="#sineCycle" transform="translate(150 145)"/>
  <use href="#sineCycle" transform="translate(190 145)"/>
  <use href="#sineCycle" transform="translate(230 145)"/>
  <use href="#sineCycle" transform="translate(270 145)"/>
  <use href="#sineCycle" transform="translate(310 145)"/>
  <use href="#sineCycle" transform="translate(350 145)"/>
  <use href="#sineCycle" transform="translate(390 145)"/>
  <use href="#sineCycle" transform="translate(430 145)"/>
  <use href="#sineCycle" transform="translate(470 145)"/>
  <use href="#sineCycle" transform="translate(510 145)"/>
  <use href="#sineCycle" transform="translate(550 145)"/>
  <use href="#sineCycle" transform="translate(590 145)"/>
  <use href="#sineCycle" transform="translate(630 145)"/>
  <use href="#sineCycle" transform="translate(670 145)"/>
  <use href="#sineCycle" transform="translate(710 145)"/>
  <use href="#sineCycle" transform="translate(750 145)"/>
  <use href="#sineCycle" transform="translate(790 145)"/>
  <use href="#sineCycle" transform="translate(830 145)"/>
</g>

<path class="baseband" d="M150,275 H270 V345 H390 V275 H630 V345 H870"/>
<text x="884" y="279" class="small">+1</text>
<text x="884" y="349" class="small">-1</text>

<g class="modulated">
  <use href="#sineCycle" transform="translate(150 475)"/>
  <use href="#sineCycle" transform="translate(190 475)"/>
  <use href="#sineCycle" transform="translate(230 475)"/>
  <use href="#sineCycle" transform="matrix(1 0 0 -1 270 475)"/>
  <use href="#sineCycle" transform="matrix(1 0 0 -1 310 475)"/>
  <use href="#sineCycle" transform="matrix(1 0 0 -1 350 475)"/>
  <use href="#sineCycle" transform="translate(390 475)"/>
  <use href="#sineCycle" transform="translate(430 475)"/>
  <use href="#sineCycle" transform="translate(470 475)"/>
  <use href="#sineCycle" transform="translate(510 475)"/>
  <use href="#sineCycle" transform="translate(550 475)"/>
  <use href="#sineCycle" transform="translate(590 475)"/>
  <use href="#sineCycle" transform="matrix(1 0 0 -1 630 475)"/>
  <use href="#sineCycle" transform="matrix(1 0 0 -1 670 475)"/>
  <use href="#sineCycle" transform="matrix(1 0 0 -1 710 475)"/>
  <use href="#sineCycle" transform="matrix(1 0 0 -1 750 475)"/>
  <use href="#sineCycle" transform="matrix(1 0 0 -1 790 475)"/>
  <use href="#sineCycle" transform="matrix(1 0 0 -1 830 475)"/>
</g>

<rect x="150" y="560" width="120" height="32" fill="#E3F2FD" stroke="#1565C0" class="bitbox"/>
<rect x="270" y="560" width="120" height="32" fill="#FFEBEE" stroke="#C62828" class="bitbox"/>
<rect x="390" y="560" width="120" height="32" fill="#E3F2FD" stroke="#1565C0" class="bitbox"/>
<rect x="510" y="560" width="120" height="32" fill="#E3F2FD" stroke="#1565C0" class="bitbox"/>
<rect x="630" y="560" width="120" height="32" fill="#FFEBEE" stroke="#C62828" class="bitbox"/>
<rect x="750" y="560" width="120" height="32" fill="#FFEBEE" stroke="#C62828" class="bitbox"/>
<text x="210" y="581" text-anchor="middle" class="label" fill="#1565C0">bit 0: a=+1</text>
<text x="330" y="581" text-anchor="middle" class="label" fill="#C62828">bit 1: a=-1</text>
<text x="450" y="581" text-anchor="middle" class="label" fill="#1565C0">bit 0: a=+1</text>
<text x="570" y="581" text-anchor="middle" class="label" fill="#1565C0">bit 0: a=+1</text>
<text x="690" y="581" text-anchor="middle" class="label" fill="#C62828">bit 1: a=-1</text>
<text x="810" y="581" text-anchor="middle" class="label" fill="#C62828">bit 1: a=-1</text>

<text x="520" y="620" text-anchor="middle" class="small">符号边界只表示判决窗口；载波振荡器不停止，矩形包络示意未包含实际发射滤波的平滑过渡</text>
</svg>
