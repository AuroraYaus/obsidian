<?xml version="1.0" encoding="UTF-8"?>
<!--
  @file    T2.0_time_frequency_dual_view.svg
  @brief   同一 OFDM 符号的时域与频域对照图：N=4、QPSK 教学例，IFFT/FFT 可逆转换
  @date    2026-08-04
  @note    数学真实：时域曲线为 x(t)=Re{Σ X_k e^{j2πkt/Tu}} 的 241 点采样；
           X_k 取 QPSK 四象限点 {1+j, -1-j, 1-j, -1+j}；|X_k|=1 故频域四柱等高。
           依据 T2.1 基准图规格（960 宽、字号层级、Noto CJK 字体栈）。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img">
  <title>同一 OFDM 符号的时域与频域对照</title>
  <rect width="960" height="640" fill="#ffffff"/>
  <style>
    .title { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 18px; font-weight: bold; fill: #111; }
    .label { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 14px; fill: #222; }
    .small { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 12px; fill: #555; }
    .mono { font-family: monospace; font-size: 13px; fill: #333; }
    .axis { stroke: #444; stroke-width: 1.2; }
  </style>
  <text x="480" y="32" text-anchor="middle" class="title">同一 OFDM 符号的时域与频域：N=4、QPSK 教学例</text>
  <text x="480" y="55" text-anchor="middle" class="small">x[n] 与 X[k] 是同一信息的两种表示，IFFT 合成时域波形、FFT 分解回频域符号</text>

  <!-- ============ 上：时域面板 ============ -->
  <text x="140" y="95" class="label" font-weight="bold">时域：发射波形 x(t)</text>
  <text x="140" y="114" class="small">4 个子载波上的 QPSK 符号叠加（取实部），随时间连续变化，实际送入 DAC/RF</text>
