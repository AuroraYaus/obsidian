  <text x="110" y="130" text-anchor="end" class="small">+4</text>
  <text x="110" y="216" text-anchor="end" class="small">0</text>
  <text x="120" y="240" text-anchor="middle" class="small">t=0</text>
  <text x="840" y="240" text-anchor="middle" class="small">t=T_u（一个 OFDM 符号时长）</text>
  <text x="480" y="240" text-anchor="middle" class="small">时间 t</text>

  <!-- ============ 中：IFFT/FFT 转换 ============ -->
  <text x="480" y="266" text-anchor="middle" class="label" font-weight="bold">IFFT（频域→时域，合成）　⇄　FFT（时域→频域，分解）</text>
  <line x1="310" y1="278" x2="650" y2="278" stroke="#5B6B82" stroke-width="1.4"/>
  <polygon points="650,278 640,273 640,283"/>
  <polygon points="310,278 320,273 320,283"/>

  <!-- ============ 下：频域面板 ============ -->
  <text x="140" y="330" class="label" font-weight="bold">频域：子载波符号 X(k)</text>
  <text x="140" y="349" class="small">每个子载波承载一个 QPSK 复数符号（|X_k|=1，四柱等高）</text>
  <line x1="120" y1="440" x2="840" y2="440" class="axis"/>
  <line x1="120" y1="350" x2="120" y2="440" class="axis"/>
  <!-- 四根线谱：x=200/370/540/710，基线 440，柱高 70 -->
  <line x1="200" y1="390" x2="200" y2="440" stroke="#00897B" stroke-width="16"/>
  <line x1="370" y1="390" x2="370" y2="440" stroke="#7B1FA2" stroke-width="16"/>
  <line x1="540" y1="390" x2="540" y2="440" stroke="#B65B2E" stroke-width="16"/>
  <line x1="710" y1="390" x2="710" y2="440" stroke="#C2185B" stroke-width="16"/>
  <text x="200" y="380" text-anchor="middle" class="mono">X₀=1+j</text>
  <text x="370" y="380" text-anchor="middle" class="mono">X₁=-1-j</text>
  <text x="540" y="380" text-anchor="middle" class="mono">X₂=1-j</text>
  <text x="710" y="380" text-anchor="middle" class="mono">X₃=-1+j</text>
  <text x="200" y="458" text-anchor="middle" class="small">f₀</text>
  <text x="370" y="458" text-anchor="middle" class="small">f₁</text>
  <text x="540" y="458" text-anchor="middle" class="small">f₂</text>
  <text x="710" y="458" text-anchor="middle" class="small">f₃</text>
  <text x="480" y="480" text-anchor="middle" class="small">频率 f（子载波间隔 Δf = 1/T_u）</text>
  <text x="140" y="505" class="small">四根线谱等高的工程含义：OFDM 频域资源"装满"时频谱包络平坦，不依赖单个符号取值；</text>
  <text x="140" y="523" class="small">X_k 的相位（所在象限）决定时域波形形状——同一组 X_k 唯一对应一条 x(t) 曲线。</text>

  <text x="480" y="616" text-anchor="middle" class="small">读图：上行看"每个时刻发什么"（波形），下行看"每个频率装什么"（符号）；两行由 IFFT/FFT 唯一互译，无信息损失</text>
</svg>
