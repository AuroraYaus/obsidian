<?xml version="1.0" encoding="UTF-8"?>
<!--
@file    T2.17_papr_peak_average.svg
@brief   PAPR 定义：子载波同相叠加机制 + 真实 OFDM 包络的峰值/平均功率标注
@date    2026-08-04
@note    docs/L1_基础/T2.17_OFDM_PAPR_power_amplifier.md 配套图 1。
         语义色：橙 = 峰值/高 PAPR；青绿 = 平均功率基准；灰蓝 = 子载波机制元素。
         上：4 个同相子载波相量相加；下：16 子载波随机 OFDM 包络 |x(t)|，
         平均功率归一化为 1，峰值 2.3 → PAPR ≈ 7.3 dB（正文 4 载波例为 6.02 dB）。
         曲线由 numpy 合成（QPSK 随机符号 + 8 个载波在 t* 同相），注释全部手绘。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720">
<rect width="960" height="720" fill="#ffffff"/>
<style>
.title { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 19px; font-weight: bold; fill: #111; }
.sub { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 12px; fill: #555; }
.labelb { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 14px; font-weight: bold; fill: #222; }
.small { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 12px; fill: #444; }
.tiny { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 11px; fill: #666; }
.axis { stroke: #444; stroke-width: 1.2; }
.dash { stroke: #9e9e9e; stroke-width: 1.2; stroke-dasharray: 6,5; }
.env { stroke: #455A64; stroke-width: 2.6; fill: none; stroke-linejoin: round; }
.avgline { stroke: #00796B; stroke-width: 1.8; stroke-dasharray: 8,5; }
.pkline { stroke: #E65100; stroke-width: 1.6; stroke-dasharray: 5,4; }
.ph { stroke: #455A64; stroke-width: 3.2; fill: none; }
.sum { stroke: #E65100; stroke-width: 3.6; fill: none; }
</style>
<defs>
<marker id="arwMech" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 z" fill="#455A64"/>
</marker>
<marker id="arwPeak" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 z" fill="#E65100"/>
</marker>
</defs>

<text x="480" y="30" text-anchor="middle" class="title">PAPR 定义：OFDM 的峰值来自子载波同相叠加</text>
<text x="480" y="52" text-anchor="middle" class="sub">4 个同相子载波：幅度相加 → 功率 ×16；PAPR = 峰值功率 / 平均功率 = 4 ≈ 6.02 dB</text>

<text x="130" y="100" class="labelb">机制：多个子载波在某时刻同相，瞬时功率放大</text>

<!-- 相量链：4 个 +1 箭头首尾相接（灰蓝 = 子载波机制） -->
<line x1="130" y1="150" x2="185" y2="150" class="ph" marker-end="url(#arwMech)"/>
<line x1="190" y1="150" x2="245" y2="150" class="ph" marker-end="url(#arwMech)"/>
<line x1="250" y1="150" x2="305" y2="150" class="ph" marker-end="url(#arwMech)"/>
<line x1="310" y1="150" x2="365" y2="150" class="ph" marker-end="url(#arwMech)"/>
<text x="158" y="175" text-anchor="middle" class="small" fill="#455A64">+1</text>
<text x="218" y="175" text-anchor="middle" class="small" fill="#455A64">+1</text>
<text x="278" y="175" text-anchor="middle" class="small" fill="#455A64">+1</text>
<text x="338" y="175" text-anchor="middle" class="small" fill="#455A64">+1</text>

<line x1="130" y1="230" x2="370" y2="230" class="sum" marker-end="url(#arwPeak)"/>
<text x="250" y="212" text-anchor="middle" class="small" fill="#E65100">合成相量：幅度 4 → 瞬时功率 16</text>
<text x="250" y="262" text-anchor="middle" class="tiny">OFDM 用 1/√N 归一化（N=4）：同相样本 = (1+1+1+1)/√4 = 2 → 功率 4，PAPR 不变</text>

<line x1="60" y1="330" x2="900" y2="330" class="dash"/>

<text x="130" y="382" class="labelb">真实 OFDM 符号包络 |x(t)|（16 个子载波，平均功率 = 1）</text>

<!-- PAPR 结果框：橙 = 峰值相关结果 -->
<rect x="130" y="396" width="340" height="44" rx="5" fill="#FFF3E0" stroke="#E65100" stroke-width="1.4"/>
<text x="300" y="414" text-anchor="middle" class="small" fill="#BF360C">PAPR = 峰值功率 / 平均功率</text>
<text x="300" y="432" text-anchor="middle" class="small" fill="#BF360C">≈ 2.3² / 1 ≈ 5.3 ≈ 7.3 dB（本图数值）</text>

<!-- 包络曲线 -->
<line x1="120" y1="650" x2="860" y2="650" class="axis"/>
<path class="env" d="M120.0,619.9 L125.8,618.9 L131.6,618.2 L137.4,619.8 L143.2,621.7 L149.0,620.0 L154.8,613.0 L160.6,603.4 L166.4,594.5 L172.2,588.3 L178.0,585.8 L183.8,587.4 L189.6,592.5 L195.5,600.4 L201.3,609.7 L207.1,619.1 L212.9,627.1 L218.7,632.1 L224.5,633.7 L230.3,632.9 L236.1,631.7 L241.9,630.9 L247.7,631.2 L253.5,632.5 L259.3,634.6 L265.1,636.1 L270.9,634.8 L276.7,629.8 L282.5,622.9 L288.3,616.0 L294.1,610.3 L299.9,606.6 L305.7,604.9 L311.5,604.2 L317.3,602.9 L323.1,598.8 L328.9,591.6 L334.7,582.3 L340.5,573.2 L346.4,566.3 L352.2,563.0 L358.0,564.2 L363.8,569.6 L369.6,578.4 L375.4,588.6 L381.2,597.6 L387.0,602.8 L392.8,603.7 L398.6,602.4 L404.4,602.0 L410.2,604.4 L416.0,610.1 L421.8,618.2 L427.6,626.5 L433.4,631.7 L439.2,631.5 L445.0,629.6 L450.8,629.8 L456.6,633.3 L462.4,636.9 L468.2,631.0 L474.0,617.2 L479.8,601.5 L485.6,587.3 L491.5,577.2 L497.3,572.9 L503.1,575.2 L508.9,583.7 L514.7,596.3 L520.5,608.0 L526.3,610.3 L532.1,601.0 L537.9,588.6 L543.7,580.1 L549.5,579.1 L555.3,587.0 L561.1,602.3 L566.9,616.3 L572.7,606.2 L578.5,575.6 L584.3,540.9 L590.1,509.3 L595.9,485.1 L601.7,471.2 L607.5,468.9 L613.3,477.9 L619.1,495.8 L624.9,517.5 L630.7,534.9 L636.5,539.2 L642.4,528.6 L648.2,511.0 L654.0,495.1 L659.8,486.5 L665.6,487.6 L671.4,498.5 L677.2,517.3 L683.0,540.8 L688.8,564.5 L694.6,583.1 L700.4,592.2 L706.2,592.4 L712.0,588.3 L717.8,582.0 L723.6,571.1 L729.4,553.0 L735.2,528.3 L741.0,500.0 L746.8,472.0 L752.6,447.9 L758.4,430.5 L764.2,421.1 L770.0,419.6 L775.8,424.6 L781.6,433.6 L787.5,443.4 L793.3,451.5 L799.1,456.7 L804.9,460.1 L810.7,464.3 L816.5,471.7 L822.3,484.1 L828.1,502.1 L833.9,524.9 L839.7,550.5 L845.5,576.4 L851.3,599.2 L857.1,614.7"/>

<!-- 平均功率线（青绿 = 平均基准） -->
<line x1="120" y1="550" x2="860" y2="550" class="avgline"/>
<text x="132" y="540" class="tiny" fill="#00796B">平均功率 = 1（RMS 幅度 1.0）</text>

<!-- 峰值标注（橙） -->
<line x1="767.1" y1="419.4" x2="767.1" y2="650" class="pkline"/>
<circle cx="767.1" cy="419.4" r="5" fill="#E65100"/>
<text x="767.1" y="397" text-anchor="middle" class="small" fill="#E65100">峰值样本</text>

<!-- 左侧幅度标尺 -->
<text x="108" y="654" text-anchor="end" class="tiny">0</text>
<text x="108" y="554" text-anchor="end" class="tiny" fill="#00796B">1.0（平均）</text>
<text x="108" y="424" text-anchor="end" class="tiny" fill="#E65100">2.3（峰值）</text>

<text x="490" y="674" text-anchor="middle" class="tiny">时间 t（一个 OFDM 符号周期）</text>
<text x="490" y="702" text-anchor="middle" class="tiny">峰值以低概率出现，但功放必须为它预留线性余量 —— 这就是功放回退（backoff）的由来</text>
</svg>
