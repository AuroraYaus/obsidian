<!--
@file    T2.15_zf_mmse_equalizer_compare.svg
@brief   ZF 与 MMSE 均衡数值对比：单径深衰落信道 h=0.2、σ²=0.04 下，
         信号链、噪声方差放大、双列数值对比与结论（对应文档"数值手算"节）
@date    2026-08-04
@note    数据口径：BPSK X=+1；ZF：σ²/|h|²=1.0（×25），MSE=1.0；
         MMSE：w=2.5，g=0.5（有偏），原始噪声 0.25，MSE=0.5；
         无偏化后噪声回到 1.0，两者 post-eq SINR 相同（0 dB vs 14 dB）。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" width="960" height="680">
<rect width="960" height="680" fill="#ffffff"/>
<style>
.title { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 19px; font-weight: bold; fill: #1A237E; }
.stitle { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 15px; font-weight: bold; fill: #1A237E; }
.label { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 14px; fill: #222; }
.small { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 12px; fill: #546E7A; }
.mono { font-family: "DejaVu Sans Mono", monospace; font-size: 13px; fill: #37474F; }
.node { fill: #E8EAF6; stroke: #283593; stroke-width: 1.4; }
.arrow { stroke: #455A64; stroke-width: 1.6; fill: none; }
.bar-zf { fill: #B71C1C; }
.bar-mmse { fill: #6A1B9A; }
.card { fill: #FFFFFF; stroke: #9FA8DA; stroke-width: 1.2; }
.badge-red { fill: #FBE9E7; stroke: #B71C1C; stroke-width: 1.2; }
.badge-green { fill: #E8F5E9; stroke: #1B5E20; stroke-width: 1.2; }
</style>

<text x="480" y="30" text-anchor="middle" class="title">深衰落 h=0.2 下 ZF 与 MMSE 均衡的数值对比</text>
<text x="480" y="54" text-anchor="middle" class="small">单径信道 σ²=0.04、BPSK X=+1：同一接收符号 Y=0.2+n，两种均衡器给出不同的噪声、偏置与总误差</text>

<text x="60" y="84" class="stitle">① 信号链</text>
<rect x="60" y="92" width="120" height="48" rx="8" class="node"/>
<text x="120" y="112" text-anchor="middle" class="label">发送</text>
<text x="120" y="130" text-anchor="middle" class="mono">X=+1</text>
<line x1="184" y1="116" x2="210" y2="116" class="arrow"/>
<polygon points="214,116 204,111 204,121" fill="#455A64"/>
<rect x="214" y="92" width="120" height="48" rx="8" class="node"/>
<text x="274" y="112" text-anchor="middle" class="label">信道</text>
<text x="274" y="130" text-anchor="middle" class="mono">h=0.2</text>
<line x1="338" y1="116" x2="364" y2="116" class="arrow"/>
<polygon points="368,116 358,111 358,121" fill="#455A64"/>
<rect x="368" y="92" width="130" height="48" rx="8" class="node"/>
<text x="433" y="112" text-anchor="middle" class="label">接收</text>
<text x="433" y="130" text-anchor="middle" class="mono">Y=0.2+n</text>
<line x1="502" y1="116" x2="528" y2="116" class="arrow"/>
<polygon points="532,116 522,111 522,121" fill="#455A64"/>
<rect x="532" y="92" width="130" height="48" rx="8" class="node"/>
<text x="597" y="112" text-anchor="middle" class="label">均衡器 w</text>
<text x="597" y="130" text-anchor="middle" class="mono">ZF 5 / MMSE 2.5</text>
<line x1="666" y1="116" x2="692" y2="116" class="arrow"/>
<polygon points="696,116 686,111 686,121" fill="#455A64"/>
<rect x="696" y="92" width="120" height="48" rx="8" class="node"/>
<text x="756" y="112" text-anchor="middle" class="label">输出</text>
<text x="756" y="130" text-anchor="middle" class="mono">X̂ 噪声/偏置不同</text>

<text x="60" y="196" class="stitle">② 噪声方差放大对比（输入 σ²=0.04）</text>
<text x="60" y="226" class="label">ZF 均衡</text>
<rect x="170" y="212" width="64" height="26" rx="5" fill="#ECEFF1" stroke="#455A64" stroke-width="1.2"/>
<text x="202" y="230" text-anchor="middle" class="mono">0.04</text>
<line x1="238" y1="225" x2="262" y2="225" class="arrow"/>
<polygon points="266,225 256,220 256,230" fill="#455A64"/>
<rect x="270" y="212" width="380" height="26" rx="5" class="bar-zf"/>
<text x="460" y="230" text-anchor="middle" class="mono" fill="#FFFFFF">σ²/|h|² = 1.0</text>
<text x="680" y="226" class="mono" fill="#B71C1C">×25</text>
<rect x="760" y="212" width="90" height="26" rx="5" fill="#FBE9E7" stroke="#B71C1C" stroke-width="1.4"/>
<text x="805" y="230" text-anchor="middle" class="mono" fill="#B71C1C">MSE=1.0</text>
<text x="60" y="252" class="small">噪声被放大 25 倍：深衰落 RE 即使星座回正，LLR 也必须收缩（≈3.6 量级）</text>

<text x="60" y="286" class="label">MMSE 均衡</text>
<rect x="170" y="272" width="64" height="26" rx="5" fill="#ECEFF1" stroke="#455A64" stroke-width="1.2"/>
<text x="202" y="290" text-anchor="middle" class="mono">0.04</text>
<line x1="238" y1="285" x2="262" y2="285" class="arrow"/>
<polygon points="266,285 256,280 256,290" fill="#455A64"/>
<rect x="270" y="272" width="95" height="26" rx="5" class="bar-mmse"/>
<text x="317" y="290" text-anchor="middle" class="mono" fill="#FFFFFF">|w|²σ²=0.25</text>
<text x="680" y="286" class="mono" fill="#6A1B9A">×6.25</text>
<rect x="760" y="272" width="90" height="26" rx="5" fill="#EDE7F6" stroke="#6A1B9A" stroke-width="1.4"/>
<text x="805" y="290" text-anchor="middle" class="mono" fill="#6A1B9A">MSE=0.5</text>
<text x="60" y="312" class="small">MMSE 权重 w=2.5 被 σ² 压住：输出有偏 g=0.5，原始噪声仅 0.25，总 MSE 减半</text>

<text x="60" y="352" class="stitle">③ 同一 σ²=0.04 下的双列数值对比</text>
<rect x="60" y="368" width="400" height="178" rx="10" class="card"/>
<text x="76" y="394" class="label" fill="#B71C1C">深衰落 |h|=0.2</text>
<rect x="336" y="380" width="110" height="24" rx="12" class="badge-red"/>
<text x="391" y="397" text-anchor="middle" class="small" fill="#B71C1C">LLR 收缩 ≈3.6</text>
<text x="76" y="420" class="small">ZF 后噪声方差 σ²/|h|²</text>
<text x="444" y="420" text-anchor="end" class="mono">1.0</text>
<text x="76" y="438" class="small">MMSE 权重 w</text>
<text x="444" y="438" text-anchor="end" class="mono">2.5</text>
<text x="76" y="456" class="small">MMSE 增益 g（有偏）</text>
<text x="444" y="456" text-anchor="end" class="mono">0.5</text>
<text x="76" y="474" class="small">MMSE 原始噪声 |w|²σ²</text>
<text x="444" y="474" text-anchor="end" class="mono">0.25</text>
<text x="76" y="492" class="small">ZF 总 MSE</text>
<text x="444" y="492" text-anchor="end" class="mono">1.0</text>
<text x="76" y="510" class="small">MMSE 总 MSE</text>
<text x="444" y="510" text-anchor="end" class="mono">0.5</text>
<text x="76" y="528" class="small">post-eq SINR</text>
<text x="444" y="528" text-anchor="end" class="mono" fill="#B71C1C">0 dB</text>

<rect x="500" y="368" width="400" height="178" rx="10" class="card"/>
<text x="516" y="394" class="label" fill="#1B5E20">平坦 |h|=1.0</text>
<rect x="776" y="380" width="110" height="24" rx="12" class="badge-green"/>
<text x="831" y="397" text-anchor="middle" class="small" fill="#1B5E20">LLR 自信 36~50</text>
<text x="516" y="420" class="small">ZF 后噪声方差 σ²/|h|²</text>
<text x="884" y="420" text-anchor="end" class="mono">0.04</text>
<text x="516" y="438" class="small">MMSE 权重 w</text>
<text x="884" y="438" text-anchor="end" class="mono">0.9615</text>
<text x="516" y="456" class="small">MMSE 增益 g（近无偏）</text>
<text x="884" y="456" text-anchor="end" class="mono">0.9615</text>
<text x="516" y="474" class="small">MMSE 原始噪声 |w|²σ²</text>
<text x="884" y="474" text-anchor="end" class="mono">0.037</text>
<text x="516" y="492" class="small">ZF 总 MSE</text>
<text x="884" y="492" text-anchor="end" class="mono">0.04</text>
<text x="516" y="510" class="small">MMSE 总 MSE</text>
<text x="884" y="510" text-anchor="end" class="mono">0.0385</text>
<text x="516" y="528" class="small">post-eq SINR</text>
<text x="884" y="528" text-anchor="end" class="mono" fill="#1B5E20">14 dB</text>

<rect x="60" y="576" width="840" height="92" rx="10" fill="#ECEFF1" stroke="#78909C" stroke-width="1.2"/>
<text x="76" y="600" class="stitle">④ 结论</text>
<text x="76" y="624" class="label">ZF：位置回正但噪声 ×25；MMSE：原始 MSE 减半（0.5 &lt; 1.0）但有偏 g=0.5；</text>
<text x="76" y="646" class="label">无偏化 z=X̂/g 后噪声回到 1.0——两者 post-eq SINR 相同（0 dB vs 14 dB），可靠度必须与位置分开传递。</text>
</svg>
