<text x="450.0" y="228" text-anchor="middle" font-size="12" fill="#333">S = DwPTS（下行导频）+ GP（保护间隔）+ UpPTS（上行导频），GP 长度决定小区覆盖半径</text>
<text x="450.0" y="340" text-anchor="middle" font-size="12" fill="#555">FDD: 上下行各独立频率并行传输 · TDD: 同频率时分交替，切换周期 5/10 ms</text>
