<circle cx="780" cy="522" r="2.5" fill="#E64A19"/>
<circle cx="834" cy="486" r="2.5" fill="#E64A19"/>
<circle cx="842" cy="482" r="2.5" fill="#E64A19"/>
<circle cx="828" cy="490" r="2.5" fill="#E64A19"/>
<text x="810" y="590" text-anchor="middle" class="small" font-size="11" fill="#D84315">均衡后 QPSK 散点：EVM 增大，LLR 幅度失真</text>

<text x="480" y="626" text-anchor="middle" class="small" font-size="12" fill="#333">CP 外误差：FFT 输入 = 两个符号数据混叠 → 子载波正交性丧失，全部子载波互相污染（ISI + ICI），线性相位模型不再成立</text>
</svg>
