<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
<rect width="900" height="500" fill="white"/>
<style>
.axis { stroke: #333; stroke-width: 1.4; fill: none; }
.tick { stroke: #666; stroke-width: 0.8; }
.boundary { stroke: #999; stroke-width: 1; stroke-dasharray: 6,4; }
.label { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 13px; fill: #333; }
.small { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 12px; fill: #666; }
.bit-label { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 15px; font-weight: bold; }
.title { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 17px; font-weight: bold; fill: #111; }
.normal { stroke: #1565C0; stroke-width: 2.1; fill: none; }
.inverted { stroke: #C62828; stroke-width: 2.1; fill: none; }
</style>
<defs>
  <path id="carrierCycle" d="M0,0 C4,-95 8,-95 12,0 C16,95 20,95 24,0"/>
</defs>
<text x="450" y="28" text-anchor="middle" class="title">BPSK 调制载波波形</text>
<text x="450" y="47" text-anchor="middle" class="small">每个色块 = 1 个符号周期内的已调载波波形（5 个周期）| 符号边界画在载波过零处以保持幅度连续</text>

<line x1="80" y1="220" x2="800" y2="220" class="axis"/>
<line x1="80" y1="75" x2="80" y2="365" class="axis"/>
<line x1="74" y1="125" x2="80" y2="125" class="tick"/>
<text x="70" y="129" text-anchor="end" class="label" fill="#1565C0">+1 (bit 0)</text>
<line x1="74" y1="315" x2="80" y2="315" class="tick"/>
<text x="70" y="319" text-anchor="end" class="label" fill="#C62828">-1 (bit 1)</text>
<text x="440" y="389" text-anchor="middle" class="label">时间</text>
<text x="18" y="220" text-anchor="middle" class="label" transform="rotate(-90,18,220)">幅度</text>

<line x1="80" y1="75" x2="80" y2="365" class="boundary"/>
<line x1="200" y1="75" x2="200" y2="365" class="boundary"/>
<line x1="320" y1="75" x2="320" y2="365" class="boundary"/>
<line x1="440" y1="75" x2="440" y2="365" class="boundary"/>
<line x1="560" y1="75" x2="560" y2="365" class="boundary"/>
<line x1="680" y1="75" x2="680" y2="365" class="boundary"/>
<line x1="800" y1="75" x2="800" y2="365" class="boundary"/>

<g class="normal">
  <use href="#carrierCycle" transform="translate(80 220)"/>
  <use href="#carrierCycle" transform="translate(104 220)"/>
  <use href="#carrierCycle" transform="translate(128 220)"/>
  <use href="#carrierCycle" transform="translate(152 220)"/>
  <use href="#carrierCycle" transform="translate(176 220)"/>
  <use href="#carrierCycle" transform="translate(320 220)"/>
  <use href="#carrierCycle" transform="translate(344 220)"/>
  <use href="#carrierCycle" transform="translate(368 220)"/>
  <use href="#carrierCycle" transform="translate(392 220)"/>
  <use href="#carrierCycle" transform="translate(416 220)"/>
  <use href="#carrierCycle" transform="translate(440 220)"/>
  <use href="#carrierCycle" transform="translate(464 220)"/>
  <use href="#carrierCycle" transform="translate(488 220)"/>
  <use href="#carrierCycle" transform="translate(512 220)"/>
  <use href="#carrierCycle" transform="translate(536 220)"/>
</g>
<g class="inverted">
  <use href="#carrierCycle" transform="matrix(1 0 0 -1 200 220)"/>
  <use href="#carrierCycle" transform="matrix(1 0 0 -1 224 220)"/>
  <use href="#carrierCycle" transform="matrix(1 0 0 -1 248 220)"/>
  <use href="#carrierCycle" transform="matrix(1 0 0 -1 272 220)"/>
  <use href="#carrierCycle" transform="matrix(1 0 0 -1 296 220)"/>
  <use href="#carrierCycle" transform="matrix(1 0 0 -1 560 220)"/>
  <use href="#carrierCycle" transform="matrix(1 0 0 -1 584 220)"/>
  <use href="#carrierCycle" transform="matrix(1 0 0 -1 608 220)"/>
  <use href="#carrierCycle" transform="matrix(1 0 0 -1 632 220)"/>
  <use href="#carrierCycle" transform="matrix(1 0 0 -1 656 220)"/>
  <use href="#carrierCycle" transform="matrix(1 0 0 -1 680 220)"/>
  <use href="#carrierCycle" transform="matrix(1 0 0 -1 704 220)"/>
  <use href="#carrierCycle" transform="matrix(1 0 0 -1 728 220)"/>
  <use href="#carrierCycle" transform="matrix(1 0 0 -1 752 220)"/>
  <use href="#carrierCycle" transform="matrix(1 0 0 -1 776 220)"/>
</g>

<rect x="80" y="420" width="120" height="30" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.2" rx="4"/>
<rect x="200" y="420" width="120" height="30" fill="#FFEBEE" stroke="#C62828" stroke-width="1.2" rx="4"/>
<rect x="320" y="420" width="120" height="30" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.2" rx="4"/>
<rect x="440" y="420" width="120" height="30" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.2" rx="4"/>
<rect x="560" y="420" width="120" height="30" fill="#FFEBEE" stroke="#C62828" stroke-width="1.2" rx="4"/>
<rect x="680" y="420" width="120" height="30" fill="#FFEBEE" stroke="#C62828" stroke-width="1.2" rx="4"/>
<text x="140" y="440" text-anchor="middle" class="bit-label" fill="#1565C0">0</text>
<text x="260" y="440" text-anchor="middle" class="bit-label" fill="#C62828">1</text>
<text x="380" y="440" text-anchor="middle" class="bit-label" fill="#1565C0">0</text>
<text x="500" y="440" text-anchor="middle" class="bit-label" fill="#1565C0">0</text>
<text x="620" y="440" text-anchor="middle" class="bit-label" fill="#C62828">1</text>
<text x="740" y="440" text-anchor="middle" class="bit-label" fill="#C62828">1</text>
<text x="440" y="481" text-anchor="middle" class="small">这是 bit-to-phase 映射示意；真实发射还会经过脉冲成形和射频滤波</text>
<text x="140" y="96" text-anchor="middle" class="label" fill="#1565C0">bit=0，同相 0°</text>
<text x="260" y="350" text-anchor="middle" class="label" fill="#C62828">bit=1，反相 180°</text>
</svg>
