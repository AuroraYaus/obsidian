<?xml version="1.0" encoding="UTF-8"?>
<!--
@file    T2.18_tx_rx_filter_group_delay.svg
@brief   发射→接收滤波链级联与群时延汇总图：各级固定群时延合计后
         在同步坐标中统一扣除（T2.12 衔接），并展示 CP 预算中真正
         的消耗项（多径尾与窗滚降）。
@date    2026-08-04
@note    数字为教学示例：17 阶 FIR 群时延 8 samples、21 阶 FIR 10 samples。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620">
<rect width="960" height="620" fill="#ffffff"/>
<style>
.title { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 19px; font-weight: bold; fill: #111; }
.label { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 14px; fill: #222; }
.small { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 12px; fill: #555; }
.mono { font-family: monospace; font-size: 13px; fill: #333; }
.axis { stroke: #444; stroke-width: 1.2; }
.box { stroke-width: 1.6; }
</style>

<text x="480" y="32" text-anchor="middle" class="title">发射与接收滤波链：群时延汇总进定时预算</text>
<text x="480" y="56" text-anchor="middle" class="small">教学示例：线性相位 FIR 群时延 = (N−1)/2 samples；固定群时延是确定性可补偿项，不消耗 CP 预算（T2.12 衔接）</text>

<text x="480" y="84" text-anchor="middle" class="label">信号链路（发射端 → 接收端）与每级固定群时延</text>

<!-- ============ 级联链 6 框 ============ -->
<rect x="40" y="104" width="160" height="64" rx="6" fill="#F3E5F5" stroke="#7B1FA2" class="box"/>
<rect x="240" y="104" width="140" height="64" rx="6" fill="#E0F7FA" stroke="#00838F" class="box"/>
<rect x="420" y="104" width="140" height="64" rx="6" fill="#FFF8E1" stroke="#FF8F00" class="box"/>
<rect x="600" y="104" width="140" height="64" rx="6" fill="#F3E5F5" stroke="#7B1FA2" class="box"/>
<rect x="780" y="104" width="140" height="64" rx="6" fill="#E0F7FA" stroke="#00838F" class="box"/>

<line x1="200" y1="136" x2="240" y2="136" class="axis"/>
<line x1="380" y1="136" x2="420" y2="136" class="axis"/>
<line x1="560" y1="136" x2="600" y2="136" class="axis"/>
<line x1="740" y1="136" x2="780" y2="136" class="axis"/>
<polygon points="240,131 252,136 240,141" fill="#444"/>
<polygon points="420,131 432,136 420,141" fill="#444"/>
<polygon points="600,131 612,136 600,141" fill="#444"/>
<polygon points="780,131 792,136 780,141" fill="#444"/>

<text x="120" y="130" text-anchor="middle" class="label" fill="#7B1FA2">发射窗/滤波</text>
<text x="120" y="152" text-anchor="middle" class="mono">17 阶 FIR</text>
<text x="310" y="130" text-anchor="middle" class="label" fill="#00838F">发射 RF 链路</text>
<text x="310" y="152" text-anchor="middle" class="mono">DAC/PA/混频</text>
<text x="490" y="130" text-anchor="middle" class="label" fill="#FF8F00">无线信道</text>
<text x="490" y="152" text-anchor="middle" class="mono">多径主径</text>
<text x="670" y="130" text-anchor="middle" class="label" fill="#7B1FA2">接收滤波</text>
<text x="670" y="152" text-anchor="middle" class="mono">21 阶 FIR</text>
<text x="850" y="130" text-anchor="middle" class="label" fill="#00838F">FFT 窗/同步</text>
<text x="850" y="152" text-anchor="middle" class="mono">扣除合计延迟</text>

<!-- ============ 每级群时延 ============ -->
<text x="120" y="196" text-anchor="middle" class="small" fill="#7B1FA2">τ_tx = 8 samples</text>
<text x="310" y="196" text-anchor="middle" class="small" fill="#00838F">τ_rf = 3 samples</text>
<text x="490" y="196" text-anchor="middle" class="small" fill="#FF8F00">τ_chan = 15 samples</text>
<text x="670" y="196" text-anchor="middle" class="small" fill="#7B1FA2">τ_rx = 10 samples</text>
<text x="850" y="196" text-anchor="middle" class="small" fill="#00838F">τ_comp = −36</text>

<text x="480" y="230" text-anchor="middle" class="label" fill="#00838F">Σ 固定群时延 = 8 + 3 + 15 + 10 = 36 samples → 同步模块从相关峰位置提前扣除（fft_start 修正）</text>

<!-- ============ 可补偿项条 ============ -->
<rect x="120" y="260" width="360" height="26" fill="#E0F7FA" stroke="#00838F" class="box"/>
<text x="300" y="277" text-anchor="middle" class="small" fill="#00838F">固定群时延 36 samples：补偿扣除，不占 CP 预算</text>

<!-- ============ CP 预算条 ============ -->
<text x="480" y="320" text-anchor="middle" class="label">接收端 CP 预算（参考 CP = 72 samples）：消耗项与余量</text>
<rect x="120" y="338" width="500" height="40" fill="#FFF8E1" stroke="#FF8F00" class="box"/>
<rect x="620" y="338" width="120" height="40" fill="#FBE9E7" stroke="#E64A19" class="box"/>
<rect x="740" y="338" width="100" height="40" fill="#ECEFF1" stroke="#546E7A" class="box"/>
<text x="370" y="362" text-anchor="middle" class="small">多径尾 50 samples</text>
<text x="680" y="362" text-anchor="middle" class="small" fill="#E64A19">窗滚降 12</text>
<text x="790" y="362" text-anchor="middle" class="small">余量 10</text>
<line x1="120" y1="394" x2="840" y2="394" class="axis"/>
<line x1="120" y1="394" x2="120" y2="402" class="axis"/>
<line x1="620" y1="394" x2="620" y2="402" class="axis"/>
<line x1="740" y1="394" x2="740" y2="402" class="axis"/>
<line x1="840" y1="394" x2="840" y2="402" class="axis"/>
<text x="120" y="420" text-anchor="middle" class="small">0</text>
<text x="620" y="420" text-anchor="middle" class="small">50</text>
<text x="740" y="420" text-anchor="middle" class="small">62</text>
<text x="840" y="420" text-anchor="middle" class="small">72 samples</text>

<!-- ============ 警示与结论 ============ -->
<text x="480" y="470" text-anchor="middle" class="label" fill="#E64A19">未扣除群时延的后果：fft_start 整体偏移 36 samples → 定时搜索窗口被迫后移，CP 余量被悄悄吃掉</text>
<text x="480" y="500" text-anchor="middle" class="small">对应 T2.12 调试案例「滤波器时延未扣除」：关闭滤波对比 fft_start，并在同步链路补偿 filter delay</text>
<text x="480" y="550" text-anchor="middle" class="label">工程要点：滤波器阶数越高群时延越大；群时延必须与同步模块共享同一时间参考，而不是各维护一套局部坐标</text>
<text x="480" y="578" text-anchor="middle" class="small">诊断字段：filter_group_delay、fft_start、cp_margin、tx_window_len、rx_window_len（与 T2.12 的 fft_start 字段对齐）</text>
</svg>
