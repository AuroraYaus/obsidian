<text x="480" y="34" text-anchor="middle" class="free" font-size="17" fill="#111" font-weight="bold">CFO 与 SFO 的相位特征：平坦偏置 vs 子载波线性斜率</text><text x="480" y="60" text-anchor="middle" class="free" font-size="12" fill="#555">横轴：子载波索引 k（0–600），每条折线对应一个 OFDM 符号 l</text><rect x="150.35" y="60" width="229.3" height="28" rx="6" fill="#FCE4EC" stroke="#C2185B" stroke-width="1.2"/><text x="265" y="79.04" text-anchor="middle" class="label" font-weight="normal" fill="#222">左：CFO —— 相位与 k 无关</text><line x1="90" y1="420" x2="440" y2="420" stroke="#444" stroke-width="1.2"/><line x1="90" y1="110" x2="90" y2="420" stroke="#444" stroke-width="1.2"/><line x1="90" y1="110" x2="440" y2="110" stroke="#E0E0E0" stroke-width="1" stroke-dasharray="4,4"/><line x1="90" y1="165" x2="440" y2="165" stroke="#E0E0E0" stroke-width="1" stroke-dasharray="4,4"/><line x1="90" y1="220" x2="440" y2="220" stroke="#E0E0E0" stroke-width="1" stroke-dasharray="4,4"/><line x1="90" y1="275" x2="440" y2="275" stroke="#E0E0E0" stroke-width="1" stroke-dasharray="4,4"/><line x1="90" y1="330" x2="440" y2="330" stroke="#E0E0E0" stroke-width="1" stroke-dasharray="4,4"/><line x1="90" y1="385" x2="440" y2="385" stroke="#E0E0E0" stroke-width="1" stroke-dasharray="4,4"/><line x1="90" y1="420" x2="440" y2="420" stroke="#B0BEC5" stroke-width="2.4"/><rect x="52.12" y="394" width="91.76" height="24" rx="6" fill="#FAFAFA" stroke="#B0BEC5" stroke-width="1.2"/><text x="98" y="410.68" text-anchor="middle" class="label" font-weight="normal" fill="#222">l=0 · 0°</text><line x1="90" y1="290" x2="440" y2="290" stroke="#EC407A" stroke-width="2.4"/><rect x="47.635" y="264" width="100.73" height="24" rx="6" fill="#FAFAFA" stroke="#B0BEC5" stroke-width="1.2"/><text x="98" y="280.68" text-anchor="middle" class="label" font-weight="normal" fill="#222">l=2 · 26°</text><line x1="90" y1="165" x2="440" y2="165" stroke="#C2185B" stroke-width="2.4"/><rect x="47.635" y="139" width="100.73" height="24" rx="6" fill="#FAFAFA" stroke="#B0BEC5" stroke-width="1.2"/><text x="98" y="155.68" text-anchor="middle" class="label" font-weight="normal" fill="#222">l=4 · 51°</text><rect x="42.625" y="84" width="94.75" height="24" rx="6" fill="#ECEFF1" stroke="#90A4AE" stroke-width="1.2"/><text x="90" y="100.68" text-anchor="middle" class="label" font-weight="normal" fill="#222">相位（度）</text><text x="105" y="210" text-anchor="start" class="free" font-size="12" fill="#555">所有子载波同相位，随 l 整体抬升</text><rect x="67.58" y="435" width="44.84" height="22" rx="6" fill="#FAFAFA" stroke="#B0BEC5" stroke-width="1.2"/><text x="90" y="450.32" text-anchor="middle" class="label" font-weight="normal" fill="#222">k=0</text><rect x="367.3" y="435" width="61.4" height="22" rx="6" fill="#FAFAFA" stroke="#B0BEC5" stroke-width="1.2"/><text x="398" y="450.32" text-anchor="middle" class="label" font-weight="normal" fill="#222">k=600</text><rect x="205.09" y="465" width="119.82" height="26" rx="6" fill="#ECEFF1" stroke="#90A4AE" stroke-width="1.2"/><text x="265" y="483.04" text-anchor="middle" class="label" font-weight="normal" fill="#222">子载波索引 k</text><rect x="569.25" y="60" width="261.5" height="28" rx="6" fill="#E8EAF6" stroke="#3949AB" stroke-width="1.2"/><text x="700" y="79.04" text-anchor="middle" class="label" font-weight="normal" fill="#222">右：SFO —— 相位随 k 线性增长</text><line x1="520" y1="420" x2="880" y2="420" stroke="#444" stroke-width="1.2"/><line x1="520" y1="110" x2="520" y2="420" stroke="#444" stroke-width="1.2"/><line x1="520" y1="110" x2="880" y2="110" stroke="#E0E0E0" stroke-width="1" stroke-dasharray="4,4"/><line x1="520" y1="165" x2="880" y2="165" stroke="#E0E0E0" stroke-width="1" stroke-dasharray="4,4"/><line x1="520" y1="220" x2="880" y2="220" stroke="#E0E0E0" stroke-width="1" stroke-dasharray="4,4"/><line x1="520" y1="275" x2="880" y2="275" stroke="#E0E0E0" stroke-width="1" stroke-dasharray="4,4"/><line x1="520" y1="330" x2="880" y2="330" stroke="#E0E0E0" stroke-width="1" stroke-dasharray="4,4"/><line x1="520" y1="385" x2="880" y2="385" stroke="#E0E0E0" stroke-width="1" stroke-dasharray="4,4"/><line x1="520" y1="420" x2="880" y2="420" stroke="#B0BEC5" stroke-width="2.4"/><rect x="482.12" y="394" width="91.76" height="24" rx="6" fill="#FAFAFA" stroke="#B0BEC5" stroke-width="1.2"/><text x="528" y="410.68" text-anchor="middle" class="label" font-weight="normal" fill="#222">l=0 · 0°</text><line x1="520" y1="420" x2="880" y2="374" stroke="#5C6BC0" stroke-width="2.4"/><rect x="473.15" y="348" width="109.7" height="24" rx="6" fill="#FAFAFA" stroke="#B0BEC5" stroke-width="1.2"/><text x="528" y="364.68" text-anchor="middle" class="label" font-weight="normal" fill="#222">l=2 · 9.2°</text><line x1="520" y1="420" x2="880" y2="327.5" stroke="#3949AB" stroke-width="2.4"/><rect x="468.665" y="301.5" width="118.67" height="24" rx="6" fill="#FAFAFA" stroke="#B0BEC5" stroke-width="1.2"/><text x="528" y="318.18" text-anchor="middle" class="label" font-weight="normal" fill="#222">l=4 · 18.5°</text><rect x="464.625" y="84" width="94.75" height="24" rx="6" fill="#ECEFF1" stroke="#90A4AE" stroke-width="1.2"/><text x="520" y="100.68" text-anchor="middle" class="label" font-weight="normal" fill="#222">相位（度）</text><text x="540" y="210" text-anchor="start" class="free" font-size="13" fill="#333" font-family="monospace">相位 = 2π·k·Δf·η·t_l：斜率随 l 加大</text><rect x="497.58" y="435" width="44.84" height="22" rx="6" fill="#FAFAFA" stroke="#B0BEC5" stroke-width="1.2"/><text x="520" y="450.32" text-anchor="middle" class="label" font-weight="normal" fill="#222">k=0</text><rect x="797.3" y="435" width="61.4" height="22" rx="6" fill="#FAFAFA" stroke="#B0BEC5" stroke-width="1.2"/><text x="828" y="450.32" text-anchor="middle" class="label" font-weight="normal" fill="#222">k=600</text><rect x="640.09" y="465" width="119.82" height="26" rx="6" fill="#ECEFF1" stroke="#90A4AE" stroke-width="1.2"/><text x="700" y="483.04" text-anchor="middle" class="label" font-weight="normal" fill="#222">子载波索引 k</text><text x="480" y="556" text-anchor="middle" class="free" font-size="12" fill="#555">数值来源：左图残余 CFO=1 kHz @ 30 kHz SCS（每符号 12.8°）；右图 SFO=20 ppm、k=600（每符号 4.6°，Δφ=2π·k·Δf·η·T_symb）</text><text x="480" y="578" text-anchor="middle" class="free" font-size="12" fill="#555">两图 y 轴满量程均为 60°，比例一致；SFO 的相位随 k 与 l 双重累积，长 burst 中不可忽略</text></svg>
