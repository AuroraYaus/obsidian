     @note 左图按残余 CFO=1 kHz @30 kHz SCS（每符号 12.8°）；右图按 SFO=20 ppm、k=600（每符号 4.6°）；y 轴满量程 60° 两图一致。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600">
<rect width="960" height="600" fill="#ffffff"/>
<style>
.title { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 17px; font-weight: bold; fill: #111; }
