<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560">
<rect width="900" height="560" fill="white"/>
<text x="50" y="28" font-size="15" fill="#c62828" font-weight="bold">场景 A：无 CP（ISI 发生）</text>
<rect x="180" y="56" width="200" height="66" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<text x="280.0" y="94" text-anchor="middle" font-size="13" fill="#1565c0">OFDM 符号 n−1</text>
<rect x="380" y="56" width="200" height="66" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="480.0" y="94" text-anchor="middle" font-size="13" fill="#2e7d32">OFDM 符号 n</text>
<rect x="240" y="146" width="200" height="66" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5" stroke-dasharray="6,3"/>
<text x="340.0" y="184" text-anchor="middle" font-size="12" fill="#c62828">延迟副本（n−1）</text>
<rect x="380" y="56" width="200" height="96" fill="none" stroke="#c62828" stroke-width="2.5" rx="3"/>
<text x="480.0" y="48" text-anchor="middle" font-size="12" fill="#c62828" font-weight="bold">FFT 积分窗口</text>
<text x="450.0" y="240" text-anchor="middle" font-size="13" fill="#c62828">❌ 延迟副本落入符号 n 的 FFT 窗口 → 符号间干扰</text>
<text x="50" y="276" font-size="15" fill="#2e7d32" font-weight="bold">场景 B：有 CP（ISI 消除，前提：τ_max ≤ T_CP）</text>
<rect x="140" y="304" width="48" height="66" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
<text x="164.0" y="342" text-anchor="middle" font-size="11" fill="#1565c0">CP</text>
<rect x="188" y="304" width="200" height="66" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<text x="288.0" y="342" text-anchor="middle" font-size="13" fill="#1565c0">OFDM 符号 n−1 (data)</text>
<rect x="388" y="304" width="48" height="66" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
<text x="412.0" y="342" text-anchor="middle" font-size="11" fill="#2e7d32">CP</text>
<rect x="436" y="304" width="200" height="66" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="536.0" y="342" text-anchor="middle" font-size="13" fill="#2e7d32">OFDM 符号 n (data)</text>
<rect x="236" y="394" width="200" height="66" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="6,3"/>
<text x="336.0" y="432" text-anchor="middle" font-size="12" fill="#2e7d32">延迟副本（n−1 data）</text>
<rect x="436" y="304" width="200" height="96" fill="none" stroke="#2e7d32" stroke-width="2.5" rx="3"/>
<text x="536.0" y="296" text-anchor="middle" font-size="12" fill="#2e7d32" font-weight="bold">FFT 积分窗口（去 CP 后）</text>
<rect x="388.0" y="394" width="48.0" height="66" fill="#4caf50" opacity="0.25"/>
<text x="412.0" y="432" text-anchor="middle" font-size="11" fill="#1b5e20">落入 CP ✓</text>
<text x="450.0" y="488" text-anchor="middle" font-size="13" fill="#2e7d32">✓ 延迟副本只侵入符号 n 的 CP 区间 → FFT 窗口内无 ISI</text>
<text x="450.0" y="538" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">前提条件：τ_max ≤ T_CP → CP 吸收跨符号尾巴，去 CP 后的 FFT 窗口不受污染</text>
</svg>
