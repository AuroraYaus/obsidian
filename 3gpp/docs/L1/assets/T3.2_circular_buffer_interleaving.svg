<?xml version="1.0" encoding="UTF-8"?>
<!--
  @file    T3.2_circular_buffer_interleaving.svg
  @brief   图 2：circular buffer w 的交错写入布局（K_Π = 5 示例，15 个位置）——
           三路 sub-block interleaver 输出按 TS 36.212 §5.1.4.1.2 bit collection
           规则填入 w：前半段 v⁽⁰⁾ 独占，后半段 v⁽¹⁾/v⁽²⁾ 逐比特交替
  @date    2026-08-04
  @note    视觉设计依据 docs/L1/T3.2_transport_code_block_filler_bits.md 语义
           （§5.1.4.1.2 公式、决策一/二），不参考旧脚本渲染图：
           对齐式映射布局——上方三路子块交织输出（每路 K_Π = 5 个带下标格子）
           经同色竖线逐位下落，汇入下方 w 的 15 个位置（每格标 w 下标）；
           段标签 [0, K_Π−1] / [K_Π, 3K_Π−1] 与公式芯片给出 bit collection 规则。
           色系（新）：系统流 v⁽⁰⁾ 青绿 / 校验流 v⁽¹⁾ 靛蓝 / 校验流 v⁽²⁾ 琥珀；
           扁平工程图风格（直角、无阴影、细描边）。替代原脚本渲染 PNG
           （脚本与 PNG 已随迁移删除，git 可恢复）。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="530" viewBox="0 0 1000 530" role="img" font-family="'Noto Sans CJK SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif">
  <title>circular buffer w 的交错写入布局（K_Π=5，K_w=15）</title>

  <!-- ============ 标题区 ============ -->
  <text x="500" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#0F172A" class="free">
    circular buffer w 的交错写入（bit collection）
  </text>
  <text x="500" y="66" text-anchor="middle" font-size="12.5" fill="#64748B" class="free">
    三路子块交织输出 v⁽⁰⁾/v⁽¹⁾/v⁽²⁾（各 K_Π = 5 比特）按 TS 36.212 §5.1.4.1.2 收集为 w：系统流在前、校验流逐比特交替在后（K_w = 3K_Π = 15）
  </text>

  <!-- ============ 源流行标签（左侧） ============ -->
  <g font-size="12.5" fill="#334155">
    <text x="40" y="113" class="free">v⁽⁰⁾ 系统流（systematic）</text>
    <text x="40" y="155" class="free">v⁽¹⁾ 校验流一（parity 1）</text>
    <text x="40" y="197" class="free">v⁽²⁾ 校验流二（parity 2）</text>
  </g>

  <!-- ============ 子块交织输出：三路各 5 格（按 K_Π=5 示例） ============ -->
  <g font-family="inherit">
    <!-- v⁽⁰⁾ 系统流：第 0..4 比特 -->
    <rect x="220" y="96"  width="40" height="34" rx="2" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.5"/>
    <text x="240" y="113" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#134E4A">v⁰₀</text>
    <rect x="268" y="96"  width="40" height="34" rx="2" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.5"/>
    <text x="288" y="113" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#134E4A">v⁰₁</text>
    <rect x="316" y="96"  width="40" height="34" rx="2" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.5"/>
    <text x="336" y="113" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#134E4A">v⁰₂</text>
    <rect x="364" y="96"  width="40" height="34" rx="2" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.5"/>
    <text x="384" y="113" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#134E4A">v⁰₃</text>
    <rect x="412" y="96"  width="40" height="34" rx="2" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.5"/>
    <text x="432" y="113" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#134E4A">v⁰₄</text>
    <!-- v⁽¹⁾ 校验流一：偶数偏移位置（K_Π+2k） -->
    <rect x="460" y="138" width="44" height="34" rx="2" fill="#E0E7FF" stroke="#4338CA" stroke-width="1.5"/>
    <text x="482" y="155" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#3730A3">v¹₀</text>
    <rect x="556" y="138" width="44" height="34" rx="2" fill="#E0E7FF" stroke="#4338CA" stroke-width="1.5"/>
    <text x="578" y="155" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#3730A3">v¹₁</text>
    <rect x="652" y="138" width="44" height="34" rx="2" fill="#E0E7FF" stroke="#4338CA" stroke-width="1.5"/>
    <text x="674" y="155" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#3730A3">v¹₂</text>
    <rect x="748" y="138" width="44" height="34" rx="2" fill="#E0E7FF" stroke="#4338CA" stroke-width="1.5"/>
    <text x="770" y="155" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#3730A3">v¹₃</text>
    <rect x="844" y="138" width="44" height="34" rx="2" fill="#E0E7FF" stroke="#4338CA" stroke-width="1.5"/>
    <text x="866" y="155" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#3730A3">v¹₄</text>
    <!-- v⁽²⁾ 校验流二：奇数偏移位置（K_Π+2k+1） -->
    <rect x="508" y="180" width="44" height="34" rx="2" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
    <text x="530" y="197" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#78350F">v²₀</text>
    <rect x="604" y="180" width="44" height="34" rx="2" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
    <text x="626" y="197" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#78350F">v²₁</text>
    <rect x="700" y="180" width="44" height="34" rx="2" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
    <text x="722" y="197" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#78350F">v²₂</text>
    <rect x="796" y="180" width="44" height="34" rx="2" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
    <text x="818" y="197" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#78350F">v²₃</text>
    <rect x="892" y="180" width="44" height="34" rx="2" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
    <text x="914" y="197" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#78350F">v²₄</text>
  </g>

  <!-- ============ 逐位映射竖线（每格一根，同色指向 w 对应位置） ============ -->
  <g stroke-width="1.25">
    <line x1="242" y1="130" x2="242" y2="278" stroke="#0F766E"/>
    <line x1="290" y1="130" x2="290" y2="278" stroke="#0F766E"/>
    <line x1="338" y1="130" x2="338" y2="278" stroke="#0F766E"/>
    <line x1="386" y1="130" x2="386" y2="278" stroke="#0F766E"/>
    <line x1="434" y1="130" x2="434" y2="278" stroke="#0F766E"/>
    <line x1="482" y1="172" x2="482" y2="278" stroke="#4338CA"/>
    <line x1="530" y1="214" x2="530" y2="278" stroke="#B45309"/>
    <line x1="578" y1="172" x2="578" y2="278" stroke="#4338CA"/>
    <line x1="626" y1="214" x2="626" y2="278" stroke="#B45309"/>
    <line x1="674" y1="172" x2="674" y2="278" stroke="#4338CA"/>
    <line x1="722" y1="214" x2="722" y2="278" stroke="#B45309"/>
    <line x1="770" y1="172" x2="770" y2="278" stroke="#4338CA"/>
    <line x1="818" y1="214" x2="818" y2="278" stroke="#B45309"/>
    <line x1="866" y1="172" x2="866" y2="278" stroke="#4338CA"/>
    <line x1="914" y1="214" x2="914" y2="278" stroke="#B45309"/>
  </g>

  <!-- ============ 系统段 / 校验段分隔虚线 ============ -->
  <path d="M 458 96 l 0 240" stroke="#64748B" stroke-width="1.5" stroke-dasharray="6,3"/>

  <!-- ============ 目标：circular buffer w 的 15 个位置 ============ -->
  <g font-family="inherit">
    <rect x="220" y="278" width="40" height="36" rx="2" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.5"/>
    <text x="242" y="296" text-anchor="middle" font-size="13" fill="#134E4A">w₀</text>
    <rect x="268" y="278" width="40" height="36" rx="2" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.5"/>
    <text x="290" y="296" text-anchor="middle" font-size="13" fill="#134E4A">w₁</text>
    <rect x="316" y="278" width="40" height="36" rx="2" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.5"/>
    <text x="338" y="296" text-anchor="middle" font-size="13" fill="#134E4A">w₂</text>
    <rect x="364" y="278" width="40" height="36" rx="2" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.5"/>
    <text x="386" y="296" text-anchor="middle" font-size="13" fill="#134E4A">w₃</text>
    <rect x="412" y="278" width="40" height="36" rx="2" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.5"/>
    <text x="434" y="296" text-anchor="middle" font-size="13" fill="#134E4A">w₄</text>
    <rect x="460" y="278" width="40" height="36" rx="2" fill="#E0E7FF" stroke="#4338CA" stroke-width="1.5"/>
    <text x="482" y="296" text-anchor="middle" font-size="13" fill="#3730A3">w₅</text>
    <rect x="508" y="278" width="40" height="36" rx="2" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
    <text x="530" y="296" text-anchor="middle" font-size="13" fill="#78350F">w₆</text>
    <rect x="556" y="278" width="40" height="36" rx="2" fill="#E0E7FF" stroke="#4338CA" stroke-width="1.5"/>
    <text x="578" y="296" text-anchor="middle" font-size="13" fill="#3730A3">w₇</text>
    <rect x="604" y="278" width="40" height="36" rx="2" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
    <text x="626" y="296" text-anchor="middle" font-size="13" fill="#78350F">w₈</text>
    <rect x="652" y="278" width="40" height="36" rx="2" fill="#E0E7FF" stroke="#4338CA" stroke-width="1.5"/>
    <text x="674" y="296" text-anchor="middle" font-size="13" fill="#3730A3">w₉</text>
    <rect x="700" y="278" width="40" height="36" rx="2" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
    <text x="720" y="296" text-anchor="middle" font-size="11" fill="#78350F">w₁₀</text>
    <rect x="748" y="278" width="40" height="36" rx="2" fill="#E0E7FF" stroke="#4338CA" stroke-width="1.5"/>
    <text x="768" y="296" text-anchor="middle" font-size="11" fill="#3730A3">w₁₁</text>
    <rect x="796" y="278" width="40" height="36" rx="2" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
    <text x="816" y="296" text-anchor="middle" font-size="11" fill="#78350F">w₁₂</text>
    <rect x="844" y="278" width="40" height="36" rx="2" fill="#E0E7FF" stroke="#4338CA" stroke-width="1.5"/>
    <text x="864" y="296" text-anchor="middle" font-size="11" fill="#3730A3">w₁₃</text>
    <rect x="892" y="278" width="40" height="36" rx="2" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
    <text x="912" y="296" text-anchor="middle" font-size="11" fill="#78350F">w₁₄</text>
  </g>

  <!-- ============ 段标签 ============ -->
  <text x="338" y="338" text-anchor="middle" font-size="12" fill="#334155" class="free">系统段 [0, K<tspan font-size="9" dy="2">Π</tspan>−1]</text>
  <text x="698" y="338" text-anchor="middle" font-size="12" fill="#334155" class="free">校验段 [K<tspan font-size="9" dy="2">Π</tspan>, 3K<tspan font-size="9" dy="2">Π</tspan>−1]（偶→v¹ 奇→v²）</text>

  <!-- ============ bit collection 公式芯片 ============ -->
  <rect x="250" y="368" width="500" height="40" rx="2" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.25"/>
  <text x="500" y="392" text-anchor="middle" font-size="12.5" fill="#334155">
    bit collection 规则：w<tspan font-size="9" dy="2">k</tspan> = v⁽⁰⁾<tspan font-size="9" dy="2">k</tspan>（k = 0 … K_Π−1）；w<tspan font-size="9" dy="2">K_Π+2k</tspan> = v⁽¹⁾<tspan font-size="9" dy="2">k</tspan>、w<tspan font-size="9" dy="2">K_Π+2k+1</tspan> = v⁽²⁾<tspan font-size="9" dy="2">k</tspan>
  </text>

  <!-- ============ 设计语义说明 ============ -->
  <text x="500" y="430" text-anchor="middle" font-size="12" fill="#64748B" class="free">
    设计语义：系统比特居前 → RV 0 首发优先（决策一）；校验流逐比特交替 → 任意连续读取窗口两路校验数量差 ≤ 1（决策二）
  </text>

  <!-- ============ 图例 ============ -->
  <g font-size="12.5" fill="#334155">
    <rect x="125" y="456" width="230" height="28" rx="2" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.25"/>
    <rect x="137" y="462" width="16" height="16" rx="2" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.25"/>
    <text x="161" y="470" dominant-baseline="central">v⁽⁰⁾ 系统流（systematic）</text>
    <rect x="385" y="456" width="230" height="28" rx="2" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.25"/>
    <rect x="397" y="462" width="16" height="16" rx="2" fill="#E0E7FF" stroke="#4338CA" stroke-width="1.25"/>
    <text x="421" y="470" dominant-baseline="central">v⁽¹⁾ 校验流一（parity 1）</text>
    <rect x="645" y="456" width="230" height="28" rx="2" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.25"/>
    <rect x="657" y="462" width="16" height="16" rx="2" fill="#FEF3C7" stroke="#B45309" stroke-width="1.25"/>
    <text x="681" y="470" dominant-baseline="central">v⁽²⁾ 校验流二（parity 2）</text>
  </g>

  <!-- ============ 读图说明 ============ -->
  <text x="500" y="508" text-anchor="middle" font-size="12" fill="#64748B" class="free">
    w 格内标位置编号；同色竖线从源流指向 w 对应位置（如 w₅ ← v¹₀），表示该位来自哪一路的第几个比特
  </text>
</svg>
