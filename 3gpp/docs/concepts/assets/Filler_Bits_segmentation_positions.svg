<?xml version="1.0" encoding="UTF-8"?>
<!--
@file    Filler_Bits_segmentation_positions.svg
@brief   填充位在码块分段中的插入位置、在编码与速率匹配中的走向，以及填充位数量与码块长度、分段数的数值关系
@note    本图以三个面板并列呈现同一件事的三个侧面。面板 A 把同一传输块按 LTE 与 NR 两种分段约定
         各画一遍：LTE（TS 36.212 §5.1.2）的填充位全部置于首个码块开头，NR（TS 38.212 §5.2.2）
         的填充位置于每个码块尾部，两者均标出码块长度与填充长度；面板 A 中填充段宽度为示意放大，
         长度以标注数字为准，净荷与 CB CRC 合并为数据段标注。面板 B 沿编码、写循环缓存、比特选择
         三个阶段说明 NULL 的取值语义与去向：编码输入处按 0 参与运算，缓存中只占地址，比特选择时
         只推进地址而不产生输出比特，与 Circular_Buffer 笔记对 NULL 位置的口径一致。面板 C 以取值表
         并列两组算例，给出 K_+、K_-、K'、K_r、F 与 F_r 的数值关系，两例的码块数均为 2。
         图中数值取自 TS 36.212 Table 5.1.3-3 与 TS 38.212 Table 5.3.2-1，可按面板 C 逐行复核。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1180" viewBox="0 0 1180 1180" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <rect x="0" y="0" width="1180" height="1180" fill="#ffffff"/>

  <!-- 页级标题（框外文字） -->
  <text class="free" x="590" y="42" font-size="19" font-weight="bold" text-anchor="middle" fill="#222222">填充位在分段、编码与速率匹配中的位置、走向与数量</text>

  <!-- ================= 面板 A：填充位的插入位置 ================= -->
  <rect x="30" y="70" width="1120" height="390" fill="#fdfdfd" stroke="#444444" stroke-width="1.5"/>
  <text x="590" y="102" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222">面板 A｜填充位的插入位置：LTE 首块开头与 NR 每块尾部</text>
  <text x="590" y="124" font-size="11" text-anchor="middle" fill="#333333">填充段宽度为示意放大，长度以标注数字为准；净荷与 CB CRC 合并为数据段</text>

  <!-- LTE 行 -->
  <text x="52" y="162" font-size="11" fill="#222222">LTE Turbo（TS 36.212 §5.1.2）：F 个 &lt;NULL&gt; 全部置于第一个码块开头</text>

  <rect x="150" y="180" width="54" height="44" fill="#e9e2f5" stroke="#6b4f9e" stroke-width="1.5"/>
  <rect x="204" y="180" width="306" height="44" fill="#cfe3ff" stroke="#3d6fb5" stroke-width="1.5"/>
  <rect x="560" y="180" width="368" height="44" fill="#cfe3ff" stroke="#3d6fb5" stroke-width="1.5"/>
  <text x="177" y="208" font-size="11" text-anchor="middle" fill="#4a3372">NULL</text>
  <text x="357" y="208" font-size="11" text-anchor="middle" fill="#222222">净荷 3033 + CB CRC 24</text>
  <text x="744" y="208" font-size="11" text-anchor="middle" fill="#222222">净荷 3112 + CB CRC 24</text>
  <text x="944" y="196" font-size="11" fill="#333333">B' = 6193</text>
  <text x="944" y="218" font-size="11" fill="#333333">容量 6208 = 6193 + 15</text>

  <text x="330" y="246" font-size="11" text-anchor="middle" fill="#222222">CB0：K_r = K_- = 3072（含 15 个 NULL）</text>
  <text x="744" y="246" font-size="11" text-anchor="middle" fill="#222222">CB1：K_r = K_+ = 3136</text>
  <text x="52" y="272" font-size="11" fill="#333333">首块 = 15 个 NULL + 3033 位净荷 + 24 bit CB CRC = 3072；次块 = 3112 + 24 = 3136</text>

  <!-- NR 行 -->
  <text x="52" y="306" font-size="11" fill="#222222">NR LDPC（TS 38.212 §5.2.2）：每个码块尾部补 F_r，最后一个码块同样在尾部</text>

  <rect x="150" y="324" width="306" height="44" fill="#cfe3ff" stroke="#3d6fb5" stroke-width="1.5"/>
  <rect x="456" y="324" width="54" height="44" fill="#e9e2f5" stroke="#6b4f9e" stroke-width="1.5"/>
  <rect x="560" y="324" width="306" height="44" fill="#cfe3ff" stroke="#3d6fb5" stroke-width="1.5"/>
  <rect x="866" y="324" width="54" height="44" fill="#e9e2f5" stroke="#6b4f9e" stroke-width="1.5"/>
  <text x="303" y="352" font-size="11" text-anchor="middle" fill="#222222">净荷 5000 + CB CRC 24</text>
  <text x="483" y="352" font-size="11" text-anchor="middle" fill="#4a3372">NULL</text>
  <text x="713" y="352" font-size="11" text-anchor="middle" fill="#222222">净荷 5000 + CB CRC 24</text>
  <text x="893" y="352" font-size="11" text-anchor="middle" fill="#4a3372">NULL</text>
  <text x="944" y="340" font-size="11" fill="#333333">B' = 10048</text>
  <text x="944" y="362" font-size="11" fill="#333333">容量 10560（含 2 × 256）</text>

  <text x="330" y="390" font-size="11" text-anchor="middle" fill="#222222">CB0：K_r = 5280，尾部 256 个 NULL</text>
  <text x="743" y="390" font-size="11" text-anchor="middle" fill="#222222">CB1：K_r = 5280，尾部 256 个 NULL</text>
  <text x="52" y="416" font-size="11" fill="#333333">每块 = 5000 位净荷 + 24 bit CB CRC + 256 个 NULL = 5280；两块净荷合计 10000</text>

  <!-- ================= 面板 B：编码与速率匹配中的走向 ================= -->
  <rect x="30" y="480" width="1120" height="330" fill="#fdfdfd" stroke="#444444" stroke-width="1.5"/>
  <text x="590" y="512" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222">面板 B｜填充位进入编码与速率匹配后的走向</text>
  <text x="590" y="534" font-size="11" text-anchor="middle" fill="#333333">三个阶段的取值与计数：编码输入按 0 参与、缓存中占地址、选择时跳过 NULL</text>

  <!-- 四个阶段框 -->
  <rect x="50" y="560" width="240" height="88" fill="#ffffff" stroke="#666666" stroke-width="1.2"/>
  <rect x="330" y="560" width="240" height="88" fill="#ffffff" stroke="#666666" stroke-width="1.2"/>
  <rect x="610" y="560" width="240" height="88" fill="#ffffff" stroke="#666666" stroke-width="1.2"/>
  <rect x="890" y="560" width="240" height="88" fill="#ffffff" stroke="#666666" stroke-width="1.2"/>

  <text x="170" y="584" font-size="11" text-anchor="middle" fill="#222222">第 1 步：分段输出</text>
  <text x="170" y="608" font-size="11" text-anchor="middle" fill="#222222">CB_r：净荷 + CB CRC</text>
  <text x="170" y="632" font-size="11" text-anchor="middle" fill="#4a3372">填充 F_r 个 NULL</text>

  <text x="450" y="584" font-size="11" text-anchor="middle" fill="#222222">第 2 步：编码</text>
  <text x="450" y="608" font-size="11" text-anchor="middle" fill="#222222">输入处 NULL 按 0 运算</text>
  <text x="450" y="632" font-size="11" text-anchor="middle" fill="#222222">输出 D = K_r + 4 或 N = 66Z_c</text>

  <text x="730" y="584" font-size="11" text-anchor="middle" fill="#222222">第 3 步：写循环缓存</text>
  <text x="730" y="608" font-size="11" text-anchor="middle" fill="#222222">长度 N_cb；NULL 占地址</text>
  <text x="730" y="632" font-size="11" text-anchor="middle" fill="#222222">地址上无比特可读</text>

  <text x="1010" y="584" font-size="11" text-anchor="middle" fill="#222222">第 4 步：比特选择</text>
  <text x="1010" y="608" font-size="11" text-anchor="middle" fill="#222222">命中 NULL：j 加 1，k 不变</text>
  <text x="1010" y="632" font-size="11" text-anchor="middle" fill="#222222">输出 e_k 不含填充位</text>

  <!-- 阶段之间的方向线 -->
  <line x1="294" y1="604" x2="324" y2="604" stroke="#444444" stroke-width="1.5"/>
  <line x1="324" y1="604" x2="316" y2="599" stroke="#444444" stroke-width="1.5"/>
  <line x1="324" y1="604" x2="316" y2="609" stroke="#444444" stroke-width="1.5"/>
  <line x1="574" y1="604" x2="604" y2="604" stroke="#444444" stroke-width="1.5"/>
  <line x1="604" y1="604" x2="596" y2="599" stroke="#444444" stroke-width="1.5"/>
  <line x1="604" y1="604" x2="596" y2="609" stroke="#444444" stroke-width="1.5"/>
  <line x1="854" y1="604" x2="884" y2="604" stroke="#444444" stroke-width="1.5"/>
  <line x1="884" y1="604" x2="876" y2="599" stroke="#444444" stroke-width="1.5"/>
  <line x1="884" y1="604" x2="876" y2="609" stroke="#444444" stroke-width="1.5"/>

  <!-- 地址序列与输出序列的错位 -->
  <text x="52" y="694" font-size="11" fill="#222222">地址 j</text>
  <rect x="170" y="666" width="56" height="32" fill="#ffffff" stroke="#666666" stroke-width="1"/>
  <rect x="226" y="666" width="56" height="32" fill="#ffffff" stroke="#666666" stroke-width="1"/>
  <rect x="282" y="666" width="56" height="32" fill="#ffffff" stroke="#666666" stroke-width="1"/>
  <rect x="338" y="666" width="56" height="32" fill="#ffffff" stroke="#666666" stroke-width="1"/>
  <rect x="394" y="666" width="56" height="32" fill="#e9e2f5" stroke="#6b4f9e" stroke-width="1.5"/>
  <rect x="450" y="666" width="56" height="32" fill="#ffffff" stroke="#666666" stroke-width="1"/>
  <rect x="506" y="666" width="56" height="32" fill="#ffffff" stroke="#666666" stroke-width="1"/>
  <rect x="562" y="666" width="56" height="32" fill="#ffffff" stroke="#666666" stroke-width="1"/>
  <text x="198" y="687" font-size="11" text-anchor="middle" fill="#333333">0</text>
  <text x="254" y="687" font-size="11" text-anchor="middle" fill="#333333">1</text>
  <text x="310" y="687" font-size="11" text-anchor="middle" fill="#333333">2</text>
  <text x="366" y="687" font-size="11" text-anchor="middle" fill="#333333">3</text>
  <text x="422" y="687" font-size="11" text-anchor="middle" fill="#4a3372">NULL</text>
  <text x="478" y="687" font-size="11" text-anchor="middle" fill="#333333">5</text>
  <text x="534" y="687" font-size="11" text-anchor="middle" fill="#333333">6</text>
  <text x="590" y="687" font-size="11" text-anchor="middle" fill="#333333">7</text>

  <text x="422" y="718" font-size="11" text-anchor="middle" fill="#4a3372">无输出</text>

  <text x="52" y="756" font-size="11" fill="#222222">输出 k</text>
  <rect x="170" y="730" width="56" height="32" fill="#cfe3ff" stroke="#3d6fb5" stroke-width="1"/>
  <rect x="226" y="730" width="56" height="32" fill="#cfe3ff" stroke="#3d6fb5" stroke-width="1"/>
  <rect x="282" y="730" width="56" height="32" fill="#cfe3ff" stroke="#3d6fb5" stroke-width="1"/>
  <rect x="338" y="730" width="56" height="32" fill="#cfe3ff" stroke="#3d6fb5" stroke-width="1"/>
  <rect x="450" y="730" width="56" height="32" fill="#cfe3ff" stroke="#3d6fb5" stroke-width="1"/>
  <rect x="506" y="730" width="56" height="32" fill="#cfe3ff" stroke="#3d6fb5" stroke-width="1"/>
  <rect x="562" y="730" width="56" height="32" fill="#cfe3ff" stroke="#3d6fb5" stroke-width="1"/>
  <text x="198" y="751" font-size="11" text-anchor="middle" fill="#222222">0</text>
  <text x="254" y="751" font-size="11" text-anchor="middle" fill="#222222">1</text>
  <text x="310" y="751" font-size="11" text-anchor="middle" fill="#222222">2</text>
  <text x="366" y="751" font-size="11" text-anchor="middle" fill="#222222">3</text>
  <text x="478" y="751" font-size="11" text-anchor="middle" fill="#222222">4</text>
  <text x="534" y="751" font-size="11" text-anchor="middle" fill="#222222">5</text>
  <text x="590" y="751" font-size="11" text-anchor="middle" fill="#222222">6</text>

  <text x="650" y="694" font-size="11" fill="#222222">推进 8 次地址，输出 7 位</text>
  <text x="650" y="718" font-size="11" fill="#4a3372">NULL 位置：j 加 1，k 不变</text>
  <text x="650" y="742" font-size="11" fill="#222222">接收端在该地址没有 LLR</text>

  <text x="52" y="792" font-size="11" fill="#333333">输出比特数 E_r 与扫描地址数 j 不等；有 filler 时一轮读取推进的地址数大于 E_r</text>

  <!-- ================= 面板 C：填充位数量与码块长度、分段数 ================= -->
  <rect x="30" y="830" width="1120" height="310" fill="#fdfdfd" stroke="#444444" stroke-width="1.5"/>
  <text x="590" y="862" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222">面板 C｜填充位数量与码块长度、分段数的数值关系（两组算例）</text>
  <text x="590" y="884" font-size="11" text-anchor="middle" fill="#333333">LTE：B = 6145；NR：B = 10000、基图 1；两例 C 均为 2</text>

  <text x="60" y="914" font-size="11" fill="#222222">量</text>
  <text x="300" y="914" font-size="11" fill="#222222">LTE（B = 6145）</text>
  <text x="700" y="914" font-size="11" fill="#222222">NR（B = 10000，基图 1）</text>
  <line x1="60" y1="924" x2="1120" y2="924" stroke="#9a9a9a" stroke-width="1"/>

  <text x="60" y="952" font-size="11" fill="#222222">码块数 C</text>
  <text x="300" y="952" font-size="11" fill="#222222">C = 2（6145/6120 向上取整），L = 24</text>
  <text x="700" y="952" font-size="11" fill="#222222">C = 2（10000/8424 向上取整），L = 24</text>

  <text x="60" y="980" font-size="11" fill="#222222">分段总长 B'</text>
  <text x="300" y="980" font-size="11" fill="#222222">B' = 6145 + 48 = 6193</text>
  <text x="700" y="980" font-size="11" fill="#222222">B' = 10000 + 48 = 10048</text>

  <text x="60" y="1008" font-size="11" fill="#222222">合法长度</text>
  <text x="300" y="1008" font-size="11" fill="#222222">K_+ = 3136，K_- = 3072</text>
  <text x="700" y="1008" font-size="11" fill="#222222">K' = 5024，Z_c = 240，K_r = 5280</text>

  <text x="60" y="1036" font-size="11" fill="#222222">码块分配</text>
  <text x="300" y="1036" font-size="11" fill="#222222">C_- = 1，C_+ = 1</text>
  <text x="700" y="1036" font-size="11" fill="#222222">每块同一长度</text>

  <text x="60" y="1064" font-size="11" fill="#222222">各块长度 K_r</text>
  <text x="300" y="1064" font-size="11" fill="#222222">CB0 = 3072，CB1 = 3136</text>
  <text x="700" y="1064" font-size="11" fill="#222222">CB0 = CB1 = 5280</text>

  <text x="60" y="1092" font-size="11" fill="#222222">填充位</text>
  <text x="300" y="1092" font-size="11" fill="#222222">F = 15（CB0 开头）</text>
  <text x="700" y="1092" font-size="11" fill="#222222">F_r = 256（每块尾部）</text>

  <text x="60" y="1120" font-size="11" fill="#222222">净荷核对</text>
  <text x="300" y="1120" font-size="11" fill="#222222">3033 + 3112 = 6145</text>
  <text x="700" y="1120" font-size="11" fill="#222222">5000 + 5000 = 10000</text>
</svg>
