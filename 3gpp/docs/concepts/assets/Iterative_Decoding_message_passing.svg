<?xml version="1.0" encoding="UTF-8"?>
<!--
@file    Iterative_Decoding_message_passing.svg
@brief   迭代译码的三面板结构图：Tanner 二分图、一次迭代内的消息方向与时序、外信息合成后验的数值组成
@note    本图以三个面板并列展示三件事。面板 A 给出 N=6、M=3 的 Tanner 图，变量节点在上、
         校验节点在下，九条边对应校验矩阵中九个取值为 1 的位置，箭头表示本轮变量节点到校验
         节点的消息方向；v0、v4、v5 的度为 1，v1、v2、v3 的度为 2。面板 B 把同一条边的两个
         方向拆成时序：先发 L(v→c)，校验节点排除目标比特后返回 L(c→v)，变量节点累加得后验
         L_v。面板 C 以比特 v2 为例，把后验拆成信道项与两条校验外信息三项相加，并给出后验
         幅度随迭代轮次的变化。图中数值取自笔记的手算例（和积口径，保留三位小数）；面板 C
         右半部分的后验幅度按不停机继续迭代计算，用于说明幅度随轮次增大并趋于饱和。所有文字均落在某个
         rect 内，页级标题为 class="free"，位于面板之外。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1054" viewBox="0 0 1200 1054" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <defs>
    <marker id="arrowV2C" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d6fb5"/>
    </marker>
    <marker id="arrowC2V" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c46a00"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="1054" fill="#ffffff"/>

  <!-- 页级标题（框外文字） -->
  <text class="free" x="600" y="38" font-size="19" font-weight="bold" text-anchor="middle" fill="#222222">迭代译码的 Tanner 图、消息时序与外信息合成</text>

  <!-- ================= 面板 A：Tanner 二分图 ================= -->
  <rect x="24" y="62" width="580" height="608" fill="#fdfdfd" stroke="#444444" stroke-width="1.5"/>
  <text x="314" y="94" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222">面板 A｜Tanner 图：6 个变量节点与 3 个校验节点</text>
  <text x="314" y="117" font-size="11" text-anchor="middle" fill="#333333">变量节点（码字位）在上，校验节点（校验方程）在下；每条边对应 H 中的一个 1</text>

  <text x="60" y="162" font-size="11" fill="#222222">变量节点：每个节点持有一个比特的 LLR</text>

  <!-- 变量节点 -->
  <circle cx="127" cy="210" r="16" fill="#eef4fb" stroke="#3d6fb5" stroke-width="1.5"/>
  <circle cx="202" cy="210" r="16" fill="#eef4fb" stroke="#3d6fb5" stroke-width="1.5"/>
  <circle cx="277" cy="210" r="16" fill="#eef4fb" stroke="#3d6fb5" stroke-width="1.5"/>
  <circle cx="352" cy="210" r="16" fill="#eef4fb" stroke="#3d6fb5" stroke-width="1.5"/>
  <circle cx="427" cy="210" r="16" fill="#eef4fb" stroke="#3d6fb5" stroke-width="1.5"/>
  <circle cx="502" cy="210" r="16" fill="#eef4fb" stroke="#3d6fb5" stroke-width="1.5"/>
  <text x="127" y="214" font-size="11" text-anchor="middle" fill="#1d3f6e">v0</text>
  <text x="202" y="214" font-size="11" text-anchor="middle" fill="#1d3f6e">v1</text>
  <text x="277" y="214" font-size="11" text-anchor="middle" fill="#1d3f6e">v2</text>
  <text x="352" y="214" font-size="11" text-anchor="middle" fill="#1d3f6e">v3</text>
  <text x="427" y="214" font-size="11" text-anchor="middle" fill="#1d3f6e">v4</text>
  <text x="502" y="214" font-size="11" text-anchor="middle" fill="#1d3f6e">v5</text>

  <!-- 边：变量节点 -> 校验节点（箭头落在校验框上边） -->
  <line x1="127" y1="226" x2="120" y2="440" stroke="#3d6fb5" stroke-width="1.4" marker-end="url(#arrowV2C)"/>
  <line x1="202" y1="226" x2="160" y2="440" stroke="#3d6fb5" stroke-width="1.4" marker-end="url(#arrowV2C)"/>
  <line x1="277" y1="226" x2="214" y2="440" stroke="#3d6fb5" stroke-width="1.4" marker-end="url(#arrowV2C)"/>
  <line x1="202" y1="226" x2="268" y2="440" stroke="#3d6fb5" stroke-width="1.4" marker-end="url(#arrowV2C)"/>
  <line x1="277" y1="226" x2="310" y2="440" stroke="#3d6fb5" stroke-width="1.4" marker-end="url(#arrowV2C)"/>
  <line x1="352" y1="226" x2="356" y2="440" stroke="#3d6fb5" stroke-width="1.4" marker-end="url(#arrowV2C)"/>
  <line x1="352" y1="226" x2="420" y2="440" stroke="#3d6fb5" stroke-width="1.4" marker-end="url(#arrowV2C)"/>
  <line x1="427" y1="226" x2="464" y2="440" stroke="#3d6fb5" stroke-width="1.4" marker-end="url(#arrowV2C)"/>
  <line x1="502" y1="226" x2="512" y2="440" stroke="#3d6fb5" stroke-width="1.4" marker-end="url(#arrowV2C)"/>

  <!-- 校验节点 -->
  <rect x="88" y="440" width="144" height="52" fill="#f4f9f4" stroke="#4a8a52" stroke-width="1.5"/>
  <text x="160" y="461" font-size="11" font-weight="bold" text-anchor="middle" fill="#2f5d35">c1</text>
  <text x="160" y="481" font-size="11" text-anchor="middle" fill="#222222">v0⊕v1⊕v2 = 0</text>

  <rect x="242" y="440" width="144" height="52" fill="#f4f9f4" stroke="#4a8a52" stroke-width="1.5"/>
  <text x="314" y="461" font-size="11" font-weight="bold" text-anchor="middle" fill="#2f5d35">c2</text>
  <text x="314" y="481" font-size="11" text-anchor="middle" fill="#222222">v1⊕v2⊕v3 = 0</text>

  <rect x="396" y="440" width="144" height="52" fill="#f4f9f4" stroke="#4a8a52" stroke-width="1.5"/>
  <text x="468" y="461" font-size="11" font-weight="bold" text-anchor="middle" fill="#2f5d35">c3</text>
  <text x="468" y="481" font-size="11" text-anchor="middle" fill="#222222">v3⊕v4⊕v5 = 0</text>

  <!-- 面板 A 说明 -->
  <text x="52" y="516" font-size="11" fill="#222222">校验矩阵 H 的三行依次对应 c1、c2、c3；第 c 行第 i 列为 1 表示边 (c,i) 存在。</text>
  <text x="52" y="538" font-size="11" fill="#222222">c1：1 1 1 0 0 0　　c2：0 1 1 1 0 0　　c3：0 0 0 1 1 1</text>
  <text x="52" y="560" font-size="11" fill="#222222">箭头方向为变量节点 → 校验节点；L(c→v) 沿同一条边反向返回，见面板 B。</text>
  <text x="52" y="582" font-size="11" fill="#222222">v0、v4、v5 的度为 1：只参与一个校验，迭代不给它们带来外信息。</text>
  <text x="52" y="604" font-size="11" fill="#222222">v1、v2、v3 的度为 2：可收到两条校验消息，后验是三项之和。</text>
  <text x="52" y="626" font-size="11" fill="#222222">边与边的交叉不改变图结构；图中只有 v2 到 c1 与 v1 到 c2 一处交叉。</text>

  <!-- ================= 面板 B：一次迭代的消息方向与时序 ================= -->
  <rect x="624" y="62" width="552" height="608" fill="#fdfdfd" stroke="#444444" stroke-width="1.5"/>
  <text x="900" y="94" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222">面板 B｜一次迭代的消息方向与时序</text>
  <text x="900" y="117" font-size="11" text-anchor="middle" fill="#333333">箭头方向即消息流向；同一条边分时承载两个方向</text>

  <rect x="648" y="150" width="210" height="76" fill="#eef4fb" stroke="#3d6fb5" stroke-width="1.5"/>
  <text x="753" y="180" font-size="11" font-weight="bold" text-anchor="middle" fill="#1d3f6e">变量节点 v_i</text>
  <text x="753" y="202" font-size="11" text-anchor="middle" fill="#333333">汇总信道与各校验消息</text>

  <rect x="942" y="150" width="210" height="76" fill="#f4f9f4" stroke="#4a8a52" stroke-width="1.5"/>
  <text x="1047" y="180" font-size="11" font-weight="bold" text-anchor="middle" fill="#2f5d35">校验节点 c_j</text>
  <text x="1047" y="202" font-size="11" text-anchor="middle" fill="#333333">排除 v_i 后计算新证据</text>

  <line x1="866" y1="176" x2="934" y2="176" stroke="#3d6fb5" stroke-width="1.5" marker-end="url(#arrowV2C)"/>
  <text x="900" y="166" font-size="11" text-anchor="middle" fill="#1d3f6e">L(v→c)</text>
  <line x1="934" y1="200" x2="866" y2="200" stroke="#c46a00" stroke-width="1.5" marker-end="url(#arrowC2V)"/>
  <text x="900" y="218" font-size="11" text-anchor="middle" fill="#8a4a00">L(c→v)</text>

  <rect x="648" y="262" width="504" height="76" fill="#f7f9fc" stroke="#d8e0ea" stroke-width="1"/>
  <text x="900" y="288" font-size="11" font-weight="bold" text-anchor="middle" fill="#1d3f6e">后验更新：L_v = L_ch + Σ L(c→v)</text>
  <text x="900" y="312" font-size="11" text-anchor="middle" fill="#333333">判决：L_v &gt; 0 判 0，L_v &lt; 0 判 1；L_v = 0 时两判决等可能</text>

  <text x="648" y="374" font-size="11" font-weight="bold" fill="#222222">一次迭代的时序（四步构成一个完整轮次）</text>
  <text x="648" y="404" font-size="11" fill="#222222">(1) 变量节点取 L_ch 与其余校验来值之和，作为 L(v→c) 发出。</text>
  <text x="648" y="430" font-size="11" fill="#222222">(2) 校验节点排除目标比特自身，按和积或最小和算出 L(c→v)。</text>
  <text x="648" y="456" font-size="11" fill="#222222">(3) L(c→v) 沿原边返回，变量节点累加更新后验 L_v。</text>
  <text x="648" y="482" font-size="11" fill="#222222">(4) 判决后检查停止准则：CRC、syndrome 全零或外信息变化量。</text>

  <line x1="648" y1="516" x2="1152" y2="516" stroke="#d8e0ea" stroke-width="1"/>
  <text x="648" y="546" font-size="11" fill="#333333">同一条边的两个方向共用一条连线，读写必须分时进行。</text>
  <text x="648" y="572" font-size="11" fill="#333333">先发完全部 L(v→c)，再统一计算并返回 L(c→v)，称为洪泛调度。</text>
  <text x="648" y="598" font-size="11" fill="#333333">分层调度按校验节点分组更新，收敛更快，但顺序依赖更强。</text>
  <text x="648" y="624" font-size="11" fill="#333333">变量节点回发时取 L_v − L(c→v)，保证外信息不含该边旧消息。</text>

  <!-- ================= 面板 C：外信息与后验的组成 ================= -->
  <rect x="24" y="690" width="1152" height="340" fill="#fdfdfd" stroke="#444444" stroke-width="1.5"/>
  <text x="600" y="722" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222">面板 C｜外信息与总后验的组成，以及后验幅度随迭代的增长</text>
  <text x="600" y="746" font-size="11" text-anchor="middle" fill="#333333">以 v2 为例：L_ch = −0.800，两条校验外信息 +0.735 与 +1.056，合计 +0.991；若不停机继续迭代，幅度增至 1.214</text>

  <!-- 左卡片：三项相加 -->
  <rect x="48" y="762" width="560" height="250" fill="#fbfbfb" stroke="#cccccc" stroke-width="1"/>
  <text x="72" y="786" font-size="11" font-weight="bold" fill="#222222">三项相加（v2，第 1 轮，和积口径）</text>

  <line x1="300" y1="800" x2="300" y2="944" stroke="#666666" stroke-width="1.2"/>

  <text x="72" y="819" font-size="11" fill="#222222">L_ch = −0.800</text>
  <rect x="204" y="806" width="96" height="18" fill="#cfe3ff" stroke="#3d6fb5" stroke-width="1"/>

  <text x="72" y="855" font-size="11" fill="#222222">L(c1→v) = +0.735</text>
  <rect x="300" y="842" width="88" height="18" fill="#f2c78f" stroke="#c46a00" stroke-width="1"/>

  <text x="72" y="891" font-size="11" fill="#222222">L(c2→v) = +1.056</text>
  <rect x="300" y="878" width="127" height="18" fill="#f2a65a" stroke="#c46a00" stroke-width="1"/>

  <text x="72" y="927" font-size="11" fill="#222222">L_v = +0.991</text>
  <rect x="300" y="914" width="119" height="18" fill="#a9c9f0" stroke="#3d6fb5" stroke-width="1"/>

  <line x1="180" y1="940" x2="180" y2="946" stroke="#666666" stroke-width="1"/>
  <line x1="300" y1="940" x2="300" y2="946" stroke="#666666" stroke-width="1"/>
  <line x1="420" y1="940" x2="420" y2="946" stroke="#666666" stroke-width="1"/>
  <line x1="540" y1="940" x2="540" y2="946" stroke="#666666" stroke-width="1"/>
  <text x="180" y="960" font-size="11" text-anchor="middle" fill="#333333">−1.0</text>
  <text x="300" y="960" font-size="11" text-anchor="middle" fill="#333333">0</text>
  <text x="420" y="960" font-size="11" text-anchor="middle" fill="#333333">+1.0</text>
  <text x="540" y="960" font-size="11" text-anchor="middle" fill="#333333">+2.0</text>
  <text x="72" y="986" font-size="11" fill="#333333">−0.800 + 0.735 + 1.056 = +0.991；外信息一律排除目标比特自身的输入。</text>

  <!-- 右卡片：后验幅度随迭代增长 -->
  <rect x="632" y="762" width="512" height="250" fill="#fbfbfb" stroke="#cccccc" stroke-width="1"/>
  <text x="656" y="786" font-size="11" font-weight="bold" fill="#222222">后验幅度 |L_v| 随迭代增长（v2）</text>

  <line x1="760" y1="806" x2="760" y2="940" stroke="#666666" stroke-width="1.2"/>

  <text x="656" y="832" font-size="11" fill="#222222">第 0 轮</text>
  <rect x="760" y="818" width="144" height="20" fill="#cfe3ff" stroke="#3d6fb5" stroke-width="1"/>
  <text x="912" y="832" font-size="11" fill="#1d3f6e">0.800</text>

  <text x="656" y="880" font-size="11" fill="#222222">第 1 轮</text>
  <rect x="760" y="866" width="178" height="20" fill="#a9c9f0" stroke="#3d6fb5" stroke-width="1"/>
  <text x="946" y="880" font-size="11" fill="#1d3f6e">0.991</text>

  <text x="656" y="928" font-size="11" fill="#222222">第 2 轮</text>
  <rect x="760" y="914" width="219" height="20" fill="#7fb0e0" stroke="#3d6fb5" stroke-width="1"/>
  <text x="988" y="928" font-size="11" fill="#1d3f6e">1.214</text>

  <text x="656" y="986" font-size="11" fill="#333333">幅度 0.800 → 0.991 → 1.214，随轮次增大并趋于饱和；功耗随轮次上升，需早停折中。</text>
</svg>
