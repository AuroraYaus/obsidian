<?xml version="1.0" encoding="UTF-8"?>
<!--
@file    SCL_Decoding_path_search.svg
@brief   串行抵消判决树的结构，以及列表译码在该树上维护 L 条候选路径、按路径度量剪枝的过程
@note    本图三个面板共用同一组参数：码长 N=4、极化层数 n=2、信息位集合 {u2,u3}、冻结位集合 {u0,u1}、
         列表大小 L=2，以及第 3 位与第 4 位的对数似然比 L2=+0.90、L3=+1.10（正号判 0）。面板 A 画出
         判决树本身：每个结点对应一位判决，冻结位结点只有一条出边，信息位结点分出 0/1 两条出边，
         四条叶边分别对应最终的四条候选路径 P1 至 P4。面板 B 画出列表维护过程：u2 层两条候选恰好
         填满 L=2，u3 层分裂为四条候选后按累计路径度量升序保留前两条，被剪枝的两条以灰色虚线绘制。
         面板 C 画出四条候选的路径度量随判决层的累加轨迹，横轴为判决层，纵轴为累计路径度量，阶梯
         只在该层存在信息位判决时抬升。图中路径度量按工程近似式计算，即候选比特与硬判决一致时
         增量为零、不一致时增量为该位对数似然比的绝对值；精确式给出的数值不同但保留集合相同。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1264" viewBox="0 0 1200 1264" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <rect x="0" y="0" width="1200" height="1264" fill="#ffffff"/>

  <!-- 页级标题（框外文字） -->
  <text class="free" x="600" y="42" font-size="19" font-weight="bold" text-anchor="middle" fill="#222222">串行抵消判决树、列表路径维护与路径度量的逐层累加</text>

  <!-- ================= 面板 A：N=4 串行抵消二叉判决树 ================= -->
  <rect x="24" y="64" width="1152" height="380" fill="#fdfdfd" stroke="#444444" stroke-width="1.5"/>
  <text x="600" y="96" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222">面板 A｜N=4 串行抵消二叉判决树（信息位判决深度 2）</text>
  <text x="600" y="118" font-size="11" text-anchor="middle" fill="#333333">浅蓝框 = 冻结位结点（强制 0、不分裂）；橙色框 = 信息位结点（按 0/1 各分一支）</text>

  <!-- 判决树连线（先画线，后画结点，线端点落在结点边上） -->
  <g stroke="#555555" stroke-width="1.6" fill="none">
    <line x1="600" y1="167" x2="600" y2="193"/>
    <line x1="600" y1="223" x2="600" y2="249"/>
    <line x1="600" y1="279" x2="360" y2="305"/>
    <line x1="600" y1="279" x2="840" y2="305"/>
    <line x1="360" y1="335" x2="220" y2="361"/>
    <line x1="360" y1="335" x2="500" y2="361"/>
    <line x1="840" y1="335" x2="700" y2="361"/>
    <line x1="840" y1="335" x2="980" y2="361"/>
  </g>

  <!-- 每条边的判决标注 -->
  <text x="612" y="185" font-size="11" fill="#333333">0（强制）</text>
  <text x="612" y="241" font-size="11" fill="#333333">0（强制）</text>
  <text x="360" y="297" font-size="11" text-anchor="middle" fill="#333333">0</text>
  <text x="840" y="297" font-size="11" text-anchor="middle" fill="#333333">1</text>
  <text x="220" y="352" font-size="11" text-anchor="middle" fill="#333333">0</text>
  <text x="500" y="352" font-size="11" text-anchor="middle" fill="#333333">1</text>
  <text x="700" y="352" font-size="11" text-anchor="middle" fill="#333333">0</text>
  <text x="980" y="352" font-size="11" text-anchor="middle" fill="#333333">1</text>

  <!-- 左侧层标注：冻结层与两位的 LLR 取值 -->
  <text x="44" y="240" font-size="11" fill="#1f3f6f">冻结层：u0、u1</text>
  <text x="44" y="297" font-size="11" fill="#7a4a10">u2：L2 = +0.90</text>
  <text x="44" y="352" font-size="11" fill="#7a4a10">u3：L3 = +1.10</text>

  <!-- 根结点 -->
  <rect x="540" y="137" width="120" height="30" fill="#eeeeee" stroke="#555555" stroke-width="1.5"/>
  <text x="600" y="156" font-size="11" text-anchor="middle" fill="#222222">起点：无判决</text>

  <!-- 冻结位结点 u0、u1 -->
  <rect x="528" y="193" width="144" height="30" fill="#dce6f2" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="600" y="212" font-size="11" text-anchor="middle" fill="#1f3f6f">u0 冻结位，强制 0</text>
  <rect x="528" y="249" width="144" height="30" fill="#dce6f2" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="600" y="268" font-size="11" text-anchor="middle" fill="#1f3f6f">u1 冻结位，强制 0</text>

  <!-- 信息位结点 u2 -->
  <rect x="285" y="305" width="150" height="30" fill="#ffe6c2" stroke="#b5761f" stroke-width="1.5"/>
  <text x="360" y="324" font-size="11" text-anchor="middle" fill="#7a4a10">u2 = 0</text>
  <rect x="765" y="305" width="150" height="30" fill="#ffe6c2" stroke="#b5761f" stroke-width="1.5"/>
  <text x="840" y="324" font-size="11" text-anchor="middle" fill="#7a4a10">u2 = 1</text>

  <!-- 信息位结点 u3：四条叶边即四条候选路径 -->
  <rect x="160" y="361" width="120" height="30" fill="#ffe6c2" stroke="#b5761f" stroke-width="1.5"/>
  <text x="220" y="380" font-size="11" text-anchor="middle" fill="#7a4a10">P1：u3=0</text>
  <rect x="440" y="361" width="120" height="30" fill="#ffe6c2" stroke="#b5761f" stroke-width="1.5"/>
  <text x="500" y="380" font-size="11" text-anchor="middle" fill="#7a4a10">P2：u3=1</text>
  <rect x="640" y="361" width="120" height="30" fill="#ffe6c2" stroke="#b5761f" stroke-width="1.5"/>
  <text x="700" y="380" font-size="11" text-anchor="middle" fill="#7a4a10">P3：u3=0</text>
  <rect x="920" y="361" width="120" height="30" fill="#ffe6c2" stroke="#b5761f" stroke-width="1.5"/>
  <text x="980" y="380" font-size="11" text-anchor="middle" fill="#7a4a10">P4：u3=1</text>

  <text x="600" y="414" font-size="11" text-anchor="middle" fill="#222222">结点只标该层判决；冻结位强制 0，因此 u0、u1 两层各只有一条出边，树的分叉只发生在 u2、u3 两层。</text>

  <!-- ================= 面板 B：L=2 的候选路径逐层维护 ================= -->
  <rect x="24" y="456" width="1152" height="400" fill="#fdfdfd" stroke="#444444" stroke-width="1.5"/>
  <text x="600" y="486" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222">面板 B｜L = 2 时候选路径的逐层维护、路径度量排序与剪枝</text>
  <text x="600" y="508" font-size="11" text-anchor="middle" fill="#333333">实线框 = 保留路径；灰色虚线框与虚线 = 被剪枝路径；每个方框给出该层的累计路径度量</text>

  <text x="165" y="580" font-size="11" text-anchor="end" fill="#222222">u2 层</text>
  <text x="165" y="732" font-size="11" text-anchor="end" fill="#222222">u3 层</text>

  <!-- u2 层：两条候选恰好填满 L=2，无剪枝 -->
  <rect x="275" y="548" width="280" height="56" fill="#e8f2ea" stroke="#2f6f42" stroke-width="1.8"/>
  <text x="415" y="568" font-size="11" text-anchor="middle" fill="#1f3f2a"><tspan x="415" y="568">候选 1：u2 = 0</tspan><tspan x="415" y="590">增量 0.00 → 累计 PM 0.00（保留）</tspan></text>
  <rect x="775" y="548" width="280" height="56" fill="#e8f2ea" stroke="#2f6f42" stroke-width="1.8"/>
  <text x="915" y="568" font-size="11" text-anchor="middle" fill="#1f3f2a"><tspan x="915" y="568">候选 2：u2 = 1</tspan><tspan x="915" y="590">增量 0.90 → 累计 PM 0.90（保留）</tspan></text>

  <!-- 父路径到子候选的连线：保留为实线，剪枝为灰色虚线 -->
  <g fill="none">
    <line x1="415" y1="604" x2="290" y2="700" stroke="#2f6f42" stroke-width="2.2"/>
    <line x1="415" y1="604" x2="540" y2="700" stroke="#9a9a9a" stroke-width="1.6" stroke-dasharray="6 5"/>
    <line x1="915" y1="604" x2="790" y2="700" stroke="#2f6f42" stroke-width="2.2"/>
    <line x1="915" y1="604" x2="1040" y2="700" stroke="#9a9a9a" stroke-width="1.6" stroke-dasharray="6 5"/>
  </g>

  <text x="665" y="676" font-size="11" text-anchor="middle" fill="#222222">4 条候选 → 按 PM 升序保留 2 条</text>

  <!-- u3 层：四条候选，按 PM 升序保留前两条 -->
  <rect x="175" y="700" width="230" height="56" fill="#e8f2ea" stroke="#2f6f42" stroke-width="1.8"/>
  <text x="290" y="714" font-size="11" text-anchor="middle" fill="#1f3f2a"><tspan x="290" y="714">P1：u2=0, u3=0</tspan><tspan x="290" y="730">PM 0.00 + 0.00 = 0.00</tspan><tspan x="290" y="746">保留（排序第 1）</tspan></text>

  <rect x="425" y="700" width="230" height="56" fill="#f4f4f4" stroke="#9a9a9a" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="540" y="714" font-size="11" text-anchor="middle" fill="#6b6b6b"><tspan x="540" y="714">P2：u2=0, u3=1</tspan><tspan x="540" y="730">PM 0.00 + 1.10 = 1.10</tspan><tspan x="540" y="746">剪枝（排序第 3）</tspan></text>

  <rect x="675" y="700" width="230" height="56" fill="#e8f2ea" stroke="#2f6f42" stroke-width="1.8"/>
  <text x="790" y="714" font-size="11" text-anchor="middle" fill="#1f3f2a"><tspan x="790" y="714">P3：u2=1, u3=0</tspan><tspan x="790" y="730">PM 0.90 + 0.00 = 0.90</tspan><tspan x="790" y="746">保留（排序第 2）</tspan></text>

  <rect x="925" y="700" width="230" height="56" fill="#f4f4f4" stroke="#9a9a9a" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="1040" y="714" font-size="11" text-anchor="middle" fill="#6b6b6b"><tspan x="1040" y="714">P4：u2=1, u3=1</tspan><tspan x="1040" y="730">PM 0.90 + 1.10 = 2.00</tspan><tspan x="1040" y="746">剪枝（排序第 4）</tspan></text>

  <text x="600" y="790" font-size="11" text-anchor="middle" fill="#222222">PM 升序：P1 0.00 ＜ P3 0.90 ＜ P2 1.10 ＜ P4 2.00，取前两条保留</text>
  <text x="600" y="816" font-size="11" text-anchor="middle" fill="#222222">交给 CRC 辅助选择的两条路径：u2u3 = 00（PM 0.00）与 u2u3 = 10（PM 0.90）</text>

  <!-- ================= 面板 C：路径度量随层数的累加 ================= -->
  <rect x="24" y="868" width="1152" height="380" fill="#fdfdfd" stroke="#444444" stroke-width="1.5"/>
  <text x="600" y="898" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222">面板 C｜路径度量随判决层的累加轨迹与剪枝发生的层</text>
  <text x="600" y="920" font-size="11" text-anchor="middle" fill="#333333">纵轴为累计路径度量（越小越好），横轴为判决层；阶梯只在该层存在信息位判决时抬升</text>

  <text x="150" y="950" font-size="11" text-anchor="middle" fill="#333333">PM（越小越好）</text>

  <!-- 坐标轴与刻度 -->
  <g stroke="#555555" stroke-width="1.4" fill="none">
    <line x1="150" y1="966" x2="150" y2="1156"/>
    <line x1="150" y1="1156" x2="1080" y2="1156"/>
    <line x1="150" y1="1136" x2="157" y2="1136"/>
    <line x1="150" y1="1097" x2="157" y2="1097"/>
    <line x1="150" y1="1059" x2="157" y2="1059"/>
    <line x1="150" y1="1020" x2="157" y2="1020"/>
    <line x1="150" y1="982" x2="157" y2="982"/>
  </g>
  <g font-size="11" text-anchor="end" fill="#333333">
    <text x="143" y="1140" font-size="11">0</text>
    <text x="143" y="1101" font-size="11">0.5</text>
    <text x="143" y="1063" font-size="11">1.0</text>
    <text x="143" y="1024" font-size="11">1.5</text>
    <text x="143" y="986" font-size="11">2.0</text>
  </g>
  <g font-size="11" text-anchor="middle" fill="#333333">
    <text x="220" y="1176" font-size="11">起点（u0、u1 强制 0）</text>
    <text x="620" y="1176" font-size="11">u2 层</text>
    <text x="1020" y="1176" font-size="11">u3 层（剪枝发生）</text>
  </g>

  <!-- 轨迹：先画被剪枝的灰色虚线，再把保留路径的绿色实线压在上层 -->
  <line x1="620" y1="1136" x2="1020" y2="1051" stroke="#9a9a9a" stroke-width="1.8" stroke-dasharray="7 5"/>
  <line x1="620" y1="1066" x2="1020" y2="982" stroke="#9a9a9a" stroke-width="1.8" stroke-dasharray="7 5"/>
  <line x1="220" y1="1136" x2="1020" y2="1136" stroke="#1f6f3f" stroke-width="2.5"/>
  <line x1="220" y1="1136" x2="620" y2="1066" stroke="#1f6f3f" stroke-width="2.5"/>
  <line x1="620" y1="1066" x2="1020" y2="1066" stroke="#1f6f3f" stroke-width="2.5"/>

  <g fill="#1f6f3f">
    <circle cx="220" cy="1136" r="4"/>
    <circle cx="620" cy="1136" r="4"/>
    <circle cx="620" cy="1066" r="4"/>
    <circle cx="1020" cy="1136" r="4"/>
    <circle cx="1020" cy="1066" r="4"/>
  </g>
  <g fill="#9a9a9a">
    <circle cx="1020" cy="1051" r="3.5"/>
    <circle cx="1020" cy="982" r="3.5"/>
  </g>

  <!-- 端点标注 -->
  <text x="1036" y="1144" font-size="11" fill="#1f3f2a">P1 保留：PM 0.00</text>
  <text x="1036" y="1078" font-size="11" fill="#1f3f2a">P3 保留：PM 0.90</text>
  <text x="1036" y="1044" font-size="11" fill="#6b6b6b">P2 剪枝：PM 1.10</text>
  <text x="1036" y="974" font-size="11" fill="#6b6b6b">P4 剪枝：PM 2.00</text>

  <!-- 图例 -->
  <line x1="180" y1="1000" x2="216" y2="1000" stroke="#1f6f3f" stroke-width="2.5"/>
  <text x="224" y="1004" font-size="11" fill="#222222">保留路径（绿实线）</text>
  <line x1="180" y1="1026" x2="216" y2="1026" stroke="#9a9a9a" stroke-width="1.8" stroke-dasharray="7 5"/>
  <text x="224" y="1030" font-size="11" fill="#222222">剪枝路径（灰虚线）</text>

  <text x="44" y="1206" font-size="11" fill="#222222">阶梯只在信息位判决处抬升：冻结位强制 0、路径度量不变；u2 层两条候选分别累加 0.00 与 0.90。</text>
  <text x="44" y="1228" font-size="11" fill="#222222">P2 与 P1 共用 u2 层前缀、P4 与 P3 共用前缀，图中只画分叉段；u3 层剪枝后只剩 P1 与 P3。</text>
</svg>
