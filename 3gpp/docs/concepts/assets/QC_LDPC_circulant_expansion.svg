<?xml version="1.0" encoding="UTF-8"?>
<!--
@file    QC_LDPC_circulant_expansion.svg
@brief   准循环 LDPC 的提升结构：基图元素到循环置换矩阵的映射、4×6 基图展开后的块矩阵、提升因子与码长的数值关系
@note    本图以三个面板展示同一件事的三个层次。面板 A 取 Zc = 4、基图元素 p(i,j) = 1，
         给出一个基图元素替换为 4×4 循环置换矩阵的过程，并逐行标出 1 所在列与位移量；
         面板 B 取 4×6 基图示意，给出展开后的块矩阵：色块表示非零元素块、色相表示位移量、
         空白块表示基图中的 -1（替换为全零矩阵），并标出块行数、块列数与总维数；
         面板 C 给出 Zc = 384 时 BG1/BG2 的母码长度 N、信息位长度 K 与码率上界，
         并给出一个块的移位量按 p = V mod Zc 的计算。面板 A、B 采用同一 Zc = 4，
         保证两图的块维数口径一致。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <rect x="0" y="0" width="1200" height="1000" fill="#ffffff"/>

  <!-- 页级标题（框外文字） -->
  <text class="free" x="600" y="42" font-size="19" font-weight="bold" text-anchor="middle" fill="#222222">QC-LDPC 的循环置换展开与提升因子</text>

  <!-- ================= 面板 A：基图元素到循环置换矩阵 ================= -->
  <rect x="30" y="70" width="560" height="510" fill="#fdfdfd" stroke="#444444" stroke-width="1.5"/>
  <text x="310" y="102" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222">面板 A｜基图元素到 4×4 循环置换矩阵</text>
  <text x="310" y="126" font-size="11" text-anchor="middle" fill="#333333">Zc = 4，基图元素 p(i, j) = 1 替换为单位阵并右移 1 位</text>

  <!-- 基图元素 -->
  <rect x="60" y="150" width="130" height="56" fill="#ffe9c8" stroke="#d08000" stroke-width="1.5"/>
  <text x="125" y="172" font-size="11" text-anchor="middle" fill="#333333">基图元素 (i, j)</text>
  <text x="125" y="194" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222">p(i, j) = 1</text>

  <!-- 提升说明与向右箭头 -->
  <line x1="190" y1="178" x2="236" y2="178" stroke="#444444" stroke-width="1.5"/>
  <line x1="228" y1="173" x2="236" y2="178" stroke="#444444" stroke-width="1.5"/>
  <line x1="228" y1="183" x2="236" y2="178" stroke="#444444" stroke-width="1.5"/>
  <text x="246" y="170" font-size="11" fill="#222222">提升：一个元素替换为一个块</text>
  <text x="246" y="192" font-size="11" fill="#222222">块维数 = Zc × Zc = 4 × 4</text>

  <!-- 自基图元素向下指向矩阵 -->
  <line x1="100" y1="206" x2="100" y2="250" stroke="#444444" stroke-width="1.5"/>
  <line x1="95" y1="242" x2="100" y2="250" stroke="#444444" stroke-width="1.5"/>
  <line x1="105" y1="242" x2="100" y2="250" stroke="#444444" stroke-width="1.5"/>

  <!-- 矩阵列标签 -->
  <text x="83" y="242" font-size="11" text-anchor="middle" fill="#333333">C0</text>
  <text x="129" y="242" font-size="11" text-anchor="middle" fill="#333333">C1</text>
  <text x="175" y="242" font-size="11" text-anchor="middle" fill="#333333">C2</text>
  <text x="221" y="242" font-size="11" text-anchor="middle" fill="#333333">C3</text>

  <!-- 4×4 矩阵网格（Zc = 4） -->
  <g stroke="#9a9a9a" stroke-width="1" fill="#ffffff">
    <rect x="60" y="250" width="46" height="46"/><rect x="106" y="250" width="46" height="46"/><rect x="152" y="250" width="46" height="46"/><rect x="198" y="250" width="46" height="46"/>
    <rect x="60" y="296" width="46" height="46"/><rect x="106" y="296" width="46" height="46"/><rect x="152" y="296" width="46" height="46"/><rect x="198" y="296" width="46" height="46"/>
    <rect x="60" y="342" width="46" height="46"/><rect x="106" y="342" width="46" height="46"/><rect x="152" y="342" width="46" height="46"/><rect x="198" y="342" width="46" height="46"/>
    <rect x="60" y="388" width="46" height="46"/><rect x="106" y="388" width="46" height="46"/><rect x="152" y="388" width="46" height="46"/><rect x="198" y="388" width="46" height="46"/>
  </g>

  <!-- 四条对角线上的 1 -->
  <g fill="#ffd9a0" stroke="#d08000" stroke-width="1.5">
    <rect x="106" y="250" width="46" height="46"/>
    <rect x="152" y="296" width="46" height="46"/>
    <rect x="198" y="342" width="46" height="46"/>
    <rect x="60" y="388" width="46" height="46"/>
  </g>
  <g font-size="15" font-weight="bold" text-anchor="middle" fill="#222222">
    <text x="129" y="280">1</text>
    <text x="175" y="326">1</text>
    <text x="221" y="372">1</text>
    <text x="83" y="418">1</text>
  </g>

  <!-- 行标签 -->
  <g font-size="11" text-anchor="end" fill="#333333">
    <text x="52" y="278">R0</text>
    <text x="52" y="324">R1</text>
    <text x="52" y="370">R2</text>
    <text x="52" y="416">R3</text>
  </g>

  <!-- 逐行位移量 -->
  <text x="270" y="278" font-size="11" fill="#222222">第 0 行：1 在第 1 列，右移 1 位</text>
  <text x="270" y="324" font-size="11" fill="#222222">第 1 行：1 在第 2 列，右移 1 位</text>
  <text x="270" y="370" font-size="11" fill="#222222">第 2 行：1 在第 3 列，右移 1 位</text>
  <text x="270" y="416" font-size="11" fill="#222222">第 3 行：1 在第 0 列，右移 1 位</text>

  <!-- 面板 A 说明 -->
  <text x="60" y="462" font-size="11" fill="#333333">第 3 行的 1 由第 3 列回绕到第 0 列，</text>
  <text x="60" y="482" font-size="11" fill="#333333">四个 1 位于同一条循环对角线上，位移量均为 1。</text>
  <text x="60" y="510" font-size="11" fill="#333333">移位量 p 只决定 1 所在的对角线；</text>
  <text x="60" y="530" font-size="11" fill="#333333">每行、每列仍恰有 1 个 1。</text>
  <text x="60" y="558" font-size="11" fill="#333333">p = 0 时退化为单位阵（1 在主对角线）。</text>

  <!-- ================= 面板 B：4×6 基图展开后的块矩阵 ================= -->
  <rect x="610" y="70" width="560" height="510" fill="#fdfdfd" stroke="#444444" stroke-width="1.5"/>
  <text x="890" y="102" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222">面板 B｜4×6 基图展开后的块矩阵</text>
  <text x="890" y="126" font-size="11" text-anchor="middle" fill="#333333">每个色块为一个 4×4 循环置换矩阵，块内数字为移位量 p</text>

  <!-- 块列标签 -->
  <g font-size="11" text-anchor="middle" fill="#333333">
    <text x="728" y="172">块列 0</text>
    <text x="784" y="172">块列 1</text>
    <text x="840" y="172">块列 2</text>
    <text x="896" y="172">块列 3</text>
    <text x="952" y="172">块列 4</text>
    <text x="1008" y="172">块列 5</text>
  </g>

  <!-- 块行标签 -->
  <g font-size="11" text-anchor="end" fill="#333333">
    <text x="692" y="207">块行 0</text>
    <text x="692" y="247">块行 1</text>
    <text x="692" y="287">块行 2</text>
    <text x="692" y="327">块行 3</text>
  </g>

  <!-- 块矩阵网格：4 行 × 6 列，每块 56×40，空白块 = -1 -->
  <g stroke="#b0b0b0" stroke-width="1" stroke-dasharray="4 3" fill="#ffffff">
    <rect x="812" y="184" width="56" height="40"/><rect x="924" y="184" width="56" height="40"/>
    <rect x="756" y="224" width="56" height="40"/><rect x="868" y="224" width="56" height="40"/>
    <rect x="700" y="264" width="56" height="40"/><rect x="924" y="264" width="56" height="40"/>
    <rect x="756" y="304" width="56" height="40"/><rect x="812" y="304" width="56" height="40"/>
  </g>

  <!-- 非零块：按移位量着色 -->
  <g stroke="#3d6fb5" stroke-width="1.5" fill="#cfe3ff">
    <rect x="700" y="184" width="56" height="40"/>
    <rect x="868" y="224" width="56" height="40"/>
    <rect x="756" y="264" width="56" height="40"/>
    <rect x="980" y="304" width="56" height="40"/>
  </g>
  <g stroke="#d08000" stroke-width="1.5" fill="#ffd9a0">
    <rect x="756" y="184" width="56" height="40"/>
    <rect x="700" y="224" width="56" height="40"/>
    <rect x="924" y="224" width="56" height="40"/>
    <rect x="868" y="264" width="56" height="40"/>
    <rect x="756" y="304" width="56" height="40"/>
  </g>
  <g stroke="#3f7f3f" stroke-width="1.5" fill="#d8ecd8">
    <rect x="868" y="184" width="56" height="40"/>
    <rect x="812" y="224" width="56" height="40"/>
    <rect x="924" y="304" width="56" height="40"/>
    <rect x="700" y="304" width="56" height="40"/>
  </g>
  <g stroke="#6b4f9e" stroke-width="1.5" fill="#e2d4f0">
    <rect x="980" y="184" width="56" height="40"/>
    <rect x="812" y="264" width="56" height="40"/>
    <rect x="868" y="304" width="56" height="40"/>
    <rect x="980" y="264" width="56" height="40"/>
  </g>

  <!-- 块内移位量数字 -->
  <g font-size="11" text-anchor="middle" fill="#222222">
    <text x="728" y="209">p=0</text><text x="784" y="209">p=1</text><text x="896" y="209">p=2</text><text x="1008" y="209">p=3</text>
    <text x="728" y="249">p=1</text><text x="840" y="249">p=2</text><text x="896" y="249">p=0</text><text x="952" y="249">p=1</text>
    <text x="784" y="289">p=0</text><text x="840" y="289">p=3</text><text x="896" y="289">p=1</text><text x="1008" y="289">p=2</text>
    <text x="728" y="329">p=2</text><text x="896" y="329">p=3</text><text x="952" y="329">p=1</text><text x="1008" y="329">p=0</text>
  </g>

  <!-- 总维数与块行列 -->
  <text x="700" y="376" font-size="11" fill="#222222">总维数：H = (4Zc) × (6Zc) = 16 × 24（Zc = 4）</text>
  <text x="700" y="398" font-size="11" fill="#222222">块行数 m_b = 4；块列数 n_b = 6；每块 4 × 4</text>
  <text x="700" y="420" font-size="11" fill="#222222">每个色块每行、每列恰有 1 个 1</text>
  <text x="700" y="442" font-size="11" fill="#222222">空白块 = 基图 -1，替换为 4 × 4 全零矩阵</text>

  <!-- 图例 -->
  <text x="700" y="472" font-size="15" font-weight="bold" fill="#222222">色块与移位量对照</text>
  <rect x="700" y="480" width="18" height="18" fill="#cfe3ff" stroke="#3d6fb5" stroke-width="1.5"/>
  <text x="728" y="494" font-size="11" fill="#222222">p = 0：单位阵（主对角线）</text>
  <rect x="700" y="506" width="18" height="18" fill="#ffd9a0" stroke="#d08000" stroke-width="1.5"/>
  <text x="728" y="520" font-size="11" fill="#222222">p = 1：右移 1 位</text>
  <rect x="700" y="532" width="18" height="18" fill="#d8ecd8" stroke="#3f7f3f" stroke-width="1.5"/>
  <text x="728" y="546" font-size="11" fill="#222222">p = 2：右移 2 位</text>
  <rect x="930" y="480" width="18" height="18" fill="#e2d4f0" stroke="#6b4f9e" stroke-width="1.5"/>
  <text x="958" y="494" font-size="11" fill="#222222">p = 3：右移 3 位</text>
  <rect x="930" y="506" width="18" height="18" fill="#ffffff" stroke="#b0b0b0" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="958" y="520" font-size="11" fill="#222222">空白：-1，全零矩阵</text>
  <text x="958" y="546" font-size="11" fill="#222222">数字即移位量 p</text>

  <!-- ================= 面板 C：Zc 与 N、K 的数值关系 ================= -->
  <rect x="30" y="600" width="1140" height="370" fill="#fdfdfd" stroke="#444444" stroke-width="1.5"/>
  <text x="600" y="632" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222">面板 C｜Zc = 384 时的母码长度、信息位长度与码率上界</text>
  <text x="600" y="656" font-size="11" text-anchor="middle" fill="#333333">N = 66Zc（BG1）或 50Zc（BG2）；K = Kb × Zc；码率上界 R = K / N</text>

  <!-- 数值表：3 行 × 4 列 -->
  <g stroke="#b8b8b8" stroke-width="1" fill="#ffffff">
    <rect x="60" y="690" width="210" height="44"/><rect x="270" y="690" width="280" height="44"/><rect x="550" y="690" width="280" height="44"/><rect x="830" y="690" width="300" height="44"/>
    <rect x="60" y="734" width="210" height="44"/><rect x="270" y="734" width="280" height="44"/><rect x="550" y="734" width="280" height="44"/><rect x="830" y="734" width="300" height="44"/>
    <rect x="60" y="778" width="210" height="44"/><rect x="270" y="778" width="280" height="44"/><rect x="550" y="778" width="280" height="44"/><rect x="830" y="778" width="300" height="44"/>
  </g>
  <g font-size="11" font-weight="bold" text-anchor="middle" fill="#222222">
    <text x="165" y="718">基图</text>
    <text x="410" y="718">母码长度 N</text>
    <text x="690" y="718">信息位长度 K</text>
    <text x="980" y="718">码率上界 R = K / N</text>
  </g>
  <g font-size="15" font-weight="bold" text-anchor="middle" fill="#222222">
    <text x="165" y="762">BG1</text>
    <text x="165" y="806">BG2</text>
  </g>
  <g font-size="15" text-anchor="middle" fill="#222222">
    <text x="410" y="762">66 × 384 = 25344</text>
    <text x="690" y="762">22 × 384 = 8448</text>
    <text x="980" y="762">8448 / 25344 = 1/3</text>
    <text x="410" y="806">50 × 384 = 19200</text>
    <text x="690" y="806">10 × 384 = 3840</text>
    <text x="980" y="806">3840 / 19200 = 0.20</text>
  </g>

  <!-- 移位量算例 -->
  <text x="60" y="856" font-size="15" font-weight="bold" fill="#222222">一个块的位移量：p(i, j) = V(i, j) mod Zc</text>
  <text x="60" y="884" font-size="11" fill="#222222">BG1 第 0 行第 0 列、集合索引 1：V = 307</text>
  <text x="60" y="910" font-size="11" fill="#222222">Zc = 384：p = 307 mod 384 = 307（块内右移 307 位）</text>
  <text x="60" y="936" font-size="11" fill="#222222">Zc = 48：p = 307 mod 48 = 19（307 − 6 × 48）</text>

  <!-- 补充说明 -->
  <text x="700" y="884" font-size="11" fill="#333333">码率上界 = K / N；实际码率还受速率匹配输出长度影响</text>
  <text x="700" y="910" font-size="11" fill="#333333">N = 66Zc 已扣除前 2Zc 个系统位：2 × 384 = 768</text>
  <text x="700" y="936" font-size="11" fill="#333333">68 × 384 − 768 = 25344；Zc 只改尺寸，不改块连接结构</text>
</svg>
