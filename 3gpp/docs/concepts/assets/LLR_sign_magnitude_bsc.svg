<?xml version="1.0" encoding="UTF-8"?>
<!--
@file    LLR_sign_magnitude_bsc.svg
@brief   LLR 的符号与幅度语义，以及 BPSK 下观测到 LLR 的线性映射与软合并的加法结构
@note    本图以三个面板并列展示三件事：面板 A 在 LLR 数轴 [-8, +8] 上标出判决门限 0、
         正负两侧对应的判决结果，以及按绝对值划分的可靠度分级（示意阈值 ±2、±4）；
         面板 B 以等概先验、方差 σ²=0.5 的 BPSK 为例，画出接收观测 y 到 LLR 的直线
         LLR=2y/σ²，并在观测轴 ±1 处标出两个星座点；面板 C 以两个独立观测的 LLR
         数值相加展示软合并——对数域相加等价于似然相乘，合并后绝对值大于任一单项。
         图中数值与笔记正文的手算例共用同一公式与同一噪声方差，仅观测取值不同。
         本图遵守 R1-R11：全部文字均落在某个面板 rect 内，页级标题用 class="free"；
         轴线与刻度用 line 绘制，不使用旋转文字与箭头三角。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="760" viewBox="0 0 1160 760" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <rect x="0" y="0" width="1160" height="760" fill="#ffffff"/>

  <!-- 页级标题（框外文字） -->
  <text class="free" x="580" y="44" font-size="19" font-weight="bold" text-anchor="middle" fill="#222222">LLR 的符号与幅度语义，以及观测到 LLR 的线性映射</text>

  <!-- ================= 面板 A：LLR 数轴 ================= -->
  <rect x="30" y="72" width="530" height="330" fill="#fdfdfd" stroke="#444444" stroke-width="1.5"/>
  <text x="295" y="106" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222">面板 A｜LLR 数轴：符号定判决方向，幅度定可靠度</text>
  <text x="295" y="130" font-size="11" text-anchor="middle" fill="#333333">正 LLR 判 0，负 LLR 判 1；绝对值越大越可靠</text>

  <!-- 两侧区域语义 -->
  <text x="195" y="190" font-size="11" text-anchor="middle" fill="#b5483d">负区：判 1</text>
  <text x="295" y="190" font-size="11" text-anchor="middle" fill="#222222">判决门限：LLR = 0</text>
  <text x="395" y="190" font-size="11" text-anchor="middle" fill="#3d6fb5">正区：判 0</text>

  <!-- 可靠度分级标注（示意阈值 ±2、±4） -->
  <text x="195" y="216" font-size="11" text-anchor="middle" fill="#333333">可靠度高</text>
  <text x="245" y="238" font-size="11" text-anchor="middle" fill="#333333">可靠度低</text>
  <text x="345" y="238" font-size="11" text-anchor="middle" fill="#333333">可靠度低</text>
  <text x="395" y="216" font-size="11" text-anchor="middle" fill="#333333">可靠度高</text>

  <!-- 数轴：−8 到 0 为判 1 侧，0 到 +8 为判 0 侧 -->
  <line x1="95" y1="250" x2="295" y2="250" stroke="#b5483d" stroke-width="2.5"/>
  <line x1="295" y1="250" x2="495" y2="250" stroke="#3d6fb5" stroke-width="2.5"/>
  <line x1="295" y1="228" x2="295" y2="302" stroke="#666666" stroke-width="1.2" stroke-dasharray="5,4"/>
  <g stroke="#333333" stroke-width="1.5">
    <line x1="95" y1="250" x2="95" y2="256"/>
    <line x1="145" y1="250" x2="145" y2="256"/>
    <line x1="195" y1="250" x2="195" y2="256"/>
    <line x1="245" y1="250" x2="245" y2="256"/>
    <line x1="345" y1="250" x2="345" y2="256"/>
    <line x1="395" y1="250" x2="395" y2="256"/>
    <line x1="445" y1="250" x2="445" y2="256"/>
    <line x1="495" y1="250" x2="495" y2="256"/>
  </g>
  <g font-size="11" text-anchor="middle" fill="#333333">
    <text x="95" y="283">−8</text>
    <text x="145" y="283">−6</text>
    <text x="195" y="283">−4</text>
    <text x="245" y="283">−2</text>
    <text x="345" y="283">+2</text>
    <text x="395" y="283">+4</text>
    <text x="445" y="283">+6</text>
    <text x="495" y="283">+8</text>
  </g>

  <!-- 面板 A 说明 -->
  <text x="52" y="330" font-size="11" fill="#222222">判决方向由符号给出：LLR &gt; 0 判 0，LLR &lt; 0 判 1，LLR = 0 无判决倾向。</text>
  <text x="52" y="354" font-size="11" fill="#222222">可靠度由绝对值给出：|LLR| ≤ 2 记低，2 &lt; |LLR| &lt; 4 记过渡，|LLR| ≥ 4 记高。</text>
  <text x="52" y="378" font-size="11" fill="#222222">图中 ±2、±4 为示意分级阈值；实际量化门限由量化位宽与定标方式决定。</text>

  <!-- ================= 面板 B：BPSK 观测到 LLR 的线性映射 ================= -->
  <rect x="580" y="72" width="550" height="330" fill="#fdfdfd" stroke="#444444" stroke-width="1.5"/>
  <text x="905" y="106" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222">面板 B｜BPSK 观测 y 到 LLR 的线性映射</text>
  <text x="905" y="130" font-size="11" text-anchor="middle" fill="#333333">LLR = 2y/σ²；σ² = 0.5 时斜率为 4，直线过原点</text>

  <!-- 坐标轴 -->
  <line x1="725" y1="180" x2="725" y2="340" stroke="#333333" stroke-width="1.5"/>
  <line x1="725" y1="340" x2="1085" y2="340" stroke="#333333" stroke-width="1.5"/>
  <text x="725" y="166" font-size="11" text-anchor="middle" fill="#333333">LLR（对数似然比）</text>

  <!-- LLR 纵轴刻度与标注 -->
  <g stroke="#333333" stroke-width="1">
    <line x1="725" y1="180" x2="720" y2="180"/>
    <line x1="725" y1="220" x2="720" y2="220"/>
    <line x1="725" y1="260" x2="720" y2="260"/>
    <line x1="725" y1="300" x2="720" y2="300"/>
    <line x1="725" y1="340" x2="720" y2="340"/>
  </g>
  <g font-size="11" text-anchor="end" fill="#333333">
    <text x="709" y="184">+8</text>
    <text x="709" y="224">+4</text>
    <text x="709" y="264">0</text>
    <text x="709" y="304">−4</text>
    <text x="709" y="344">−8</text>
  </g>

  <!-- 观测轴刻度与星座点 -->
  <g stroke="#333333" stroke-width="1">
    <line x1="725" y1="340" x2="725" y2="346"/>
    <line x1="815" y1="340" x2="815" y2="346"/>
    <line x1="995" y1="340" x2="995" y2="346"/>
    <line x1="1085" y1="340" x2="1085" y2="346"/>
  </g>
  <g font-size="11" text-anchor="middle" fill="#333333">
    <text x="725" y="364">−2</text>
    <text x="815" y="364">s = −1</text>
    <text x="995" y="364">s = +1</text>
    <text x="1085" y="364">+2</text>
  </g>
  <circle cx="815" cy="340" r="5" fill="#222222"/>
  <circle cx="995" cy="340" r="5" fill="#222222"/>

  <!-- LLR = 2y/σ² 的直线：y=+2 处 LLR=+8，y=−2 处 LLR=−8 -->
  <line x1="725" y1="340" x2="1085" y2="180" stroke="#b5483d" stroke-width="2.5"/>

  <!-- 面板 B 说明 -->
  <text x="750" y="204" font-size="11" font-weight="bold" fill="#222222">LLR = 2y / σ²</text>
  <text x="750" y="228" font-size="11" fill="#222222">σ² = 0.5 时 LLR = 4y</text>
  <text x="750" y="252" font-size="11" fill="#222222">直线过原点，斜率 2/σ²</text>
  <text x="925" y="296" font-size="11" fill="#222222">圆点 = 星座点 s = ±1</text>
  <text x="1085" y="328" font-size="11" text-anchor="end" fill="#333333">观测 y</text>
  <text x="750" y="390" font-size="11" fill="#222222">y &gt; 0 时 LLR &gt; 0 判 0；y &lt; 0 时 LLR &lt; 0 判 1</text>

  <!-- ================= 面板 C：LLR 相加即软合并 ================= -->
  <rect x="30" y="430" width="1100" height="300" fill="#fdfdfd" stroke="#444444" stroke-width="1.5"/>
  <text x="580" y="464" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222">面板 C｜软合并：两独立观测的 LLR 相加</text>
  <text x="580" y="488" font-size="11" text-anchor="middle" fill="#333333">σ² = 0.5 时 L₁ = 4y₁ = 2.4、L₂ = 4y₂ = 3.6，相加得 6.0</text>
  <text x="580" y="512" font-size="11" text-anchor="middle" fill="#333333">前提：两观测独立、噪声方差相同、先验等概</text>

  <!-- 零基线（LLR = 0）与刻度 -->
  <line x1="300" y1="530" x2="300" y2="696" stroke="#999999" stroke-width="1.2" stroke-dasharray="5,4"/>
  <g stroke="#333333" stroke-width="1.5">
    <line x1="300" y1="690" x2="300" y2="696"/>
    <line x1="550" y1="690" x2="550" y2="696"/>
    <line x1="800" y1="690" x2="800" y2="696"/>
    <line x1="1050" y1="690" x2="1050" y2="696"/>
  </g>
  <g font-size="11" text-anchor="middle" fill="#333333">
    <text x="300" y="714">0</text>
    <text x="550" y="714">+2</text>
    <text x="800" y="714">+4</text>
    <text x="1050" y="714">+6</text>
  </g>

  <!-- 三个 LLR 值的条形：2.4、3.6、6.0，比例尺 125px/单位 -->
  <rect x="300" y="545" width="300" height="22" fill="#dbe8fa" stroke="#3d6fb5" stroke-width="1.2"/>
  <rect x="300" y="595" width="450" height="22" fill="#b7cfee" stroke="#3d6fb5" stroke-width="1.2"/>
  <rect x="300" y="655" width="750" height="22" fill="#ffd9a0" stroke="#d08000" stroke-width="1.5"/>

  <!-- 行标签（右对齐到零基线）与条端数值 -->
  <text x="280" y="560" font-size="11" text-anchor="end" fill="#222222">观测 1：y₁ = +0.6</text>
  <text x="280" y="610" font-size="11" text-anchor="end" fill="#222222">观测 2：y₂ = +0.9</text>
  <text x="280" y="670" font-size="11" text-anchor="end" fill="#222222">软合并 LLR</text>
  <text x="610" y="560" font-size="11" fill="#222222">L₁ = +2.4</text>
  <text x="760" y="610" font-size="11" fill="#222222">L₂ = +3.6</text>
  <text x="1060" y="670" font-size="11" fill="#222222">L = +6.0</text>

  <!-- 面板 C 说明 -->
  <text x="320" y="640" font-size="11" fill="#222222">对数域相加：L = L₁ + L₂，|L| = 6.0 大于任一单项</text>
</svg>
