<?xml version="1.0" encoding="UTF-8"?>
<!--
@file    Modulation_Constellations_constellation_map.svg
@brief   调制星座的三个定量视图：QPSK 与 16QAM 的星座点及 Gray 比特标签、16QAM 在 AWGN 下的判决域与噪声圆、QPSK/16QAM/64QAM 的归一化因子与平均符号能量对照
@note    本图以三个面板说明同一组概念。面板 A 在归一化复平面 (a_I, a_Q) 上给出 QPSK 与 16QAM 的星座点，
         点旁比特串按 TS 38.211 §5.1.3 与 §5.1.4 的 b0 b1 ... 顺序排列（Gray 映射）；QPSK 四点位于单位圆上，
         16QAM 每维幅度为 {±1,±3}/√10。面板 B 以 16QAM 为例画出相邻理想点的垂直平分线（Voronoi 判决边界），
         并以 s 为圆心、σ 为半径画出噪声圆，说明观测 y 越过边界即被判为相邻点、格雷标签只差一位。
         面板 C 以同一比例画出三个归一化因子：QPSK 的映射式已把点放在单位圆上，因子记为 1；
         16QAM 与 64QAM 的整数坐标分别需乘 1/√10 与 1/√42，使平均符号能量归一到 1。
         图中数值均为归一化后的无量纲值，精确取值与推导见配套笔记的符号表与手算例。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="820" viewBox="0 0 1340 820" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif">
  <rect x="0" y="0" width="1340" height="820" fill="#ffffff"/>

  <!-- 页级标题（框外文字） -->
  <text class="free" x="670" y="42" font-size="19" font-weight="bold" text-anchor="middle" fill="#222222">调制星座：QPSK/16QAM 星座点、AWGN 判决域与归一化因子</text>

  <!-- ================= 面板 A：QPSK 与 16QAM 星座点 ================= -->
  <rect x="30" y="70" width="720" height="470" fill="#fdfdfd" stroke="#444444" stroke-width="1.5"/>
  <text x="390" y="104" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222">面板 A｜QPSK 与 16QAM 星座点及 Gray 比特标签</text>
  <text x="390" y="128" font-size="11" text-anchor="middle" fill="#333333">复平面 I-Q 坐标；点旁比特串为 Gray 标签，a_I 为同相坐标、a_Q 为正交坐标</text>

  <!-- A1：QPSK -->
  <text x="215" y="152" font-size="15" text-anchor="middle" fill="#222222">A1｜QPSK：4 点，每点 2 bit</text>
  <rect x="70" y="170" width="290" height="290" fill="#ffffff" stroke="#666666" stroke-width="1"/>
  <ellipse cx="215" cy="315" rx="85" ry="85" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="5 5"/>
  <line x1="78" y1="315" x2="352" y2="315" stroke="#555555" stroke-width="1.2"/>
  <line x1="215" y1="178" x2="215" y2="452" stroke="#555555" stroke-width="1.2"/>
  <text x="352" y="303" font-size="11" text-anchor="end" fill="#333333">I（a_I）</text>
  <text x="225" y="194" font-size="11" fill="#333333">Q（a_Q）</text>
  <circle cx="275.1" cy="254.9" r="4" fill="#1f4e79"/>
  <circle cx="154.9" cy="254.9" r="4" fill="#1f4e79"/>
  <circle cx="154.9" cy="375.1" r="4" fill="#1f4e79"/>
  <circle cx="275.1" cy="375.1" r="4" fill="#1f4e79"/>
  <text x="287" y="243" font-size="11" fill="#222222">00</text>
  <text x="143" y="243" font-size="11" text-anchor="end" fill="#222222">10</text>
  <text x="143" y="387" font-size="11" text-anchor="end" fill="#222222">11</text>
  <text x="287" y="387" font-size="11" fill="#222222">01</text>

  <!-- A2：16QAM -->
  <text x="575" y="152" font-size="15" text-anchor="middle" fill="#222222">A2｜16QAM：16 点，每点 4 bit</text>
  <rect x="430" y="170" width="290" height="290" fill="#ffffff" stroke="#666666" stroke-width="1"/>
  <g stroke="#bbbbbb" stroke-width="1" stroke-dasharray="3 4">
    <line x1="494.4" y1="174" x2="494.4" y2="456"/>
    <line x1="548.1" y1="174" x2="548.1" y2="456"/>
    <line x1="601.9" y1="174" x2="601.9" y2="456"/>
    <line x1="655.6" y1="174" x2="655.6" y2="456"/>
    <line x1="434" y1="234.4" x2="716" y2="234.4"/>
    <line x1="434" y1="288.1" x2="716" y2="288.1"/>
    <line x1="434" y1="341.9" x2="716" y2="341.9"/>
    <line x1="434" y1="395.6" x2="716" y2="395.6"/>
  </g>
  <line x1="438" y1="315" x2="712" y2="315" stroke="#555555" stroke-width="1.2"/>
  <line x1="575" y1="178" x2="575" y2="452" stroke="#555555" stroke-width="1.2"/>
  <text x="712" y="303" font-size="11" text-anchor="end" fill="#333333">I（a_I）</text>
  <text x="438" y="194" font-size="11" fill="#333333">Q（a_Q）</text>
  <g fill="#1f4e79">
    <circle cx="494.4" cy="234.4" r="4"/>
    <circle cx="548.1" cy="234.4" r="4"/>
    <circle cx="601.9" cy="234.4" r="4"/>
    <circle cx="655.6" cy="234.4" r="4"/>
    <circle cx="494.4" cy="288.1" r="4"/>
    <circle cx="548.1" cy="288.1" r="4"/>
    <circle cx="601.9" cy="288.1" r="4"/>
    <circle cx="655.6" cy="288.1" r="4"/>
    <circle cx="494.4" cy="341.9" r="4"/>
    <circle cx="548.1" cy="341.9" r="4"/>
    <circle cx="601.9" cy="341.9" r="4"/>
    <circle cx="655.6" cy="341.9" r="4"/>
    <circle cx="494.4" cy="395.6" r="4"/>
    <circle cx="548.1" cy="395.6" r="4"/>
    <circle cx="601.9" cy="395.6" r="4"/>
    <circle cx="655.6" cy="395.6" r="4"/>
  </g>
  <g font-size="11" fill="#222222">
    <text x="482.4" y="218.4" text-anchor="end">1011</text>
    <text x="536.1" y="218.4" text-anchor="end">1001</text>
    <text x="613.9" y="218.4">0001</text>
    <text x="667.6" y="218.4">0011</text>
    <text x="482.4" y="272.1" text-anchor="end">1010</text>
    <text x="536.1" y="272.1" text-anchor="end">1000</text>
    <text x="613.9" y="272.1">0000</text>
    <text x="667.6" y="272.1">0010</text>
    <text x="482.4" y="369.9" text-anchor="end">1110</text>
    <text x="536.1" y="369.9" text-anchor="end">1100</text>
    <text x="613.9" y="369.9">0100</text>
    <text x="667.6" y="369.9">0110</text>
    <text x="482.4" y="423.6" text-anchor="end">1111</text>
    <text x="536.1" y="423.6" text-anchor="end">1101</text>
    <text x="613.9" y="423.6">0101</text>
    <text x="667.6" y="423.6">0111</text>
  </g>

  <text x="50" y="482" font-size="11" fill="#222222">QPSK 四点等幅落在单位圆上；标签按 b0b1 排列，I 轴符号由 b0 决定、Q 轴符号由 b1 决定。</text>
  <text x="50" y="504" font-size="11" fill="#222222">16QAM 每维幅度 {±1,±3}/√10；标签按 b0b1b2b3 排列，b2 选 I 内外层、b3 选 Q 内外层。</text>
  <text x="50" y="526" font-size="11" fill="#222222">坐标均已归一化（平均符号能量 1）：QPSK 距原点 0.707，16QAM 内层 0.316、外层 0.949。</text>

  <!-- ================= 面板 B：AWGN 判决域 ================= -->
  <rect x="780" y="70" width="530" height="470" fill="#fdfdfd" stroke="#444444" stroke-width="1.5"/>
  <text x="1045" y="104" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222">面板 B｜AWGN 下的判决域与噪声圆</text>
  <text x="1045" y="128" font-size="11" text-anchor="middle" fill="#333333">虚线为相邻理想点的垂直平分线；× 为接收观测 y；蓝圈为半径 σ 的噪声圆</text>

  <rect x="895" y="150" width="300" height="300" fill="#ffffff" stroke="#666666" stroke-width="1"/>
  <g stroke="#777777" stroke-width="1" stroke-dasharray="4 4">
    <line x1="988.1" y1="154" x2="988.1" y2="446"/>
    <line x1="1045" y1="154" x2="1045" y2="446"/>
    <line x1="1101.9" y1="154" x2="1101.9" y2="446"/>
    <line x1="899" y1="243.1" x2="1191" y2="243.1"/>
    <line x1="899" y1="300" x2="1191" y2="300"/>
    <line x1="899" y1="356.9" x2="1191" y2="356.9"/>
  </g>
  <g fill="#333333">
    <circle cx="959.5" cy="214.6" r="3.5"/>
    <circle cx="1016.5" cy="214.6" r="3.5"/>
    <circle cx="1073.5" cy="214.6" r="3.5"/>
    <circle cx="1130.4" cy="214.6" r="3.5"/>
    <circle cx="959.5" cy="271.5" r="3.5"/>
    <circle cx="1073.5" cy="271.5" r="3.5"/>
    <circle cx="1130.4" cy="271.5" r="3.5"/>
    <circle cx="959.5" cy="328.5" r="3.5"/>
    <circle cx="1016.5" cy="328.5" r="3.5"/>
    <circle cx="1073.5" cy="328.5" r="3.5"/>
    <circle cx="1130.4" cy="328.5" r="3.5"/>
    <circle cx="959.5" cy="385.4" r="3.5"/>
    <circle cx="1016.5" cy="385.4" r="3.5"/>
    <circle cx="1073.5" cy="385.4" r="3.5"/>
    <circle cx="1130.4" cy="385.4" r="3.5"/>
  </g>
  <ellipse cx="1073.5" cy="271.5" rx="45" ry="45" fill="none" stroke="#3d6fb5" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="1073.5" y1="271.5" x2="1110" y2="265" stroke="#c0392b" stroke-width="1" stroke-dasharray="2 3"/>
  <circle cx="1073.5" cy="271.5" r="5" fill="#c0392b" stroke="#ffffff" stroke-width="1"/>
  <line x1="1106" y1="261" x2="1114" y2="269" stroke="#c0392b" stroke-width="2"/>
  <line x1="1106" y1="269" x2="1114" y2="261" stroke="#c0392b" stroke-width="2"/>

  <rect x="903" y="154" width="132" height="48" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <text x="911" y="172" font-size="11" fill="#222222">● 理想星座点</text>
  <text x="911" y="190" font-size="11" fill="#222222">× 接收观测 y</text>

  <text x="786" y="474" font-size="11" fill="#222222">s 位于 (0.316, 0.316)，Gray 标签 0000；y 越过 a_I = 0.632 的边界，被判为 0010。</text>
  <text x="786" y="496" font-size="11" fill="#222222">判决只看距离：y 离 0010 更近，故符号错误，但只错 b2 一位。</text>
  <text x="786" y="518" font-size="11" fill="#222222">噪声圆半径取 σ = 0.50（示意）；半径越大、判决域越窄，越界概率越高。</text>

  <!-- ================= 面板 C：归一化因子 ================= -->
  <rect x="30" y="570" width="1280" height="210" fill="#fdfdfd" stroke="#444444" stroke-width="1.5"/>
  <text x="670" y="600" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222">面板 C｜归一化因子与平均符号能量</text>
  <text x="670" y="624" font-size="11" text-anchor="middle" fill="#333333">三个数值条按同一比例绘制：条长与归一化因子 c 成正比，条右端标注 c 与未归一化坐标的平均能量</text>

  <text x="60" y="672" font-size="11" fill="#222222">QPSK（2 bit）</text>
  <rect x="200" y="654" width="500" height="22" fill="#cfe3ff" stroke="#3d6fb5" stroke-width="1.2"/>
  <text x="712" y="672" font-size="11" fill="#222222">c = 1；点已在单位圆上，E_s = 1</text>

  <text x="60" y="712" font-size="11" fill="#222222">16QAM（4 bit）</text>
  <rect x="200" y="694" width="158.1" height="22" fill="#cfe3ff" stroke="#3d6fb5" stroke-width="1.2"/>
  <text x="370" y="712" font-size="11" fill="#222222">c = 1/√10 ≈ 0.316；未归一化坐标平均能量 10</text>

  <text x="60" y="752" font-size="11" fill="#222222">64QAM（6 bit）</text>
  <rect x="200" y="734" width="77.1" height="22" fill="#cfe3ff" stroke="#3d6fb5" stroke-width="1.2"/>
  <text x="289" y="752" font-size="11" fill="#222222">c = 1/√42 ≈ 0.154；未归一化坐标平均能量 42</text>

  <rect x="900" y="640" width="380" height="100" fill="#f7f9fc" stroke="#cccccc" stroke-width="1"/>
  <text x="916" y="666" font-size="11" fill="#222222">归一化后三阶的平均符号能量均为 1。</text>
  <text x="916" y="688" font-size="11" fill="#222222">c 越小，未归一化坐标的幅度越大，压缩越多。</text>
  <text x="916" y="710" font-size="11" fill="#222222">因此 16QAM/64QAM 的相邻点距离比 QPSK 小。</text>

  <text x="60" y="776" font-size="11" fill="#222222">三个数值条按同一比例绘制；c 为归一化因子，条右端给出 c 与未归一化坐标的平均符号能量。</text>
</svg>
