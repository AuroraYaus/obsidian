    <rect x="1195" y="796" width="215" height="28" fill="#EBEEF2" stroke="#CFC8B8" stroke-width="1"/>
    <text x="1302" y="815" text-anchor="middle" font-weight="700">pos 5</text>

    <rect x="80" y="824" width="215" height="58" fill="#F7E9EF" stroke="#CFC8B8" stroke-width="1"/>
    <text x="187" y="848" text-anchor="middle" font-weight="700">+1.0</text>
    <text x="187" y="870" text-anchor="middle" fill="#646B76">new</text>
    <rect x="303" y="824" width="215" height="58" fill="#F8EEDC" stroke="#CFC8B8" stroke-width="1"/>
    <text x="410" y="848" text-anchor="middle" font-weight="700">-1.4</text>
    <text x="410" y="870" text-anchor="middle" fill="#646B76">repeat</text>
    <rect x="526" y="824" width="215" height="58" fill="#EFF1E2" stroke="#CFC8B8" stroke-width="1"/>
    <text x="633" y="848" text-anchor="middle" font-weight="700">+8.0</text>
    <text x="633" y="870" text-anchor="middle" fill="#646B76">short</text>
    <rect x="749" y="824" width="215" height="58" fill="#EBEEF2" stroke="#CFC8B8" stroke-width="1"/>
    <text x="856" y="848" text-anchor="middle" font-weight="700">0</text>
    <text x="856" y="870" text-anchor="middle" fill="#646B76">unknown</text>
