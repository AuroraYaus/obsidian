  </g>

  <!-- 图例 4 张 -->
  <g font-size="12" fill="#23272E">
    <rect x="80" y="1012" width="322" height="92" rx="9" fill="#F7E9EF" stroke="#CFC8B8" stroke-width="1"/>
    <text x="96" y="1038" font-weight="700">new</text>
    <text x="96" y="1060" fill="#646B76">首次写入：rx LLR 放入该母码位置</text>
    <rect x="414" y="1012" width="322" height="92" rx="9" fill="#F8EEDC" stroke="#CFC8B8" stroke-width="1"/>
    <text x="430" y="1038" font-weight="700">repeat</text>
