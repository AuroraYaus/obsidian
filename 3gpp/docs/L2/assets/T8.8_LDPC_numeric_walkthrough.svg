    <rect x="45" y="186" width="24" height="24" fill="#FFFFFF"/>
    <text x="57" y="203">0</text>
    <rect x="69" y="186" width="24" height="24" fill="#DCE7F6"/>
    <text x="81" y="203">1</text>
    <rect x="93" y="186" width="24" height="24" fill="#DCE7F6"/>
    <text x="105" y="203">1</text>
    <rect x="117" y="186" width="24" height="24" fill="#FFFFFF"/>
    <text x="129" y="203">0</text>
    <rect x="141" y="186" width="24" height="24" fill="#DCE7F6"/>
    <text x="153" y="203">1</text>
    <rect x="165" y="186" width="24" height="24" fill="#FFFFFF"/>
    <text x="177" y="203">0</text>
    <rect x="45" y="210" width="24" height="24" fill="#DCE7F6"/>
    <text x="57" y="227">1</text>
    <rect x="69" y="210" width="24" height="24" fill="#FFFFFF"/>
    <text x="81" y="227">0</text>
    <rect x="93" y="210" width="24" height="24" fill="#DCE7F6"/>
    <text x="105" y="227">1</text>
    <rect x="117" y="210" width="24" height="24" fill="#FFFFFF"/>
    <text x="129" y="227">0</text>
    <rect x="141" y="210" width="24" height="24" fill="#FFFFFF"/>
    <text x="153" y="227">0</text>
    <rect x="165" y="210" width="24" height="24" fill="#DCE7F6"/>
    <text x="177" y="227">1</text>
  </g>

  <!-- 初始 LLR 与硬判决表 -->
  <g font-size="12.5" text-anchor="middle">
    <rect x="45" y="244" width="50" height="26" fill="#DDE7F3"/>
    <text x="70" y="262" font-weight="700" fill="#1B2433"></text>
    <rect x="95" y="244" width="44" height="26" fill="#DDE7F3"/>
    <text x="117" y="262" font-weight="700" fill="#1B2433">v0</text>
    <rect x="139" y="244" width="44" height="26" fill="#DDE7F3"/>
    <text x="161" y="262" font-weight="700" fill="#1B2433">v1</text>
    <rect x="183" y="244" width="44" height="26" fill="#DDE7F3"/>
    <text x="205" y="262" font-weight="700" fill="#1B2433">v2</text>
    <rect x="227" y="244" width="44" height="26" fill="#DDE7F3"/>
    <text x="249" y="262" font-weight="700" fill="#1B2433">v3</text>
    <rect x="271" y="244" width="44" height="26" fill="#DDE7F3"/>
    <text x="293" y="262" font-weight="700" fill="#1B2433">v4</text>
    <rect x="315" y="244" width="44" height="26" fill="#DDE7F3"/>
    <text x="337" y="262" font-weight="700" fill="#1B2433">v5</text>
    <rect x="45" y="270" width="50" height="30" fill="#FFFFFF"/>
    <text x="70" y="290" font-weight="700">LLR</text>
    <rect x="95" y="270" width="44" height="30" fill="#FFFFFF"/>
    <text x="117" y="290">+0.9</text>
    <rect x="139" y="270" width="44" height="30" fill="#FFFFFF"/>
    <text x="161" y="290">-0.8</text>
    <rect x="183" y="270" width="44" height="30" fill="#FFFFFF"/>
    <text x="205" y="290">+0.4</text>
    <rect x="227" y="270" width="44" height="30" fill="#FFFFFF"/>
    <text x="249" y="290">-0.6</text>
    <rect x="271" y="270" width="44" height="30" fill="#FFFFFF"/>
    <text x="293" y="290">+0.7</text>
    <rect x="315" y="270" width="44" height="30" fill="#FFFFFF"/>
    <text x="337" y="290">-0.5</text>
    <rect x="45" y="300" width="50" height="30" fill="#EDF2F8"/>
    <text x="70" y="320" font-weight="700">hard0</text>
    <rect x="95" y="300" width="44" height="30" fill="#EDF2F8"/>
    <text x="117" y="320">0</text>
    <rect x="139" y="300" width="44" height="30" fill="#EDF2F8"/>
    <text x="161" y="320">1</text>
    <rect x="183" y="300" width="44" height="30" fill="#EDF2F8"/>
    <text x="205" y="320">0</text>
    <rect x="227" y="300" width="44" height="30" fill="#EDF2F8"/>
    <text x="249" y="320">1</text>
    <rect x="271" y="300" width="44" height="30" fill="#EDF2F8"/>
    <text x="293" y="320">0</text>
    <rect x="315" y="300" width="44" height="30" fill="#EDF2F8"/>
    <text x="337" y="320">1</text>
  </g>
  <text x="45" y="368" font-size="12.5" font-weight="700" fill="#C4553D">初始 syndrome=[0,1,1]，weight=2，说明 c1 和 c2 校验失败。</text>

  <!-- ============ 右：一轮 Min-Sum CN 消息 ============ -->
  <g filter="url(#soft)">
    <rect x="500" y="95" width="465" height="310" rx="14" fill="#F5F7FA" stroke="#C9D4E0" stroke-width="1.5"/>
  </g>
  <text x="520" y="122" font-size="15" font-weight="700" fill="#3E9E74">一轮 Min-Sum CN 消息</text>

  <g font-size="12.5" font-weight="700" fill="#1B2433" text-anchor="middle">
    <rect x="520" y="140" width="110" height="46" rx="9" fill="#E2F2E9" stroke="#3E9E74" stroke-width="1.3"/>
    <text x="575" y="162">r0-&gt;v0</text>
    <text x="575" y="181" font-weight="400">+0.6</text>
    <rect x="640" y="140" width="110" height="46" rx="9" fill="#E2F2E9" stroke="#3E9E74" stroke-width="1.3"/>
    <text x="695" y="162">r0-&gt;v1</text>
    <text x="695" y="181" font-weight="400">-0.6</text>
    <rect x="760" y="140" width="110" height="46" rx="9" fill="#E2F2E9" stroke="#3E9E74" stroke-width="1.3"/>
    <text x="815" y="162">r0-&gt;v3</text>
    <text x="815" y="181" font-weight="400">-0.8</text>
    <rect x="520" y="196" width="110" height="46" rx="9" fill="#E2F2E9" stroke="#3E9E74" stroke-width="1.3"/>
    <text x="575" y="218">r1-&gt;v1</text>
    <text x="575" y="237" font-weight="400">+0.4</text>
    <rect x="640" y="196" width="110" height="46" rx="9" fill="#E2F2E9" stroke="#3E9E74" stroke-width="1.3"/>
    <text x="695" y="218">r1-&gt;v2</text>
    <text x="695" y="237" font-weight="400">-0.7</text>
    <rect x="760" y="196" width="110" height="46" rx="9" fill="#E2F2E9" stroke="#3E9E74" stroke-width="1.3"/>
    <text x="815" y="218">r1-&gt;v4</text>
    <text x="815" y="237" font-weight="400">-0.4</text>
    <rect x="520" y="252" width="110" height="46" rx="9" fill="#E2F2E9" stroke="#3E9E74" stroke-width="1.3"/>
    <text x="575" y="274">r2-&gt;v0</text>
    <text x="575" y="293" font-weight="400">-0.4</text>
    <rect x="640" y="252" width="110" height="46" rx="9" fill="#E2F2E9" stroke="#3E9E74" stroke-width="1.3"/>
    <text x="695" y="274">r2-&gt;v2</text>
    <text x="695" y="293" font-weight="400">-0.5</text>
    <rect x="760" y="252" width="110" height="46" rx="9" fill="#E2F2E9" stroke="#3E9E74" stroke-width="1.3"/>
    <text x="815" y="274">r2-&gt;v5</text>
    <text x="815" y="293" font-weight="400">+0.4</text>
  </g>

  <text x="520" y="330" font-size="12" fill="#5B6877">例：r1-&gt;v2 排除 v2，只看 v1=-0.8 与 v4=+0.7；</text>
  <text x="520" y="348" font-size="12" fill="#5B6877">符号为负，幅度取 min(0.8,0.7)=0.7，所以 r1-&gt;v2=-0.7。</text>

<!-- ============ 标题 ============ -->
  <text x="35" y="464" font-size="18" font-weight="700" fill="#1B2433">Posterior、早停与调试字段</text>
  <text x="35" y="490" font-size="12" fill="#5B6877">第二张图承接第一张的 9 条 CN 消息，展示 VN posterior 合成、更新后 hard decision、</text>
  <text x="35" y="508" font-size="12" fill="#5B6877">syndrome early stop 和最小 dump 字段。</text>

  <!-- ============ 左：Posterior、硬判决与早停 ============ -->
  <g filter="url(#soft)">
    <rect x="35" y="525" width="550" height="300" rx="14" fill="#F5F7FA" stroke="#C9D4E0" stroke-width="1.5"/>
  </g>
  <text x="55" y="552" font-size="15" font-weight="700" fill="#8A6BBE">Posterior、硬判决与早停</text>

  <g font-size="12.5" text-anchor="middle">
