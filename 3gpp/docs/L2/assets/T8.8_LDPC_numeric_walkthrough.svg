  </g>

  <!-- ============ 右：更新后判决与早停 ============ -->
  <g filter="url(#soft)">
    <rect x="605" y="525" width="360" height="300" rx="14" fill="#F9ECEA" stroke="#D99A8E" stroke-width="1.5"/>
  </g>
  <text x="625" y="552" font-size="15" font-weight="700" fill="#C4553D">更新后判决与早停</text>
  <text x="625" y="580" font-size="12" fill="#5B6877">更新后 hard=[0,1,1,1,0,1]；syndrome=[0,0,0]。</text>
  <text x="625" y="598" font-size="12" fill="#5B6877">toy 译码器可 syndrome early stop；真实链路</text>
  <text x="625" y="616" font-size="12" fill="#5B6877">还要执行 CRC 边界。</text>

  <g font-size="11.5" font-weight="700" fill="#1B2433" text-anchor="middle">
    <rect x="625" y="630" width="46" height="26" rx="8" fill="#EDF1F6" stroke="#72839B" stroke-width="1.2"/>
    <text x="648" y="648">v0=0</text>
    <rect x="679" y="630" width="46" height="26" rx="8" fill="#E2F2E9" stroke="#3E9E74" stroke-width="1.2"/>
    <text x="702" y="648">v1=1</text>
    <rect x="733" y="630" width="46" height="26" rx="8" fill="#E2F2E9" stroke="#3E9E74" stroke-width="1.2"/>
    <text x="756" y="648">v2=1</text>
    <rect x="787" y="630" width="46" height="26" rx="8" fill="#E2F2E9" stroke="#3E9E74" stroke-width="1.2"/>
    <text x="810" y="648">v3=1</text>
    <rect x="841" y="630" width="46" height="26" rx="8" fill="#EDF1F6" stroke="#72839B" stroke-width="1.2"/>
    <text x="864" y="648">v4=0</text>
    <rect x="895" y="630" width="46" height="26" rx="8" fill="#E2F2E9" stroke="#3E9E74" stroke-width="1.2"/>
    <text x="918" y="648">v5=1</text>
    <rect x="625" y="680" width="155" height="28" rx="8" fill="#3E9E74"/>
    <text x="702" y="699" fill="#FFFFFF">syndrome=[0,0,0]</text>
  </g>
  <text x="625" y="740" font-size="11.5" fill="#5B6877">hard 逐位取自 Lpost 的符号；syndrome 全零表示</text>
  <text x="625" y="756" font-size="11.5" fill="#5B6877">当前硬判决满足 LDPC 校验约束。</text>

  <!-- ============ 调试字段与真实 NR 对应关系 ============ -->
  <g filter="url(#soft)">
    <rect x="35" y="845" width="930" height="240" rx="14" fill="#FAF5E4" stroke="#D9C179" stroke-width="1.5"/>
  </g>
  <text x="55" y="873" font-size="15" font-weight="700" fill="#1B2433">调试字段与真实 NR 对应关系</text>

  <g font-size="12.5" text-anchor="middle">
    <rect x="55" y="895" width="200" height="30" fill="#DDE7F3"/>
    <text x="155" y="915" font-weight="700" fill="#1B2433">field</text>
    <rect x="255" y="895" width="180" height="30" fill="#DDE7F3"/>
    <text x="345" y="915" font-weight="700" fill="#1B2433">toy value</text>
    <rect x="435" y="895" width="510" height="30" fill="#DDE7F3"/>
    <text x="690" y="915" font-weight="700" fill="#1B2433">meaning</text>
    <rect x="55" y="925" width="200" height="36" fill="#FFFFFF"/>
    <text x="155" y="948">iteration</text>
    <rect x="255" y="925" width="180" height="36" fill="#FFFFFF"/>
    <text x="345" y="948">0 -&gt; 1</text>
    <rect x="435" y="925" width="510" height="36" fill="#FFFFFF"/>
    <text x="690" y="948" fill="#5B6877">本例只跑一轮 Min-Sum。</text>
    <rect x="55" y="961" width="200" height="36" fill="#EDF2F8"/>
    <text x="155" y="984">edge messages</text>
    <rect x="255" y="961" width="180" height="36" fill="#EDF2F8"/>
    <text x="345" y="984">9 条 r</text>
    <rect x="435" y="961" width="510" height="36" fill="#EDF2F8"/>
    <text x="690" y="984" fill="#5B6877">真实 NR 由 BG/Zc/shift 生成大量边。</text>
    <rect x="55" y="997" width="200" height="36" fill="#FFFFFF"/>
    <text x="155" y="1020">posterior LLR</text>
    <rect x="255" y="997" width="180" height="36" fill="#FFFFFF"/>
    <text x="345" y="1020">6 个</text>
    <rect x="435" y="997" width="510" height="36" fill="#FFFFFF"/>
    <text x="690" y="1020" fill="#5B6877">真实 NR 是 68Zc 或 52Zc 个 H 列位置。</text>
    <rect x="55" y="1033" width="200" height="36" fill="#EDF2F8"/>
    <text x="155" y="1056">syndrome weight</text>
    <rect x="255" y="1033" width="180" height="36" fill="#EDF2F8"/>
    <text x="345" y="1056">2 -&gt; 0</text>
    <rect x="435" y="1033" width="510" height="36" fill="#EDF2F8"/>
    <text x="690" y="1056" fill="#5B6877">早停只说明 LDPC 约束通过。</text>
  </g>
</svg>
