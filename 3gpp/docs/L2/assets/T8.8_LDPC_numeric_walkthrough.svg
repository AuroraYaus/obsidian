<?xml version="1.0" encoding="UTF-8"?>
<!--
  @file    T8.8_LDPC_numeric_walkthrough.svg
  @brief   Toy LDPC Min-Sum 数值走读 · 兼容合并全景图（手绘 SVG，由 part1 + part2 纵向拼接）
  @date    2026-08-04
  @note    保留历史兼容引用：上半部分为 part1（Toy H 与初始判决 + 一轮 Min-Sum CN 消息），
           下半部分为 part2（Posterior 合成、syndrome early stop 与调试字段对照）。
           教学例子，不是 NR conformance vector；字号符合合规 Rule 23。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1100" viewBox="0 0 1000 1100" role="img" font-family="'Noto Sans CJK SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif">
  <title>Toy LDPC Min-Sum 数值走读（合并全景）</title>

  <defs>
    <filter id="soft" x="-10%" y="-10%" width="125%" height="135%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#334155" flood-opacity="0.14"/>
    </filter>
  </defs>

<!-- ============ 标题 ============ -->
  <text x="35" y="34" font-size="18" font-weight="700" fill="#1B2433">Toy LDPC Min-Sum 数值走读</text>
  <text x="35" y="60" font-size="12" fill="#5B6877">教学例子，不是 NR conformance vector。目标是把 channel LLR、H、CN 消息、posterior LLR、</text>
  <text x="35" y="78" font-size="12" fill="#5B6877">hard decision、syndrome 与 early stop 串成可复现路径。</text>

  <!-- ============ 左：Toy H 与初始判决 ============ -->
  <g filter="url(#soft)">
    <rect x="20" y="95" width="460" height="310" rx="14" fill="#F5F7FA" stroke="#C9D4E0" stroke-width="1.5"/>
  </g>
  <text x="55" y="122" font-size="15" font-weight="700" fill="#3B6FB5">Toy H 与初始判决</text>

  <g font-size="10.5" font-weight="700" fill="#1B2433" text-anchor="middle">
