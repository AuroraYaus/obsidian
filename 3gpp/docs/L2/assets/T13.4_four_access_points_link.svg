<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="570" viewBox="0 0 1560 570" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2E6DA4"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="780" y="36" font-size="22" font-weight="bold" text-anchor="middle" fill="#1F3B57">图 1：PS 嵌入 NR 的四个接入点——NR spine 复用，四处替换</text>
  <text x="780" y="62" font-size="13" text-anchor="middle" fill="#5A6B7C">蓝色为 NR spine（全部复用不改）；橙色为 PS 专属替换点；数据路径各级只认长度与统计约定、不认内容语义</text>

  <!-- 接入点 1、2 标签（上方）与竖直引线 -->
  <g>
    <rect x="30" y="88" width="280" height="72" rx="8" fill="#FCE4D6" stroke="#C55A11" stroke-width="1.5"/>
    <text x="46" y="111" font-size="14" font-weight="bold" fill="#C55A11">接入点 1：TB 构造前</text>
    <text x="46" y="133" font-size="12" fill="#333333">build_tb_for_ps：四段式 TB + ESS 编码</text>
    <text x="46" y="152" font-size="12" fill="#333333">+ SBPM 重排（替换“随机 TB”）</text>

    <rect x="330" y="88" width="260" height="72" rx="8" fill="#FCE4D6" stroke="#C55A11" stroke-width="1.5"/>
    <text x="346" y="111" font-size="14" font-weight="bold" fill="#C55A11">接入点 2：加扰处</text>
    <text x="346" y="133" font-size="12" fill="#333333">ps_scramble：行路由 + 选择性加扰</text>
    <text x="346" y="152" font-size="12" fill="#333333">（标准 Gold 序列，只改支撑集）</text>
  </g>

  <line x1="60" y1="160" x2="60" y2="212" stroke="#C55A11" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="350" y1="160" x2="350" y2="212" stroke="#C55A11" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- NR spine 四个组件（横排） -->
  <g>
    <rect x="90" y="170" width="220" height="84" rx="8" fill="#D6E9F8" stroke="#2E6DA4" stroke-width="2"/>
    <text x="200" y="200" font-size="16" font-weight="bold" text-anchor="middle" fill="#1F3B57">nrDLSCH</text>
    <text x="200" y="224" font-size="13" text-anchor="middle" fill="#333333">CRC/分段/LDPC/速率匹配（复用）</text>

    <line x1="310" y1="212" x2="408" y2="212" stroke="#2E6DA4" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="410" y="170" width="220" height="84" rx="8" fill="#D6E9F8" stroke="#2E6DA4" stroke-width="2"/>
    <text x="520" y="200" font-size="16" font-weight="bold" text-anchor="middle" fill="#1F3B57">OFDM/QAM</text>
    <text x="520" y="224" font-size="13" text-anchor="middle" fill="#333333">QAM/层映射/OFDM（复用）</text>

    <line x1="630" y1="212" x2="638" y2="212" stroke="#2E6DA4" stroke-width="2.5" marker-end="url(#arrow)"/>

    <!-- 信道（非 spine 组件，灰色） -->
    <ellipse cx="720" cy="212" rx="80" ry="32" fill="#EEEEEE" stroke="#888888" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="720" y="190" font-size="14" font-weight="bold" text-anchor="middle" fill="#555555">无线信道</text>
    <text x="720" y="236" font-size="12" text-anchor="middle" fill="#777777">TX → RX</text>

    <line x1="800" y1="212" x2="828" y2="212" stroke="#2E6DA4" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="830" y="170" width="220" height="84" rx="8" fill="#D6E9F8" stroke="#2E6DA4" stroke-width="2"/>
    <text x="940" y="200" font-size="16" font-weight="bold" text-anchor="middle" fill="#1F3B57">检测器/软解调</text>
    <text x="940" y="224" font-size="13" text-anchor="middle" fill="#333333">MMSE/Sphere/软解调（复用）</text>

    <line x1="1050" y1="212" x2="1148" y2="212" stroke="#2E6DA4" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="1150" y="170" width="220" height="84" rx="8" fill="#D6E9F8" stroke="#2E6DA4" stroke-width="2"/>
    <text x="1260" y="200" font-size="16" font-weight="bold" text-anchor="middle" fill="#1F3B57">nrDLSCHDecoder</text>
    <text x="1260" y="224" font-size="13" text-anchor="middle" fill="#333333">LDPC 解码链（复用）</text>

    <line x1="1370" y1="212" x2="1388" y2="212" stroke="#2E6DA4" stroke-width="2.5" marker-end="url(#arrow)"/>
    <line x1="60" y1="212" x2="88" y2="212" stroke="#2E6DA4" stroke-width="2.5" marker-end="url(#arrow)"/>
  </g>

  <!-- 接入点圆点（插在线路上） -->
  <g fill="#C55A11">
    <circle cx="60" cy="212" r="7"/>
    <circle cx="350" cy="212" r="7"/>
    <circle cx="810" cy="212" r="7"/>
    <circle cx="1390" cy="212" r="7"/>
  </g>

  <!-- 接入点 3、4 标签（下方）与竖直引线 -->
  <g>
    <rect x="680" y="290" width="280" height="78" rx="8" fill="#FCE4D6" stroke="#C55A11" stroke-width="1.5"/>
    <text x="696" y="313" font-size="14" font-weight="bold" fill="#C55A11">接入点 3：解调前</text>
    <text x="696" y="335" font-size="12" fill="#333333">preprocess_demod_input：先验正则等效信道</text>
    <text x="696" y="354" font-size="12" fill="#333333">+ 解扰 LLR sign flip（替换直通）</text>

    <rect x="1230" y="290" width="280" height="78" rx="8" fill="#FCE4D6" stroke="#C55A11" stroke-width="1.5"/>
    <text x="1246" y="313" font-size="14" font-weight="bold" fill="#C55A11">接入点 4：LDPC 解码后</text>
    <text x="1246" y="335" font-size="12" fill="#333333">deshape_tb：inverse ESS + SBPM + 重组</text>
    <text x="1246" y="354" font-size="12" fill="#333333">（替换“解码 TB 即结果”）</text>
  </g>

  <line x1="810" y1="290" x2="810" y2="212" stroke="#C55A11" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="1390" y1="290" x2="1390" y2="212" stroke="#C55A11" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- 图例 -->
  <text x="60" y="445" font-size="15" font-weight="bold" fill="#1F3B57">图例</text>

  <rect x="60" y="462" width="18" height="10" rx="2" fill="#D6E9F8" stroke="#2E6DA4" stroke-width="1"/>
  <text x="90" y="480" font-size="13" fill="#333333">NR spine：nrDLSCH / OFDM-QAM / 检测器 / nrDLSCHDecoder 全部复用不改（协议行为原样执行）</text>

  <rect x="60" y="492" width="18" height="10" rx="2" fill="#FCE4D6" stroke="#C55A11" stroke-width="1"/>
  <text x="90" y="510" font-size="13" fill="#333333">接入点：PS 专属替换（4 处），TX/RX 严格对称——接入点 2 ↔ 接入点 3 后半段（解扰）</text>

  <rect x="60" y="522" width="18" height="10" rx="2" fill="#EEEEEE" stroke="#888888" stroke-width="1"/>
  <text x="90" y="540" font-size="13" fill="#333333">根基：各级只认长度与统计约定、不认内容语义——任何破坏约定（长度、均匀性）的改动都会撑破架构</text>
</svg>
