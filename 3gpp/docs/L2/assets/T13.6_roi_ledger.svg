<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="arrowRight" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8A8F98"/>
    </marker>
    <marker id="arrowLeft" markerWidth="10" markerHeight="10" refX="1" refY="5" orient="auto">
      <path d="M10,0 L0,5 L10,10 Z" fill="#8A8F98"/>
    </marker>
  </defs>

  <!-- 标题区 -->
  <text x="550" y="40" text-anchor="middle" font-size="26" font-weight="bold" fill="#17212F" class="free">整形增益的 ROI 账本：增益侧 vs 代价侧</text>
  <text x="550" y="70" text-anchor="middle" font-size="15" fill="#3A4658" class="free">评估 PS 的价值必须把增益与代价放进同一个账本、按场景算账——不是只看 dB（U8）</text>

  <!-- 左栏：增益侧 -->
  <rect x="60" y="100" width="450" height="46" rx="6" fill="#2F6DB3"/>
  <text x="80" y="130" font-size="19" font-weight="bold" fill="#FFFFFF">增益侧（同 payload、同 MCS、功率归一后）</text>

  <rect x="60" y="160" width="450" height="355" rx="6" fill="#F4F8FD" stroke="#2F6DB3" stroke-width="1.5"/>
  <text x="80" y="196" font-size="16" font-weight="bold" fill="#2F6DB3">AWGN（MCS10）约 0.8–1.2 dB</text>
  <text x="80" y="222" font-size="16" fill="#33404F">AWGN（MCS20）约 0.5–0.8 dB</text>
  <text x="80" y="248" font-size="16" fill="#33404F">TDL-A（MCS10）约 0.3–0.6 dB</text>
  <text x="80" y="274" font-size="16" fill="#33404F">TDL-A（MCS20）约 0.2–0.4 dB</text>
  <line x1="80" y1="292" x2="490" y2="292" stroke="#C9D6E4" stroke-width="1"/>
  <text x="80" y="320" font-size="16" font-weight="bold" fill="#17212F">汇总：AWGN 0.5–1.2 / TDL 0.2–0.6 dB</text>
  <text x="80" y="346" font-size="16" fill="#33404F">参考：1 dB @3.5 GHz ≈ 20–25% 覆盖半径</text>
  <line x1="80" y1="364" x2="490" y2="364" stroke="#C9D6E4" stroke-width="1"/>
  <text x="80" y="392" font-size="16" font-weight="bold" fill="#17212F">公平口径四要素（先查后比）</text>
  <text x="80" y="418" font-size="15" fill="#33404F">① TBS 匹配 ±1%（同 payload 比能量）</text>
  <text x="80" y="444" font-size="15" fill="#33404F">② 功率归一（√psPowerScaling）</text>
  <text x="80" y="470" font-size="15" fill="#33404F">③ 固定 MCS</text>
  <text x="80" y="496" font-size="15" fill="#33404F">④ AWGN / 衰落分别报告</text>

  <!-- 右栏：代价侧 -->
  <rect x="590" y="100" width="450" height="46" rx="6" fill="#B04A2E"/>
  <text x="610" y="130" font-size="19" font-weight="bold" fill="#FFFFFF">代价侧（账单不随信道场景变化）</text>

  <rect x="590" y="160" width="450" height="355" rx="6" fill="#FCF5F1" stroke="#B04A2E" stroke-width="1.5"/>
  <text x="610" y="196" font-size="16" font-weight="bold" fill="#B04A2E">硬件：+55% gates / +45% SRAM / +28% 功耗</text>
  <text x="610" y="222" font-size="16" fill="#33404F">ESS 编解码 20K / 10K gates（Cholesky 90K 最大单项）</text>
  <text x="610" y="248" font-size="16" fill="#33404F">调度：8 路并行 Cholesky</text>
  <text x="610" y="274" font-size="16" fill="#33404F">486,720 cycles vs 61,440 时隙预算（≈7.9×）</text>
  <line x1="610" y1="292" x2="1020" y2="292" stroke="#E4CBBE" stroke-width="1"/>
  <text x="610" y="320" font-size="16" font-weight="bold" fill="#17212F">功率：7–14× 缩放（+8.5~11.3 dB）</text>
  <text x="610" y="346" font-size="16" fill="#33404F">PA back-off 2–3 dB（效率损失 5–15%）</text>
  <line x1="610" y1="364" x2="1020" y2="364" stroke="#E4CBBE" stroke-width="1"/>
  <text x="610" y="392" font-size="16" font-weight="bold" fill="#17212F">存储：MIMO 26% + 信道估计 20% + PS 16%</text>
  <text x="610" y="418" font-size="15" fill="#33404F">合计 62%（LDPC 仅 8%）；ESS 能量表 264 KB</text>
  <text x="610" y="444" font-size="15" fill="#33404F">账单不变、衰落只缩增益——这是按场景算账的原因</text>
  <text x="610" y="470" font-size="15" font-weight="bold" fill="#B04A2E">虚优警示：未做 TBS 匹配 → 约 2.4 dB 假增益</text>
  <text x="610" y="496" font-size="15" fill="#33404F">（R_eff = payloadTBS/(N_RE·Qm)，与目标码率脱钩）</text>

  <!-- 中间对账区：竖虚线 + 双向箭头 + 标签 -->
  <line x1="550" y1="170" x2="550" y2="510" stroke="#B8C2CF" stroke-width="1.5" stroke-dasharray="6,5"/>
  <line x1="518" y1="300" x2="582" y2="300" stroke="#8A8F98" stroke-width="2.2"
        marker-start="url(#arrowLeft)" marker-end="url(#arrowRight)"/>
  <text x="550" y="336" text-anchor="middle" font-size="15" fill="#5A6070" class="free">对 账</text>
  <text x="550" y="360" text-anchor="middle" font-size="15" fill="#5A6070" class="free">核 算</text>

  <!-- 底部 ROI 结论条 -->
  <rect x="60" y="560" width="980" height="120" rx="8" fill="#F5F7FA" stroke="#C9D6E4" stroke-width="1.5"/>
  <text x="550" y="594" text-anchor="middle" font-size="18" font-weight="bold" fill="#17212F">ROI 结论：按场景算账，不是只看 dB</text>
  <text x="550" y="626" text-anchor="middle" font-size="15" fill="#1B5E20">AWGN 高 SNR：0.8–1.2 dB ≫ 账单 → ROI 为正（1 dB ≈ 20–25% 覆盖半径）</text>
  <text x="550" y="652" text-anchor="middle" font-size="15" fill="#B04A2E">TDL 衰落：0.3–0.6 dB ≈ 账单（+55% gates 不变）→ ROI 谨慎，需按部署场景核算</text>

  <!-- 页脚 -->
  <text x="550" y="712" text-anchor="middle" font-size="13" fill="#8A8F98" class="free">素材口径：PS01 §7.2 实测区间与 §7.3 衰落三机制；理论清单 G 节（gates/SRAM/功耗、61,440 预算、486,720 cycles、存储占比、7–14×、PA back-off）</text>
  <text x="550" y="738" text-anchor="middle" font-size="13" fill="#8A8F98" class="free">T13.6 ROI 账本图——增益侧（蓝）与代价侧（橙）同账；公平口径四要素是审计任何 PS 报告的第一步</text>
</svg>
