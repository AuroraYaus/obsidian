<?xml version="1.0" encoding="UTF-8"?>
<!--
  @file    T8.2_NR_LDPC_base_graph_selection_flow.svg
  @brief   NR LDPC 基图选择流程图 BG1 vs BG2（手绘 SVG）
  @date    2026-08-04
  @note    布局按讲义语义重排：输入上下文（A、R、方向）居上，三条 BG2 分支（逻辑 OR）
           横向排开，输出 BG2/BG1 落在分支下方，配置落点在右；底部为选择条件协议复现表
           与四个边界案例。语义配色：分支 1 绿 / 分支 2 琥珀 / 分支 3 红 / BG1 蓝 /
           配置紫；字号符合合规 Rule 23。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1020" viewBox="0 0 1000 1020" role="img" font-family="'Noto Sans CJK SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif">
  <title>NR LDPC 基图选择流程</title>

  <defs>
    <filter id="soft" x="-10%" y="-10%" width="125%" height="135%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#334155" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5D6B80"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3E9E74"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D18A2F"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C4553D"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3B6FB5"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8A6BBE"/>
    </marker>
  </defs>

  <!-- ============ 标题 ============ -->
  <text x="40" y="34" font-size="18" font-weight="700" fill="#1B2433" class="free">NR LDPC 基图选择流程</text>
  <text x="40" y="60" font-size="12" fill="#5A6877" class="free">输入是传输块 payload size A 与由 MCS 指示的 coding rate R；输出是 LDPC Base Graph 1 或 Base Graph 2。</text>
  <text x="40" y="78" font-size="12" fill="#5A6877" class="free">选择结果会进入 Zc、矩阵表、地址生成和译码器配置。</text>

  <!-- ============ 输入上下文（顶部居中） ============ -->
  <g filter="url(#soft)">
    <rect x="350" y="95" width="300" height="92" rx="12" fill="#E7EFF9" stroke="#3B6FB5" stroke-width="1.5"/>
  </g>
  <text x="500" y="122" font-size="14" font-weight="700" fill="#1B2433" text-anchor="middle">输入上下文</text>
  <g font-size="12" fill="#5A6877" text-anchor="middle">
    <text x="500" y="146" text-anchor="middle">A: payload size</text>
    <text x="500" y="162" text-anchor="middle">R: MCS 指示码率</text>
    <text x="500" y="178" text-anchor="middle">方向: UL-SCH 或 DL-SCH/PCH</text>
  </g>

  <!-- ============ 三条 BG2 分支（横向排开） ============ -->
  <g filter="url(#soft)">
    <rect x="160" y="205" width="8" height="85" rx="4" fill="#3E9E74"/>
    <rect x="168" y="205" width="132" height="85" rx="10" fill="#EDF8F1" stroke="#C9D4E0" stroke-width="1.2"/>
  </g>
  <text x="234" y="236" font-size="14" font-weight="700" fill="#1B2433" text-anchor="middle">分支 1</text>
  <text x="234" y="262" font-size="12" fill="#5A6877" text-anchor="middle">A &lt;= 292</text>

  <g filter="url(#soft)">
    <rect x="430" y="205" width="8" height="85" rx="4" fill="#D18A2F"/>
    <rect x="438" y="205" width="132" height="85" rx="10" fill="#FAF0DC" stroke="#C9D4E0" stroke-width="1.2"/>
  </g>
  <text x="504" y="236" font-size="14" font-weight="700" fill="#1B2433" text-anchor="middle">分支 2</text>
  <text x="504" y="258" font-size="12" fill="#5A6877" text-anchor="middle">A &lt;= 3824 且</text>
  <text x="504" y="276" font-size="12" fill="#5A6877" text-anchor="middle">R &lt;= 0.67</text>

  <g filter="url(#soft)">
    <rect x="700" y="205" width="8" height="85" rx="4" fill="#C4553D"/>
    <rect x="708" y="205" width="132" height="85" rx="10" fill="#F9ECEA" stroke="#C9D4E0" stroke-width="1.2"/>
  </g>
  <text x="774" y="236" font-size="14" font-weight="700" fill="#1B2433" text-anchor="middle">分支 3</text>
  <text x="774" y="262" font-size="12" fill="#5A6877" text-anchor="middle">R &lt;= 0.25</text>

  <!-- ============ 输出与配置落点 ============ -->
  <g filter="url(#soft)">
    <rect x="260" y="338" width="200" height="95" rx="10" fill="#EDF8F1" stroke="#3E9E74" stroke-width="1.5"/>
  </g>
  <text x="360" y="366" font-size="14" font-weight="700" fill="#1B2433" text-anchor="middle">输出 BG2</text>
  <text x="360" y="390" font-size="12" fill="#5A6877" text-anchor="middle">短块、低码率或中小负载场景；</text>
  <text x="360" y="406" font-size="12" fill="#5A6877" text-anchor="middle">更偏稳健。</text>

  <g filter="url(#soft)">
    <rect x="540" y="338" width="200" height="95" rx="10" fill="#E7EFF9" stroke="#3B6FB5" stroke-width="1.5"/>
  </g>
  <text x="640" y="366" font-size="14" font-weight="700" fill="#1B2433" text-anchor="middle">输出 BG1</text>
  <text x="640" y="390" font-size="12" fill="#5A6877" text-anchor="middle">前三个 BG2 条件均不满足；</text>
  <text x="640" y="406" font-size="12" fill="#5A6877" text-anchor="middle">更偏长块和高吞吐。</text>

  <g filter="url(#soft)">
    <rect x="820" y="310" width="158" height="135" rx="10" fill="#F3EFF9" stroke="#8A6BBE" stroke-width="1.5"/>
  </g>
  <text x="899" y="340" font-size="14" font-weight="700" fill="#1B2433" text-anchor="middle">配置落点</text>
  <g font-size="11.5" fill="#5A6877" text-anchor="middle">
    <text x="899" y="366" text-anchor="middle">bg_id 写入描述符，</text>
    <text x="899" y="384" text-anchor="middle">选择基图表、提升规则、</text>
    <text x="899" y="402" text-anchor="middle">移位 ROM 与地址生成器。</text>
  </g>

  <!-- ============ 流程箭头 ============ -->
  <g stroke-width="1.8" fill="none">
    <path d="M 430 180 L 230 205" stroke="#5D6B80" marker-end="url(#arrow)"/>
    <path d="M 500 180 V 205" stroke="#5D6B80" marker-end="url(#arrow)"/>
    <path d="M 570 180 L 770 205" stroke="#5D6B80" marker-end="url(#arrow)"/>
    <path d="M 230 290 L 330 338" stroke="#3E9E74" marker-end="url(#arrow-green)"/>
    <path d="M 500 290 L 400 338" stroke="#D18A2F" marker-end="url(#arrow-amber)"/>
    <path d="M 770 290 L 450 338" stroke="#C4553D" marker-end="url(#arrow-red)"/>
    <path d="M 840 240 L 740 380" stroke="#3B6FB5" marker-end="url(#arrow-blue)"/>
    <path d="M 460 380 H 820" stroke="#8A6BBE" marker-end="url(#arrow-purple)"/>
    <path d="M 740 400 H 820" stroke="#8A6BBE" marker-end="url(#arrow-purple)"/>
  </g>

  <!-- 分支汇聚标注 -->
  <g font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    <rect x="205" y="300" width="70" height="26" rx="8" fill="#3E9E74"/>
    <text x="240" y="318" text-anchor="middle">任一满足</text>
    <rect x="700" y="300" width="90" height="26" rx="8" fill="#3B6FB5"/>
    <text x="745" y="318" text-anchor="middle">全部不满足</text>
  </g>

  <!-- ============ 选择条件的协议复现 ============ -->
  <g filter="url(#soft)">
    <rect x="40" y="460" width="920" height="310" rx="14" fill="#F5F7FA" stroke="#C9D4E0" stroke-width="1.5"/>
  </g>
  <text x="65" y="488" font-size="15" font-weight="700" fill="#1B2433">选择条件的协议复现</text>
  <text x="65" y="510" font-size="12" fill="#5A6877">三条 BG2 分支是逻辑 OR，只要满足任一条就选 BG2；全部不满足才选 BG1。初传和同一 TB 的后续重传使用同一个基图。</text>

  <g font-size="13" font-weight="700" fill="#1B2433" text-anchor="middle">
    <rect x="65" y="560" width="100" height="30" rx="6" fill="#DDE7F3"/>
    <text x="115" y="580" text-anchor="middle">分支</text>
    <rect x="175" y="560" width="230" height="30" rx="6" fill="#DDE7F3"/>
    <text x="290" y="580" text-anchor="middle">判定条件</text>
    <rect x="415" y="560" width="280" height="30" rx="6" fill="#DDE7F3"/>
    <text x="555" y="580" text-anchor="middle">工程含义</text>
    <rect x="705" y="560" width="140" height="30" rx="6" fill="#DDE7F3"/>
    <text x="775" y="580" text-anchor="middle">输出</text>
  </g>
  <g font-size="12.5" fill="#1B2433" text-anchor="middle">
    <rect x="65" y="590" width="780" height="42" fill="#FFFFFF"/>
    <text x="115" y="616" text-anchor="middle">1</text>
    <text x="290" y="616" text-anchor="middle">A &lt;= 292</text>
    <text x="555" y="616" text-anchor="middle">极短 payload 优先短块友好结构</text>
    <text x="775" y="616" font-weight="700" text-anchor="middle">BG2</text>
    <rect x="65" y="632" width="780" height="42" fill="#EDF2F8"/>
    <text x="115" y="658" text-anchor="middle">2</text>
    <text x="290" y="658" text-anchor="middle">A &lt;= 3824 且 R &lt;= 0.67</text>
    <text x="555" y="658" text-anchor="middle">中小 payload 且码率不高，偏稳健</text>
    <text x="775" y="658" font-weight="700" text-anchor="middle">BG2</text>
    <rect x="65" y="674" width="780" height="42" fill="#FFFFFF"/>
    <text x="115" y="700" text-anchor="middle">3</text>
    <text x="290" y="700" text-anchor="middle">R &lt;= 0.25</text>
    <text x="555" y="700" text-anchor="middle">低码率场景，即使 payload 较大也进入 BG2</text>
    <text x="775" y="700" font-weight="700" text-anchor="middle">BG2</text>
    <rect x="65" y="716" width="780" height="42" fill="#EDF2F8"/>
    <text x="115" y="742" text-anchor="middle">默认</text>
    <text x="290" y="742" text-anchor="middle">以上均不满足</text>
    <text x="555" y="742" text-anchor="middle">大 payload 或较高码率，走高吞吐长块结构</text>
    <text x="775" y="742" font-weight="700" text-anchor="middle">BG1</text>
  </g>

  <!-- ============ 边界读图与接收端落点 ============ -->
  <g filter="url(#soft)">
    <rect x="40" y="785" width="920" height="220" rx="14" fill="#FAF5E4" stroke="#D9C179" stroke-width="1.5"/>
  </g>
  <text x="65" y="813" font-size="15" font-weight="700" fill="#1B2433">边界读图与接收端落点</text>
  <g font-size="12" font-weight="700" fill="#3B6FB5">
    <text x="65" y="845">输入</text>
    <text x="245" y="845">判定路径</text>
    <text x="450" y="845">输出</text>
    <text x="540" y="845">接收端影响</text>
  </g>
  <g font-size="12.5" fill="#1B2433">
    <text x="65" y="873">A=292, R=0.90</text>
    <text x="245" y="873">满足 A &lt;= 292</text>
    <text x="450" y="873" font-weight="700">BG2</text>
    <text x="540" y="873" fill="#5A6877">短 payload 分支覆盖高码率极短块。</text>
    <text x="65" y="903">A=3824, R=0.67</text>
    <text x="245" y="903">满足 A &lt;= 3824 且 R &lt;= 0.67</text>
    <text x="450" y="903" font-weight="700">BG2</text>
    <text x="540" y="903" fill="#5A6877">两个阈值取等号仍进入 BG2。</text>
    <text x="65" y="933">A=3825, R=0.67</text>
    <text x="245" y="933">不满足前三条</text>
    <text x="450" y="933" font-weight="700">BG1</text>
    <text x="540" y="933" fill="#5A6877">只越过 A 阈值就会切到 BG1。</text>
    <text x="65" y="963">A=6000, R=0.25</text>
    <text x="245" y="963">满足 R &lt;= 0.25</text>
    <text x="450" y="963" font-weight="700">BG2</text>
    <text x="540" y="963" fill="#5A6877">低码率分支独立于 payload 大小。</text>
  </g>
</svg>
