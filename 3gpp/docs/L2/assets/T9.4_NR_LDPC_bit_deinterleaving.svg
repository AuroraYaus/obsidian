<?xml version="1.0" encoding="UTF-8"?>
<!--
  @file    T9.4_NR_LDPC_bit_deinterleaving.svg
  @brief   NR LDPC bit deinterleaving 与 LLR 放置流程教学图（手绘 SVG V2：布局与配色依据 T9.4 讲义正文语义重设计）
  @date    2026-08-04
  @note    内容保真：四步流程（demapper LLR -> deinterleaver（TS 38.212 §5.4.2.2 反向置换）
           -> rate recovery -> LDPC input）、QPSK (Qm=2, S=4) 与 16QAM (Qm=4, S=3) 的
           demapper order f 与 rate-recovery order e 矩阵（e[bS+s] = f[b+sQm]）、五个工程
           检测点（Qm 来源/bit order/buffer/bank conflict/failure），均与讲义 T9.4 正文
           及图 T9.4-1 语义一致。
           视觉设计：流程带步骤号徽章；f/e 矩阵用 lane 标签 + 双向箭头标注 inverse；
           矩阵底色：f=协议青瓷浅底、e=橄榄浅底。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1420" viewBox="0 0 1500 1420" role="img" font-family="'Noto Sans CJK SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif">
  <title>NR LDPC Bit Deinterleaving 与 LLR 放置</title>

  <defs>
    <filter id="soft" x="-10%" y="-10%" width="125%" height="135%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#4A4438" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8A8375"/>
    </marker>
  </defs>

  <!-- ============ 页头 ============ -->
  <text x="70" y="44" font-size="22" font-weight="700" class="free" fill="#23272E">NR LDPC Bit Deinterleaving 与 LLR 放置</text>
  <text x="70" y="74" font-size="13" class="free" fill="#646B76">TS 38.212 §5.4.2.2 的 bit interleaver 按 Qm 把 rate-matching 输出 e 重排成调制映射输入 f。接收端从 demapper 得到符号顺序 LLR 后，必须反向恢复 e 顺序，再交给 RV/k0 地址生成器。</text>

  <!-- ============ 面板 A：流程四步 ============ -->
  <g filter="url(#soft)">
    <rect x="60" y="130" width="1380" height="210" rx="14" fill="#F1EDE4" stroke="#CFC8B8" stroke-width="1.5"/>
  </g>
  <rect x="88" y="154" width="10" height="10" rx="3" fill="#8E3B5E"/>
  <text x="108" y="163" font-size="17" font-weight="700" fill="#23272E">接收端 bit deinterleaving 流程</text>

  <g font-size="12.5" fill="#23272E">
    <rect x="80" y="196" width="315" height="122" rx="12" fill="#F7E9EF" stroke="#8E3B5E" stroke-width="1.5"/>
    <circle cx="104" cy="222" r="13" fill="#8E3B5E"/>
    <text x="104" y="227" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">1</text>
    <text x="237" y="230" font-size="13.5" font-weight="700" text-anchor="middle">demapper LLR</text>
    <text x="98" y="266" fill="#646B76">按调制符号输出：每符号 Qm 个 LLR</text>
    <text x="98" y="288" fill="#646B76">symbol order 展平</text>
    <rect x="413" y="196" width="315" height="122" rx="12" fill="#E6F0F0" stroke="#2F6E71" stroke-width="1.5"/>
    <circle cx="437" cy="222" r="13" fill="#2F6E71"/>
    <text x="437" y="227" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">2</text>
    <text x="570" y="230" font-size="13.5" font-weight="700" text-anchor="middle">deinterleaver</text>
    <text x="431" y="266" fill="#646B76">按 TS 38.212 §5.4.2.2</text>
    <text x="431" y="288" fill="#646B76">反向置换恢复 e 序列</text>
    <rect x="746" y="196" width="315" height="122" rx="12" fill="#EFF1E2" stroke="#6C7A2E" stroke-width="1.5"/>
    <circle cx="770" cy="222" r="13" fill="#6C7A2E"/>
    <text x="770" y="227" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">3</text>
    <text x="903" y="230" font-size="13.5" font-weight="700" text-anchor="middle">rate recovery</text>
    <text x="764" y="266" fill="#646B76">恢复 e 序列后按 RV/k0</text>
    <text x="764" y="288" fill="#646B76">写回 soft_buffer[addr]</text>
    <rect x="1079" y="196" width="315" height="122" rx="12" fill="#F8EEDC" stroke="#B06F2B" stroke-width="1.5"/>
    <circle cx="1103" cy="222" r="13" fill="#B06F2B"/>
    <text x="1103" y="227" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">4</text>
    <text x="1236" y="230" font-size="13.5" font-weight="700" text-anchor="middle">LDPC input</text>
    <text x="1097" y="266" fill="#646B76">按母码位置排列的 CB LLR</text>
    <text x="1097" y="288" fill="#646B76">LLR + mask</text>
  </g>
  <g stroke="#8A8375" stroke-width="2" fill="none">
    <path d="M 395 257 H 413" marker-end="url(#arrow)"/>
    <path d="M 728 257 H 746" marker-end="url(#arrow)"/>
    <path d="M 1061 257 H 1079" marker-end="url(#arrow)"/>
  </g>

