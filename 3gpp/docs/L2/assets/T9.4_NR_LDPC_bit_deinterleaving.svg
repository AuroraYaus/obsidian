    <rect x="640" y="536" width="100" height="52" fill="#EFF1E2" stroke="#CFC8B8" stroke-width="1"/>
    <text x="690" y="560" text-anchor="middle" font-weight="700">e6</text>
    <text x="690" y="580" text-anchor="middle" fill="#646B76">=f5</text>
    <rect x="740" y="536" width="100" height="52" fill="#EFF1E2" stroke="#CFC8B8" stroke-width="1"/>
    <text x="790" y="560" text-anchor="middle" font-weight="700">e7</text>
