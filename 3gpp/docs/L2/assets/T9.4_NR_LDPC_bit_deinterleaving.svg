  </g>
  <g stroke="#8A8375" stroke-width="2" fill="none">
    <path d="M 340 606 L 410 606" marker-end="url(#arrow)"/>
  </g>
  <rect x="352" y="578" width="76" height="28" rx="6" fill="#FBFAF6" stroke="#CFC8B8" stroke-width="1"/>
  <text x="390" y="597" font-size="12" font-weight="700" text-anchor="middle" fill="#8E3B5E">inverse</text>

  <g font-size="12" fill="#23272E">
    <rect x="440" y="480" width="100" height="52" fill="#EFF1E2" stroke="#CFC8B8" stroke-width="1"/>
    <text x="490" y="504" text-anchor="middle" font-weight="700">e0</text>
    <text x="490" y="524" text-anchor="middle" fill="#646B76">=f0</text>
    <rect x="540" y="480" width="100" height="52" fill="#EFF1E2" stroke="#CFC8B8" stroke-width="1"/>
    <text x="590" y="504" text-anchor="middle" font-weight="700">e1</text>
    <text x="590" y="524" text-anchor="middle" fill="#646B76">=f2</text>
    <rect x="640" y="480" width="100" height="52" fill="#EFF1E2" stroke="#CFC8B8" stroke-width="1"/>
    <text x="690" y="504" text-anchor="middle" font-weight="700">e2</text>
    <text x="690" y="524" text-anchor="middle" fill="#646B76">=f4</text>
    <rect x="740" y="480" width="100" height="52" fill="#EFF1E2" stroke="#CFC8B8" stroke-width="1"/>
    <text x="790" y="504" text-anchor="middle" font-weight="700">e3</text>
    <text x="790" y="524" text-anchor="middle" fill="#646B76">=f6</text>
    <rect x="440" y="536" width="100" height="52" fill="#EFF1E2" stroke="#CFC8B8" stroke-width="1"/>
