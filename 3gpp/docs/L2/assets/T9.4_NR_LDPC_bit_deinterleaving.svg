  <!-- ============ 面板 D：工程检测点 ============ -->
  <g filter="url(#soft)">
    <rect x="60" y="1200" width="1380" height="190" rx="14" fill="#F8EEDC" stroke="#B06F2B" stroke-width="1.5"/>
