    <text x="1294" y="1296" text-anchor="middle" font-weight="700">failure</text>
    <text x="1184" y="1324" fill="#646B76">高 SNR 仍 CRC fail，</text>
    <text x="1184" y="1346" fill="#646B76">先查 Qm/order/codeword。</text>
