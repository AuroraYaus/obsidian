  <text x="140" y="448" font-size="13" font-weight="700" fill="#2F6E71">demapper order f</text>
  <text x="620" y="448" font-size="13" font-weight="700" fill="#6C7A2E">rate-recovery input e</text>

  <g font-size="11.5" fill="#646B76">
