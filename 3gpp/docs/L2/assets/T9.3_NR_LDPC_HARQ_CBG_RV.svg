    <text x="1100" y="736" font-weight="700">CBG0 mask=0</text>
    <text x="1100" y="758" fill="#646B76">不消费本组 LLR；缓存不变</text>
    <rect x="1080" y="790" width="320" height="70" rx="8" fill="#FFFFFF" stroke="#CFC8B8" stroke-width="1"/>
    <text x="1100" y="818" font-weight="700">CBG1 mask=1</text>
