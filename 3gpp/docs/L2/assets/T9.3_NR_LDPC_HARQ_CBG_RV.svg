    <rect x="189" y="1017" width="36" height="30" rx="6" fill="#FFFFFF" stroke="#CFC8B8" stroke-width="1.5"/>
    <text x="207" y="1038" text-anchor="middle" font-weight="700">8</text>
    <rect x="172" y="935" width="36" height="30" rx="6" fill="#FFFFFF" stroke="#CFC8B8" stroke-width="1.5"/>
    <text x="190" y="956" text-anchor="middle" font-weight="700">9</text>
    <rect x="189" y="853" width="36" height="30" rx="6" fill="#FFFFFF" stroke="#CFC8B8" stroke-width="1.5"/>
