  <text x="640" y="1154" font-size="12" class="free" fill="#6C7A2E">RV2 now: addr 3-6, addr3 repeats（饱和累加）</text>

  <!-- 接收端写回规则 -->
  <g filter="url(#soft)">
    <rect x="1060" y="640" width="360" height="560" rx="14" fill="#F8EEDC" stroke="#B06F2B" stroke-width="1.5"/>
  </g>
  <text x="1088" y="680" font-size="15" font-weight="700" fill="#23272E">接收端写回规则</text>
  <g font-size="12" fill="#23272E">
