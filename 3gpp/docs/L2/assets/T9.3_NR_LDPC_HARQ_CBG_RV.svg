    <text x="1100" y="1086" fill="#646B76">harq/tb/cbg/cb/addr 定位</text>
  </g>

  <!-- ============ 面板 C：最小调试 dump 与风险检查 ============ -->
  <g filter="url(#soft)">
    <rect x="60" y="1250" width="1380" height="410" rx="14" fill="#F0EEF4" stroke="#7A6E8E" stroke-width="1.5"/>
