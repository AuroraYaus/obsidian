  </g>
  <circle cx="330" cy="935" r="58" fill="#F1EDE4" stroke="#CFC8B8" stroke-width="1.5"/>
  <text x="330" y="929" font-size="11" text-anchor="middle" font-weight="700" fill="#23272E">CB0</text>
  <text x="330" y="945" font-size="11" text-anchor="middle" font-weight="700" fill="#23272E">保持</text>
  <text x="150" y="1130" font-size="12" class="free" fill="#2F6E71">RV0 history: addr 0-3</text>
  <text x="150" y="1154" font-size="12" class="free" fill="#646B76">本次无新 LLR，保持 RV0 结果</text>

  <!-- 右环 CB2/CBG1：cx=820 cy=950 r=130 -->
  <text x="640" y="700" font-size="13.5" font-weight="700" fill="#23272E">CB2 / CBG1: RV2 部分重传</text>
  <g font-size="11" fill="#23272E">
    <rect x="802" y="798" width="36" height="30" rx="6" fill="#E6F0F0" stroke="#2F6E71" stroke-width="1.5"/>
    <text x="820" y="819" text-anchor="middle" font-weight="700">0</text>
    <rect x="873" y="812" width="36" height="30" rx="6" fill="#E6F0F0" stroke="#2F6E71" stroke-width="1.5"/>
