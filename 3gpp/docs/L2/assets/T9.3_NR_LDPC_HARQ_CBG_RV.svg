    <rect x="679" y="1017" width="36" height="30" rx="6" fill="#FFFFFF" stroke="#CFC8B8" stroke-width="1.5"/>
    <text x="697" y="1038" text-anchor="middle" font-weight="700">8</text>
    <rect x="662" y="935" width="36" height="30" rx="6" fill="#FFFFFF" stroke="#CFC8B8" stroke-width="1.5"/>
    <text x="680" y="956" text-anchor="middle" font-weight="700">9</text>
    <rect x="679" y="853" width="36" height="30" rx="6" fill="#FFFFFF" stroke="#CFC8B8" stroke-width="1.5"/>
