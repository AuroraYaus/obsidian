  <circle cx="820" cy="935" r="58" fill="#F1EDE4" stroke="#CFC8B8" stroke-width="1.5"/>
  <text x="820" y="929" font-size="11" text-anchor="middle" font-weight="700" fill="#23272E">CB2</text>
  <text x="820" y="945" font-size="11" text-anchor="middle" font-weight="700" fill="#23272E">重传</text>
