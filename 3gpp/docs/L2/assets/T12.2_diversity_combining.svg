<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
<style>
.cjk  { font-family: "Noto Sans CJK SC", sans-serif; }
.lat  { font-family: "Noto Sans", "DejaVu Sans", sans-serif; }
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L10,4 L0,8 Z" fill="#64748b"/>
  </marker>
</defs>
<rect width="900" height="420" fill="#ffffff"/>
<text x="450" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#111827" class="cjk">分集合并（MRC）：N 条独立衰落支路 → 共轭加权求和</text>
<text x="145" y="76" text-anchor="middle" font-size="11" fill="#475569" class="cjk">N 条独立衰落支路</text>

<!-- 支路 1：h1 信道框 → y1 接收符号框 → 合并节点；权重 w1=h1* -->
<rect x="50" y="90" width="90" height="30" rx="6" ry="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="95" y="109" text-anchor="middle" font-size="13" font-weight="700" fill="#2563eb" class="lat">h₁</text>
<rect x="160" y="90" width="80" height="30" rx="6" ry="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="200" y="109" text-anchor="middle" font-size="13" font-weight="700" fill="#16a34a" class="lat">y₁</text>
<line x1="140" y1="105" x2="156" y2="105" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<line x1="240" y1="105" x2="414" y2="105" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="330" y="95" text-anchor="middle" font-size="11" fill="#b45309" class="lat">w₁ = h₁*</text>

<!-- 支路 2 -->
<rect x="50" y="180" width="90" height="30" rx="6" ry="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="95" y="199" text-anchor="middle" font-size="13" font-weight="700" fill="#2563eb" class="lat">h₂</text>
<rect x="160" y="180" width="80" height="30" rx="6" ry="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="200" y="199" text-anchor="middle" font-size="13" font-weight="700" fill="#16a34a" class="lat">y₂</text>
<line x1="140" y1="195" x2="156" y2="195" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<line x1="240" y1="195" x2="414" y2="195" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="330" y="185" text-anchor="middle" font-size="11" fill="#b45309" class="lat">w₂ = h₂*</text>

<!-- 支路 3 -->
<rect x="50" y="270" width="90" height="30" rx="6" ry="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="95" y="289" text-anchor="middle" font-size="13" font-weight="700" fill="#2563eb" class="lat">h₃</text>
<rect x="160" y="270" width="80" height="30" rx="6" ry="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="200" y="289" text-anchor="middle" font-size="13" font-weight="700" fill="#16a34a" class="lat">y₃</text>
<line x1="140" y1="285" x2="156" y2="285" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<line x1="240" y1="285" x2="414" y2="285" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="330" y="275" text-anchor="middle" font-size="11" fill="#b45309" class="lat">w₃ = h₃*</text>

<!-- 支路 4 -->
<rect x="50" y="360" width="90" height="30" rx="6" ry="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="95" y="379" text-anchor="middle" font-size="13" font-weight="700" fill="#2563eb" class="lat">h₄</text>
<rect x="160" y="360" width="80" height="30" rx="6" ry="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="200" y="379" text-anchor="middle" font-size="13" font-weight="700" fill="#16a34a" class="lat">y₄</text>
<line x1="140" y1="375" x2="156" y2="375" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<line x1="240" y1="375" x2="414" y2="375" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="330" y="365" text-anchor="middle" font-size="11" fill="#b45309" class="lat">w₄ = h₄*</text>

<!-- 合并节点：共轭加权 + 求和 -->
<rect x="420" y="90" width="220" height="300" rx="10" ry="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="530" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#b45309" class="cjk">共轭加权 + 求和</text>
<text x="530" y="355" text-anchor="middle" font-size="12" fill="#92400e" class="lat">ŝ = (Σ hᵢ*·yᵢ) / ‖h‖²</text>

<!-- 输出：ŝ -->
<line x1="640" y1="250" x2="676" y2="250" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="680" y="220" width="160" height="64" rx="8" ry="8" fill="#fdf2f8" stroke="#db2777" stroke-width="1.5"/>
<text x="760" y="255" text-anchor="middle" font-size="20" font-weight="700" fill="#db2777" class="lat">ŝ</text>
<text x="760" y="273" text-anchor="middle" font-size="10" fill="#9d174d" class="cjk">合并符号估计</text>
<text x="760" y="310" text-anchor="middle" font-size="13" fill="#1e293b" class="lat">SNR_out = ‖h‖²/σ²</text>
<text x="760" y="330" text-anchor="middle" font-size="11" fill="#475569" class="cjk">输出 SNR 等于各支路 SNR 之和</text>

<!-- 底部结论行 -->
<text x="450" y="412" text-anchor="middle" font-size="13" fill="#1e293b" class="cjk">分集阶数 N → 深衰落概率 ε^N/N!</text>
</svg>
