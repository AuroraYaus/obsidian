<?xml version="1.0" encoding="UTF-8"?>
<!--
  @file    T8.1_NR_LDPC_decoder_chain_overview.svg
  @brief   NR LDPC 接收侧译码链路总览（手绘 SVG）
  @date    2026-08-04
  @note    布局按讲义语义重排：顶部七步译码链（左侧色条节点，读图顺序从左到右）；
           中部协议锚点落点表（全宽，三列：协议锚点/对象/接收端动作）；
           底部左右并排：两码块 CB 路径示例与最小 decoder descriptor 字段集合。
           语义配色：LLR 蓝 / 速率恢复青 / 译码核琥珀 / CRC 紫 / 拼接绿 / HARQ 红；
           字号符合合规 Rule 23。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" role="img" font-family="'Noto Sans CJK SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif">
  <title>NR LDPC 接收侧译码链路总览</title>

  <defs>
    <filter id="soft" x="-10%" y="-10%" width="125%" height="135%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#334155" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5D6B80"/>
    </marker>
  </defs>

  <!-- ============ 标题 ============ -->
  <text x="35" y="34" font-size="18" font-weight="700" fill="#1B2433">NR LDPC 接收侧译码链路总览</text>
  <text x="35" y="60" font-size="12" fill="#596879">读图顺序从左到右：软解调器给出 LLR；接收端先恢复速率匹配前的 LDPC 母码位置，再译码每个 CB；</text>
  <text x="35" y="78" font-size="12" fill="#596879">CB 全部通过后拼接 TB，由 TB CRC 决定 HARQ 反馈。</text>

  <!-- ============ 七步译码链 ============ -->
  <g filter="url(#soft)">
    <rect x="22" y="95" width="8" height="115" rx="4" fill="#3B6FB5"/>
    <rect x="30" y="95" width="120" height="115" rx="10" fill="#E7EFF9" stroke="#C9D4E0" stroke-width="1.2"/>
  </g>
  <text x="90" y="126" font-size="13" font-weight="700" fill="#1B2433" text-anchor="middle">Demapper LLR</text>
  <g font-size="11.5" fill="#596879" text-anchor="middle">
    <text x="90" y="148">来自软解调</text>
    <text x="90" y="164">LLR，保留软可靠度。</text>
  </g>

  <g filter="url(#soft)">
    <rect x="152" y="95" width="8" height="115" rx="4" fill="#2E9AA6"/>
    <rect x="160" y="95" width="120" height="115" rx="10" fill="#E3F4F6" stroke="#C9D4E0" stroke-width="1.2"/>
  </g>
  <text x="220" y="126" font-size="13" font-weight="700" fill="#1B2433" text-anchor="middle">Rate recovery</text>
  <g font-size="11.5" fill="#596879" text-anchor="middle">
    <text x="220" y="148">按 RV/E/Ncb/Qm</text>
    <text x="220" y="164">回填母码环形缓存。</text>
  </g>

  <g filter="url(#soft)">
    <rect x="282" y="95" width="8" height="115" rx="4" fill="#D18A2F"/>
    <rect x="290" y="95" width="120" height="115" rx="10" fill="#FAF0DC" stroke="#C9D4E0" stroke-width="1.2"/>
  </g>
  <text x="350" y="126" font-size="13" font-weight="700" fill="#1B2433" text-anchor="middle">LDPC decoder</text>
  <g font-size="11.5" fill="#596879" text-anchor="middle">
    <text x="350" y="148">按 BG/Zc 生成 H</text>
    <text x="350" y="164">迭代更新并查</text>
    <text x="350" y="180">syndrome。</text>
  </g>

  <g filter="url(#soft)">
    <rect x="412" y="95" width="8" height="115" rx="4" fill="#8A6BBE"/>
    <rect x="420" y="95" width="120" height="115" rx="10" fill="#F0EBF9" stroke="#C9D4E0" stroke-width="1.2"/>
  </g>
  <text x="480" y="126" font-size="13" font-weight="700" fill="#1B2433" text-anchor="middle">CB CRC</text>
  <g font-size="11.5" fill="#596879" text-anchor="middle">
    <text x="480" y="148">逐 CB 判断；失败则</text>
    <text x="480" y="164">保留 HARQ 软信息。</text>
  </g>

  <g filter="url(#soft)">
    <rect x="542" y="95" width="8" height="115" rx="4" fill="#3E9E74"/>
    <rect x="550" y="95" width="120" height="115" rx="10" fill="#E5F4ED" stroke="#C9D4E0" stroke-width="1.2"/>
  </g>
  <text x="610" y="126" font-size="13" font-weight="700" fill="#1B2433" text-anchor="middle">CB concat</text>
  <g font-size="11.5" fill="#596879" text-anchor="middle">
    <text x="610" y="148">按 CB 序号拼接，</text>
    <text x="610" y="164">不能按完成时间。</text>
  </g>

  <g filter="url(#soft)">
    <rect x="672" y="95" width="8" height="115" rx="4" fill="#8A6BBE"/>
    <rect x="680" y="95" width="120" height="115" rx="10" fill="#F0EBF9" stroke="#C9D4E0" stroke-width="1.2"/>
  </g>
  <text x="740" y="126" font-size="13" font-weight="700" fill="#1B2433" text-anchor="middle">TB CRC</text>
  <g font-size="11.5" fill="#596879" text-anchor="middle">
    <text x="740" y="148">整 TB 终检，决定</text>
    <text x="740" y="164">交付边界。</text>
  </g>

  <g filter="url(#soft)">
    <rect x="802" y="95" width="8" height="115" rx="4" fill="#C4553D"/>
    <rect x="810" y="95" width="120" height="115" rx="10" fill="#F9ECEA" stroke="#C9D4E0" stroke-width="1.2"/>
  </g>
  <text x="870" y="126" font-size="13" font-weight="700" fill="#1B2433" text-anchor="middle">HARQ/CBG</text>
  <g font-size="11.5" fill="#596879" text-anchor="middle">
    <text x="870" y="148">输出 ACK/NACK</text>
    <text x="870" y="164">管理 CBG 重传和</text>
    <text x="870" y="180">soft buffer。</text>
  </g>

  <g stroke="#5D6B80" stroke-width="1.8" fill="none">
    <path d="M 150 152 H 160" marker-end="url(#arrow)"/>
    <path d="M 280 152 H 290" marker-end="url(#arrow)"/>
    <path d="M 410 152 H 420" marker-end="url(#arrow)"/>
    <path d="M 540 152 H 550" marker-end="url(#arrow)"/>
    <path d="M 670 152 H 680" marker-end="url(#arrow)"/>
    <path d="M 800 152 H 810" marker-end="url(#arrow)"/>
  </g>

  <!-- ============ 协议锚点落点表（全宽） ============ -->
  <g filter="url(#soft)">
    <rect x="35" y="230" width="930" height="240" rx="14" fill="#F5F7FA" stroke="#C9D4E0" stroke-width="1.5"/>
  </g>
  <text x="55" y="258" font-size="15" font-weight="700" fill="#1B2433">协议锚点如何落到接收端动作</text>
  <g font-size="12" font-weight="700" fill="#1F3A5F" text-anchor="middle">
    <rect x="55" y="285" width="200" height="26" rx="6" fill="#DDE7F3"/>
    <text x="155" y="303">协议锚点</text>
    <rect x="255" y="285" width="225" height="26" rx="6" fill="#DDE7F3"/>
    <text x="367" y="303">对象</text>
    <rect x="480" y="285" width="465" height="26" rx="6" fill="#DDE7F3"/>
    <text x="712" y="303">接收端动作</text>
  </g>
  <g font-size="12">
    <text x="55" y="339" font-weight="700" fill="#3B6FB5">TS 38.212 §5.2.2</text>
    <text x="255" y="339" fill="#1B2433">CB segmentation / CB CRC / filler</text>
    <text x="480" y="339" fill="#596879">确定 C、Kr、CB CRC 和 filler 删除边界</text>
    <text x="55" y="377" font-weight="700" fill="#3B6FB5">TS 38.212 §5.3.2</text>
    <text x="255" y="377" fill="#1B2433">LDPC coding / BG / Zc / H</text>
    <text x="480" y="377" fill="#596879">确定译码器必须使用的校验结构</text>
    <text x="55" y="415" font-weight="700" fill="#3B6FB5">TS 38.212 §5.4.2</text>
    <text x="255" y="415" fill="#1B2433">bit selection / interleaving</text>
    <text x="480" y="415" fill="#596879">确定顺序 LLR 如何回到环形缓存</text>
    <text x="55" y="453" font-weight="700" fill="#3B6FB5">TS 38.212 §6.2 / §7.2</text>
    <text x="255" y="453" fill="#1B2433">UL-SCH / DL-SCH 链路</text>
    <text x="480" y="453" fill="#596879">确定 TB CRC、BG 选择、分段、编码、rate matching、拼接顺序</text>
  </g>

  <!-- ============ 左：两个码块的接收侧路径示例 ============ -->
  <g filter="url(#soft)">
    <rect x="35" y="490" width="555" height="210" rx="14" fill="#F8FAFD" stroke="#C9D4E0" stroke-width="1.5"/>
  </g>
  <text x="55" y="518" font-size="15" font-weight="700" fill="#1B2433">两个码块的接收侧路径示例</text>
  <text x="55" y="540" font-size="12" fill="#596879">TB 先被分成 CB0 和 CB1；接收端分别做速率恢复、LDPC 译码和 CB CRC。</text>
  <text x="55" y="556" font-size="12" fill="#596879">两个 CB 都通过后，才按 r=0,1 的顺序拼接并检查 TB CRC。</text>
  <g font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    <rect x="55" y="588" width="76" height="26" rx="8" fill="#3E9E74"/>
    <text x="93" y="606">CB0 pass</text>
    <rect x="139" y="588" width="76" height="26" rx="8" fill="#3E9E74"/>
    <text x="177" y="606">CB1 pass</text>
    <rect x="223" y="588" width="122" height="26" rx="8" fill="#3B6FB5"/>
    <text x="284" y="606">concat r order</text>
    <rect x="353" y="588" width="61" height="26" rx="8" fill="#8A6BBE"/>
    <text x="383" y="606">TB CRC</text>
    <rect x="422" y="588" width="76" height="26" rx="8" fill="#C4553D"/>
    <text x="460" y="606">ACK/NACK</text>
  </g>
  <text x="55" y="644" font-size="12" font-weight="700" fill="#1B2433">失败定位入口</text>
  <g font-size="12" fill="#596879">
    <circle cx="62" cy="662" r="4" fill="#C4553D"/>
    <text x="74" y="666">速率恢复地址错</text>
    <circle cx="62" cy="684" r="4" fill="#C4553D"/>
    <text x="74" y="688">BG/Zc 配置错</text>
    <circle cx="330" cy="662" r="4" fill="#C4553D"/>
    <text x="342" y="666">LDPC 不收敛</text>
    <circle cx="330" cy="684" r="4" fill="#C4553D"/>
    <text x="342" y="688">CB/TB CRC 边界错</text>
  </g>

  <!-- ============ 右：最小 decoder descriptor v0 ============ -->
  <g filter="url(#soft)">
    <rect x="610" y="490" width="355" height="210" rx="14" fill="#FAF5E4" stroke="#D9C179" stroke-width="1.5"/>
  </g>
  <text x="630" y="518" font-size="15" font-weight="700" fill="#1B2433">最小 decoder descriptor v0</text>
  <text x="630" y="540" font-size="11.5" fill="#596879">这些字段不是同一个协议表里的连续列，而是接收端把</text>
  <text x="630" y="556" font-size="11.5" fill="#596879">TS 38.212 的编码链路和 TS 38.214 的调度背景</text>
  <text x="630" y="572" font-size="11.5" fill="#596879">汇合成可执行译码任务时必须携带的上下文。</text>
  <g font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    <rect x="630" y="600" width="32" height="26" rx="8" fill="#3B6FB5"/>
    <text x="646" y="618">BG</text>
    <rect x="670" y="600" width="32" height="26" rx="8" fill="#3B6FB5"/>
    <text x="686" y="618">Zc</text>
    <rect x="775" y="600" width="56" height="26" rx="8" fill="#C4553D"/>
    <text x="803" y="618">rvidx</text>
    <rect x="839" y="600" width="32" height="26" rx="8" fill="#3E9E74"/>
    <text x="855" y="618">E</text>
    <rect x="630" y="634" width="48" height="26" rx="8" fill="#3E9E74"/>
    <text x="654" y="652">Ncb</text>
    <rect x="686" y="634" width="32" height="26" rx="8" fill="#8A6BBE"/>
    <text x="702" y="652">Qm</text>
    <rect x="775" y="634" width="32" height="26" rx="8" fill="#8A6BBE"/>
    <text x="791" y="652">C</text>
    <rect x="815" y="634" width="56" height="26" rx="8" fill="#72839B"/>
    <text x="843" y="652">cb_id</text>
    <rect x="630" y="668" width="48" height="26" rx="8" fill="#72839B"/>
    <text x="654" y="686">CRC</text>
    <rect x="686" y="668" width="54" height="26" rx="8" fill="#72839B"/>
    <text x="713" y="686">HARQ</text>
    <rect x="775" y="668" width="64" height="26" rx="8" fill="#C4553D"/>
    <text x="807" y="686">CBGTI</text>
  </g>
</svg>
