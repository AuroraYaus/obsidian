<?xml version="1.0" encoding="UTF-8"?>
<!--
  @file    T0.1_LTE_NR_decoder_protocol_reading_map.svg
  @brief   LTE/NR 译码协议阅读地图（T0.1 讲义主图，手绘 SVG 替代 Mermaid 渲染 PNG）
  @date    2026-08-04
  @note    语义配色与 docs/L0/T0.1_LTE_NR_decoder_protocol_reading_map.md 的
           Mermaid 源图一致：protocol 蓝 / receiver 白 / LTE 橙 / NR 绿 /
           NR 控制蓝 / evidence 紫 / engineering 黄。
           布局：主脊（协议源 -> 接收端对象 -> 三主线 -> 工程落点）
           + 右侧证据链（协议源 -> 证据闭环 -> 工程落点，右缘下行绕开三主线）。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="990" viewBox="0 0 1180 990" role="img" font-family="'Noto Sans CJK SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif">
  <title>LTE/NR 译码协议阅读地图</title>

  <defs>
    <!-- 盒子柔和阴影 -->
    <filter id="soft" x="-10%" y="-10%" width="125%" height="135%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#334155" flood-opacity="0.14"/>
    </filter>
    <!-- 箭头（终点实心三角） -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5B6B82"/>
    </marker>
  </defs>

  <!-- ============ 第一层：协议源（左）与证据闭环（右） ============ -->
  <!-- 协议源 SRC：x 60..760，y 40..250 -->
  <g filter="url(#soft)">
    <rect x="60" y="40" width="700" height="210" rx="12" fill="#EAF1FB" stroke="#2457A6" stroke-width="1.5"/>
  </g>
  <rect x="90" y="75" width="12" height="12" rx="3" fill="#2457A6"/>
  <text x="112" y="88" font-size="20" font-weight="700" fill="#152033">协议源</text>
  <line x1="90" y1="104" x2="730" y2="104" stroke="#2457A6" stroke-opacity="0.25" stroke-width="1"/>
  <g font-size="13" fill="#152033">
    <rect x="90"  y="128" width="310" height="38" rx="8" fill="#FFFFFF" stroke="#B9CBEA" stroke-width="1"/>
    <text x="106" y="153">TS 36/38.211 · 调制映射</text>
    <rect x="430" y="128" width="310" height="38" rx="8" fill="#FFFFFF" stroke="#B9CBEA" stroke-width="1"/>
    <text x="446" y="153">TS 36/38.212 · 信道编码</text>
    <rect x="90"  y="176" width="310" height="38" rx="8" fill="#FFFFFF" stroke="#B9CBEA" stroke-width="1"/>
    <text x="106" y="201">TS 36/38.213/214 · 调度</text>
    <rect x="430" y="176" width="310" height="38" rx="8" fill="#FFFFFF" stroke="#B9CBEA" stroke-width="1"/>
    <text x="446" y="201">TS 36/38.321/331 · 上下文</text>
  </g>

  <!-- 证据闭环 EVI：x 800..1140，y 40..250 -->
  <g filter="url(#soft)">
    <rect x="800" y="40" width="340" height="210" rx="12" fill="#F1EDFF" stroke="#6E55A4" stroke-width="1.5"/>
  </g>
  <rect x="830" y="75" width="12" height="12" rx="3" fill="#6E55A4"/>
  <text x="852" y="88" font-size="20" font-weight="700" fill="#152033">证据闭环</text>
  <line x1="852" y1="104" x2="1110" y2="104" stroke="#6E55A4" stroke-opacity="0.25" stroke-width="1"/>
  <g font-size="13" fill="#152033">
    <rect x="830" y="122" width="290" height="30" rx="7" fill="#FFFFFF" stroke="#C9BEE8" stroke-width="1"/>
    <text x="844" y="143">本地 content.md、sections.jsonl</text>
    <rect x="830" y="160" width="290" height="30" rx="7" fill="#FFFFFF" stroke="#C9BEE8" stroke-width="1"/>
    <text x="844" y="181">tables/html/csv、equations/media</text>
    <rect x="830" y="198" width="290" height="30" rx="7" fill="#FFFFFF" stroke="#C9BEE8" stroke-width="1"/>
    <text x="844" y="219">audit logs</text>
  </g>

  <!-- ============ 第二层：接收端对象 ============ -->
  <!-- RX：x 140..700，y 340..440 -->
  <g filter="url(#soft)">
    <rect x="140" y="340" width="560" height="100" rx="12" fill="#FFFFFF" stroke="#AAB7C8" stroke-width="1.5"/>
  </g>
  <rect x="170" y="371" width="12" height="12" rx="3" fill="#7A8BA0"/>
  <text x="192" y="384" font-size="20" font-weight="700" fill="#152033">接收端对象</text>
  <g font-size="12.5" fill="#152033">
    <rect x="184" y="408" width="35"  height="24" rx="6" fill="#FFFFFF" stroke="#C7D0DB" stroke-width="1"/>
    <text x="192" y="425">LLR</text>
    <rect x="225" y="408" width="35"  height="24" rx="6" fill="#FFFFFF" stroke="#C7D0DB" stroke-width="1"/>
    <text x="233" y="425">CRC</text>
    <rect x="266" y="408" width="47"  height="24" rx="6" fill="#FFFFFF" stroke="#C7D0DB" stroke-width="1"/>
    <text x="274" y="425">TB/CB</text>
    <rect x="319" y="408" width="54"  height="24" rx="6" fill="#FFFFFF" stroke="#C7D0DB" stroke-width="1"/>
    <text x="327" y="425">filler</text>
    <rect x="379" y="408" width="29"  height="24" rx="6" fill="#FFFFFF" stroke="#C7D0DB" stroke-width="1"/>
    <text x="387" y="425">RV</text>
    <rect x="414" y="408" width="85"  height="24" rx="6" fill="#FFFFFF" stroke="#C7D0DB" stroke-width="1"/>
    <text x="422" y="425">soft buffer</text>
    <rect x="505" y="408" width="79"  height="24" rx="6" fill="#FFFFFF" stroke="#C7D0DB" stroke-width="1"/>
    <text x="513" y="425">descriptor</text>
    <rect x="590" y="408" width="66"  height="24" rx="6" fill="#FFFFFF" stroke="#C7D0DB" stroke-width="1"/>
    <text x="598" y="425">evidence</text>
  </g>

  <!-- ============ 第三层：三条译码主线 ============ -->
  <!-- LTE 主线：x 60..380，y 530..740 -->
  <g filter="url(#soft)">
    <rect x="60" y="530" width="320" height="210" rx="12" fill="#FFF0E6" stroke="#B65B2E" stroke-width="1.5"/>
  </g>
  <rect x="90" y="563" width="12" height="12" rx="3" fill="#B65B2E"/>
  <text x="112" y="576" font-size="20" font-weight="700" fill="#152033">LTE 主线</text>
  <line x1="90" y1="592" x2="350" y2="592" stroke="#B65B2E" stroke-opacity="0.25" stroke-width="1"/>
  <text x="90" y="620" font-size="15" font-weight="700" fill="#152033">Turbo 数据译码</text>
  <g font-size="13" fill="#152033">
    <rect x="90" y="640" width="280" height="30" rx="7" fill="#FFFFFF" stroke="#E7C0A6" stroke-width="1"/>
    <text x="104" y="661">TS 36.212 §5.1.3.2</text>
    <rect x="90" y="678" width="280" height="30" rx="7" fill="#FFFFFF" stroke="#E7C0A6" stroke-width="1"/>
    <text x="104" y="699">rate recovery 与 HARQ</text>
  </g>

  <!-- NR 数据主线：x 400..720，y 530..740 -->
  <g filter="url(#soft)">
    <rect x="400" y="530" width="320" height="210" rx="12" fill="#E8F6EF" stroke="#236B5A" stroke-width="1.5"/>
  </g>
  <rect x="430" y="563" width="12" height="12" rx="3" fill="#236B5A"/>
  <text x="452" y="576" font-size="20" font-weight="700" fill="#152033">NR 数据主线</text>
  <line x1="430" y1="592" x2="690" y2="592" stroke="#236B5A" stroke-opacity="0.25" stroke-width="1"/>
  <text x="430" y="620" font-size="15" font-weight="700" fill="#152033">LDPC 数据译码</text>
  <g font-size="13" fill="#152033">
    <rect x="430" y="640" width="280" height="30" rx="7" fill="#FFFFFF" stroke="#A9D3C2" stroke-width="1"/>
    <text x="444" y="661">TS 38.212 §5.3.2</text>
    <rect x="430" y="678" width="280" height="30" rx="7" fill="#FFFFFF" stroke="#A9D3C2" stroke-width="1"/>
    <text x="444" y="699">BG/Zc/rate recovery</text>
  </g>

  <!-- NR 控制主线：x 740..1060，y 530..740 -->
  <g filter="url(#soft)">
    <rect x="740" y="530" width="320" height="210" rx="12" fill="#EAF1FB" stroke="#2457A6" stroke-width="1.5"/>
  </g>
  <rect x="770" y="563" width="12" height="12" rx="3" fill="#2457A6"/>
  <text x="792" y="576" font-size="20" font-weight="700" fill="#152033">NR 控制主线</text>
  <line x1="770" y1="592" x2="1030" y2="592" stroke="#2457A6" stroke-opacity="0.25" stroke-width="1"/>
  <text x="770" y="620" font-size="15" font-weight="700" fill="#152033">Polar 控制译码</text>
  <g font-size="13" fill="#152033">
    <rect x="770" y="640" width="280" height="30" rx="7" fill="#FFFFFF" stroke="#B9CBEA" stroke-width="1"/>
    <text x="784" y="661">TS 38.212 §5.3.1</text>
    <rect x="770" y="678" width="280" height="30" rx="7" fill="#FFFFFF" stroke="#B9CBEA" stroke-width="1"/>
    <text x="784" y="699">SC/SCL/CRC aided</text>
  </g>

  <!-- ============ 第四层：工程落点 ============ -->
  <!-- ENG：x 160..940，y 830..950 -->
  <g filter="url(#soft)">
    <rect x="160" y="830" width="780" height="120" rx="12" fill="#FFF6DD" stroke="#B9841A" stroke-width="1.5"/>
  </g>
  <rect x="190" y="863" width="12" height="12" rx="3" fill="#B9841A"/>
  <text x="212" y="876" font-size="20" font-weight="700" fill="#152033">工程落点</text>
  <line x1="212" y1="892" x2="910" y2="892" stroke="#B9841A" stroke-opacity="0.25" stroke-width="1"/>
  <g font-size="13" fill="#152033">
    <rect x="212" y="902" width="340" height="32" rx="8" fill="#FFFFFF" stroke="#E8CF9C" stroke-width="1"/>
    <text x="228" y="924">浮点模型、定点模型、RTL/ASIC</text>
    <rect x="570" y="902" width="340" height="32" rx="8" fill="#FFFFFF" stroke="#E8CF9C" stroke-width="1"/>
    <text x="586" y="924">testbench、coverage、sign-off 模板</text>
  </g>

  <!-- ============ 箭头（9 条，语义与 Mermaid 源图一致） ============ -->
  <g stroke="#5B6B82" stroke-width="2" fill="none">
    <!-- 协议源 -> 接收端对象 -->
    <path d="M 420 250 V 340" marker-end="url(#arrow)"/>
    <!-- 协议源 -> 证据闭环 -->
    <path d="M 760 145 H 800" marker-end="url(#arrow)"/>
    <!-- 接收端对象 -> 三条主线（三叉） -->
    <path d="M 420 440 V 485 H 220 V 530" marker-end="url(#arrow)"/>
    <path d="M 420 440 V 485 H 560 V 530" marker-end="url(#arrow)"/>
    <path d="M 420 440 V 485 H 900 V 530" marker-end="url(#arrow)"/>
    <!-- 证据闭环 -> 工程落点（右缘下行，绕开三主线） -->
    <path d="M 970 250 V 890 H 940" marker-end="url(#arrow)"/>
    <!-- 三条主线 -> 工程落点（汇聚） -->
    <path d="M 220 740 V 830" marker-end="url(#arrow)"/>
    <path d="M 560 740 V 830" marker-end="url(#arrow)"/>
    <path d="M 900 740 V 830" marker-end="url(#arrow)"/>
  </g>

  <!-- ============ 箭头语义标注（白描边防压线） ============ -->
  <g font-size="12" fill="#5B6B82" stroke="#FFFFFF" stroke-width="5" paint-order="stroke">
    <text x="432" y="302">翻译为接收端对象</text>
    <text x="560" y="470" text-anchor="middle">按对象选择 decoder core</text>
  </g>
</svg>
