<?xml version="1.0" encoding="UTF-8"?>
<!--
  @file    T9.2_NR_LDPC_circular_buffer_states.svg
  @brief   NR LDPC circular buffer 三类位置状态的环形结构图（重绘版）
  @date    2026-08-04
  @note    重绘原因：旧版环形格内含 12 个 LLR 数值且含"错误对照与工程检测点"
           四列表格；按项目原则数值与对照数据由讲义 Markdown 承载（T9.2 正文
           已有 12 位置最终 LLR 数组、逐项更新表、mask 数组与错误对照表），
           本图只画结构：环形 12 格状态布局（底色表达状态类别）、三类状态语义
           卡、接收端动作链四步、三类位置的写回决策链。状态语义色：
           observed=石板、unknown=浅灰、shortened=琥珀、repeated=LDPC 橄榄。
           依据 T2.1 基准图规格。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" role="img">
  <title>NR LDPC circular buffer 三类位置状态</title>
  <rect width="960" height="700" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B7C"/>
    </marker>
  </defs>
  <style>
    .title { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 18px; font-weight: bold; fill: #111; }
    .label { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 14px; font-weight: bold; fill: #222; }
    .small { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 12px; fill: #333; }
    .note  { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 11px; fill: #5C6B7C; }
    .cell  { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 10px; font-weight: bold; fill: #333; }
  </style>
  <text x="40" y="24" class="title">NR LDPC circular buffer：三类位置的状态结构</text>
  <text x="40" y="39" class="small">12 位置最终 LLR、逐项更新表、mask 与错误对照由讲义 T9.2 表格承载</text>
  <line x1="40" y1="46" x2="920" y2="46" stroke="#C4CC9E" stroke-width="1.5"/>

  <!-- ============ 面板 1：环形 12 格 ============ -->
  <rect x="40" y="49" width="460" height="353" rx="10" fill="#FBFAF6" stroke="#5C6B7C" stroke-width="1.5"/>
  <text x="58" y="96" class="label">同一条 circular buffer 上的 12 个位置</text>
  <circle cx="250" cy="225" r="88" fill="none" stroke="#C9D4E0" stroke-width="1.6"/>
  <rect x="232.0" y="108.0" width="36" height="28" rx="5" fill="#EDF2F8" stroke="#5C6B7C" stroke-width="1.4"/>
<text x="250.0" y="126.0" text-anchor="middle" class="cell">0</text>
<rect x="283.5" y="121.8" width="36" height="28" rx="5" fill="#F3F4F6" stroke="#9AA4B0" stroke-width="1.4"/>
<text x="301.5" y="139.8" text-anchor="middle" class="cell">1</text>
<rect x="321.2" y="159.5" width="36" height="28" rx="5" fill="#FDF3E4" stroke="#C9972E" stroke-width="1.4"/>
<text x="339.2" y="177.5" text-anchor="middle" class="cell">2</text>
<rect x="335.0" y="211.0" width="36" height="28" rx="5" fill="#EFF1E2" stroke="#6C7A2E" stroke-width="1.4"/>
<text x="353.0" y="229.0" text-anchor="middle" class="cell">3</text>
<rect x="321.2" y="262.5" width="36" height="28" rx="5" fill="#EDF2F8" stroke="#5C6B7C" stroke-width="1.4"/>
<text x="339.2" y="280.5" text-anchor="middle" class="cell">4</text>
<rect x="283.5" y="300.2" width="36" height="28" rx="5" fill="#F3F4F6" stroke="#9AA4B0" stroke-width="1.4"/>
<text x="301.5" y="318.2" text-anchor="middle" class="cell">5</text>
<rect x="232.0" y="314.0" width="36" height="28" rx="5" fill="#FDF3E4" stroke="#C9972E" stroke-width="1.4"/>
<text x="250.0" y="332.0" text-anchor="middle" class="cell">6</text>
<rect x="180.5" y="300.2" width="36" height="28" rx="5" fill="#EDF2F8" stroke="#5C6B7C" stroke-width="1.4"/>
<text x="198.5" y="318.2" text-anchor="middle" class="cell">7</text>
<rect x="142.8" y="262.5" width="36" height="28" rx="5" fill="#EFF1E2" stroke="#6C7A2E" stroke-width="1.4"/>
<text x="160.8" y="280.5" text-anchor="middle" class="cell">8</text>
<rect x="129.0" y="211.0" width="36" height="28" rx="5" fill="#F3F4F6" stroke="#9AA4B0" stroke-width="1.4"/>
<text x="147.0" y="229.0" text-anchor="middle" class="cell">9</text>
<rect x="142.8" y="159.5" width="36" height="28" rx="5" fill="#EDF2F8" stroke="#5C6B7C" stroke-width="1.4"/>
<text x="160.8" y="177.5" text-anchor="middle" class="cell">10</text>
<rect x="180.5" y="121.8" width="36" height="28" rx="5" fill="#EDF2F8" stroke="#5C6B7C" stroke-width="1.4"/>
<text x="198.5" y="139.8" text-anchor="middle" class="cell">11</text>

  <rect x="216" y="212" width="68" height="26" rx="6" fill="#FFFFFF" stroke="#C9D4E0" stroke-width="1.2"/>
  <text x="250" y="230" text-anchor="middle" class="small">环形缓存</text>
  <text x="58" y="360" class="note">格子底色 = 状态类别（含义见图例）；地址沿环递增，位置 11 之后回到 0</text>
  <text x="58" y="382" class="note">每个位置的 LLR 数值与写回明细由讲义 12 位置表承载</text>

  <!-- ============ 面板 2：三类状态语义 ============ -->
  <rect x="520" y="72" width="400" height="330" rx="10" fill="#FBFAF6" stroke="#5C6B7C" stroke-width="1.5"/>
  <text x="538" y="96" class="label">三类状态的语义</text>
  <rect x="538" y="116" width="364" height="64" rx="8" fill="#FFFFFF" stroke="#9AA4B0" stroke-width="1.2"/>
  <rect x="554" y="128" width="14" height="14" rx="3" fill="#F3F4F6" stroke="#9AA4B0" stroke-width="1.2"/>
  <text x="578" y="140" class="small">punctured / unknown：没有观测</text>
  <text x="578" y="164" class="note">LLR=0 表示无证据，不是业务 0；unknown_mask=1</text>
  <rect x="538" y="196" width="364" height="64" rx="8" fill="#FFFFFF" stroke="#C9972E" stroke-width="1.2"/>
  <rect x="554" y="208" width="14" height="14" rx="3" fill="#FDF3E4" stroke="#C9972E" stroke-width="1.2"/>
  <text x="578" y="220" class="small">shortened / filler：协议已知约束</text>
  <text x="578" y="244" class="note">强正 LLR 或 known_mask 固定；不消耗 rx LLR</text>
  <rect x="538" y="276" width="364" height="64" rx="8" fill="#FFFFFF" stroke="#6C7A2E" stroke-width="1.2"/>
  <rect x="554" y="288" width="14" height="14" rx="3" fill="#EFF1E2" stroke="#6C7A2E" stroke-width="1.2"/>
  <text x="578" y="300" class="small">repeated：同一位置多次观测</text>
  <text x="578" y="324" class="note">旧 LLR + 新 LLR 累加，定点实现需饱和</text>
  <text x="538" y="368" class="note">unknown 无证据、known 是约束、repeat 是多次证据</text>
  <text x="538" y="390" class="note">三者语义不可互相替代</text>

  <!-- ============ 面板 3：接收端动作链 ============ -->
  <rect x="40" y="422" width="880" height="140" rx="10" fill="#FBFAF6" stroke="#5C6B7C" stroke-width="1.5"/>
  <text x="58" y="446" class="label">接收端动作链</text>
  <rect x="56" y="462" width="196" height="84" rx="8" fill="#FFFFFF" stroke="#5C6B7C" stroke-width="1.3"/>
  <text x="72" y="486" class="small">1. 地址流</text>
  <text x="72" y="510" class="note">RV/k0/Ncb 生成候选地址</text>
  <text x="72" y="530" class="note">地址流是一切的基础</text>
  <rect x="276" y="462" width="196" height="84" rx="8" fill="#FFFFFF" stroke="#5C6B7C" stroke-width="1.3"/>
  <text x="292" y="486" class="small">2. 掩码检查</text>
  <text x="292" y="510" class="note">打孔 / 缩短 / 已观测</text>
  <text x="292" y="530" class="note">三类掩码不可互换</text>
  <rect x="496" y="462" width="196" height="84" rx="8" fill="#FFFFFF" stroke="#5C6B7C" stroke-width="1.3"/>
  <text x="512" y="486" class="small">3. LLR 动作</text>
  <text x="512" y="510" class="note">0 / 强约束 / 饱和累加</text>
  <text x="512" y="530" class="note">未知中性、已知强约束</text>
  <rect x="716" y="462" width="196" height="84" rx="8" fill="#FFFFFF" stroke="#5C6B7C" stroke-width="1.3"/>
  <text x="732" y="486" class="small">4. LDPC 输入</text>
  <text x="732" y="510" class="note">LLR 与 mask 必须成对</text>
  <text x="732" y="530" class="note">数值与掩码一起交付</text>
  <path d="M 252 504 L 272 504" stroke="#5C6B7C" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 472 504 L 492 504" stroke="#5C6B7C" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 692 504 L 712 504" stroke="#5C6B7C" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ============ 面板 4：写回决策链 ============ -->
  <rect x="40" y="582" width="880" height="100" rx="10" fill="#FBFAF6" stroke="#5C6B7C" stroke-width="1.5"/>
  <text x="58" y="606" class="label">三类位置的写回决策（逐项数值见讲义表）</text>
  <rect x="56" y="622" width="250" height="46" rx="8" fill="#F3F4F6" stroke="#9AA4B0" stroke-width="1.2"/>
  <text x="72" y="642" class="small">unknown：写入中性 0</text>
  <text x="72" y="660" class="note">unknown_mask=1 标记无证据</text>
  <rect x="326" y="622" width="250" height="46" rx="8" fill="#FDF3E4" stroke="#C9972E" stroke-width="1.2"/>
  <text x="342" y="642" class="small">shortened：强约束固定</text>
  <text x="342" y="660" class="note">known_mask=1，不消耗 rx LLR</text>
  <rect x="596" y="622" width="250" height="46" rx="8" fill="#EFF1E2" stroke="#6C7A2E" stroke-width="1.2"/>
  <text x="612" y="642" class="small">repeated：sat(旧 + 新)</text>
  <text x="612" y="660" class="note">重复计数与饱和计数入日志</text>
</svg>
