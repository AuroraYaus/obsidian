<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="arrowGray" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#8A8F98"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2F6DB3"/>
    </marker>
  </defs>

  <!-- 标题区 -->
  <text x="500" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#17212F" class="free">16QAM 单符号软解调：LLR 先验偏置示意</text>
  <text x="500" y="64" text-anchor="middle" font-size="16" fill="#3A4658" class="free">接收点 y=(2.2, 0.5)/√10 落在内、外圈之间而更靠外圈——均匀先验判外圈，MB 先验判内圈</text>
  <text x="500" y="92" text-anchor="middle" font-size="14" fill="#3A4658" class="free">圆大小 ∝ MB 先验权重 P(s) ∝ e^(−ν̃|s|²)：内圈 0.776 / 边点 0.281 / 角点 0.102（ν=0.127，即 ν̃=1.27）</text>
  <text x="500" y="114" text-anchor="middle" font-size="14" fill="#3A4658" class="free">★ 接收点 y（幅度坐标）　灰色虚线箭头：均匀先验 LLR 方向（判外圈 b2=1）　蓝色实线箭头：MB 先验修正方向（判内圈 b2=0）</text>

  <!-- 坐标轴（幅度坐标 ±1, ±3，比例 62 px/单位，原点 (500,400)） -->
  <line x1="314" y1="400" x2="686" y2="400" stroke="#D8DEE6" stroke-width="1"/>
  <line x1="500" y1="214" x2="500" y2="586" stroke="#D8DEE6" stroke-width="1"/>

  <!-- 16QAM 星座点：圆半径 ∝ MB 先验权重（内圈 r15 / 边点 r9 / 角点 r5.5） -->
  <!-- 内圈 |s|²=0.2 -->
  <circle cx="438" cy="338" r="15" fill="#CFE3F8" stroke="#2F6DB3" stroke-width="1.6"/>
  <circle cx="562" cy="338" r="15" fill="#CFE3F8" stroke="#2F6DB3" stroke-width="1.6"/>
  <circle cx="438" cy="462" r="15" fill="#CFE3F8" stroke="#2F6DB3" stroke-width="1.6"/>
  <circle cx="562" cy="462" r="15" fill="#CFE3F8" stroke="#2F6DB3" stroke-width="1.6"/>
  <!-- 边点 |s|²=1.0 -->
  <circle cx="438" cy="214" r="9" fill="#E5EEF9" stroke="#5A87C1" stroke-width="1.4"/>
  <circle cx="562" cy="214" r="9" fill="#E5EEF9" stroke="#5A87C1" stroke-width="1.4"/>
  <circle cx="438" cy="586" r="9" fill="#E5EEF9" stroke="#5A87C1" stroke-width="1.4"/>
  <circle cx="562" cy="586" r="9" fill="#E5EEF9" stroke="#5A87C1" stroke-width="1.4"/>
  <circle cx="314" cy="338" r="9" fill="#E5EEF9" stroke="#5A87C1" stroke-width="1.4"/>
  <circle cx="686" cy="338" r="9" fill="#E5EEF9" stroke="#5A87C1" stroke-width="1.4"/>
  <circle cx="314" cy="462" r="9" fill="#E5EEF9" stroke="#5A87C1" stroke-width="1.4"/>
  <circle cx="686" cy="462" r="9" fill="#E5EEF9" stroke="#5A87C1" stroke-width="1.4"/>
  <!-- 角点 |s|²=1.8 -->
  <circle cx="314" cy="214" r="5.5" fill="#F2F6FC" stroke="#8AA6C4" stroke-width="1.2"/>
  <circle cx="686" cy="214" r="5.5" fill="#F2F6FC" stroke="#8AA6C4" stroke-width="1.2"/>
  <circle cx="314" cy="586" r="5.5" fill="#F2F6FC" stroke="#8AA6C4" stroke-width="1.2"/>
  <circle cx="686" cy="586" r="5.5" fill="#F2F6FC" stroke="#8AA6C4" stroke-width="1.2"/>

  <!-- 接收点 y=(2.2, 0.5)/√10 → (636, 369) -->
  <polygon points="636,355 641,365 652,365 643,371 646,382 636,376 626,382 629,371 620,365 631,365"
        fill="#D64541" stroke="#B03530" stroke-width="1"/>
  <text x="646" y="392" font-size="13" fill="#B03530" class="free">y</text>

  <!-- 均匀先验 LLR 方向：指向外圈边点 (3,1)/√10 = (686,338) -->
  <line x1="630" y1="366" x2="678" y2="344" stroke="#8A8F98" stroke-width="2.2"
        stroke-dasharray="7,5" marker-end="url(#arrowGray)"/>
  <!-- MB 先验修正方向：指向内圈点 (1,1)/√10 = (562,338) -->
  <line x1="630" y1="366" x2="574" y2="342" stroke="#2F6DB3" stroke-width="2.6"
        marker-end="url(#arrowBlue)"/>

  <!-- 箭头说明（画布左右两侧空白区） -->
  <text x="708" y="300" font-size="14" fill="#5A6070" class="free">均匀先验：距离主导</text>
  <text x="708" y="320" font-size="14" fill="#5A6070" class="free">外圈被判更可信（LLR −0.39）</text>
  <text x="150" y="300" font-size="14" fill="#2F6DB3" class="free">MB 先验：外圈权重被压低</text>
  <text x="150" y="320" font-size="14" fill="#2F6DB3" class="free">LLR 回摆判内圈（+0.63）</text>

  <!-- 底部结论区 -->
  <text x="500" y="640" text-anchor="middle" font-size="14" fill="#17212F" class="free">幅度位 b2（位 3）：均匀先验 LLR = −0.39（判外圈）→ MB 先验 +0.63（判内圈）；先验偏置 ΔLLR = +1.016 nats = 8ν（与接收点无关）</text>
  <text x="500" y="662" text-anchor="middle" font-size="14" fill="#3A4658" class="free">sign 位近似不变：b1 偏移仅 −0.03 nats（先验只依赖幅度，± 镜像候选权重相同）——修正集中在幅度位</text>
</svg>
