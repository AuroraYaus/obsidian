<?xml version="1.0" encoding="UTF-8"?>
<!--
  @file    T7.3_LTE_HARQ_RV_windows.svg
  @brief   LTE HARQ 四个冗余版本在循环缓存（ring buffer）上的窗口结构（重绘版）
  @date    2026-08-04
  @note    重绘原因：旧版含 soft buffer 更新表与四轮传输对照表两张数据表格；
           按项目原则数据/对比表格由讲义 Markdown 承载（T7.3 正文已有 LLR 流
           映射与写回规则表，本次补充 32 环四轮覆盖统计表），本图只保留结构：
           同一环上的四个 RV 窗口、LLR 流到环地址的映射关系、接收端写回动作
           四规则与工程检查点。教学参数 Kw=32、E=11、k0=0/8/16/24。语义配色：
           Turbo 赭金 #B06F2B 四档区分 RV0-RV3。依据 T2.1 基准图规格。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720" role="img">
  <title>LTE HARQ 冗余版本：同一环上的四个读取窗口</title>
  <rect width="960" height="720" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B06F2B"/>
    </marker>
  </defs>
  <style>
    .title { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 18px; font-weight: bold; fill: #111; }
    .label { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 14px; font-weight: bold; fill: #222; }
    .small { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 12px; fill: #333; }
    .note  { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 11px; fill: #5C6B7C; }
    .chip  { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 12px; font-weight: bold; fill: #222; }
  </style>
  <text x="40" y="28" class="title">LTE HARQ 冗余版本：同一环上的四个读取窗口</text>
  <text x="40" y="50" class="small">教学参数 Kw=32、E=11、k0=0/8/16/24；地址明细与四轮覆盖统计由讲义表格承载</text>
  <line x1="40" y1="62" x2="920" y2="62" stroke="#E8C795" stroke-width="1.5"/>

  <!-- ============ 面板 A：环与四个 RV 窗口 ============ -->
  <rect x="40" y="72" width="445" height="390" rx="10" fill="#FDF8F1" stroke="#B06F2B" stroke-width="1.5"/>
  <text x="58" y="96" class="label">四个 RV 是同一环上的窗口选择</text>
  <circle cx="250" cy="270" r="90" fill="none" stroke="#C98F4E" stroke-width="1.6"/>
  
    <path d="M 250.0 173.0 A 97 97 0 0 1 339.6 307.1" stroke="#B06F2B" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M 347.0 270.0 A 97 97 0 0 1 212.9 359.6" stroke="#C98F4E" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M 250.0 367.0 A 97 97 0 0 1 160.4 232.9" stroke="#8D5A1E" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M 153.0 270.0 A 97 97 0 0 1 231.1 174.9" stroke="#E0B87F" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M 250.0 173.0 A 97 97 0 0 0 287.1 180.4" stroke="#E0B87F" stroke-width="6" fill="none" stroke-linecap="round"/>

  <circle cx="250.0" cy="180.0" r="5" fill="#FBEED9" stroke="#C98F4E" stroke-width="1.2"/><circle cx="267.6" cy="181.7" r="5" fill="#FBEED9" stroke="#C98F4E" stroke-width="1.2"/><circle cx="284.4" cy="186.9" r="5" fill="#FBEED9" stroke="#C98F4E" stroke-width="1.2"/><circle cx="300.0" cy="195.2" r="5" fill="#FBEED9" stroke="#C98F4E" stroke-width="1.2"/><circle cx="313.6" cy="206.4" r="5" fill="#FBEED9" stroke="#C98F4E" stroke-width="1.2"/><circle cx="324.8" cy="220.0" r="5" fill="#FBEED9" stroke="#C98F4E" stroke-width="1.2"/><circle cx="333.1" cy="235.6" r="5" fill="#FBEED9" stroke="#C98F4E" stroke-width="1.2"/><circle cx="338.3" cy="252.4" r="5" fill="#FBEED9" stroke="#C98F4E" stroke-width="1.2"/><circle cx="340.0" cy="270.0" r="5" fill="#FBEED9" stroke="#C98F4E" stroke-width="1.2"/><circle cx="338.3" cy="287.6" r="5" fill="#FBEED9" stroke="#C98F4E" stroke-width="1.2"/><circle cx="333.1" cy="304.4" r="5" fill="#FBEED9" stroke="#C98F4E" stroke-width="1.2"/><circle cx="324.8" cy="320.0" r="5" fill="#FBEED9" stroke="#C98F4E" stroke-width="1.2"/><circle cx="313.6" cy="333.6" r="5" fill="#FBEED9" stroke="#C98F4E" stroke-width="1.2"/><circle cx="300.0" cy="344.8" r="5" fill="#FBEED9" stroke="#C98F4E" stroke-width="1.2"/><circle cx="284.4" cy="353.1" r="5" fill="#FBEED9" stroke="#C98F4E" stroke-width="1.2"/><circle cx="267.6" cy="358.3" r="5" fill="#FBEED9" stroke="#C98F4E" stroke-width="1.2"/><circle cx="250.0" cy="360.0" r="5" fill="#FBEED9" stroke="#C98F4E" stroke-width="1.2"/><circle cx="232.4" cy="358.3" r="5" fill="#FBEED9" stroke="#C98F4E" stroke-width="1.2"/><circle cx="215.6" cy="353.1" r="5" fill="#FBEED9" stroke="#C98F4E" stroke-width="1.2"/><circle cx="200.0" cy="344.8" r="5" fill="#FBEED9" stroke="#C98F4E" stroke-width="1.2"/><circle cx="186.4" cy="333.6" r="5" fill="#FBEED9" stroke="#C98F4E" stroke-width="1.2"/><circle cx="175.2" cy="320.0" r="5" fill="#FBEED9" stroke="#C98F4E" stroke-width="1.2"/><circle cx="166.9" cy="304.4" r="5" fill="#FBEED9" stroke="#C98F4E" stroke-width="1.2"/><circle cx="161.7" cy="287.6" r="5" fill="#FBEED9" stroke="#C98F4E" stroke-width="1.2"/><circle cx="160.0" cy="270.0" r="5" fill="#FBEED9" stroke="#C98F4E" stroke-width="1.2"/><circle cx="161.7" cy="252.4" r="5" fill="#FBEED9" stroke="#C98F4E" stroke-width="1.2"/><circle cx="166.9" cy="235.6" r="5" fill="#FBEED9" stroke="#C98F4E" stroke-width="1.2"/><circle cx="175.2" cy="220.0" r="5" fill="#FBEED9" stroke="#C98F4E" stroke-width="1.2"/><circle cx="186.4" cy="206.4" r="5" fill="#FBEED9" stroke="#C98F4E" stroke-width="1.2"/><circle cx="200.0" cy="195.2" r="5" fill="#FBEED9" stroke="#C98F4E" stroke-width="1.2"/><circle cx="215.6" cy="186.9" r="5" fill="#FBEED9" stroke="#C98F4E" stroke-width="1.2"/><circle cx="232.4" cy="181.7" r="5" fill="#FBEED9" stroke="#C98F4E" stroke-width="1.2"/>
  <circle cx="250.0" cy="180.0" r="7" fill="#B06F2B"/><circle cx="340.0" cy="270.0" r="7" fill="#C98F4E"/><circle cx="250.0" cy="360.0" r="7" fill="#8D5A1E"/><circle cx="160.0" cy="270.0" r="7" fill="#E0B87F"/>
  <rect x="208" y="256" width="84" height="26" rx="6" fill="#FFFFFF" stroke="#C98F4E" stroke-width="1.2"/>
  <text x="250" y="274" text-anchor="middle" class="small">ring buffer</text>
  <text x="58" y="352" class="note">环上 32 个位置点：地址沿环递增，到末尾回到 0</text>
  <text x="58" y="372" class="note">四段弧 = 四个读取窗口；圆点 = 各 RV 起点 k0</text>

  <rect x="175" y="104" width="92" height="26" rx="6" fill="#B06F2B"/>
  <text x="221" y="122" text-anchor="middle" class="chip" fill="#FFFFFF">RV0 k0=0</text>
  <rect x="356" y="257" width="76" height="26" rx="6" fill="#C98F4E"/>
  <text x="394" y="275" text-anchor="middle" class="chip" fill="#FFFFFF">RV1 k0=8</text>
  <rect x="204" y="380" width="92" height="26" rx="6" fill="#8D5A1E"/>
  <text x="250" y="398" text-anchor="middle" class="chip" fill="#FFFFFF">RV2 k0=16</text>
  <rect x="44" y="257" width="76" height="26" rx="6" fill="#E0B87F"/>
  <text x="82" y="275" text-anchor="middle" class="chip" fill="#FFFFFF">RV3 k0=24</text>

  <rect x="56" y="412" width="14" height="14" rx="3" fill="#B06F2B"/>
  <text x="78" y="423" class="small">RV0：初传常见起点</text>
  <rect x="56" y="438" width="14" height="14" rx="3" fill="#8D5A1E"/>
  <text x="78" y="449" class="small">RV2：继续覆盖新区</text>
  <rect x="308" y="412" width="14" height="14" rx="3" fill="#C98F4E"/>
  <text x="330" y="423" class="small">RV1：从另一段开始</text>
  <rect x="308" y="438" width="14" height="14" rx="3" fill="#E0B87F"/>
  <text x="330" y="449" class="small">RV3：跨环尾回到 0</text>

  <!-- ============ 面板 B：LLR 流与环地址映射 ============ -->
  <rect x="505" y="72" width="415" height="390" rx="10" fill="#F5F8F2" stroke="#5C6B7C" stroke-width="1.5"/>
  <text x="523" y="96" class="label">LLR 流与环地址映射（RV1 示例）</text>
  <text x="523" y="120" class="small">软解调器输出顺序 LLR 流；写回必须按 rvidx/k0 恢复环地址</text>
  
    <rect x="540" y="150" width="76" height="30" rx="6" fill="#FFFFFF" stroke="#C98F4E" stroke-width="1.3"/>
    <text x="578" y="170" text-anchor="middle" class="chip">L0</text>
    <line x1="616" y1="165" x2="772" y2="165" stroke="#C98F4E" stroke-width="1.6" marker-end="url(#arrow)"/>
    <rect x="776" y="150" width="76" height="30" rx="6" fill="#FDF3E4" stroke="#B06F2B" stroke-width="1.3"/>
    <text x="814" y="170" text-anchor="middle" class="chip">a=8</text>
    <rect x="540" y="210" width="76" height="30" rx="6" fill="#FFFFFF" stroke="#C98F4E" stroke-width="1.3"/>
    <text x="578" y="230" text-anchor="middle" class="chip">L5</text>
    <line x1="616" y1="225" x2="772" y2="225" stroke="#C98F4E" stroke-width="1.6" marker-end="url(#arrow)"/>
    <rect x="776" y="210" width="76" height="30" rx="6" fill="#FDF3E4" stroke="#B06F2B" stroke-width="1.3"/>
    <text x="814" y="230" text-anchor="middle" class="chip">a=13</text>
    <rect x="540" y="270" width="76" height="30" rx="6" fill="#FFFFFF" stroke="#C98F4E" stroke-width="1.3"/>
    <text x="578" y="290" text-anchor="middle" class="chip">L10</text>
    <line x1="616" y1="285" x2="772" y2="285" stroke="#C98F4E" stroke-width="1.6" marker-end="url(#arrow)"/>
    <rect x="776" y="270" width="76" height="30" rx="6" fill="#FDF3E4" stroke="#B06F2B" stroke-width="1.3"/>
    <text x="814" y="290" text-anchor="middle" class="chip">a=18</text>
  <text x="523" y="340" class="small">流序号 i 不能当作环地址 a：按流序号合并会破坏重传增益</text>
  <text x="523" y="366" class="note">&lt;NULL&gt; 位置跳过；窗口重叠处做饱和累加（逐项数值见讲义表）</text>
  <text x="523" y="404" class="note">日志须同时保存 LLR 流序号与环地址两组索引</text>

  <!-- ============ 面板 C：写回动作四规则 ============ -->
  <rect x="40" y="486" width="880" height="150" rx="10" fill="#FDF8F1" stroke="#B06F2B" stroke-width="1.5"/>
  <text x="58" y="510" class="label">接收端写回动作：按环地址区分四种情形</text>
  <rect x="56" y="528" width="196" height="92" rx="8" fill="#FFFFFF" stroke="#C98F4E" stroke-width="1.2"/>
  <text x="72" y="550" class="small">首次命中：写入</text>
  <text x="72" y="572" class="note">旧值中性 0，写入本次 LLR</text>
  <rect x="276" y="528" width="196" height="92" rx="8" fill="#FFFFFF" stroke="#C98F4E" stroke-width="1.2"/>
  <text x="292" y="550" class="small">重复命中：累加</text>
  <text x="292" y="572" class="note">sat(旧 LLR + 新 LLR)</text>
  <text x="292" y="592" class="note">定点实现必须饱和</text>
  <rect x="496" y="528" width="196" height="92" rx="8" fill="#FFFFFF" stroke="#C98F4E" stroke-width="1.2"/>
  <text x="512" y="550" class="small">未命中：保持</text>
  <text x="512" y="572" class="note">保持旧值，不凭空生成</text>
  <rect x="716" y="528" width="196" height="92" rx="8" fill="#FFFFFF" stroke="#C98F4E" stroke-width="1.2"/>
  <text x="732" y="550" class="small">&lt;NULL&gt;：跳过</text>
  <text x="732" y="572" class="note">非编码位，不消费 LLR</text>

  <!-- ============ 检查点 ============ -->
  <rect x="40" y="656" width="880" height="52" rx="10" fill="#F5F8F2" stroke="#5C6B7C" stroke-width="1.2"/>
  <text x="58" y="685" class="small">检查点：k0、E、命中地址、新覆盖数、重复覆盖数、饱和次数、CRC 结果均须入日志（四轮统计见讲义表）</text>
</svg>
