<?xml version="1.0" encoding="UTF-8"?>
<!--
  @file    T8.3_NR_LDPC_toy_QC_expansion.svg
  @brief   QC-LDPC 玩具基矩阵展开示例（手绘 SVG）
  @date    2026-08-04
  @note    布局按讲义语义重排：上排左基矩阵 B（2x3，-1 为零矩阵、非负数为循环移位值）、
           上排右展开后的 H（Zc=4，8x12，每 4x4 子块按移位值填充循环 1，标签 P^p / zero）；
           下排"读图要点"横带收纳五条要点。绿色圆点表示子块内的 1（教学示意），
           0 是有效移位值；字号符合合规 Rule 23。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420" role="img" font-family="'Noto Sans CJK SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif">
  <title>QC-LDPC 玩具基矩阵展开示例</title>

  <defs>
    <filter id="soft" x="-10%" y="-10%" width="125%" height="135%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#334155" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- ============ 标题 ============ -->
  <text x="35" y="30" font-size="18" font-weight="700" fill="#1B2433" class="free">QC-LDPC 玩具基矩阵展开示例</text>
  <text x="35" y="56" font-size="12" fill="#5B6877" class="free">基矩阵元素 -1 表示零矩阵；非负数 p 表示把 Zc x Zc 单位矩阵向右循环移位 p 次。</text>
  <text x="35" y="74" font-size="12" fill="#5B6877" class="free">这里取 Zc=4，把 2x3 基矩阵展开为 8x12 的完整奇偶校验矩阵 H。</text>

  <!-- ============ 基矩阵 B ============ -->
  <text x="40" y="110" font-size="14" font-weight="700" fill="#3B6FB5" class="free">基矩阵 B</text>
  <g font-size="13" font-weight="700" fill="#1B2433" text-anchor="middle">
    <rect x="40" y="122" width="52" height="38" fill="#FAF0DC" stroke="#C9D4E0" stroke-width="1.2"/>
    <text x="66" y="147" font-size="13" font-weight="700" text-anchor="middle">0</text>
    <rect x="92" y="122" width="52" height="38" fill="#EDF1F6" stroke="#C9D4E0" stroke-width="1.2"/>
    <text x="118" y="147" font-size="13" font-weight="700" text-anchor="middle">-1</text>
    <rect x="144" y="122" width="52" height="38" fill="#FAF0DC" stroke="#C9D4E0" stroke-width="1.2"/>
    <text x="170" y="147" font-size="13" font-weight="700" text-anchor="middle">2</text>
    <rect x="40" y="160" width="52" height="38" fill="#FAF0DC" stroke="#C9D4E0" stroke-width="1.2"/>
    <text x="66" y="185" font-size="13" font-weight="700" text-anchor="middle">1</text>
    <rect x="92" y="160" width="52" height="38" fill="#FAF0DC" stroke="#C9D4E0" stroke-width="1.2"/>
    <text x="118" y="185" font-size="13" font-weight="700" text-anchor="middle">0</text>
    <rect x="144" y="160" width="52" height="38" fill="#EDF1F6" stroke="#C9D4E0" stroke-width="1.2"/>
    <text x="170" y="185" font-size="13" font-weight="700" text-anchor="middle">-1</text>
  </g>

  <!-- ============ 展开后的 H ============ -->
  <text x="240" y="110" font-size="14" font-weight="700" fill="#3E9E74" class="free">展开后的 H</text>

  <!-- 六个 4x4 子块（块边框 + 网格描边用 line 绘制：块内圆点是矩阵 1 标记的
       自由数据点，子块边框若用 rect 会因 12px 格心与 r=4 的几何关系产生 R10 贴边误报） -->
  <g stroke-width="1.5">
    <line x1="240" y1="122" x2="288" y2="122" stroke="#D18A2F"/>
    <line x1="240" y1="122" x2="240" y2="170" stroke="#D18A2F"/>
    <line x1="288" y1="122" x2="288" y2="170" stroke="#D18A2F"/>
    <line x1="240" y1="170" x2="288" y2="170" stroke="#D18A2F"/>
    <line x1="288" y1="122" x2="336" y2="122" stroke="#C4553D"/>
    <line x1="288" y1="122" x2="288" y2="170" stroke="#C4553D"/>
    <line x1="336" y1="122" x2="336" y2="170" stroke="#C4553D"/>
    <line x1="288" y1="170" x2="336" y2="170" stroke="#C4553D"/>
    <line x1="336" y1="122" x2="384" y2="122" stroke="#D18A2F"/>
    <line x1="336" y1="122" x2="336" y2="170" stroke="#D18A2F"/>
    <line x1="384" y1="122" x2="384" y2="170" stroke="#D18A2F"/>
    <line x1="336" y1="170" x2="384" y2="170" stroke="#D18A2F"/>
    <line x1="240" y1="170" x2="288" y2="170" stroke="#D18A2F"/>
    <line x1="240" y1="170" x2="240" y2="218" stroke="#D18A2F"/>
    <line x1="288" y1="170" x2="288" y2="218" stroke="#D18A2F"/>
    <line x1="240" y1="218" x2="288" y2="218" stroke="#D18A2F"/>
    <line x1="288" y1="170" x2="336" y2="170" stroke="#D18A2F"/>
    <line x1="288" y1="170" x2="288" y2="218" stroke="#D18A2F"/>
    <line x1="336" y1="170" x2="336" y2="218" stroke="#D18A2F"/>
    <line x1="288" y1="218" x2="336" y2="218" stroke="#D18A2F"/>
    <line x1="336" y1="170" x2="384" y2="170" stroke="#C4553D"/>
    <line x1="336" y1="170" x2="336" y2="218" stroke="#C4553D"/>
    <line x1="384" y1="170" x2="384" y2="218" stroke="#C4553D"/>
    <line x1="336" y1="218" x2="384" y2="218" stroke="#C4553D"/>
  </g>
  <g stroke="#D4DEE8" stroke-width="1">
    <line x1="252" y1="122" x2="252" y2="170"/>
    <line x1="264" y1="122" x2="264" y2="170"/>
    <line x1="276" y1="122" x2="276" y2="170"/>
    <line x1="252" y1="134" x2="288" y2="134"/>
    <line x1="252" y1="146" x2="288" y2="146"/>
    <line x1="252" y1="158" x2="288" y2="158"/>
    <line x1="300" y1="122" x2="300" y2="170"/>
    <line x1="312" y1="122" x2="312" y2="170"/>
    <line x1="324" y1="122" x2="324" y2="170"/>
    <line x1="300" y1="134" x2="336" y2="134"/>
    <line x1="300" y1="146" x2="336" y2="146"/>
    <line x1="300" y1="158" x2="336" y2="158"/>
    <line x1="348" y1="122" x2="348" y2="170"/>
    <line x1="360" y1="122" x2="360" y2="170"/>
    <line x1="372" y1="122" x2="372" y2="170"/>
    <line x1="348" y1="134" x2="384" y2="134"/>
    <line x1="348" y1="146" x2="384" y2="146"/>
    <line x1="348" y1="158" x2="384" y2="158"/>
    <line x1="252" y1="170" x2="252" y2="218"/>
    <line x1="264" y1="170" x2="264" y2="218"/>
    <line x1="276" y1="170" x2="276" y2="218"/>
    <line x1="252" y1="182" x2="288" y2="182"/>
    <line x1="252" y1="194" x2="288" y2="194"/>
    <line x1="252" y1="206" x2="288" y2="206"/>
    <line x1="300" y1="170" x2="300" y2="218"/>
    <line x1="312" y1="170" x2="312" y2="218"/>
    <line x1="324" y1="170" x2="324" y2="218"/>
    <line x1="300" y1="182" x2="336" y2="182"/>
    <line x1="300" y1="194" x2="336" y2="194"/>
    <line x1="300" y1="206" x2="336" y2="206"/>
    <line x1="348" y1="170" x2="348" y2="218"/>
    <line x1="360" y1="170" x2="360" y2="218"/>
    <line x1="372" y1="170" x2="372" y2="218"/>
    <line x1="348" y1="182" x2="384" y2="182"/>
    <line x1="348" y1="194" x2="384" y2="194"/>
    <line x1="348" y1="206" x2="384" y2="206"/>
  </g>

  <!-- 循环移位 1 标记（圆点） -->
  <g fill="#3E9E74">
    <circle cx="246" cy="128" r="4"/><circle cx="258" cy="140" r="4"/><circle cx="270" cy="152" r="4"/><circle cx="282" cy="164" r="4"/>
    <circle cx="366" cy="128" r="4"/><circle cx="378" cy="140" r="4"/><circle cx="342" cy="152" r="4"/><circle cx="354" cy="164" r="4"/>
    <circle cx="258" cy="176" r="4"/><circle cx="270" cy="188" r="4"/><circle cx="282" cy="200" r="4"/><circle cx="246" cy="212" r="4"/>
    <circle cx="294" cy="176" r="4"/><circle cx="306" cy="188" r="4"/><circle cx="318" cy="200" r="4"/><circle cx="330" cy="212" r="4"/>
  </g>

  <!-- 子块标签（白底胶囊；避开本块内的 1 标记位置） -->
  <g font-size="8.5" font-weight="700" text-anchor="middle">
    <rect x="255" y="125" width="25" height="14" rx="3" fill="#FFFFFF"/>
    <text x="267.5" y="136" fill="#D18A2F" font-size="8.5" font-weight="700" text-anchor="middle">P^0</text>
    <rect x="301" y="125" width="27" height="14" rx="3" fill="#FFFFFF"/>
    <text x="314.5" y="136" fill="#C4553D" font-size="8.5" font-weight="700" text-anchor="middle">zero</text>
    <rect x="344" y="132" width="25" height="14" rx="3" fill="#FFFFFF"/>
    <text x="356.5" y="143" fill="#D18A2F" font-size="8.5" font-weight="700" text-anchor="middle">P^2</text>
    <rect x="252" y="194" width="25" height="14" rx="3" fill="#FFFFFF"/>
    <text x="264.5" y="205" fill="#D18A2F" font-size="8.5" font-weight="700" text-anchor="middle">P^1</text>
    <rect x="303" y="181" width="25" height="14" rx="3" fill="#FFFFFF"/>
    <text x="315.5" y="192" fill="#D18A2F" font-size="8.5" font-weight="700" text-anchor="middle">P^0</text>
    <rect x="357" y="181" width="27" height="14" rx="3" fill="#FFFFFF"/>
    <text x="370.5" y="192" fill="#C4553D" font-size="8.5" font-weight="700" text-anchor="middle">zero</text>
  </g>

  <!-- ============ 读图要点（下排横带） ============ -->
  <g filter="url(#soft)">
    <rect x="35" y="250" width="790" height="150" rx="14" fill="#F5F7FA" stroke="#C9D4E0" stroke-width="1.5"/>
  </g>
  <text x="58" y="278" font-size="15" font-weight="700" fill="#1B2433">读图要点</text>
  <g font-size="12" fill="#5B6877">
    <text x="58" y="306">-1 不是 shift=-1，而是整个 Zc x Zc 子块全为 0。</text>
    <text x="430" y="306">0 是有效 shift value，表示不移位的单位矩阵。</text>
    <text x="58" y="336">p=2 表示每一行的 1 向右循环移动 2 格。</text>
    <text x="330" y="336">真实 NR 不保存完整 H，而保存 BG 表、iLS、Zc 和移位值。</text>
    <text x="58" y="366">地址生成器只需做模 Zc 加法，即可找到循环移位后的列地址。</text>
  </g>
</svg>
