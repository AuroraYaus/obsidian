<?xml version="1.0" encoding="UTF-8"?>
<!--
  @file    T8.8_LDPC_numeric_walkthrough_part2.svg
  @brief   Toy LDPC 数值走读（二）：Posterior 合成、早停与调试字段结构（重绘版）
  @date    2026-08-04
  @note    重绘原因：旧版含 VN posterior 合成数值表（sum/Lpost/hard1 六行）与
           "调试字段与真实 NR 对应关系"三列表；按项目原则数值由讲义 Markdown
           承载（T8.8 正文已有 posterior 逐项表与调试字段说明），本图只画结构：
           VN 合成器拓扑、syndrome 早停判定链、最小调试字段四卡。
           语义配色：LDPC 橄榄 #6C7A2E，风险石榴 #A6403C 用于校验失败。
           依据 T2.1 基准图规格。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img">
  <title>Posterior 合成、早停与调试字段结构</title>
  <rect width="960" height="560" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6C7A2E"/>
    </marker>
  </defs>
  <style>
    .title {{ font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 18px; font-weight: bold; fill: #111; }}
    .label {{ font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 14px; font-weight: bold; fill: #222; }}
    .small {{ font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 12px; fill: #333; }}
    .note  {{ font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 11px; fill: #5C6B7C; }}
    .chip  {{ font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 11px; font-weight: bold; fill: #333; }}
  </style>
  <text x="40" y="28" class="title">Toy LDPC 数值走读（二）：Posterior 合成、早停与调试字段</text>
  <text x="40" y="50" class="small">posterior 逐项数值、hard1、syndrome 与 dump 数值由讲义 T8.8 表格承载</text>
  <line x1="40" y1="62" x2="920" y2="62" stroke="#C4CC9E" stroke-width="1.5"/>

  <!-- ============ 面板 1：VN posterior 合成结构 ============ -->
  <rect x="40" y="72" width="430" height="400" rx="10" fill="#F5F8F2" stroke="#6C7A2E" stroke-width="1.5"/>
  <text x="58" y="96" class="label">VN posterior 合成结构（6 个 VN 同理）</text>
  <rect x="56" y="170" width="140" height="32" rx="6" fill="#FFFFFF" stroke="#6C7A2E" stroke-width="1.3"/>
  <text x="126" y="191" text-anchor="middle" class="small">channel LLR</text>
  <rect x="56" y="230" width="140" height="32" rx="6" fill="#FFFFFF" stroke="#6C7A2E" stroke-width="1.3"/>
  <text x="126" y="251" text-anchor="middle" class="small">CN 消息（多条）</text>
  <rect x="216" y="190" width="120" height="56" rx="8" fill="#EDF2E2" stroke="#6C7A2E" stroke-width="1.5"/>
  <text x="276" y="214" text-anchor="middle" class="small">求和</text>
  <text x="276" y="234" text-anchor="middle" class="note">sum = Lpost</text>
  <rect x="356" y="180" width="110" height="32" rx="6" fill="#FFFFFF" stroke="#6C7A2E" stroke-width="1.3"/>
  <text x="411" y="201" text-anchor="middle" class="small">Lpost</text>
  <rect x="356" y="240" width="110" height="32" rx="6" fill="#FFFFFF" stroke="#6C7A2E" stroke-width="1.3"/>
  <text x="411" y="261" text-anchor="middle" class="small">hard</text>
  <path d="M 196 186 L 216 200" stroke="#6C7A2E" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 196 246 L 216 232" stroke="#6C7A2E" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 336 200 L 356 196" stroke="#6C7A2E" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 411 212 L 411 240" stroke="#6C7A2E" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="58" y="330" class="note">hard 逐位取 Lpost 的符号（L≥0 判 0）</text>
  <text x="58" y="352" class="note">6 个 VN 的 sum / Lpost / hard1 数值见讲义 posterior 表</text>
  <text x="58" y="374" class="note">更新后 hard1 与 syndrome=[0,0,0] 的逐位结果见讲义</text>
  <text x="58" y="396" class="note">v3 只有一条 CN 消息时仍按同一合成规则</text>

  <!-- ============ 面板 2：早停判定链 ============ -->
  <rect x="490" y="72" width="430" height="400" rx="10" fill="#F5F8F2" stroke="#6C7A2E" stroke-width="1.5"/>
  <text x="508" y="96" class="label">更新后判决与 syndrome 早停判定</text>
  <rect x="510" y="130" width="390" height="56" rx="8" fill="#FFFFFF" stroke="#6C7A2E" stroke-width="1.3"/>
  <text x="526" y="154" class="small">hard1 更新</text>
  <text x="526" y="176" class="note">按 Lpost 符号逐位判决</text>
  <path d="M 705 186 L 705 202" stroke="#6C7A2E" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="510" y="202" width="390" height="56" rx="8" fill="#FFFFFF" stroke="#6C7A2E" stroke-width="1.3"/>
  <text x="526" y="226" class="small">syndrome 检查</text>
  <text x="526" y="248" class="note">H·x^T 模 2，全零才满足 LDPC 约束</text>
  <path d="M 705 258 L 705 274" stroke="#6C7A2E" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="510" y="274" width="390" height="56" rx="8" fill="#EDF2E2" stroke="#6C7A2E" stroke-width="1.4"/>
  <text x="526" y="298" class="small">全零 → syndrome early stop</text>
  <text x="526" y="320" class="note">toy 译码器可提前停止迭代</text>
  <text x="508" y="360" class="note">非零 → 继续下一轮迭代（回到 CN/VN 消息更新）</text>
  <rect x="510" y="384" width="390" height="56" rx="8" fill="#EDF1F6" stroke="#5C6B7C" stroke-width="1.3"/>
  <text x="526" y="408" class="small">真实链路：CRC 边界</text>
  <text x="526" y="430" class="note">syndrome 收敛 ≠ 交付成功；以 CB/TB CRC 为准</text>
</svg>
