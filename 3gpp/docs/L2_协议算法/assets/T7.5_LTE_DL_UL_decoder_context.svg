<?xml version="1.0" encoding="UTF-8"?>
<!--
  @file    T7.5_LTE_DL_UL_decoder_context.svg
  @brief   LTE DL-SCH 与 UL-SCH 译码器上下文与 soft buffer namespace 对比图（手绘 SVG）
  @date    2026-08-04
  @note    布局按讲义语义重排：顶部"可共享"横带先点明 Turbo core 复用边界，其下
           左右并排 DL-SCH（UE 侧，蓝）与 UL-SCH（eNB 侧，绿）两条流水线
           （demapper -> descriptor -> soft buffer key -> shared Turbo core），
           底部负例演示 UL key 缺少 UE context 时 UE17/UE18 的 LLR 碰撞。
           语义配色：DL 蓝系、UL 绿系、风险红；字号符合合规 Rule 23。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="850" viewBox="0 0 1000 850" role="img" font-family="'Noto Sans CJK SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif">
  <title>LTE DL-SCH 与 UL-SCH：同一 Turbo core，不同 soft buffer namespace</title>

  <defs>
    <filter id="soft" x="-10%" y="-10%" width="125%" height="135%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#334155" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5D6B80"/>
    </marker>
  </defs>

  <!-- ============ 标题 ============ -->
  <text x="35" y="34" font-size="18" font-weight="700" fill="#1B2433" class="free">LTE DL-SCH 与 UL-SCH：同一 Turbo core，不同 soft buffer namespace</text>
  <text x="35" y="60" font-size="12" fill="#5A6A7A" class="free">读图顺序：左边是 UE 接收下行，右边是 eNB 接收上行。两条链路都进入 shared Turbo core，但进入 soft buffer 前的</text>
  <text x="35" y="78" font-size="12" fill="#5A6A7A" class="free">key 不同；UL 必须包含 UE context，否则多 UE 会命中同一缓存。</text>

  <!-- ============ 顶部：可共享横带 ============ -->
  <g filter="url(#soft)">
    <rect x="35" y="100" width="930" height="45" rx="10" fill="#FAF5E4" stroke="#D9C179" stroke-width="1.5"/>
  </g>
  <text x="55" y="129" font-size="13" font-weight="700" fill="#1B2433">可共享</text>
  <text x="110" y="129" font-size="12" fill="#5A6A7A">Turbo 译码数学核心在两侧复用；soft buffer key 不能复用</text>

  <!-- ============ 左：DL-SCH 接收（UE 侧） ============ -->
  <g filter="url(#soft)">
    <rect x="35" y="160" width="455" height="500" rx="14" fill="#EEF4FB" stroke="#3B6FB5" stroke-width="1.5"/>
  </g>
  <rect x="35" y="160" width="455" height="36" rx="10" fill="#3B6FB5"/>
  <text x="262" y="184" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">DL-SCH 接收：UE 侧</text>

  <g filter="url(#soft)">
    <rect x="95" y="210" width="335" height="55" rx="10" fill="#FFFFFF" stroke="#C9D4E0" stroke-width="1.2"/>
  </g>
  <text x="108" y="232" font-size="13" font-weight="700" fill="#1B2433">PDSCH demapper</text>
  <text x="108" y="253" font-size="12" fill="#5A6A7A">输出 DL LLR 流</text>

  <g filter="url(#soft)">
    <rect x="95" y="282" width="335" height="55" rx="10" fill="#FFFFFF" stroke="#C9D4E0" stroke-width="1.2"/>
  </g>
  <text x="108" y="304" font-size="13" font-weight="700" fill="#1B2433">DL descriptor</text>
  <text x="108" y="325" font-size="12" fill="#5A6A7A">direction, HARQ, RV, TBS, MCS</text>

  <g filter="url(#soft)">
    <rect x="95" y="354" width="335" height="55" rx="10" fill="#FAF5E4" stroke="#D9C179" stroke-width="1.2"/>
  </g>
  <text x="108" y="376" font-size="13" font-weight="700" fill="#1B2433">soft buffer key</text>
  <text x="108" y="397" font-size="11.5" fill="#5A6A7A">direction=DL / harq_id / tb_id / cb_id</text>

  <g filter="url(#soft)">
    <rect x="95" y="426" width="335" height="55" rx="10" fill="#E7EFF9" stroke="#B9CBE3" stroke-width="1.2"/>
  </g>
  <text x="108" y="448" font-size="13" font-weight="700" fill="#1B2433">shared Turbo core</text>
  <text x="108" y="469" font-size="12" fill="#5A6A7A">同一译码数学核心；上下文在 core 外侧隔离</text>

  <g stroke="#5D6B80" stroke-width="1.8" fill="none">
    <path d="M 262 265 V 282" marker-end="url(#arrow)"/>
    <path d="M 262 337 V 354" marker-end="url(#arrow)"/>
    <path d="M 262 409 V 426" marker-end="url(#arrow)"/>
  </g>

  <text x="95" y="508" font-size="12" font-weight="700" fill="#1B2433">key tokens</text>
  <g font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    <rect x="95" y="518" width="32" height="24" rx="6" fill="#3B6FB5"/>
    <text x="111" y="535" font-size="12" font-weight="700" text-anchor="middle">DL</text>
    <rect x="135" y="518" width="56" height="24" rx="6" fill="#5B82BE"/>
    <text x="163" y="535" font-size="12" font-weight="700" text-anchor="middle">HARQ3</text>
    <rect x="199" y="518" width="52" height="24" rx="6" fill="#7B9BC9"/>
    <text x="225" y="535" font-size="12" font-weight="700" text-anchor="middle">TB17</text>
    <rect x="259" y="518" width="48" height="24" rx="6" fill="#9CB3D6"/>
    <text x="283" y="535" font-size="12" font-weight="700" text-anchor="middle">CB0</text>
  </g>

  <g filter="url(#soft)">
    <rect x="95" y="558" width="335" height="84" rx="10" fill="#FFFFFF" stroke="#C9D4E0" stroke-width="1.2"/>
  </g>
  <g font-size="12" fill="#5A6A7A">
    <text x="108" y="586">要点：UE 只代表本机，通常不需要显式 ue_id。</text>
    <text x="108" y="612">风险：RV、Ncb 或 HARQ key 错会污染重传合并。</text>
  </g>

  <!-- ============ 右：UL-SCH 接收（eNB 侧） ============ -->
  <g filter="url(#soft)">
    <rect x="510" y="160" width="455" height="500" rx="14" fill="#EDF6F1" stroke="#3E9E74" stroke-width="1.5"/>
  </g>
  <rect x="510" y="160" width="455" height="36" rx="10" fill="#3E9E74"/>
  <text x="737" y="184" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">UL-SCH 接收：eNB 侧</text>

  <g filter="url(#soft)">
    <rect x="570" y="210" width="335" height="55" rx="10" fill="#FFFFFF" stroke="#C9D4E0" stroke-width="1.2"/>
  </g>
  <text x="583" y="232" font-size="13" font-weight="700" fill="#1B2433">PUSCH demapper</text>
  <text x="583" y="253" font-size="12" fill="#5A6A7A">输出 UL LLR 流</text>

  <g filter="url(#soft)">
    <rect x="570" y="282" width="335" height="55" rx="10" fill="#FFFFFF" stroke="#C9D4E0" stroke-width="1.2"/>
  </g>
  <text x="583" y="304" font-size="13" font-weight="700" fill="#1B2433">UL descriptor</text>
  <text x="583" y="325" font-size="12" fill="#5A6A7A">direction, UE, HARQ, RV, TBS, MCS</text>

  <g filter="url(#soft)">
    <rect x="570" y="354" width="335" height="55" rx="10" fill="#FAF5E4" stroke="#D9C179" stroke-width="1.2"/>
  </g>
  <text x="583" y="376" font-size="13" font-weight="700" fill="#1B2433">soft buffer key</text>
  <text x="583" y="397" font-size="11.5" fill="#5A6A7A">direction=UL / ue_id / harq_id / tb_id / cb_id</text>

  <g filter="url(#soft)">
    <rect x="570" y="426" width="335" height="55" rx="10" fill="#E7EFF9" stroke="#B9CBE3" stroke-width="1.2"/>
  </g>
  <text x="583" y="448" font-size="13" font-weight="700" fill="#1B2433">shared Turbo core</text>
  <text x="583" y="469" font-size="12" fill="#5A6A7A">同一译码数学核心；上下文在 core 外侧隔离</text>

  <g stroke="#5D6B80" stroke-width="1.8" fill="none">
    <path d="M 737 265 V 282" marker-end="url(#arrow)"/>
    <path d="M 737 337 V 354" marker-end="url(#arrow)"/>
    <path d="M 737 409 V 426" marker-end="url(#arrow)"/>
  </g>

  <text x="570" y="508" font-size="12" font-weight="700" fill="#1B2433">key tokens</text>
  <g font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    <rect x="570" y="518" width="32" height="24" rx="6" fill="#3E9E74"/>
    <text x="586" y="535" font-size="12" font-weight="700" text-anchor="middle">UL</text>
    <rect x="610" y="518" width="52" height="24" rx="6" fill="#55A98A"/>
    <text x="636" y="535" font-size="12" font-weight="700" text-anchor="middle">UE17</text>
    <rect x="670" y="518" width="56" height="24" rx="6" fill="#77BC9E"/>
    <text x="698" y="535" font-size="12" font-weight="700" text-anchor="middle">HARQ3</text>
    <rect x="734" y="518" width="52" height="24" rx="6" fill="#99CEB3"/>
    <text x="760" y="535" font-size="12" font-weight="700" text-anchor="middle">TB17</text>
    <rect x="794" y="518" width="48" height="24" rx="6" fill="#B8DFCB"/>
    <text x="818" y="535" font-size="12" font-weight="700" text-anchor="middle">CB0</text>
  </g>

  <g filter="url(#soft)">
    <rect x="570" y="558" width="335" height="84" rx="10" fill="#FFFFFF" stroke="#C9D4E0" stroke-width="1.2"/>
  </g>
  <g font-size="12" fill="#5A6A7A">
    <text x="583" y="586">要点：eNB 同时服务多个 UE，key 必须带 UE 维度。</text>
    <text x="583" y="612">风险：少一个 ue_id，就可能把 UE17 和 UE18</text>
    <text x="583" y="630">的 LLR 合并。</text>
  </g>

  <!-- ============ 底部：负例 ============ -->
  <g filter="url(#soft)">
    <rect x="35" y="680" width="930" height="155" rx="14" fill="#F9ECEA" stroke="#D99A8E" stroke-width="1.5"/>
  </g>
  <text x="55" y="708" font-size="15" font-weight="700" fill="#C4553D">负例：UL soft buffer key 缺少 UE context</text>
  <text x="55" y="730" font-size="12" fill="#5A6A7A">如果 eNB 侧 key 只写 direction=UL / HARQ3 / TB17 / CB0，那么 UE17 和 UE18 的重传会命中同一缓存地址。</text>
  <text x="55" y="746" font-size="12" fill="#5A6A7A">Turbo core 仍然会运行，但输入 LLR 已经混入错误历史。</text>

  <text x="65" y="784" font-size="12" font-weight="700" fill="#1B2433">UE17 错误 key</text>
  <g font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    <rect x="65" y="794" width="32" height="24" rx="6" fill="#3E9E74"/>
    <text x="81" y="811" font-size="12" font-weight="700" text-anchor="middle">UL</text>
    <rect x="105" y="794" width="56" height="24" rx="6" fill="#77BC9E"/>
    <text x="133" y="811" font-size="12" font-weight="700" text-anchor="middle">HARQ3</text>
    <rect x="169" y="794" width="52" height="24" rx="6" fill="#99CEB3"/>
    <text x="195" y="811" font-size="12" font-weight="700" text-anchor="middle">TB17</text>
    <rect x="229" y="794" width="48" height="24" rx="6" fill="#B8DFCB"/>
    <text x="253" y="811" font-size="12" font-weight="700" text-anchor="middle">CB0</text>
  </g>

  <text x="420" y="784" font-size="12" font-weight="700" fill="#1B2433">UE18 错误 key</text>
  <g font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    <rect x="420" y="794" width="32" height="24" rx="6" fill="#3E9E74"/>
    <text x="436" y="811" font-size="12" font-weight="700" text-anchor="middle">UL</text>
    <rect x="460" y="794" width="56" height="24" rx="6" fill="#77BC9E"/>
    <text x="488" y="811" font-size="12" font-weight="700" text-anchor="middle">HARQ3</text>
    <rect x="524" y="794" width="52" height="24" rx="6" fill="#99CEB3"/>
    <text x="550" y="811" font-size="12" font-weight="700" text-anchor="middle">TB17</text>
    <rect x="584" y="794" width="48" height="24" rx="6" fill="#B8DFCB"/>
    <text x="608" y="811" font-size="12" font-weight="700" text-anchor="middle">CB0</text>
  </g>

  <text x="745" y="790" font-size="12" font-weight="700" fill="#C4553D">同一个 key -&gt; 同一个缓存</text>
  <text x="745" y="812" font-size="12" fill="#5A6A7A">结果：LLR 被错误软合并</text>
</svg>
