<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
<style>
.cjk  { font-family: "Noto Sans CJK SC", sans-serif; }
.lat  { font-family: "Noto Sans", "DejaVu Sans", sans-serif; }
</style>
<rect width="900" height="520" fill="#ffffff"/>

<!-- 标题 -->
<text x="450" y="24" text-anchor="middle" font-size="17" font-weight="700" fill="#111827" class="cjk">2×2 QPSK 球面检测 QR 树搜索：逐层部分距离累加与剪枝</text>

<!-- 根节点 -->
<line x1="450" y1="102" x2="136" y2="164" stroke="#94a3b8" stroke-width="1.5"/>
<line x1="450" y1="102" x2="344" y2="164" stroke="#94a3b8" stroke-width="1.5"/>
<line x1="450" y1="102" x2="552" y2="164" stroke="#16a34a" stroke-width="2.5"/>
<line x1="450" y1="102" x2="760" y2="164" stroke="#94a3b8" stroke-width="1.5"/>
<circle cx="450" cy="90" r="12" fill="#1d4ed8"/>
<text x="450" y="52" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af" class="cjk">根：接收向量 y</text>

<!-- 第一层：s1 候选（4 个节点） -->
<!-- 节点 A：s1=+1+j，d1=1.63 -->
<line x1="136" y1="190" x2="58"  y2="309" stroke="#cbd5e1" stroke-width="1.5"/>
<line x1="136" y1="190" x2="110" y2="309" stroke="#cbd5e1" stroke-width="1.5"/>
<line x1="136" y1="190" x2="162" y2="309" stroke="#cbd5e1" stroke-width="1.5"/>
<line x1="136" y1="190" x2="214" y2="309" stroke="#cbd5e1" stroke-width="1.5"/>
<circle cx="136" cy="177" r="13" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<rect x="109" y="192" width="54" height="14" rx="3" ry="3" fill="#ffffff"/>
<text x="136" y="204" text-anchor="middle" font-size="10" fill="#334155" class="lat">s1=+1+j</text>
<rect x="113" y="214" width="50" height="14" rx="3" ry="3" fill="#ffffff"/>
<text x="137" y="226" text-anchor="middle" font-size="10" fill="#334155" class="lat">d1=1.63</text>

<!-- 节点 B：s1=+1−j，d1=3.26，被剪枝（灰显虚线） -->
<line x1="344" y1="190" x2="266" y2="309" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="344" y1="190" x2="318" y2="309" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="344" y1="190" x2="370" y2="309" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="344" y1="190" x2="422" y2="309" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
<circle cx="344" cy="177" r="13" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/>
<rect x="321" y="192" width="46" height="14" rx="3" ry="3" fill="#ffffff"/>
<text x="344" y="204" text-anchor="middle" font-size="10" fill="#9ca3af" class="lat">s1=+1−j</text>
<rect x="321" y="214" width="50" height="14" rx="3" ry="3" fill="#ffffff"/>
<text x="345" y="226" text-anchor="middle" font-size="10" fill="#9ca3af" class="lat">d1=3.26</text>
<rect x="277" y="236.5" width="134" height="14" rx="3" ry="3" fill="#ffffff"/>
<text x="344" y="248" text-anchor="middle" font-size="10" fill="#6b7280" class="lat">pruned: d1&gt;r²=1.8</text>

<!-- 节点 C：s1=−1+j，d1=0.014，最优路径 -->
<line x1="552" y1="190" x2="474" y2="309" stroke="#cbd5e1" stroke-width="1.5"/>
<line x1="552" y1="190" x2="526" y2="309" stroke="#16a34a" stroke-width="2.5"/>
<line x1="552" y1="190" x2="578" y2="309" stroke="#cbd5e1" stroke-width="1.5"/>
<line x1="552" y1="190" x2="630" y2="309" stroke="#cbd5e1" stroke-width="1.5"/>
<circle cx="552" cy="177" r="13" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
<rect x="525" y="192" width="54" height="14" rx="3" ry="3" fill="#ffffff"/>
<text x="552" y="204" text-anchor="middle" font-size="10" fill="#16a34a" class="lat">s1=−1+j</text>
<rect x="526" y="214" width="56" height="14" rx="3" ry="3" fill="#ffffff"/>
<text x="553" y="226" text-anchor="middle" font-size="10" fill="#16a34a" class="lat">d1=0.014</text>

<!-- 节点 D：s1=−1−j，d1=1.64 -->
<line x1="760" y1="190" x2="682" y2="309" stroke="#cbd5e1" stroke-width="1.5"/>
<line x1="760" y1="190" x2="734" y2="309" stroke="#cbd5e1" stroke-width="1.5"/>
<line x1="760" y1="190" x2="786" y2="309" stroke="#cbd5e1" stroke-width="1.5"/>
<line x1="760" y1="190" x2="838" y2="309" stroke="#cbd5e1" stroke-width="1.5"/>
<circle cx="760" cy="177" r="13" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<rect x="733" y="192" width="54" height="14" rx="3" ry="3" fill="#ffffff"/>
<text x="760" y="204" text-anchor="middle" font-size="10" fill="#334155" class="lat">s1=−1−j</text>
<rect x="737" y="214" width="50" height="14" rx="3" ry="3" fill="#ffffff"/>
<text x="761" y="226" text-anchor="middle" font-size="10" fill="#334155" class="lat">d1=1.64</text>

<!-- 第二层：s0 叶子（16 个） -->
<!-- 子树 A（s1=+1+j）：累积距离 4.32 / 2.38 / 3.95 / 2.02 -->
<circle cx="58"  cy="318" r="9" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<circle cx="110" cy="318" r="9" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<circle cx="162" cy="318" r="9" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<circle cx="214" cy="318" r="9" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<text x="58"  y="342" text-anchor="middle" font-size="10" fill="#475569" class="lat">s0=+1+j</text>
<text x="110" y="342" text-anchor="middle" font-size="10" fill="#475569" class="lat">s0=+1−j</text>
<text x="162" y="342" text-anchor="middle" font-size="10" fill="#475569" class="lat">s0=−1+j</text>
<text x="214" y="342" text-anchor="middle" font-size="10" fill="#475569" class="lat">s0=−1−j</text>
<text x="58"  y="360" text-anchor="middle" font-size="10" fill="#475569" class="lat">d=4.32</text>
<text x="110" y="360" text-anchor="middle" font-size="10" fill="#475569" class="lat">d=2.38</text>
<text x="162" y="360" text-anchor="middle" font-size="10" fill="#475569" class="lat">d=3.95</text>
<text x="214" y="360" text-anchor="middle" font-size="10" fill="#475569" class="lat">d=2.02</text>

<!-- 子树 B（s1=+1−j，被剪枝）：累积距离 4.20 / 5.06 / 3.83 / 4.70（灰显） -->
<circle cx="266" cy="318" r="9" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
<circle cx="318" cy="318" r="9" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
<circle cx="370" cy="318" r="9" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
<circle cx="422" cy="318" r="9" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="266" y="342" text-anchor="middle" font-size="10" fill="#9ca3af" class="lat">s0=+1+j</text>
<text x="318" y="342" text-anchor="middle" font-size="10" fill="#9ca3af" class="lat">s0=+1−j</text>
<text x="370" y="342" text-anchor="middle" font-size="10" fill="#9ca3af" class="lat">s0=−1+j</text>
<text x="422" y="342" text-anchor="middle" font-size="10" fill="#9ca3af" class="lat">s0=−1−j</text>
<text x="266" y="360" text-anchor="middle" font-size="10" fill="#9ca3af" class="lat">d=4.20</text>
<text x="318" y="360" text-anchor="middle" font-size="10" fill="#9ca3af" class="lat">d=5.06</text>
<text x="370" y="360" text-anchor="middle" font-size="10" fill="#9ca3af" class="lat">d=3.83</text>
<text x="422" y="360" text-anchor="middle" font-size="10" fill="#9ca3af" class="lat">d=4.70</text>

<!-- 子树 C（s1=−1+j）：累积距离 1.97 / 0.028（ML 解） / 4.40 / 2.46 -->
<circle cx="474" cy="318" r="9" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<circle cx="526" cy="318" r="9" fill="#16a34a" stroke="#15803d" stroke-width="2"/>
<circle cx="578" cy="318" r="9" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<circle cx="630" cy="318" r="9" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<text x="474" y="342" text-anchor="middle" font-size="10" fill="#475569" class="lat">s0=+1+j</text>
<text x="526" y="342" text-anchor="middle" font-size="10" font-weight="700" fill="#16a34a" class="lat">s0=+1−j</text>
<text x="578" y="342" text-anchor="middle" font-size="10" fill="#475569" class="lat">s0=−1+j</text>
<text x="630" y="342" text-anchor="middle" font-size="10" fill="#475569" class="lat">s0=−1−j</text>
<text x="474" y="360" text-anchor="middle" font-size="10" fill="#475569" class="lat">d=1.97</text>
<text x="526" y="360" text-anchor="middle" font-size="10" font-weight="700" fill="#16a34a" class="lat">d=0.028</text>
<text x="578" y="360" text-anchor="middle" font-size="10" fill="#475569" class="lat">d=4.40</text>
<text x="630" y="360" text-anchor="middle" font-size="10" fill="#475569" class="lat">d=2.46</text>

<!-- 子树 D（s1=−1−j）：累积距离 1.84 / 2.71 / 4.28 / 5.14 -->
<circle cx="682" cy="318" r="9" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<circle cx="734" cy="318" r="9" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<circle cx="786" cy="318" r="9" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<circle cx="838" cy="318" r="9" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<text x="682" y="342" text-anchor="middle" font-size="10" fill="#475569" class="lat">s0=+1+j</text>
<text x="734" y="342" text-anchor="middle" font-size="10" fill="#475569" class="lat">s0=+1−j</text>
<text x="786" y="342" text-anchor="middle" font-size="10" fill="#475569" class="lat">s0=−1+j</text>
<text x="838" y="342" text-anchor="middle" font-size="10" fill="#475569" class="lat">s0=−1−j</text>
<text x="682" y="360" text-anchor="middle" font-size="10" fill="#475569" class="lat">d=1.84</text>
<text x="734" y="360" text-anchor="middle" font-size="10" fill="#475569" class="lat">d=2.71</text>
<text x="786" y="360" text-anchor="middle" font-size="10" fill="#475569" class="lat">d=4.28</text>
<text x="838" y="360" text-anchor="middle" font-size="10" fill="#475569" class="lat">d=5.14</text>

<!-- 底部说明框 -->
<rect x="24" y="378" width="852" height="132" rx="6" ry="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="42" y="398" font-size="11" fill="#334155" class="cjk">(1) 树结构：根（y）→ 第一层 4 个 s1 候选（标注部分距离 d1）→ 第二层 16 个 s0 叶子（标注累积距离 d1+d2）</text>
<text x="42" y="420" font-size="11" fill="#334155" class="cjk">(2) 剪枝：d1=3.26 &gt; r²=1.8 → s1=+1−j 的整棵子树（4 个叶子）灰显跳过，不再访问其 s0 候选</text>
<text x="42" y="442" font-size="11" fill="#334155" class="cjk">(3) 最优路径（绿色加粗）：s1=−1+j → s0=+1−j，累积距离 d1+d2=0.028；半径 r 由初始 1.8 收缩至 0.028</text>
<text x="42" y="464" font-size="11" fill="#334155" class="cjk">(4) 数值实例：2×2 实信道 H=[[1,0.4],[0.3,1]]，噪声 σ²≈0.014；QPSK 符号按单位能量归一化（除以 √2）</text>
<text x="42" y="486" font-size="11" fill="#334155" class="cjk">(5) 图例：绿色加粗线=最优路径（ML 解）｜灰色虚线=因 d1&gt;r² 被整体剪枝的子树｜白色节点=被访问但累积距离超半径而终止</text>
</svg>
