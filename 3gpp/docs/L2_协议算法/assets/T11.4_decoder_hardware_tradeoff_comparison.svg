<?xml version="1.0" encoding="UTF-8"?>
<!--
  @file    T11.4_decoder_hardware_tradeoff_comparison.svg
  @brief   Turbo/LDPC/Polar 三种译码器硬件取舍对比：数据通路形状 + 瓶颈 + 共享边界
  @date    2026-08-04
  @note    v2 重绘：原版"工程决策矩阵表格"与讲义 Markdown 表格重复，已删除；本图
           补充表格之外的拓扑/结构信息：三类数据依赖形状（trellis / 稀疏图 / 树）、
           计算-存储流水结构以及可共享/不宜共享子系统的边界。决策矩阵数据仍由
           讲义 Markdown 表格承载。
           语义色：Turbo=赭金 #B06F2B、LDPC=橄榄 #6C7A2E、Polar=青瓷 #2F6E71、
           中性=石板 #5C6B7C、风险=石榴 #A6403C；浅色填充深色描边。
           依据 T2.1 基准图规格（960 宽、字号层级、Noto CJK 字体栈）。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 710" width="960" height="710" role="img">
  <title>Turbo / LDPC / Polar 硬件取舍：数据通路形状决定瓶颈</title>
  <rect width="960" height="710" fill="#ffffff"/>
  <defs>
    <marker id="ah-turbo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B06F2B"/>
    </marker>
    <marker id="ah-ldpc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6C7A2E"/>
    </marker>
    <marker id="ah-polar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2F6E71"/>
    </marker>
  </defs>
  <style>
    .title { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 18px; font-weight: bold; fill: #111; }
    .label { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 14px; fill: #222; }
    .small { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 12px; fill: #555; }
    .mono { font-family: monospace; font-size: 13px; fill: #333; }
  </style>
  <text x="480" y="30" text-anchor="middle" class="title">Turbo / LDPC / Polar 硬件取舍：数据通路形状决定瓶颈</text>
  <text x="480" y="54" text-anchor="middle" class="small">先看依赖形状（递推 / 图 / 树），再看存储、排序与迭代——决策矩阵数据见讲义表</text>

  <!-- ============ 列 1：Turbo ============ -->
  <rect x="40" y="78" width="285" height="470" rx="10" fill="#FDF8F1" stroke="#B06F2B" stroke-width="1.5"/>
  <text x="62" y="100" class="small" font-weight="bold" fill="#8D5A1E">LTE Turbo：trellis 递推</text>
  <circle cx="100" cy="150" r="6" fill="#B06F2B"/>
  <circle cx="100" cy="180" r="6" fill="#B06F2B"/>
  <circle cx="100" cy="210" r="6" fill="#B06F2B"/>
  <circle cx="220" cy="150" r="6" fill="#B06F2B"/>
  <circle cx="220" cy="180" r="6" fill="#B06F2B"/>
  <circle cx="220" cy="210" r="6" fill="#B06F2B"/>
  <line x1="100" y1="150" x2="220" y2="150" stroke="#C98F4E" stroke-width="1.3"/>
  <line x1="100" y1="150" x2="220" y2="180" stroke="#C98F4E" stroke-width="1.3"/>
  <line x1="100" y1="180" x2="220" y2="150" stroke="#C98F4E" stroke-width="1.3"/>
  <line x1="100" y1="180" x2="220" y2="210" stroke="#C98F4E" stroke-width="1.3"/>
  <line x1="100" y1="210" x2="220" y2="180" stroke="#C98F4E" stroke-width="1.3"/>
  <line x1="100" y1="210" x2="220" y2="210" stroke="#C98F4E" stroke-width="1.3"/>
  <text x="160" y="250" text-anchor="middle" class="small">α/β 前后向递推（时间依赖）</text>
  <rect x="65" y="290" width="190" height="28" rx="6" fill="#FFFFFF" stroke="#C98F4E" stroke-width="1.2"/>
  <text x="160" y="308" text-anchor="middle" class="small">LLR RAM（三路流）</text>
  <path d="M 160 318 L 160 338" stroke="#B06F2B" stroke-width="1.5" fill="none" marker-end="url(#ah-turbo)"/>
  <rect x="65" y="338" width="190" height="28" rx="6" fill="#FFFFFF" stroke="#C98F4E" stroke-width="1.2"/>
  <text x="160" y="356" text-anchor="middle" class="small">SISO/BCJR：αβ 递推</text>
  <path d="M 160 366 L 160 386" stroke="#B06F2B" stroke-width="1.5" fill="none" marker-end="url(#ah-turbo)"/>
  <rect x="65" y="386" width="190" height="44" rx="6" fill="#FFFFFF" stroke="#C98F4E" stroke-width="1.2"/>
  <text x="160" y="404" text-anchor="middle" class="small">interleaver + extrinsic</text>
  <text x="160" y="422" text-anchor="middle" class="small">×I 迭代 + early stop</text>
  <rect x="55" y="455" width="220" height="90" rx="8" fill="#FFFFFF" stroke="#B06F2B" stroke-width="1.3"/>
  <text x="75" y="480" class="small" font-weight="bold" fill="#8D5A1E">瓶颈</text>
  <text x="75" y="502" class="small">trellis 前后向递推</text>
  <text x="75" y="522" class="small">顺序依赖 + 交织随机访问</text>
  <text x="75" y="538" class="small">迭代放大最坏延迟</text>

  <!-- ============ 列 2：LDPC ============ -->
  <rect x="345" y="78" width="285" height="470" rx="10" fill="#F5F8F2" stroke="#6C7A2E" stroke-width="1.5"/>
  <text x="367" y="100" class="small" font-weight="bold" fill="#525F1F">NR LDPC：QC 稀疏图分层</text>
  <circle cx="415" cy="145" r="6" fill="#6C7A2E"/>
  <circle cx="465" cy="145" r="6" fill="#6C7A2E"/>
  <circle cx="515" cy="145" r="6" fill="#6C7A2E"/>
  <circle cx="565" cy="145" r="6" fill="#6C7A2E"/>
  <circle cx="425" cy="215" r="6" fill="#6C7A2E"/>
  <circle cx="490" cy="215" r="6" fill="#6C7A2E"/>
  <circle cx="555" cy="215" r="6" fill="#6C7A2E"/>
  <line x1="415" y1="145" x2="425" y2="215" stroke="#93A95A" stroke-width="1.3"/>
  <line x1="465" y1="145" x2="425" y2="215" stroke="#93A95A" stroke-width="1.3"/>
  <line x1="465" y1="145" x2="490" y2="215" stroke="#93A95A" stroke-width="1.3"/>
  <line x1="515" y1="145" x2="490" y2="215" stroke="#93A95A" stroke-width="1.3"/>
  <line x1="515" y1="145" x2="555" y2="215" stroke="#93A95A" stroke-width="1.3"/>
  <line x1="565" y1="145" x2="555" y2="215" stroke="#93A95A" stroke-width="1.3"/>
  <text x="487" y="250" text-anchor="middle" class="small">VN/CN 消息沿边迭代（QC 并行）</text>
  <rect x="392" y="290" width="190" height="28" rx="6" fill="#FFFFFF" stroke="#93A95A" stroke-width="1.2"/>
  <text x="487" y="308" text-anchor="middle" class="small">LLR RAM（后验 LLR）</text>
  <path d="M 487 318 L 487 338" stroke="#6C7A2E" stroke-width="1.5" fill="none" marker-end="url(#ah-ldpc)"/>
  <rect x="392" y="338" width="190" height="28" rx="6" fill="#FFFFFF" stroke="#93A95A" stroke-width="1.2"/>
  <text x="487" y="356" text-anchor="middle" class="small">CN/VN 阵列 + min1/min2</text>
  <path d="M 487 366 L 487 386" stroke="#6C7A2E" stroke-width="1.5" fill="none" marker-end="url(#ah-ldpc)"/>
  <rect x="392" y="386" width="190" height="44" rx="6" fill="#FFFFFF" stroke="#93A95A" stroke-width="1.2"/>
  <text x="487" y="404" text-anchor="middle" class="small">message memory / bank</text>
  <text x="487" y="422" text-anchor="middle" class="small">layered RMW 读改写</text>
  <rect x="360" y="455" width="220" height="90" rx="8" fill="#FFFFFF" stroke="#6C7A2E" stroke-width="1.3"/>
  <text x="380" y="480" class="small" font-weight="bold" fill="#525F1F">瓶颈</text>
  <text x="380" y="502" class="small">消息 RMW / bank conflict</text>
  <text x="380" y="522" class="small">算力够，存储带宽不足</text>
  <text x="380" y="538" class="small">layer stall 拖尾延迟</text>

  <!-- ============ 列 3：Polar SCL ============ -->
  <rect x="650" y="78" width="285" height="470" rx="10" fill="#F2F7F7" stroke="#2F6E71" stroke-width="1.5"/>
  <text x="672" y="100" class="small" font-weight="bold" fill="#1E4E50">NR Polar：SCL 树 + 路径</text>
  <circle cx="792" cy="135" r="6" fill="#2F6E71"/>
  <circle cx="752" cy="190" r="6" fill="#2F6E71"/>
  <circle cx="832" cy="190" r="6" fill="#2F6E71"/>
  <circle cx="692" cy="245" r="6" fill="#2F6E71"/>
  <circle cx="752" cy="245" r="6" fill="#2F6E71"/>
  <circle cx="832" cy="245" r="6" fill="#2F6E71"/>
  <circle cx="892" cy="245" r="6" fill="#2F6E71"/>
  <line x1="792" y1="135" x2="752" y2="190" stroke="#7FA6A8" stroke-width="1.3"/>
  <line x1="792" y1="135" x2="832" y2="190" stroke="#7FA6A8" stroke-width="1.3"/>
  <line x1="752" y1="190" x2="692" y2="245" stroke="#7FA6A8" stroke-width="1.3"/>
  <line x1="752" y1="190" x2="752" y2="245" stroke="#7FA6A8" stroke-width="1.3"/>
  <line x1="832" y1="190" x2="832" y2="245" stroke="#7FA6A8" stroke-width="1.3"/>
  <line x1="832" y1="190" x2="892" y2="245" stroke="#7FA6A8" stroke-width="1.3"/>
  <line x1="792" y1="135" x2="752" y2="190" stroke="#2F6E71" stroke-width="2.2"/>
  <line x1="752" y1="190" x2="692" y2="245" stroke="#2F6E71" stroke-width="2.2"/>
  <line x1="792" y1="135" x2="832" y2="190" stroke="#2F6E71" stroke-width="2.2"/>
  <line x1="832" y1="190" x2="832" y2="245" stroke="#2F6E71" stroke-width="2.2"/>
  <text x="792" y="268" text-anchor="middle" class="small">SC/SCL：L 条路径扩展 + 剪枝</text>
  <rect x="697" y="290" width="190" height="28" rx="6" fill="#FFFFFF" stroke="#7FA6A8" stroke-width="1.2"/>
  <text x="792" y="308" text-anchor="middle" class="small">LLR memory（树节点）</text>
  <path d="M 792 318 L 792 338" stroke="#2F6E71" stroke-width="1.5" fill="none" marker-end="url(#ah-polar)"/>
  <rect x="697" y="338" width="190" height="28" rx="6" fill="#FFFFFF" stroke="#7FA6A8" stroke-width="1.2"/>
  <text x="792" y="356" text-anchor="middle" class="small">f/g 遍历 + path split</text>
  <path d="M 792 366 L 792 386" stroke="#2F6E71" stroke-width="1.5" fill="none" marker-end="url(#ah-polar)"/>
  <rect x="697" y="386" width="190" height="44" rx="6" fill="#FFFFFF" stroke="#7FA6A8" stroke-width="1.2"/>
  <text x="792" y="404" text-anchor="middle" class="small">sorter + path memory</text>
  <text x="792" y="422" text-anchor="middle" class="small">partial sum + CRC 选择</text>
  <rect x="665" y="455" width="220" height="90" rx="8" fill="#FFFFFF" stroke="#2F6E71" stroke-width="1.3"/>
  <text x="685" y="480" class="small" font-weight="bold" fill="#1E4E50">瓶颈</text>
  <text x="685" y="502" class="small">information bit → 2L 候选</text>
  <text x="685" y="522" class="small">sorter 排序 + 状态同步复制</text>
  <text x="685" y="538" class="small">控制时限内难隐藏延迟</text>

  <!-- ============ 底部：统一译码子系统的共享边界 ============ -->
  <rect x="40" y="585" width="435" height="115" rx="10" fill="#F4F6F8" stroke="#5C6B7C" stroke-width="1.5"/>
  <text x="60" y="608" class="small" font-weight="bold" fill="#3C4A5C">可共享：外层接口与算术</text>
  <text x="60" y="630" class="small">DMA / LLR buffer / FIFO / 寄存器 / 中断</text>
  <text x="60" y="652" class="small">CRC wrapper / 饱和加法 / 比较器</text>
  <text x="60" y="674" class="small">SRAM allocator / bank 监控 / trace</text>

  <rect x="485" y="585" width="435" height="115" rx="10" fill="#FBF1EF" stroke="#A6403C" stroke-width="1.5"/>
  <text x="505" y="608" class="small" font-weight="bold" fill="#8A2F2B">不宜共享：算法核心与状态存储</text>
  <text x="505" y="630" class="small">Turbo SISO / interleaver / extrinsic</text>
  <text x="505" y="652" class="small">LDPC message memory / CN-VN</text>
  <text x="505" y="674" class="small">Polar sorter / path / partial sum</text>
</svg>
