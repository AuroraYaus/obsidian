<?xml version="1.0" encoding="UTF-8"?>
<!--
  @file    T14.1_pdcch_cce_aggregation.svg
  @brief   CORESET / REG / CCE 与聚合等级教学图：左为 3 符号 x 12 PRB 的
           CORESET 资源格（REG 按符号优先编号，CCE = 6 个 REG），
           右为聚合等级 1/2/4/8 与码率关系（TS 38.211 §7.3.2）
  @date    2026-08-13
  @note    与讲义 T14.1 正文语义一致：REG = 1 PRB x 1 OFDM 符号；
           CCE = 6 REG；聚合等级 = 一个 PDCCH 占用的 CCE 数，
           聚合越大编码码率越低、抗噪声能力越强。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="940" height="620" viewBox="0 0 940 620" role="img" font-family="'Noto Sans CJK SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif">
  <title>CORESET、REG、CCE 与聚合等级</title>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8A8375"/>
    </marker>
  </defs>

  <!-- ============ 页头 ============ -->
  <text x="60" y="40" font-size="20" font-weight="700" class="free" fill="#23272E">CORESET、REG、CCE 与聚合等级</text>
  <text x="60" y="66" font-size="12.5" class="free" fill="#646B76">REG = 1 个 PRB × 1 个 OFDM 符号；CCE = 6 个 REG（TS 38.211 §7.3.2）</text>

  <!-- ============ 左区：CORESET 资源格 ============ -->
  <!-- 列头 -->
  <g font-size="8.5" fill="#23272E">
    <text x="171" y="117.5" text-anchor="middle">RB 0</text>
    <text x="209" y="117.5" text-anchor="middle">RB 1</text>
    <text x="247" y="117.5" text-anchor="middle">RB 2</text>
    <text x="285" y="117.5" text-anchor="middle">RB 3</text>
    <text x="323" y="117.5" text-anchor="middle">RB 4</text>
    <text x="361" y="117.5" text-anchor="middle">RB 5</text>
    <text x="399" y="117.5" text-anchor="middle">RB 6</text>
    <text x="437" y="117.5" text-anchor="middle">RB 7</text>
    <text x="475" y="117.5" text-anchor="middle">RB 8</text>
    <text x="513" y="117.5" text-anchor="middle">RB 9</text>
    <text x="551" y="117.5" text-anchor="middle">RB 10</text>
    <text x="589" y="117.5" text-anchor="middle">RB 11</text>
  </g>
  <!-- 列头宿主格 -->
  <g fill="#F1EDE4" stroke="#CFC8B8" stroke-width="1">
    <rect x="152" y="104" width="38" height="18"/>
    <rect x="190" y="104" width="38" height="18"/>
    <rect x="228" y="104" width="38" height="18"/>
    <rect x="266" y="104" width="38" height="18"/>
    <rect x="304" y="104" width="38" height="18"/>
    <rect x="342" y="104" width="38" height="18"/>
    <rect x="380" y="104" width="38" height="18"/>
    <rect x="418" y="104" width="38" height="18"/>
    <rect x="456" y="104" width="38" height="18"/>
    <rect x="494" y="104" width="38" height="18"/>
    <rect x="532" y="104" width="38" height="18"/>
    <rect x="570" y="104" width="38" height="18"/>
  </g>
  <!-- 行标签 -->
  <g font-size="9.5" fill="#23272E">
    <rect x="96" y="140" width="40" height="30" rx="4" fill="#F1EDE4" stroke="#CFC8B8" stroke-width="1"/>
    <text x="116" y="158" text-anchor="middle">符号 1</text>
    <rect x="96" y="170" width="40" height="30" rx="4" fill="#F1EDE4" stroke="#CFC8B8" stroke-width="1"/>
    <text x="116" y="188" text-anchor="middle">符号 2</text>
    <rect x="96" y="200" width="40" height="30" rx="4" fill="#F1EDE4" stroke="#CFC8B8" stroke-width="1"/>
    <text x="116" y="218" text-anchor="middle">符号 3</text>
  </g>
  <!-- REG 格（3 符号 x 12 PRB，时域优先编号） -->
  <g fill="#EAF1FB" stroke="#7C9CC9" stroke-width="1">
    <rect x="152" y="140" width="38" height="30"/>
    <rect x="190" y="140" width="38" height="30"/>
    <rect x="228" y="140" width="38" height="30"/>
    <rect x="266" y="140" width="38" height="30"/>
    <rect x="304" y="140" width="38" height="30"/>
    <rect x="342" y="140" width="38" height="30"/>
    <rect x="380" y="140" width="38" height="30"/>
    <rect x="418" y="140" width="38" height="30"/>
    <rect x="456" y="140" width="38" height="30"/>
    <rect x="494" y="140" width="38" height="30"/>
    <rect x="532" y="140" width="38" height="30"/>
    <rect x="570" y="140" width="38" height="30"/>
    <rect x="152" y="170" width="38" height="30"/>
    <rect x="190" y="170" width="38" height="30"/>
    <rect x="228" y="170" width="38" height="30"/>
    <rect x="266" y="170" width="38" height="30"/>
    <rect x="304" y="170" width="38" height="30"/>
    <rect x="342" y="170" width="38" height="30"/>
    <rect x="380" y="170" width="38" height="30"/>
    <rect x="418" y="170" width="38" height="30"/>
    <rect x="456" y="170" width="38" height="30"/>
    <rect x="494" y="170" width="38" height="30"/>
    <rect x="532" y="170" width="38" height="30"/>
    <rect x="570" y="170" width="38" height="30"/>
    <rect x="152" y="200" width="38" height="30"/>
    <rect x="190" y="200" width="38" height="30"/>
    <rect x="228" y="200" width="38" height="30"/>
    <rect x="266" y="200" width="38" height="30"/>
    <rect x="304" y="200" width="38" height="30"/>
    <rect x="342" y="200" width="38" height="30"/>
    <rect x="380" y="200" width="38" height="30"/>
    <rect x="418" y="200" width="38" height="30"/>
    <rect x="456" y="200" width="38" height="30"/>
    <rect x="494" y="200" width="38" height="30"/>
    <rect x="532" y="200" width="38" height="30"/>
    <rect x="570" y="200" width="38" height="30"/>
  </g>
  <!-- REG 0 高亮格 -->
  <rect x="152" y="140" width="38" height="30" fill="#FDEBDC" stroke="#B06F2B" stroke-width="2"/>
  <!-- CCE 轮廓（每个 CCE = 同一符号内的 6 个连续 REG） -->
  <g fill="none" stroke="#8E3B5E" stroke-width="3">
    <rect x="152" y="140" width="228" height="30"/>
    <rect x="380" y="140" width="228" height="30"/>
    <rect x="152" y="170" width="228" height="30"/>
    <rect x="380" y="170" width="228" height="30"/>
    <rect x="152" y="200" width="228" height="30"/>
    <rect x="380" y="200" width="228" height="30"/>
  </g>
  <!-- 说明框 -->
  <g font-size="12" fill="#23272E">
    <rect x="152" y="268" width="456" height="88" rx="10" fill="#FBFAF6" stroke="#CFC8B8" stroke-width="1.5"/>
    <text x="172" y="292">CCE 0 = REG 0-5：6 个 REG（时域优先编号）；REG 0 为高亮格</text>
    <text x="172" y="314">REG = 1 个 PRB × 1 个 OFDM 符号 = 12 个 RE；PDCCH 用 QPSK 调制</text>
    <text x="172" y="336">CCE = 6 个 REG；1 个 CCE 的编码容量约 144 个 QPSK 比特</text>
  </g>

  <!-- ============ 右区：聚合等级与码率 ============ -->
  <g filter="url(#soft)">
    <rect x="640" y="104" width="260" height="400" rx="14" fill="#F1EDE4" stroke="#CFC8B8" stroke-width="1.5"/>
  </g>
  <text x="668" y="130" font-size="14.5" font-weight="700" fill="#23272E">聚合等级与码率</text>

  <g font-size="12.5" fill="#23272E">
    <rect x="668" y="150" width="204" height="64" rx="10" fill="#F7E9EF" stroke="#8E3B5E" stroke-width="1.5"/>
    <text x="770" y="174" font-size="12.5" font-weight="700" text-anchor="middle">聚合等级 1：1 个 CCE</text>
    <text x="770" y="196" font-size="11.5" text-anchor="middle" fill="#646B76">有效码率最高</text>

    <rect x="668" y="234" width="204" height="64" rx="10" fill="#E6F0F0" stroke="#2F6E71" stroke-width="1.5"/>
    <text x="770" y="258" font-size="12.5" font-weight="700" text-anchor="middle">聚合等级 2：2 个 CCE</text>
    <text x="770" y="280" font-size="11.5" text-anchor="middle" fill="#646B76">码率约为 1/2</text>

    <rect x="668" y="318" width="204" height="64" rx="10" fill="#EFF1E2" stroke="#6C7A2E" stroke-width="1.5"/>
    <text x="770" y="342" font-size="12.5" font-weight="700" text-anchor="middle">聚合等级 4：4 个 CCE</text>
    <text x="770" y="364" font-size="11.5" text-anchor="middle" fill="#646B76">码率约为 1/4</text>

    <rect x="668" y="402" width="204" height="64" rx="10" fill="#F8EEDC" stroke="#B06F2B" stroke-width="1.5"/>
    <text x="770" y="426" font-size="12.5" font-weight="700" text-anchor="middle">聚合等级 8：8 个 CCE</text>
    <text x="770" y="448" font-size="11.5" text-anchor="middle" fill="#646B76">码率约为 1/8，最可靠</text>
  </g>
  <g stroke="#8A8375" stroke-width="2" fill="none">
    <path d="M 770 214 V 234" marker-end="url(#arrow)"/>
    <path d="M 770 298 V 318" marker-end="url(#arrow)"/>
    <path d="M 770 382 V 402" marker-end="url(#arrow)"/>
  </g>

  <!-- ============ 底部注记 ============ -->
  <text x="60" y="540" font-size="12.5" class="free" fill="#646B76">聚合等级 1/2/4/8/16：一个 PDCCH 占用的 CCE 数；聚合越大码率越低、越可靠（TS 38.213 §10.1 / 38.211 表 7.3.2.1-1）</text>
</svg>
