<?xml version="1.0" encoding="UTF-8"?>
<!--
  @file    T11.5_decoder_selection_by_channel_type.svg
  @brief   按信道与信息类型选择译码器的决策树：RAT -> 数据/控制 -> 译码器家族
  @date    2026-08-04
  @note    v2 重绘：原版"协议映射速查表"与讲义 Markdown 表格重复，已删除；本图
           保留表格之外的拓扑/结构信息：selector 判定顺序的分支结构（先 RAT、
           再数据/控制、最后 decoder_type）与边界情况的归属位置。
           语义色：Turbo=赭金 #B06F2B、LDPC=橄榄 #6C7A2E、Polar=青瓷 #2F6E71、
           中性=石板 #5C6B7C、风险=石榴 #A6403C；浅色填充深色描边。
           依据 T2.1 基准图规格（960 宽、字号层级、Noto CJK 字体栈）。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" role="img">
  <title>按信道与信息类型选择译码器：决策树</title>
  <rect width="960" height="700" fill="#ffffff"/>
  <defs>
    <marker id="ah-turbo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B06F2B"/>
    </marker>
    <marker id="ah-ldpc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6C7A2E"/>
    </marker>
    <marker id="ah-polar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2F6E71"/>
    </marker>
    <marker id="ah-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B7C"/>
    </marker>
    <marker id="ah-risk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#A6403C"/>
    </marker>
  </defs>
  <style>
    .title { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 18px; font-weight: bold; fill: #111; }
    .label { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 14px; fill: #222; }
    .small { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 12px; fill: #555; }
    .mono { font-family: monospace; font-size: 13px; fill: #333; }
  </style>
  <text x="480" y="30" text-anchor="middle" class="title">按信道与信息类型选择译码器：协议对象先于算法偏好</text>
  <text x="480" y="54" text-anchor="middle" class="small">先问：LTE 还是 NR？数据 TB 还是控制 payload？DCI 还是 UCI？——协议映射表见讲义</text>

  <!-- ============ 根：descriptor ============ -->
  <rect x="330" y="88" width="300" height="44" rx="8" fill="#F4F6F8" stroke="#5C6B7C" stroke-width="1.5"/>
  <text x="480" y="106" text-anchor="middle" class="small" font-weight="bold" fill="#3C4A5C">descriptor 输入</text>
  <text x="480" y="124" text-anchor="middle" class="small">rat + channel_type + payload_type</text>
  <path d="M 400 132 L 225 160" stroke="#B06F2B" stroke-width="1.5" fill="none" marker-end="url(#ah-turbo)"/>
  <path d="M 560 132 L 735 160" stroke="#5C6B7C" stroke-width="1.5" fill="none" marker-end="url(#ah-slate)"/>

  <!-- ============ 第一层：RAT ============ -->
  <rect x="135" y="160" width="190" height="44" rx="8" fill="#FDF8F1" stroke="#B06F2B" stroke-width="1.5"/>
  <text x="230" y="182" text-anchor="middle" class="small" font-weight="bold" fill="#8D5A1E">RAT = LTE</text>
  <rect x="635" y="160" width="190" height="44" rx="8" fill="#F4F6F8" stroke="#5C6B7C" stroke-width="1.5"/>
  <text x="730" y="182" text-anchor="middle" class="small" font-weight="bold" fill="#3C4A5C">RAT = NR</text>

  <!-- ============ 第二层：信道类型 ============ -->
  <path d="M 230 204 L 140 252" stroke="#B06F2B" stroke-width="1.5" fill="none" marker-end="url(#ah-turbo)"/>
  <path d="M 230 204 L 385 252" stroke="#A6403C" stroke-width="1.5" fill="none" marker-end="url(#ah-risk)"/>
  <path d="M 730 204 L 660 252" stroke="#6C7A2E" stroke-width="1.5" fill="none" marker-end="url(#ah-ldpc)"/>
  <path d="M 730 204 L 852.5 252" stroke="#5C6B7C" stroke-width="1.5" fill="none" marker-end="url(#ah-slate)"/>
  <rect x="40" y="252" width="200" height="52" rx="8" fill="#FDF8F1" stroke="#B06F2B" stroke-width="1.5"/>
  <text x="140" y="270" text-anchor="middle" class="small" font-weight="bold" fill="#8D5A1E">数据 TrCH</text>
  <text x="140" y="290" text-anchor="middle" class="small">DL-SCH / UL-SCH / PCH…</text>
  <rect x="260" y="252" width="250" height="52" rx="8" fill="#FBF1EF" stroke="#A6403C" stroke-width="1.5"/>
  <text x="385" y="270" text-anchor="middle" class="small" font-weight="bold" fill="#8A2F2B">控制 payload</text>
  <text x="385" y="290" text-anchor="middle" class="small">DCI / UCI / CFI / HI / SCI</text>
  <rect x="545" y="252" width="230" height="64" rx="8" fill="#F5F8F2" stroke="#6C7A2E" stroke-width="1.5"/>
  <text x="660" y="270" text-anchor="middle" class="small" font-weight="bold" fill="#525F1F">数据 TrCH</text>
  <text x="660" y="290" text-anchor="middle" class="small">DL-SCH / UL-SCH / PCH</text>
  <text x="660" y="310" text-anchor="middle" class="small">BCH → Polar（PBCH 边界）</text>
  <rect x="795" y="252" width="115" height="52" rx="8" fill="#F4F6F8" stroke="#5C6B7C" stroke-width="1.5"/>
  <text x="852.5" y="270" text-anchor="middle" class="small" font-weight="bold" fill="#3C4A5C">控制 payload</text>
  <text x="852.5" y="290" text-anchor="middle" class="small">DCI / UCI</text>

  <!-- ============ 第三层：decoder_type ============ -->
  <path d="M 140 304 L 137.5 344" stroke="#B06F2B" stroke-width="1.5" fill="none" marker-end="url(#ah-turbo)"/>
  <path d="M 385 304 L 385 344" stroke="#A6403C" stroke-width="1.5" fill="none" marker-end="url(#ah-risk)"/>
  <path d="M 660 316 L 660 344" stroke="#6C7A2E" stroke-width="1.5" fill="none" marker-end="url(#ah-ldpc)"/>
  <path d="M 852.5 304 L 852.5 344" stroke="#2F6E71" stroke-width="1.5" fill="none" marker-end="url(#ah-polar)"/>
  <rect x="40" y="344" width="200" height="78" rx="8" fill="#FFFFFF" stroke="#B06F2B" stroke-width="1.5"/>
  <text x="140" y="362" text-anchor="middle" class="small" font-weight="bold" fill="#8D5A1E">decoder_type = TURBO</text>
  <text x="140" y="382" text-anchor="middle" class="small">TB/CB CRC + rate recovery</text>
  <text x="140" y="402" text-anchor="middle" class="small">HARQ soft buffer 必需</text>
  <rect x="260" y="344" width="250" height="78" rx="8" fill="#FFFFFF" stroke="#A6403C" stroke-width="1.5"/>
  <text x="385" y="362" text-anchor="middle" class="small" font-weight="bold" fill="#8A2F2B">decoder_type = LTE_CONTROL</text>
  <text x="385" y="382" text-anchor="middle" class="small">DCI/BCH→TBCC；CFI/HI→block</text>
  <text x="385" y="402" text-anchor="middle" class="small">不走 NR Polar 分支！</text>
  <rect x="545" y="344" width="230" height="78" rx="8" fill="#FFFFFF" stroke="#6C7A2E" stroke-width="1.5"/>
  <text x="660" y="362" text-anchor="middle" class="small" font-weight="bold" fill="#525F1F">decoder_type = LDPC</text>
  <text x="660" y="382" text-anchor="middle" class="small">BG / Zc / Ncb / k0 / RV + CBG</text>
  <text x="660" y="402" text-anchor="middle" class="small">harq_context 必需</text>
  <rect x="790" y="344" width="160" height="78" rx="8" fill="#FFFFFF" stroke="#2F6E71" stroke-width="1.5"/>
  <text x="870" y="362" text-anchor="middle" class="small" font-weight="bold" fill="#1E4E50">decoder_type = POLAR</text>
  <text x="870" y="382" text-anchor="middle" class="small">DCI：CRC/RNTI 盲检</text>
  <text x="870" y="402" text-anchor="middle" class="small">UCI → small-block 例外</text>

  <!-- ============ 边界情况芯片 ============ -->
  <rect x="40" y="452" width="285" height="44" rx="8" fill="#F8FAFC" stroke="#5C6B7C" stroke-width="1.4"/>
  <text x="58" y="470" class="small" font-weight="bold" fill="#3C4A5C">先分 RAT，再分数据/控制</text>
  <text x="58" y="488" class="small">防 LTE 与 NR 控制混用</text>
  <rect x="340" y="452" width="285" height="44" rx="8" fill="#F8FAFC" stroke="#5C6B7C" stroke-width="1.4"/>
  <text x="358" y="470" class="small" font-weight="bold" fill="#3C4A5C">BCH（NR）→ Polar</text>
  <text x="358" y="488" class="small">PBCH 边界，本路线图不展开</text>
  <rect x="640" y="452" width="285" height="44" rx="8" fill="#F8FAFC" stroke="#5C6B7C" stroke-width="1.4"/>
  <text x="658" y="470" class="small" font-weight="bold" fill="#3C4A5C">UCI on PUSCH</text>
  <text x="658" y="488" class="small">数据 → LDPC，UCI → 控制分支</text>

  <!-- ============ 底部：错误处理与上下文断言 ============ -->
  <rect x="120" y="540" width="350" height="34" rx="8" fill="#FBF1EF" stroke="#A6403C" stroke-width="1.4"/>
  <text x="295" y="562" text-anchor="middle" class="small" fill="#8A2F2B">缺字段 / 非法组合 → 明确 status_code</text>
  <rect x="480" y="540" width="370" height="34" rx="8" fill="#FBF1EF" stroke="#A6403C" stroke-width="1.4"/>
  <text x="665" y="562" text-anchor="middle" class="small" fill="#8A2F2B">context 缺失 → DESCRIPTOR_INCOMPLETE，不启动 core</text>

  <text x="480" y="622" text-anchor="middle" class="small">决策树即 selector 伪代码图形化；协议锚点：TS 36.212 §5.1.3 / TS 38.212 §5.3 Table 5.3-1/2</text>
  <text x="480" y="646" text-anchor="middle" class="small">selector 错误在 core 启动前报错（status_code）；译码失败才进入 CRC / syndrome 分析</text>
</svg>
