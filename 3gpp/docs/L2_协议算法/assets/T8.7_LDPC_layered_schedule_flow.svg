<?xml version="1.0" encoding="UTF-8"?>
<!--
  @file    T8.7_LDPC_layered_schedule_flow.svg
  @brief   LDPC Flooding 与 Layered 译码调度对比图（手绘 SVG）
  @date    2026-08-04
  @note    布局按讲义语义重排：上排左 Flooding 与 Layered 两条时序链（各 3 节点 + 箭头 +
           读图注记）、上排右小 H 的 layer 更新表与 Zc 地址访问；
           下排 Layered decoder loop 画成闭环（iteration -> layer -> CN update ->
           VN update -> syndrome -> 回到 iteration）并附最小验证日志字段。
           语义配色：Flooding 灰蓝 / Layered 绿 / 循环琥珀；字号符合合规 Rule 23。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="815" viewBox="0 0 1000 815" role="img" font-family="'Noto Sans CJK SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif">
  <title>LDPC Flooding 与 Layered 译码调度</title>

  <defs>
    <filter id="soft" x="-10%" y="-10%" width="125%" height="135%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#334155" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5D6B80"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3E9E74"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D18A2F"/>
    </marker>
  </defs>

  <!-- ============ 标题 ============ -->
  <text x="35" y="34" font-size="18" font-weight="700" class="free" fill="#1B2433">LDPC Flooding 与 Layered 译码调度</text>
  <text x="35" y="60" font-size="12" class="free" fill="#5B6877">Layered schedule 不是新的码结构，而是按 TS 38.212 的 BG row group / QC-LDPC 连接顺序组织消息更新。</text>
  <text x="35" y="78" font-size="12" class="free" fill="#5B6877">核心差异是同一 iteration 内是否立即使用刚更新的变量节点值。</text>

  <!-- ============ Flooding 与 Layered 时序差异 ============ -->
  <g filter="url(#soft)">
    <rect x="35" y="95" width="565" height="365" rx="14" fill="#F5F7FA" stroke="#C9D4E0" stroke-width="1.5"/>
  </g>
  <text x="55" y="122" font-size="15" font-weight="700" fill="#3B6FB5">Flooding 与 Layered 时序差异</text>

  <!-- Flooding 行 -->
  <g font-size="12.5" font-weight="700" fill="#1B2433" text-anchor="middle">
    <rect x="55" y="145" width="135" height="80" rx="10" fill="#EDF1F6" stroke="#72839B" stroke-width="1.2"/>
    <text x="122" y="172" text-anchor="middle">CN all rows</text>
    <text x="122" y="196" font-size="11.5" font-weight="400" fill="#5B6877" text-anchor="middle">先用旧变量消息计算</text>
    <text x="122" y="212" font-size="11.5" font-weight="400" fill="#5B6877" text-anchor="middle">所有校验节点。</text>
    <rect x="215" y="145" width="135" height="80" rx="10" fill="#EDF1F6" stroke="#72839B" stroke-width="1.2"/>
    <text x="282" y="172" text-anchor="middle">VN all cols</text>
    <text x="282" y="196" font-size="11.5" font-weight="400" fill="#5B6877" text-anchor="middle">再统一更新所有</text>
    <text x="282" y="212" font-size="11.5" font-weight="400" fill="#5B6877" text-anchor="middle">变量节点。</text>
    <rect x="375" y="145" width="135" height="80" rx="10" fill="#EDF1F6" stroke="#72839B" stroke-width="1.2"/>
    <text x="442" y="172" text-anchor="middle">Syndrome</text>
    <text x="442" y="196" font-size="11.5" font-weight="400" fill="#5B6877" text-anchor="middle">整轮结束后检查。</text>
  </g>
  <g stroke="#5D6B80" stroke-width="1.8" fill="none">
    <path d="M 190 185 H 215" marker-end="url(#arrow)"/>
    <path d="M 350 185 H 375" marker-end="url(#arrow)"/>
  </g>
  <text x="55" y="252" font-size="11.5" fill="#5B6877">Flooding：一轮内先算完全部 CN，再统一 VN；同一轮后面的行看不到前面行的新结果。</text>

  <!-- Layered 行 -->
  <g font-size="12.5" font-weight="700" fill="#1B2433" text-anchor="middle">
    <rect x="55" y="290" width="135" height="80" rx="10" fill="#E2F2E9" stroke="#3E9E74" stroke-width="1.2"/>
    <text x="122" y="317" text-anchor="middle">Layer 0</text>
    <text x="122" y="341" font-size="11.5" font-weight="400" fill="#5B6877" text-anchor="middle">更新行组 0，立即</text>
    <text x="122" y="357" font-size="11.5" font-weight="400" fill="#5B6877" text-anchor="middle">写回软值。</text>
    <rect x="215" y="290" width="135" height="80" rx="10" fill="#E2F2E9" stroke="#3E9E74" stroke-width="1.2"/>
    <text x="282" y="317" text-anchor="middle">Layer 1</text>
    <text x="282" y="341" font-size="11.5" font-weight="400" fill="#5B6877" text-anchor="middle">读到前层的</text>
    <text x="282" y="357" font-size="11.5" font-weight="400" fill="#5B6877" text-anchor="middle">新软值。</text>
    <rect x="375" y="290" width="135" height="80" rx="10" fill="#E2F2E9" stroke="#3E9E74" stroke-width="1.2"/>
    <text x="442" y="317" text-anchor="middle">Layer 2</text>
    <text x="442" y="341" font-size="11.5" font-weight="400" fill="#5B6877" text-anchor="middle">继续 RMW 更新。</text>
  </g>
  <g stroke="#3E9E74" stroke-width="1.8" fill="none">
    <path d="M 190 330 H 215" marker-end="url(#arrow-green)"/>
    <path d="M 350 330 H 375" marker-end="url(#arrow-green)"/>
  </g>
  <text x="55" y="397" font-size="11.5" fill="#5B6877">Layered：同一 iteration 内逐层更新，变量节点新值立即影响后续 layer，通常收敛更快。</text>

  <!-- ============ 小 H 的 layer 更新顺序 ============ -->
  <g filter="url(#soft)">
    <rect x="620" y="95" width="345" height="365" rx="14" fill="#F5F7FA" stroke="#C9D4E0" stroke-width="1.5"/>
  </g>
  <text x="640" y="122" font-size="15" font-weight="700" fill="#3E9E74">小 H 的 layer 更新顺序</text>

  <g font-size="11.5" text-anchor="middle">
    <rect x="640" y="145" width="50" height="28" fill="#DDE7F3"/>
    <text x="665" y="163" text-anchor="middle" font-weight="700" fill="#1B2433">layer</text>
    <rect x="690" y="145" width="45" height="28" fill="#DDE7F3"/>
    <text x="712" y="163" text-anchor="middle" font-weight="700" fill="#1B2433">row</text>
    <rect x="735" y="145" width="100" height="28" fill="#DDE7F3"/>
    <text x="785" y="163" text-anchor="middle" font-weight="700" fill="#1B2433" font-size="11">connected cols</text>
    <rect x="835" y="145" width="130" height="28" fill="#DDE7F3"/>
    <text x="900" y="163" text-anchor="middle" font-weight="700" fill="#1B2433" font-size="11">read-modify-write</text>
    <rect x="640" y="173" width="50" height="32" fill="#FFFFFF"/>
    <text x="665" y="193">0</text>
    <rect x="690" y="173" width="45" height="32" fill="#FFFFFF"/>
    <text x="712" y="193">c0</text>
    <rect x="735" y="173" width="100" height="32" fill="#FFFFFF"/>
    <text x="785" y="193" text-anchor="middle">v0,v1,v3</text>
    <rect x="835" y="173" width="130" height="32" fill="#FFFFFF"/>
    <text x="900" y="195" text-anchor="middle">更新 L0,L1,L3</text>
    <rect x="640" y="205" width="50" height="32" fill="#EDF2F8"/>
    <text x="665" y="225">1</text>
    <rect x="690" y="205" width="45" height="32" fill="#EDF2F8"/>
    <text x="712" y="225">c1</text>
    <rect x="735" y="205" width="100" height="32" fill="#EDF2F8"/>
    <text x="785" y="225" text-anchor="middle">v1,v2,v4</text>
    <rect x="835" y="205" width="130" height="32" fill="#EDF2F8"/>
    <text x="900" y="227" text-anchor="middle">使用新 L1</text>
    <rect x="640" y="237" width="50" height="32" fill="#FFFFFF"/>
    <text x="665" y="257">2</text>
    <rect x="690" y="237" width="45" height="32" fill="#FFFFFF"/>
    <text x="712" y="257">c2</text>
    <rect x="735" y="237" width="100" height="32" fill="#FFFFFF"/>
    <text x="785" y="257" text-anchor="middle">v0,v2,v5</text>
    <rect x="835" y="237" width="130" height="32" fill="#FFFFFF"/>
    <text x="900" y="259" text-anchor="middle">使用新 L0/L2</text>
  </g>

  <text x="640" y="300" font-size="11.5" fill="#5B6877">真实 NR 中一个 layer 通常对应 BG 的一个 row group；</text>
  <text x="640" y="318" font-size="11.5" fill="#5B6877">该 row group 通过 shift value 连接若干 column group，</text>
  <text x="640" y="336" font-size="11.5" fill="#5B6877">每个有效连接扩展成 Zc 个 bit-level 更新。</text>

  <g filter="url(#soft)">
    <rect x="640" y="360" width="305" height="85" rx="10" fill="#FAF5E4" stroke="#D9C179" stroke-width="1.2"/>
  </g>
  <text x="662" y="387" font-size="13" font-weight="700" fill="#1B2433">Zc 地址访问</text>
  <text x="662" y="411" font-size="11.5" fill="#5B6877">BG 边含 row group、column group 和 shift；</text>
  <text x="662" y="427" font-size="11.5" fill="#5B6877">地址为 base(column)+(local+shift) mod Zc。</text>

  <!-- ============ Layered decoder loop（闭环） ============ -->
  <g filter="url(#soft)">
    <rect x="35" y="480" width="930" height="320" rx="14" fill="#FAF5E4" stroke="#D9C179" stroke-width="1.5"/>
  </g>
  <text x="55" y="508" font-size="15" font-weight="700" fill="#1B2433">Layered decoder loop 与验证日志</text>

  <g font-size="12.5" font-weight="700" fill="#1B2433" text-anchor="middle">
    <rect x="442" y="530" width="115" height="50" rx="10" fill="#FFFFFF" stroke="#D18A2F" stroke-width="1.5"/>
    <text x="499" y="554" text-anchor="middle">iteration loop</text>
    <text x="499" y="574" font-size="10.5" font-weight="400" fill="#5B6877" text-anchor="middle">iter &lt; max_iter</text>
    <rect x="585" y="615" width="115" height="50" rx="10" fill="#FFFFFF" stroke="#D18A2F" stroke-width="1.5"/>
    <text x="642" y="639" text-anchor="middle">layer loop</text>
    <text x="642" y="659" font-size="10.5" font-weight="400" fill="#5B6877" text-anchor="middle">row group order</text>
    <rect x="442" y="710" width="115" height="50" rx="10" fill="#FFFFFF" stroke="#D18A2F" stroke-width="1.5"/>
    <text x="499" y="734" text-anchor="middle">CN update</text>
    <text x="499" y="754" font-size="10.5" font-weight="400" fill="#5B6877" text-anchor="middle">current layer</text>
    <rect x="300" y="615" width="115" height="50" rx="10" fill="#FFFFFF" stroke="#D18A2F" stroke-width="1.5"/>
    <text x="357" y="639" text-anchor="middle">VN update</text>
    <text x="357" y="659" font-size="10.5" font-weight="400" fill="#5B6877" text-anchor="middle">write soft value</text>
    <rect x="300" y="530" width="115" height="50" rx="10" fill="#FFFFFF" stroke="#D18A2F" stroke-width="1.5"/>
    <text x="357" y="554" text-anchor="middle">syndrome</text>
    <text x="357" y="574" font-size="10.5" font-weight="400" fill="#5B6877" text-anchor="middle">check schedule</text>
  </g>

  <g stroke="#D18A2F" stroke-width="1.8" fill="none">
    <path d="M 557 555 L 642 615" marker-end="url(#arrow-amber)"/>
    <path d="M 642 665 L 500 710" marker-end="url(#arrow-amber)"/>
    <path d="M 442 735 L 415 640" marker-end="url(#arrow-amber)"/>
    <path d="M 357 615 V 580" marker-end="url(#arrow-amber)"/>
    <path d="M 415 555 H 442" marker-end="url(#arrow-amber)"/>
  </g>

  <text x="55" y="785" font-size="11.5" font-weight="700" fill="#C4553D">最小验证日志：iteration、layer、syndrome_weight、updated_variable_count、bank_conflict_count、pipeline_stall_count。</text>
</svg>
