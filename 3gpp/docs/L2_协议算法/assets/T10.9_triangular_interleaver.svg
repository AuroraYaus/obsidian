<?xml version="1.0" encoding="UTF-8"?>
<!--
  @file    T10.9_triangular_interleaver.svg
  @brief   三角交织器写读示意：G=10、L=4 教学例，按行写入、按列读出
  @date    2026-08-04
  @note    教学重建：本地 TS 38.212 Rel-19 抽取件未包含三角交织器文本
           （§6.3.2.6 仅转引 §6.2.7），本图按 3GPP 公开标准结构重建，
           写读规则与数值标注"待核验"。依据 T2.1 基准图规格。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img">
  <title>三角交织器：按行写入、按列读出</title>
  <rect width="960" height="640" fill="#ffffff"/>
  <style>
    .title { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 18px; font-weight: bold; fill: #111; }
    .label { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 14px; fill: #222; }
    .small { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 12px; fill: #555; }
    .mono { font-family: monospace; font-size: 13px; fill: #333; }
  </style>
  <text x="480" y="32" text-anchor="middle" class="title">三角交织器：按行写入、按列读出（G=10，L=4）</text>
  <text x="480" y="54" text-anchor="middle" class="small">输入 g_0…g_9 写入三角形后按列读出，输出 f_0…f_9——相邻输入比特在输出中散布开</text>

