  <text x="150" y="508" class="small">相邻输入在输出中的间距：g0↔g1 隔 4 位、g1↔g2 隔 3 位、g2↔g3 隔 2 位（大部分 ≥3）</text>
  <text x="150" y="528" class="small">工程含义：深衰落或打孔破坏连续几个 RE 时，被破坏的是输出中相邻的 f 比特，</text>
  <text x="150" y="546" class="small">对应到输入 g 序列是分散的多个比特——每个只伤一点，纠错码可以救回来。</text>

  <text x="480" y="610" text-anchor="middle" class="small">读图：左边看"写入"（行优先），右边看"读出"（列优先）；同一三角形，两种遍历顺序</text>
</svg>
