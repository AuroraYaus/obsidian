<?xml version="1.0" encoding="UTF-8"?>
<!--
  @file    T10.7_NR_Polar_rate_recovery_flow.svg
  @brief   NR Polar 速率恢复接收端反操作结构图（重绘版）
  @date    2026-08-04
  @note    重绘原因：旧版含 N=8 缓存格的 LLR 数值与"NR Polar / NR LDPC / LTE Turbo
           速率恢复对比"三列表格；按项目原则数值与对比数据由讲义 Markdown 承载
           （T10.7 正文已有 N=8 E=10 状态表、LLR 初始化规则与三算法差异表），
           本图只画结构：接收端五节点反向链路、N=8 位置状态条（底色表达状态
           类别：punctured=风险、received=青瓷、shortened=琥珀、repeated=橄榄）、
           LLR 初始化规则四条、三类速率匹配状态卡。语义配色：Polar 青瓷 #2F6E71。
           依据 T2.1 基准图规格。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" role="img">
  <title>NR Polar 速率恢复：接收端反操作与 LLR 放回</title>
  <rect width="960" height="700" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2F6E71"/>
    </marker>
  </defs>
  <style>
    .title {{ font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 18px; font-weight: bold; fill: #111; }}
    .label {{ font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 14px; font-weight: bold; fill: #222; }}
    .small {{ font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 12px; fill: #333; }}
    .note  {{ font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 11px; fill: #5C6B7C; }}
    .cell  {{ font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 9px; font-weight: bold; fill: #333; }}
  </style>
  <text x="40" y="28" class="title">NR Polar 速率恢复：接收端反操作与 LLR 放回</text>
  <text x="40" y="50" class="small">发送端 sub-block interleaving → bit selection → coded-bit interleaving；接收端反向恢复</text>
  <line x1="40" y1="62" x2="920" y2="62" stroke="#9FC4C6" stroke-width="1.5"/>

  <!-- ============ 面板 1：五节点反向链路 ============ -->
  <rect x="40" y="72" width="880" height="130" rx="10" fill="#F2F7F7" stroke="#2F6E71" stroke-width="1.5"/>
  <text x="58" y="96" class="label">接收端反向流程：五节点链路</text>
  <rect x="56" y="104" width="160" height="84" rx="8" fill="#FFFFFF" stroke="#2F6E71" stroke-width="1.3"/>
  <text x="72" y="128" class="small">1. demapper</text>
  <text x="72" y="152" class="note">rx_llr[0:E-1]</text>
  <text x="72" y="172" class="note">Qm bit order</text>
  <rect x="228" y="104" width="160" height="84" rx="8" fill="#FFFFFF" stroke="#2F6E71" stroke-width="1.3"/>
  <text x="244" y="128" class="small">2. deinterleave</text>
  <text x="244" y="152" class="note">coded-bit（if enabled）</text>
  <text x="244" y="172" class="note">恢复 e 顺序</text>
  <rect x="400" y="104" width="160" height="84" rx="8" fill="#FFFFFF" stroke="#2F6E71" stroke-width="1.3"/>
  <text x="416" y="128" class="small">3. selection 反演</text>
  <text x="416" y="152" class="note">放回母码位置</text>
  <text x="416" y="172" class="note">三类状态初始化</text>
  <rect x="572" y="104" width="160" height="84" rx="8" fill="#FFFFFF" stroke="#2F6E71" stroke-width="1.3"/>
  <text x="588" y="128" class="small">4. sub-block 反置</text>
  <text x="588" y="152" class="note">32 块 pattern</text>
  <text x="588" y="172" class="note">Table 5.4.1.1-1</text>
  <rect x="744" y="104" width="160" height="84" rx="8" fill="#DCEBEC" stroke="#2F6E71" stroke-width="1.5"/>
  <text x="760" y="128" class="small">5. Polar 输入</text>
  <text x="760" y="152" class="note">L[0:N-1]</text>
  <text x="760" y="172" class="note">frozen mask</text>
  <path d="M 216 146 L 228 146" stroke="#2F6E71" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 388 146 L 400 146" stroke="#2F6E71" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 560 146 L 572 146" stroke="#2F6E71" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 732 146 L 744 146" stroke="#2F6E71" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ============ 面板 2：N=8 缓存位置条 ============ -->
  <rect x="40" y="222" width="880" height="150" rx="10" fill="#F2F7F7" stroke="#2F6E71" stroke-width="1.5"/>
  <text x="58" y="246" class="label">小型循环缓存例子：N=8, E=10（LLR 数值见讲义表）</text>
  <rect x="64" y="264" width="96" height="64" rx="6" fill="#F8E9E7" stroke="#A6403C" stroke-width="1.4"/>
  <text x="112" y="288" text-anchor="middle" class="cell">pos 0</text>
  <text x="112" y="310" text-anchor="middle" class="cell">punctured</text>
  <rect x="168" y="264" width="96" height="64" rx="6" fill="#F8E9E7" stroke="#A6403C" stroke-width="1.4"/>
  <text x="216" y="288" text-anchor="middle" class="cell">pos 1</text>
  <text x="216" y="310" text-anchor="middle" class="cell">punctured</text>
  <rect x="272" y="264" width="96" height="64" rx="6" fill="#E6F0F0" stroke="#2F6E71" stroke-width="1.4"/>
  <text x="320" y="288" text-anchor="middle" class="cell">pos 2</text>
  <text x="320" y="310" text-anchor="middle" class="cell">received</text>
  <rect x="376" y="264" width="96" height="64" rx="6" fill="#FDF3E4" stroke="#C9972E" stroke-width="1.4"/>
  <text x="424" y="288" text-anchor="middle" class="cell">pos 3</text>
  <text x="424" y="310" text-anchor="middle" class="cell">shortened</text>
  <rect x="480" y="264" width="96" height="64" rx="6" fill="#E6F0F0" stroke="#2F6E71" stroke-width="1.4"/>
  <text x="528" y="288" text-anchor="middle" class="cell">pos 4</text>
  <text x="528" y="310" text-anchor="middle" class="cell">received</text>
  <rect x="584" y="264" width="96" height="64" rx="6" fill="#E6F0F0" stroke="#2F6E71" stroke-width="1.4"/>
  <text x="632" y="288" text-anchor="middle" class="cell">pos 5</text>
  <text x="632" y="310" text-anchor="middle" class="cell">received</text>
  <rect x="688" y="264" width="96" height="64" rx="6" fill="#EFF1E2" stroke="#6C7A2E" stroke-width="1.4"/>
  <text x="736" y="288" text-anchor="middle" class="cell">pos 6</text>
  <text x="736" y="310" text-anchor="middle" class="cell">repeated</text>
  <rect x="792" y="264" width="96" height="64" rx="6" fill="#EFF1E2" stroke="#6C7A2E" stroke-width="1.4"/>
  <text x="840" y="288" text-anchor="middle" class="cell">pos 7</text>
  <text x="840" y="310" text-anchor="middle" class="cell">repeated</text>
  <text x="58" y="352" class="note">位置 0/1 punctured、位置 3 shortened、位置 6/7 repeated；LLR 值与累加结果见讲义 N=8 表</text>

  <!-- ============ 面板 3：LLR 初始化规则 ============ -->
  <rect x="40" y="392" width="880" height="150" rx="10" fill="#F8EEDC" stroke="#B06F2B" stroke-width="1.5"/>
  <text x="58" y="416" class="label">LLR 初始化规则</text>
  <text x="58" y="446" class="small">1. punctured / 未发送：未知 → 中性 LLR 0</text>
  <text x="58" y="472" class="small">2. shortened / 已知 0：强正 LLR，饱和到实现上限</text>
  <text x="58" y="498" class="small">3. repetition：同一母码位置多次观测 → 累加并饱和</text>
  <text x="58" y="524" class="small">4. sub-block 反置改变位置，不改变 LLR 符号约定</text>

  <!-- ============ 面板 4：三类状态卡 ============ -->
  <rect x="40" y="562" width="880" height="120" rx="10" fill="#F2F7F7" stroke="#2F6E71" stroke-width="1.5"/>
  <text x="58" y="586" class="label">三类速率匹配状态（协议差异见讲义对比表）</text>
  <rect x="56" y="596" width="272" height="54" rx="8" fill="#FFFFFF" stroke="#2F6E71" stroke-width="1.3"/>
  <text x="72" y="618" class="small">punctured：无观测</text>
  <text x="72" y="640" class="note">中性 0 + unknown_mask</text>
  <rect x="344" y="596" width="272" height="54" rx="8" fill="#FFFFFF" stroke="#2F6E71" stroke-width="1.3"/>
  <text x="360" y="618" class="small">shortened：已知约束</text>
  <text x="360" y="640" class="note">强 LLR + known_mask</text>
  <rect x="632" y="596" width="272" height="54" rx="8" fill="#FFFFFF" stroke="#2F6E71" stroke-width="1.3"/>
  <text x="648" y="618" class="small">repeated：多次观测</text>
  <text x="648" y="640" class="note">累加并饱和</text>
  <text x="58" y="672" class="note">与 NR LDPC、LTE Turbo 的速率恢复差异（母码对象、交织、重复处理）由讲义对比表承载</text>
</svg>
