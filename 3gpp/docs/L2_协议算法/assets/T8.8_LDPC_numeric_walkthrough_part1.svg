<?xml version="1.0" encoding="UTF-8"?>
<!--
  @file    T8.8_LDPC_numeric_walkthrough_part1.svg
  @brief   Toy LDPC 数值走读（一）：Tanner 图拓扑与一轮 CN 消息结构（重绘版）
  @date    2026-08-04
  @note    重绘原因：旧版含 Toy H 数值网格、初始 LLR/hard0 数值表与 9 条 CN 消息
           数值芯片；按项目原则数值由讲义 Markdown 承载（T8.8 正文已有 channel
           LLR 表、CN 连接表、9 条 r 数值表与初始 syndrome），本图只画结构：
           Tanner 图连接（初始校验失败的 c1/c2 用风险色标记）、9 条消息的流向
           与 r1→v2 排除自身输入的推导结构。语义配色：LDPC 橄榄 #6C7A2E、
           风险石榴 #A6403C。依据 T2.1 基准图规格。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img">
  <title>Toy LDPC Min-Sum 数值走读（一）：结构与消息流向</title>
  <rect width="960" height="560" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6C7A2E"/>
    </marker>
  </defs>
  <style>
    .title { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 18px; font-weight: bold; fill: #111; }
    .label { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 14px; font-weight: bold; fill: #222; }
    .small { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 12px; fill: #333; }
    .note  { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 11px; fill: #5C6B7C; }
    .node  { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 11px; font-weight: bold; fill: #222; }
    .chip  { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 12px; font-weight: bold; fill: #333; }
  </style>
  <text x="40" y="28" class="title">Toy LDPC Min-Sum 数值走读（一）：H 的 Tanner 图与一轮 CN 消息</text>
  <text x="40" y="50" class="small">channel LLR、9 条 r 数值、初始 syndrome 与 H 数值由讲义 T8.8 表格承载</text>
  <line x1="40" y1="62" x2="920" y2="62" stroke="#C4CC9E" stroke-width="1.5"/>

  <!-- ============ 面板 1：Tanner 图与初始判决 ============ -->
  <rect x="40" y="72" width="430" height="400" rx="10" fill="#F5F8F2" stroke="#6C7A2E" stroke-width="1.5"/>
  <text x="58" y="96" class="label">Toy H 的 Tanner 图与初始判决</text>
  <line x1="75" y1="195" x2="110" y2="300" stroke="#93A95A" stroke-width="1.3"/>
<line x1="145" y1="195" x2="110" y2="300" stroke="#93A95A" stroke-width="1.3"/>
<line x1="285" y1="195" x2="110" y2="300" stroke="#93A95A" stroke-width="1.3"/>
<line x1="145" y1="195" x2="250" y2="300" stroke="#93A95A" stroke-width="1.3"/>
<line x1="215" y1="195" x2="250" y2="300" stroke="#93A95A" stroke-width="1.3"/>
<line x1="355" y1="195" x2="250" y2="300" stroke="#93A95A" stroke-width="1.3"/>
<line x1="75" y1="195" x2="390" y2="300" stroke="#93A95A" stroke-width="1.3"/>
<line x1="215" y1="195" x2="390" y2="300" stroke="#93A95A" stroke-width="1.3"/>
<line x1="425" y1="195" x2="390" y2="300" stroke="#93A95A" stroke-width="1.3"/>

  <circle cx="75" cy="180" r="15" fill="#EDF2E2" stroke="#6C7A2E" stroke-width="1.6"/>
<text x="75" y="184" text-anchor="middle" class="node">v0</text>
<circle cx="145" cy="180" r="15" fill="#EDF2E2" stroke="#6C7A2E" stroke-width="1.6"/>
<text x="145" y="184" text-anchor="middle" class="node">v1</text>
<circle cx="215" cy="180" r="15" fill="#EDF2E2" stroke="#6C7A2E" stroke-width="1.6"/>
<text x="215" y="184" text-anchor="middle" class="node">v2</text>
<circle cx="285" cy="180" r="15" fill="#EDF2E2" stroke="#6C7A2E" stroke-width="1.6"/>
<text x="285" y="184" text-anchor="middle" class="node">v3</text>
<circle cx="355" cy="180" r="15" fill="#EDF2E2" stroke="#6C7A2E" stroke-width="1.6"/>
<text x="355" y="184" text-anchor="middle" class="node">v4</text>
<circle cx="425" cy="180" r="15" fill="#EDF2E2" stroke="#6C7A2E" stroke-width="1.6"/>
<text x="425" y="184" text-anchor="middle" class="node">v5</text>

  <rect x="75" y="300" width="70" height="28" rx="7" fill="#E2F2E9" stroke="#6C7A2E" stroke-width="1.6"/>
<text x="110" y="319" text-anchor="middle" class="node">c0</text>
<rect x="215" y="300" width="70" height="28" rx="7" fill="#F8E9E7" stroke="#A6403C" stroke-width="1.6"/>
<text x="250" y="319" text-anchor="middle" class="node">c1</text>
<rect x="355" y="300" width="70" height="28" rx="7" fill="#F8E9E7" stroke="#A6403C" stroke-width="1.6"/>
<text x="390" y="319" text-anchor="middle" class="node">c2</text>

  <text x="58" y="362" class="note">初始 hard0 使 c1、c2 校验失败：syndrome=[0,1,1]（数值见讲义）</text>
  <text x="58" y="384" class="note">红色描边 = 校验失败的校验节点，等待 CN 消息修正</text>
  <text x="58" y="406" class="note">H 的 9 个非零元素 = 图上 9 条边（H 矩阵见讲义）</text>

  <!-- ============ 面板 2：一轮 CN 消息结构 ============ -->
  <rect x="490" y="72" width="430" height="400" rx="10" fill="#F5F8F2" stroke="#6C7A2E" stroke-width="1.5"/>
  <text x="508" y="96" class="label">一轮 CN 消息：9 条 r 的流向（数值见讲义表）</text>
  <rect x="510" y="150" width="88" height="30" rx="6" fill="#EDF2E2" stroke="#6C7A2E" stroke-width="1.2"/>
<text x="554" y="170" text-anchor="middle" class="chip">r0→v0</text>
<rect x="610" y="150" width="88" height="30" rx="6" fill="#EDF2E2" stroke="#6C7A2E" stroke-width="1.2"/>
<text x="654" y="170" text-anchor="middle" class="chip">r0→v1</text>
<rect x="710" y="150" width="88" height="30" rx="6" fill="#EDF2E2" stroke="#6C7A2E" stroke-width="1.2"/>
<text x="754" y="170" text-anchor="middle" class="chip">r0→v3</text>
<rect x="510" y="192" width="88" height="30" rx="6" fill="#EDF2E2" stroke="#6C7A2E" stroke-width="1.2"/>
<text x="554" y="212" text-anchor="middle" class="chip">r1→v1</text>
<rect x="610" y="192" width="88" height="30" rx="6" fill="#EDF2E2" stroke="#6C7A2E" stroke-width="1.2"/>
<text x="654" y="212" text-anchor="middle" class="chip">r1→v2</text>
<rect x="710" y="192" width="88" height="30" rx="6" fill="#EDF2E2" stroke="#6C7A2E" stroke-width="1.2"/>
<text x="754" y="212" text-anchor="middle" class="chip">r1→v4</text>
<rect x="510" y="234" width="88" height="30" rx="6" fill="#EDF2E2" stroke="#6C7A2E" stroke-width="1.2"/>
<text x="554" y="254" text-anchor="middle" class="chip">r2→v0</text>
<rect x="610" y="234" width="88" height="30" rx="6" fill="#EDF2E2" stroke="#6C7A2E" stroke-width="1.2"/>
<text x="654" y="254" text-anchor="middle" class="chip">r2→v2</text>
<rect x="710" y="234" width="88" height="30" rx="6" fill="#EDF2E2" stroke="#6C7A2E" stroke-width="1.2"/>
<text x="754" y="254" text-anchor="middle" class="chip">r2→v5</text>

  <text x="508" y="278" class="note">每条消息 r_i→v_j 由 c_i 排除 v_j 自身输入后生成</text>
  <rect x="510" y="300" width="390" height="108" rx="8" fill="#FFFFFF" stroke="#6C7A2E" stroke-width="1.3"/>
  <text x="526" y="324" class="small">示例 r1→v2 的推导结构：排除 v2 自身</text>
  <text x="526" y="348" class="note">其余输入：v1 与 v4 的消息</text>
  <text x="526" y="370" class="note">符号 = 其余输入符号之积；幅度 = 最小绝对值</text>
  <text x="526" y="392" class="note">具体数值（如 -0.7）见讲义 9 条 r 表</text>
  <text x="508" y="446" class="note">初始 syndrome 与 hard0 的逐位数值由讲义承载</text>
</svg>
