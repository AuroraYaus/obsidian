<?xml version="1.0" encoding="UTF-8"?>
<!--
  @file    T10.5_NR_Polar_SCL_N4_L2_paths.svg
  @brief   N=4, L=2 Polar SCL 解码树、阶段流程与剪枝检查点（重绘版）
  @date    2026-08-04
  @note    重绘原因：旧版含"路径表"六行数值表格（step/candidate path/u2 PM/
           u3 PM/total PM/status）；按项目原则数值由讲义 Markdown 承载
           （T10.5 正文已有叶子 LLR 表、u2 分裂表、u3 排序表），本图只画结构：
           N=4 解码树（frozen 位单支、information 位分裂、L=2 存活路径加粗）、
           五阶段流程卡、剪枝必须同步复制的路径数据四件套。PM 约定越小越好。
           语义配色：Polar 青瓷 #2F6E71，剪枝风险石榴 #A6403C。
           依据 T2.1 基准图规格。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" role="img">
  <title>N=4, L=2 Polar SCL 解码树与剪枝</title>
  <rect width="960" height="700" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2F6E71"/>
    </marker>
  </defs>
  <style>
    .title {{ font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 18px; font-weight: bold; fill: #111; }}
    .label {{ font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 14px; font-weight: bold; fill: #222; }}
    .small {{ font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 12px; fill: #333; }}
    .note  {{ font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 11px; fill: #5C6B7C; }}
    .leaf  {{ font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 10px; font-weight: bold; fill: #333; }}
  </style>
  <text x="40" y="28" class="title">N=4, L=2 Polar SCL：解码树、路径分裂与剪枝</text>
  <text x="40" y="50" class="small">叶子 LLR、u2/u3 的 PM 数值与排序表由讲义 T10.5 表格承载；PM 越小越好</text>
  <line x1="40" y1="62" x2="920" y2="62" stroke="#9FC4C6" stroke-width="1.5"/>

  <!-- ============ 面板 1：N=4 解码树 ============ -->
  <rect x="40" y="72" width="560" height="380" rx="10" fill="#F2F7F7" stroke="#2F6E71" stroke-width="1.5"/>
  <text x="58" y="96" class="label">N=4 解码树：frozen 单支、information 分裂</text>
  <line x1="150" y1="299" x2="180" y2="299" stroke="#7FA6A8" stroke-width="1.6"/>
  <line x1="250" y1="299" x2="300" y2="214" stroke="#7FA6A8" stroke-width="1.6"/>
  <line x1="250" y1="299" x2="300" y2="384" stroke="#7FA6A8" stroke-width="1.6"/>
  <line x1="370" y1="214" x2="440" y2="130" stroke="#7FA6A8" stroke-width="1.6"/>
  <line x1="370" y1="214" x2="440" y2="200" stroke="#7FA6A8" stroke-width="1.6"/>
  <line x1="370" y1="384" x2="440" y2="270" stroke="#7FA6A8" stroke-width="1.6"/>
  <line x1="370" y1="384" x2="440" y2="340" stroke="#7FA6A8" stroke-width="1.6"/>
  <line x1="150" y1="299" x2="180" y2="299" stroke="#2F6E71" stroke-width="3"/>
  <line x1="250" y1="299" x2="300" y2="214" stroke="#2F6E71" stroke-width="3"/>
  <line x1="250" y1="299" x2="300" y2="384" stroke="#2F6E71" stroke-width="3"/>
  <line x1="370" y1="214" x2="440" y2="130" stroke="#2F6E71" stroke-width="3"/>
  <line x1="370" y1="384" x2="440" y2="270" stroke="#2F6E71" stroke-width="3"/>
  <rect x="80" y="285" width="70" height="28" rx="6" fill="#2F6E71"/>
  <text x="115" y="304" text-anchor="middle" class="small" fill="#FFFFFF">u0 frozen</text>
  <rect x="180" y="285" width="70" height="28" rx="6" fill="#2F6E71"/>
  <text x="215" y="304" text-anchor="middle" class="small" fill="#FFFFFF">u1 frozen</text>
  <rect x="300" y="200" width="70" height="28" rx="6" fill="#DCEBEC" stroke="#2F6E71" stroke-width="1.5"/>
  <text x="335" y="219" text-anchor="middle" class="small">u2=0</text>
  <rect x="300" y="370" width="70" height="28" rx="6" fill="#DCEBEC" stroke="#2F6E71" stroke-width="1.5"/>
  <text x="335" y="389" text-anchor="middle" class="small">u2=1</text>
  <rect x="440" y="110" width="100" height="40" rx="6" fill="#DCEBEC" stroke="#2F6E71" stroke-width="2"/>
  <text x="490" y="126" text-anchor="middle" class="leaf">[0000]</text>
  <text x="490" y="142" text-anchor="middle" class="leaf">保留</text>
  <rect x="440" y="180" width="100" height="40" rx="6" fill="#FFFFFF" stroke="#A6403C" stroke-width="1.4"/>
  <text x="490" y="196" text-anchor="middle" class="leaf">[0001]</text>
  <text x="490" y="212" text-anchor="middle" class="leaf">剪枝</text>
  <rect x="440" y="250" width="100" height="40" rx="6" fill="#DCEBEC" stroke="#2F6E71" stroke-width="2"/>
  <text x="490" y="266" text-anchor="middle" class="leaf">[0010]</text>
  <text x="490" y="282" text-anchor="middle" class="leaf">保留</text>
  <rect x="440" y="320" width="100" height="40" rx="6" fill="#FFFFFF" stroke="#A6403C" stroke-width="1.4"/>
  <text x="490" y="336" text-anchor="middle" class="leaf">[0011]</text>
  <text x="490" y="352" text-anchor="middle" class="leaf">剪枝</text>
  <text x="58" y="416" class="note">frozen 位强制 0 不分裂；information 位分裂 0/1</text>
  <text x="58" y="438" class="note">加粗 = L=2 存活路径；PM 数值与排序见讲义路径表</text>

  <!-- ============ 面板 2：五阶段流程 ============ -->
  <rect x="620" y="72" width="300" height="380" rx="10" fill="#F2F7F7" stroke="#2F6E71" stroke-width="1.5"/>
  <text x="638" y="96" class="label">五阶段流程</text>
  <rect x="640" y="110" width="260" height="48" rx="8" fill="#FFFFFF" stroke="#2F6E71" stroke-width="1.3"/>
  <text x="656" y="132" class="small">初始：空路径</text>
  <text x="656" y="150" class="note">active 路径数为 1</text>
  <path d="M 770 158 L 770 172" stroke="#2F6E71" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="640" y="172" width="260" height="48" rx="8" fill="#FFFFFF" stroke="#2F6E71" stroke-width="1.3"/>
  <text x="656" y="194" class="small">u0 / u1 frozen：强制 0</text>
  <text x="656" y="212" class="note">不分裂，PM 不变</text>
  <path d="M 770 220 L 770 234" stroke="#2F6E71" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="640" y="234" width="260" height="48" rx="8" fill="#FFFFFF" stroke="#2F6E71" stroke-width="1.3"/>
  <text x="656" y="256" class="small">u2 information：分裂 0/1</text>
  <text x="656" y="274" class="note">L=2，两条都保留</text>
  <path d="M 770 282 L 770 296" stroke="#2F6E71" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="640" y="296" width="260" height="48" rx="8" fill="#FFFFFF" stroke="#2F6E71" stroke-width="1.3"/>
  <text x="656" y="318" class="small">u3 information：四条候选</text>
  <text x="656" y="336" class="note">每条路径各分裂一次</text>
  <path d="M 770 344 L 770 358" stroke="#2F6E71" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="640" y="358" width="260" height="48" rx="8" fill="#DCEBEC" stroke="#2F6E71" stroke-width="1.4"/>
  <text x="656" y="380" class="small">按 PM 排序，保留前 L=2</text>
  <text x="656" y="398" class="note">其余两条剪枝</text>
  <text x="638" y="436" class="note">候选路径、PM 与保留/剪枝状态见讲义排序表</text>

  <!-- ============ 面板 3：工程检测点 ============ -->
  <rect x="40" y="472" width="880" height="210" rx="10" fill="#F8EEDC" stroke="#B06F2B" stroke-width="1.5"/>
  <text x="58" y="496" class="label">剪枝必须同步复制：路径数据四件套</text>
  <rect x="56" y="514" width="196" height="60" rx="8" fill="#FFFFFF" stroke="#B06F2B" stroke-width="1.3"/>
  <text x="72" y="538" class="small">path bits</text>
  <text x="72" y="560" class="note">已判决前缀</text>
  <rect x="276" y="514" width="196" height="60" rx="8" fill="#FFFFFF" stroke="#B06F2B" stroke-width="1.3"/>
  <text x="292" y="538" class="small">PM</text>
  <text x="292" y="560" class="note">累计不一致惩罚</text>
  <rect x="496" y="514" width="196" height="60" rx="8" fill="#FFFFFF" stroke="#B06F2B" stroke-width="1.3"/>
  <text x="512" y="538" class="small">LLR state</text>
  <text x="512" y="560" class="note">树节点中间 LLR</text>
  <rect x="716" y="514" width="196" height="60" rx="8" fill="#FFFFFF" stroke="#B06F2B" stroke-width="1.3"/>
  <text x="732" y="538" class="small">partial sums</text>
  <text x="732" y="560" class="note">硬判决回传值</text>
  <text x="58" y="608" class="small">若只复制 bit 而漏复制 partial sum，下一次 g 函数会使用错误历史，候选路径不可复现</text>
  <text x="58" y="632" class="note">CRC-aided SCL（T10.6）还需同步 CRC 状态；PM 最小路径不一定是最终输出</text>
  <text x="58" y="656" class="note">u2/u3 的叶子 LLR 与 PM 增量数值由讲义路径表承载</text>
</svg>
