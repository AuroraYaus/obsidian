<?xml version="1.0" encoding="UTF-8"?>
<!--
  @file    T11.1_Turbo_LDPC_Polar_algorithm_comparison.svg
  @brief   三种译码算法的图模型对比：trellis / Tanner graph / 解码树 + 算法档案
  @date    2026-08-04
  @note    v4 版式重构：v2/v3 三列纵长版式信息密度低、留白多；v4 压缩画布为
           960x580，每列 = 图模型示意 + 算法档案卡片（本质/软信息/瓶颈/落点）。
           对比数据由讲义 Markdown 表格承载，本图以图模型示意补充表格无法表达的
           拓扑结构。依据 T2.1 基准图规格。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img">
  <title>三种译码算法的图模型与算法档案</title>
  <rect width="960" height="580" fill="#ffffff"/>
  <style>
    .title { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 18px; font-weight: bold; fill: #111; }
    .label { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 14px; fill: #222; }
    .small { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 12px; fill: #555; }
  </style>
  <text x="480" y="30" text-anchor="middle" class="title">三种译码算法的图模型与算法档案</text>
  <text x="480" y="52" text-anchor="middle" class="small">同一份 channel LLR，三种图模型、三种消息流——对比数据见讲义 Markdown 表格，本图补充表格之外的拓扑结构</text>

  <!-- ============ 列 1：LTE Turbo ============ -->
  <rect x="60" y="72" width="280" height="452" rx="10" fill="#FDF8F1" stroke="#B06F2B" stroke-width="1.5"/>
  <text x="82" y="100" class="label" font-weight="bold" fill="#8D5A1E">LTE Turbo：trellis + SISO 迭代</text>
  <circle cx="140" cy="160" r="7" fill="#B06F2B"/>
  <circle cx="140" cy="210" r="7" fill="#B06F2B"/>
  <circle cx="140" cy="260" r="7" fill="#B06F2B"/>
  <circle cx="140" cy="310" r="7" fill="#B06F2B"/>
  <circle cx="260" cy="160" r="7" fill="#B06F2B"/>
  <circle cx="260" cy="210" r="7" fill="#B06F2B"/>
  <circle cx="260" cy="260" r="7" fill="#B06F2B"/>
  <circle cx="260" cy="310" r="7" fill="#B06F2B"/>
  <line x1="140" y1="160" x2="260" y2="160" stroke="#C98F4E" stroke-width="1.4"/>
  <line x1="140" y1="160" x2="260" y2="210" stroke="#C98F4E" stroke-width="1.4"/>
  <line x1="140" y1="210" x2="260" y2="160" stroke="#C98F4E" stroke-width="1.4"/>
  <line x1="140" y1="210" x2="260" y2="260" stroke="#C98F4E" stroke-width="1.4"/>
  <line x1="140" y1="260" x2="260" y2="210" stroke="#C98F4E" stroke-width="1.4"/>
  <line x1="140" y1="260" x2="260" y2="310" stroke="#C98F4E" stroke-width="1.4"/>
  <line x1="140" y1="310" x2="260" y2="260" stroke="#C98F4E" stroke-width="1.4"/>
  <line x1="140" y1="310" x2="260" y2="310" stroke="#C98F4E" stroke-width="1.4"/>
  <text x="200" y="344" text-anchor="middle" class="small">状态 s_0…s_3（示意），一步递推</text>
  <text x="200" y="366" text-anchor="middle" class="small">两个 SISO decoder 经交织器交换外信息</text>
  <rect x="82" y="392" width="248" height="110" rx="6" fill="#FFFFFF" stroke="#B06F2B" stroke-width="1.2"/>
  <text x="97" y="416" class="small"><tspan font-weight="bold" fill="#8D5A1E">算法本质</tspan>：SISO 递推（BCJR/Log-MAP）</text>
  <text x="97" y="440" class="small"><tspan font-weight="bold" fill="#8D5A1E">软信息</tspan>：channel LLR + 外信息</text>
  <text x="97" y="464" class="small"><tspan font-weight="bold" fill="#8D5A1E">瓶颈</tspan>：度量递推、交织地址、迭代时延</text>
  <text x="97" y="488" class="small"><tspan font-weight="bold" fill="#8D5A1E">落点</tspan>：LTE 数据链路（UL/DL-SCH）</text>

  <!-- ============ 列 2：NR LDPC ============ -->
  <rect x="355" y="72" width="280" height="452" rx="10" fill="#F5F8F2" stroke="#6C7A2E" stroke-width="1.5"/>
  <text x="377" y="100" class="label" font-weight="bold" fill="#525F1F">NR LDPC：Tanner 图 + 消息传递</text>
  <circle cx="420" cy="175" r="7" fill="#6C7A2E"/>
  <circle cx="470" cy="175" r="7" fill="#6C7A2E"/>
  <circle cx="520" cy="175" r="7" fill="#6C7A2E"/>
  <circle cx="570" cy="175" r="7" fill="#6C7A2E"/>
  <rect x="435" y="300" width="20" height="16" rx="2" fill="#FFFFFF" stroke="#6C7A2E" stroke-width="1.3"/>
  <rect x="495" y="300" width="20" height="16" rx="2" fill="#FFFFFF" stroke="#6C7A2E" stroke-width="1.3"/>
  <rect x="555" y="300" width="20" height="16" rx="2" fill="#FFFFFF" stroke="#6C7A2E" stroke-width="1.3"/>
  <line x1="420" y1="182" x2="445" y2="300" stroke="#93A95A" stroke-width="1.3"/>
  <line x1="420" y1="182" x2="505" y2="300" stroke="#93A95A" stroke-width="1.3"/>
  <line x1="470" y1="182" x2="445" y2="300" stroke="#93A95A" stroke-width="1.3"/>
  <line x1="470" y1="182" x2="565" y2="300" stroke="#93A95A" stroke-width="1.3"/>
  <line x1="520" y1="182" x2="505" y2="300" stroke="#93A95A" stroke-width="1.3"/>
  <line x1="520" y1="182" x2="565" y2="300" stroke="#93A95A" stroke-width="1.3"/>
  <line x1="570" y1="182" x2="505" y2="300" stroke="#93A95A" stroke-width="1.3"/>
  <line x1="570" y1="182" x2="565" y2="300" stroke="#93A95A" stroke-width="1.3"/>
  <text x="495" y="164" text-anchor="middle" class="small">变量节点 VN（码字比特）</text>
  <text x="495" y="340" text-anchor="middle" class="small">校验节点 CN（校验方程）</text>
  <text x="495" y="366" text-anchor="middle" class="small">VN ↔ CN 消息沿边迭代</text>
  <rect x="372" y="392" width="248" height="110" rx="6" fill="#FFFFFF" stroke="#6C7A2E" stroke-width="1.2"/>
  <text x="387" y="416" class="small"><tspan font-weight="bold" fill="#525F1F">算法本质</tspan>：消息传递（BP/Min-Sum）</text>
  <text x="387" y="440" class="small"><tspan font-weight="bold" fill="#525F1F">软信息</tspan>：VN/CN 消息 + posterior</text>
  <text x="387" y="464" class="small"><tspan font-weight="bold" fill="#525F1F">瓶颈</tspan>：min1/min2、分层调度</text>
  <text x="387" y="488" class="small"><tspan font-weight="bold" fill="#525F1F">落点</tspan>：NR 数据链路（UL/DL-SCH）</text>

  <!-- ============ 列 3：NR Polar ============ -->
  <rect x="650" y="72" width="280" height="452" rx="10" fill="#F2F7F7" stroke="#2F6E71" stroke-width="1.5"/>
  <text x="672" y="100" class="label" font-weight="bold" fill="#1E4E50">NR Polar：解码树 + SCL 路径</text>
  <circle cx="790" cy="150" r="7" fill="#2F6E71"/>
  <circle cx="745" cy="225" r="7" fill="#2F6E71"/>
  <circle cx="835" cy="225" r="7" fill="#2F6E71"/>
  <circle cx="677" cy="300" r="7" fill="#2F6E71"/>
  <circle cx="753" cy="300" r="7" fill="#2F6E71"/>
  <circle cx="828" cy="300" r="7" fill="#2F6E71"/>
  <circle cx="902" cy="300" r="7" fill="#2F6E71"/>
  <line x1="790" y1="157" x2="745" y2="218" stroke="#7FA6A8" stroke-width="1.3"/>
  <line x1="790" y1="157" x2="835" y2="218" stroke="#7FA6A8" stroke-width="1.3"/>
  <line x1="745" y1="232" x2="677" y2="293" stroke="#7FA6A8" stroke-width="1.3"/>
  <line x1="745" y1="232" x2="753" y2="293" stroke="#7FA6A8" stroke-width="1.3"/>
  <line x1="835" y1="232" x2="828" y2="293" stroke="#7FA6A8" stroke-width="1.3"/>
  <line x1="835" y1="232" x2="902" y2="293" stroke="#7FA6A8" stroke-width="1.3"/>
  <line x1="790" y1="157" x2="745" y2="218" stroke="#B06F2B" stroke-width="2.2"/>
  <line x1="745" y1="232" x2="677" y2="293" stroke="#B06F2B" stroke-width="2.2"/>
  <line x1="790" y1="157" x2="835" y2="218" stroke="#B06F2B" stroke-width="2.2"/>
  <line x1="835" y1="232" x2="902" y2="293" stroke="#B06F2B" stroke-width="2.2"/>
  <text x="672" y="340" class="small">N=4 解码树；加粗 = SCL L=2 存活路径</text>
  <text x="672" y="366" class="small">frozen 位约束 + CRC 辅助最终选择</text>
  <rect x="672" y="392" width="248" height="110" rx="6" fill="#FFFFFF" stroke="#2F6E71" stroke-width="1.2"/>
  <text x="687" y="416" class="small"><tspan font-weight="bold" fill="#1E4E50">算法本质</tspan>：SC / SCL 路径搜索 + CRC</text>
  <text x="687" y="440" class="small"><tspan font-weight="bold" fill="#1E4E50">软信息</tspan>：PM + frozen + CRC</text>
  <text x="687" y="464" class="small"><tspan font-weight="bold" fill="#1E4E50">瓶颈</tspan>：sorter、路径内存、PM 更新</text>
  <text x="687" y="488" class="small"><tspan font-weight="bold" fill="#1E4E50">落点</tspan>：NR 控制链路（DCI / UCI）</text>

  <text x="480" y="560" text-anchor="middle" class="small">读图：三种图模型承载同一种软信息（LLR），消息流与瓶颈不同——数值与协议细节见讲义对比表</text>
</svg>
