<?xml version="1.0" encoding="UTF-8"?>
<!--
  @file    T8.4_LDPC_Tanner_syndrome_toy.svg
  @brief   LDPC Tanner 图拓扑、一轮消息流与 syndrome 判定结构（重绘版）
  @date    2026-08-04
  @note    重绘原因：旧版含 3×6 校验矩阵 H 数值网格与 GF(2) syndrome 手算数值行；
           按项目原则数据由讲义 Markdown 承载（T8.4 正文已有 H 矩阵、校验方程、
           Tanner 边、syndrome 手算与失败对照表），本图只画表格表达不了的拓扑：
           6 个变量节点与 3 个校验节点的连接结构、消息流四步链、syndrome 全零
           判定分支。语义配色：LDPC 橄榄 #6C7A2E。依据 T2.1 基准图规格。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img">
  <title>LDPC Tanner 图、syndrome 与一轮消息流</title>
  <rect width="960" height="620" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6C7A2E"/>
    </marker>
  </defs>
  <style>
    .title { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 18px; font-weight: bold; fill: #111; }
    .label { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 14px; font-weight: bold; fill: #222; }
    .small { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 12px; fill: #333; }
    .note  { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 11px; fill: #5C6B7C; }
    .node  { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 11px; font-weight: bold; fill: #222; }
  </style>
  <text x="40" y="28" class="title">LDPC Tanner 图、syndrome 与一轮消息流</text>
  <text x="40" y="50" class="small">教学 3×6 校验矩阵：H 数值、校验方程与 syndrome 手算由讲义 T8.4 表格承载</text>
  <line x1="40" y1="62" x2="920" y2="62" stroke="#C4CC9E" stroke-width="1.5"/>

  <!-- ============ 面板 1：Tanner 图拓扑 ============ -->
  <rect x="40" y="72" width="430" height="500" rx="10" fill="#F5F8F2" stroke="#6C7A2E" stroke-width="1.5"/>
  <text x="58" y="96" class="label">Tanner 图：H 的行列变成节点和边</text>
  <line x1="75" y1="216" x2="110" y2="340" stroke="#93A95A" stroke-width="1.3"/>
<line x1="145" y1="216" x2="110" y2="340" stroke="#93A95A" stroke-width="1.3"/>
<line x1="285" y1="216" x2="110" y2="340" stroke="#93A95A" stroke-width="1.3"/>
<line x1="145" y1="216" x2="215" y2="340" stroke="#93A95A" stroke-width="1.3"/>
<line x1="215" y1="216" x2="215" y2="340" stroke="#93A95A" stroke-width="1.3"/>
<line x1="355" y1="216" x2="215" y2="340" stroke="#93A95A" stroke-width="1.3"/>
<line x1="75" y1="216" x2="320" y2="340" stroke="#93A95A" stroke-width="1.3"/>
<line x1="215" y1="216" x2="320" y2="340" stroke="#93A95A" stroke-width="1.3"/>
<line x1="425" y1="216" x2="320" y2="340" stroke="#93A95A" stroke-width="1.3"/>

  <circle cx="75" cy="200" r="16" fill="#EDF2E2" stroke="#6C7A2E" stroke-width="1.6"/>
<text x="75" y="204" text-anchor="middle" class="node">v0</text>
<circle cx="145" cy="200" r="16" fill="#EDF2E2" stroke="#6C7A2E" stroke-width="1.6"/>
<text x="145" y="204" text-anchor="middle" class="node">v1</text>
<circle cx="215" cy="200" r="16" fill="#EDF2E2" stroke="#6C7A2E" stroke-width="1.6"/>
<text x="215" y="204" text-anchor="middle" class="node">v2</text>
<circle cx="285" cy="200" r="16" fill="#EDF2E2" stroke="#6C7A2E" stroke-width="1.6"/>
<text x="285" y="204" text-anchor="middle" class="node">v3</text>
<circle cx="355" cy="200" r="16" fill="#EDF2E2" stroke="#6C7A2E" stroke-width="1.6"/>
<text x="355" y="204" text-anchor="middle" class="node">v4</text>
<circle cx="425" cy="200" r="16" fill="#EDF2E2" stroke="#6C7A2E" stroke-width="1.6"/>
<text x="425" y="204" text-anchor="middle" class="node">v5</text>

  <rect x="75" y="340" width="70" height="30" rx="7" fill="#E2F2E9" stroke="#6C7A2E" stroke-width="1.5"/>
<text x="110" y="360" text-anchor="middle" class="node">c0</text>
<rect x="180" y="340" width="70" height="30" rx="7" fill="#E2F2E9" stroke="#6C7A2E" stroke-width="1.5"/>
<text x="215" y="360" text-anchor="middle" class="node">c1</text>
<rect x="285" y="340" width="70" height="30" rx="7" fill="#E2F2E9" stroke="#6C7A2E" stroke-width="1.5"/>
<text x="320" y="360" text-anchor="middle" class="node">c2</text>

  <text x="58" y="430" class="note">H 的每个 1 对应一条边：变量节点 vj 连接到校验节点 ci</text>
  <text x="58" y="452" class="note">9 条边 = H 的 9 个非零元素（H 数值见讲义）</text>
  <text x="58" y="474" class="note">变量节点存候选比特 LLR；校验节点存一条校验方程</text>

  <!-- ============ 面板 2：一轮消息流与 syndrome 检查 ============ -->
  <rect x="490" y="72" width="430" height="500" rx="10" fill="#F5F8F2" stroke="#6C7A2E" stroke-width="1.5"/>
  <text x="508" y="96" class="label">一轮消息流与 syndrome 检查</text>
  
    <rect x="510" y="120" width="390" height="72" rx="8" fill="#FFFFFF" stroke="#6C7A2E" stroke-width="1.3"/>
    <text x="526" y="144" class="small">1. VN → CN：发 channel LLR</text>
    <text x="526" y="166" class="note">变量节点携带初始证据沿边送出</text>
    <text x="526" y="184" class="note">相邻校验节点各收到一份</text>
    <rect x="510" y="208" width="390" height="72" rx="8" fill="#FFFFFF" stroke="#6C7A2E" stroke-width="1.3"/>
    <text x="526" y="232" class="small">2. CN → VN：外信息</text>
    <text x="526" y="254" class="note">排除目标边自身的输入</text>
    <text x="526" y="272" class="note">符号与幅度由其他输入决定</text>
    <rect x="510" y="296" width="390" height="72" rx="8" fill="#FFFFFF" stroke="#6C7A2E" stroke-width="1.3"/>
    <text x="526" y="320" class="small">3. VN 合成 posterior</text>
    <text x="526" y="342" class="note">channel LLR 与全部 CN 消息求和</text>
    <text x="526" y="360" class="note">按符号做 hard decision</text>
    <rect x="510" y="384" width="390" height="72" rx="8" fill="#FFFFFF" stroke="#6C7A2E" stroke-width="1.3"/>
    <text x="526" y="408" class="small">4. syndrome 检查</text>
    <text x="526" y="430" class="note">硬判决代入 H·x^T 模 2</text>
    <text x="526" y="448" class="note">全零 = 满足 LDPC 约束</text>
  <path d="M 705 192 L 705 208" stroke="#6C7A2E" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 705 280 L 705 296" stroke="#6C7A2E" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 705 368 L 705 384" stroke="#6C7A2E" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="510" y="480" width="390" height="48" rx="8" fill="#EDF2E2" stroke="#6C7A2E" stroke-width="1.4"/>
  <text x="705" y="510" text-anchor="middle" class="small">全零 → early stop；非零 → 继续下一轮迭代</text>
  <text x="508" y="556" class="note">消息数值、syndrome 手算与失败对照均由讲义表格承载</text>
</svg>
