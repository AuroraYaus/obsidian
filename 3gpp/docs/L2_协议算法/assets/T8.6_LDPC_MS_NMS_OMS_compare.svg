<?xml version="1.0" encoding="UTF-8"?>
<!--
  @file    T8.6_LDPC_MS_NMS_OMS_compare.svg
  @brief   LDPC Min-Sum、NMS 与 OMS 校验节点更新的结构对比（重绘版）
  @date    2026-08-04
  @note    重绘原因：旧版含"同一组输入下的三种输出"数值对比表（输出边/符号/幅度/
           MS/NMS/OMS 五列四行）；按项目原则对比数据由讲义 Markdown 承载
           （T8.6 正文已有完整逐边输出表与 min1/min2 数值），本图只画结构：
           check-node 输入拓扑、min1/min2 排除自身输入的机制、SPA/MS/NMS/OMS
           四条处理链与工程取舍。教学输入 q=[+2.4,-0.9,+1.6,-3.1] 见讲义。
           语义配色：LDPC 橄榄 #6C7A2E，风险石榴 #A6403C 用于 OMS 截零。
           依据 T2.1 基准图规格。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" role="img">
  <title>LDPC Min-Sum、NMS 与 OMS 校验节点更新结构</title>
  <rect width="960" height="660" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6C7A2E"/>
    </marker>
  </defs>
  <style>
    .title {{ font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 18px; font-weight: bold; fill: #111; }}
    .label {{ font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 14px; font-weight: bold; fill: #222; }}
    .small {{ font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 12px; fill: #333; }}
    .note  {{ font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 11px; fill: #5C6B7C; }}
    .node  {{ font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 12px; font-weight: bold; fill: #222; }}
  </style>
  <text x="40" y="28" class="title">LDPC 校验节点更新：Min-Sum、NMS 与 OMS 的结构对比</text>
  <text x="40" y="50" class="small">输入 q=[+2.4,-0.9,+1.6,-3.1] 及逐边 MS/NMS/OMS 输出数值由讲义 T8.6 表格承载</text>
  <line x1="40" y1="62" x2="920" y2="62" stroke="#C4CC9E" stroke-width="1.5"/>

  <!-- ============ 面板 1：check-node 输入拓扑 ============ -->
  <rect x="40" y="72" width="430" height="250" rx="10" fill="#F5F8F2" stroke="#6C7A2E" stroke-width="1.5"/>
  <text x="58" y="96" class="label">check-node 输入拓扑</text>
  <line x1="88" y1="166" x2="200" y2="200" stroke="#93A95A" stroke-width="1.5"/>
  <line x1="88" y1="266" x2="200" y2="226" stroke="#93A95A" stroke-width="1.5"/>
  <line x1="390" y1="166" x2="270" y2="200" stroke="#93A95A" stroke-width="1.5"/>
  <line x1="390" y1="266" x2="270" y2="226" stroke="#93A95A" stroke-width="1.5"/>
  <circle cx="88" cy="150" r="24" fill="#EDF2E2" stroke="#6C7A2E" stroke-width="1.6"/>
  <text x="88" y="154" text-anchor="middle" class="node">q0</text>
  <circle cx="88" cy="250" r="24" fill="#EDF2E2" stroke="#6C7A2E" stroke-width="1.6"/>
  <text x="88" y="254" text-anchor="middle" class="node">q1</text>
  <circle cx="390" cy="150" r="24" fill="#EDF2E2" stroke="#6C7A2E" stroke-width="1.6"/>
  <text x="390" y="154" text-anchor="middle" class="node">q2</text>
  <circle cx="390" cy="250" r="24" fill="#EDF2E2" stroke="#6C7A2E" stroke-width="1.6"/>
  <text x="390" y="254" text-anchor="middle" class="node">q3</text>
  <rect x="200" y="182" width="70" height="36" rx="8" fill="#E2F2E9" stroke="#6C7A2E" stroke-width="1.6"/>
  <text x="235" y="206" text-anchor="middle" class="node">CN</text>
  <text x="58" y="300" class="note">给某条边输出时只看其他输入：符号取乘积，幅度取最小值</text>

  <!-- ============ 面板 2：min1/min2 机制 ============ -->
  <rect x="490" y="72" width="430" height="250" rx="10" fill="#F5F8F2" stroke="#6C7A2E" stroke-width="1.5"/>
  <text x="508" y="96" class="label">min1/min2：排除自身输入的机制</text>
  <rect x="510" y="122" width="60" height="28" rx="6" fill="#FFFFFF" stroke="#6C7A2E" stroke-width="1.3"/>
  <text x="540" y="141" text-anchor="middle" class="small">|q0|</text>
  <rect x="586" y="122" width="60" height="28" rx="6" fill="#EDF2E2" stroke="#6C7A2E" stroke-width="1.3"/>
  <text x="616" y="141" text-anchor="middle" class="small">|q1|</text>
  <rect x="662" y="122" width="60" height="28" rx="6" fill="#FFFFFF" stroke="#6C7A2E" stroke-width="1.3"/>
  <text x="692" y="141" text-anchor="middle" class="small">|q2|</text>
  <rect x="738" y="122" width="60" height="28" rx="6" fill="#FFFFFF" stroke="#6C7A2E" stroke-width="1.3"/>
  <text x="768" y="141" text-anchor="middle" class="small">|q3|</text>
  <path d="M 540 150 L 540 176" stroke="#6C7A2E" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 616 150 L 570 176" stroke="#6C7A2E" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 692 150 L 662 176" stroke="#6C7A2E" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 768 150 L 742 176" stroke="#6C7A2E" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="540" y="176" width="60" height="28" rx="6" fill="#6C7A2E"/>
  <text x="570" y="195" text-anchor="middle" class="small" fill="#FFFFFF">min1</text>
  <rect x="632" y="176" width="60" height="28" rx="6" fill="#93A95A"/>
  <text x="662" y="195" text-anchor="middle" class="small" fill="#FFFFFF">min2</text>
  <text x="508" y="236" class="small">min1 来自 |q1|，min2 来自 |q2|（数值见讲义）</text>
  <text x="508" y="260" class="note">输出给 q1 所在边时改用 min2；输出给其他边用 min1</text>
  <text x="508" y="284" class="note">具体数值：min1=0.9、min2=1.6（讲义表承载）</text>

  <!-- ============ 面板 3：四种处理链 ============ -->
  <rect x="40" y="342" width="880" height="190" rx="10" fill="#F5F8F2" stroke="#6C7A2E" stroke-width="1.5"/>
  <text x="58" y="366" class="label">四种校验节点更新：处理链对比（逐边数值见讲义表）</text>
  <rect x="56" y="388" width="196" height="126" rx="8" fill="#FFFFFF" stroke="#6C7A2E" stroke-width="1.3"/>
  <text x="72" y="412" class="small">SPA：精确</text>
  <text x="72" y="436" class="note">tanh/atanh 域求和</text>
  <text x="72" y="458" class="note">精确但昂贵，需 LUT</text>
  <text x="72" y="480" class="note">性能基准</text>
  <rect x="276" y="388" width="196" height="126" rx="8" fill="#FFFFFF" stroke="#6C7A2E" stroke-width="1.3"/>
  <text x="292" y="412" class="small">Min-Sum：近似</text>
  <text x="292" y="436" class="note">符号异或 + min1/min2</text>
  <text x="292" y="458" class="note">无乘法、复杂度低</text>
  <text x="292" y="480" class="note">偏乐观</text>
  <rect x="496" y="388" width="196" height="126" rx="8" fill="#FFFFFF" stroke="#6C7A2E" stroke-width="1.3"/>
  <text x="512" y="412" class="small">NMS：归一化</text>
  <text x="512" y="436" class="note">MS 输出乘 α&lt;1</text>
  <text x="512" y="458" class="note">降低过度自信</text>
  <text x="512" y="480" class="note">性能通常优于纯 MS</text>
  <rect x="716" y="388" width="196" height="126" rx="8" fill="#FFFFFF" stroke="#A6403C" stroke-width="1.3"/>
  <text x="732" y="412" class="small">OMS：偏移</text>
  <text x="732" y="436" class="note">MS 输出减 β 后截零</text>
  <text x="732" y="458" class="note">弱消息压为 0</text>
  <text x="732" y="480" class="note">β 过大会损失信息</text>

  <!-- ============ 底部：工程注意 ============ -->
  <rect x="40" y="552" width="880" height="88" rx="10" fill="#FDF8F1" stroke="#6C7A2E" stroke-width="1.3"/>
  <text x="58" y="580" class="small">工程注意：MS 只需符号异或与 min1/min2 比较器树；NMS 用乘法器替换 LUT；OMS 只需减法</text>
  <text x="58" y="606" class="note">α、β 的具体取值与逐边输出数值（+0.675、-1.200 等）由讲义表格承载</text>
</svg>
