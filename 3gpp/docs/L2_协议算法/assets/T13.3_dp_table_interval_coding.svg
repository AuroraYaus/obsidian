<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="720" viewBox="0 0 1024 720"
     font-family="Noto Sans CJK SC, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 z" fill="#444444"/>
    </marker>
  </defs>

  <!-- 标题区 -->
  <text x="20" y="20" font-size="17" font-weight="bold" fill="#1a1a1a" class="free">图 T13.3-1　DP 计数表区间切割路径：rank 20 → 序列 1 1 2 1 2 1 1 1</text>
  <text x="20" y="44" font-size="13" fill="#444444" class="free">翻书模型：每层区间按分支子孙数（计数表值）切段，B 落在哪段就选哪个符号，再收缩进该段</text>

  <!-- 输入框 -->
  <rect x="80" y="72" width="330" height="34" rx="6" fill="#eef3fa" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="94" y="93" font-size="14" fill="#1a1a1a">输入 bit 1 0 1 0 0 → rank B = 20</text>
  <line x1="416" y1="89" x2="452" y2="89" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 层 1：n=8 E=3，区间 [0,37)，段 [0,29) 与 [29,37)，B=20 -->
  <text x="70" y="161" font-size="12" fill="#333333" text-anchor="end" class="free">n=8 E=3</text>
  <text x="512" y="130" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle" class="free">B=20</text>
  <rect x="80" y="140" width="627" height="32" fill="#c9dcf0" stroke="#4a6fa5" stroke-width="2.5"/>
  <rect x="707" y="140" width="173" height="32" fill="#f0dcc9" stroke="#c08a2d" stroke-width="1.5"/>
  <text x="393" y="161" font-size="13" fill="#1a1a1a" text-anchor="middle">符号 1（幅度 1）·29 页</text>
  <text x="793" y="161" font-size="13" fill="#1a1a1a" text-anchor="middle">符号 2（幅度 3）·8 页</text>
  <line x1="512" y1="140" x2="512" y2="172" stroke="#c0392b" stroke-width="2"/>
  <polygon points="508,136 516,136 512,144" fill="#c0392b"/>
  <text x="80" y="190" font-size="11" fill="#666666" text-anchor="middle" class="free">0</text>
  <text x="707" y="190" font-size="11" fill="#666666" text-anchor="middle" class="free">29</text>
  <text x="880" y="190" font-size="11" fill="#666666" text-anchor="middle" class="free">37</text>
  <text x="940" y="161" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle" class="free">→ 符号 1</text>
  <text x="80" y="211" font-size="12" fill="#555555" class="free">选中符号 1：区间收缩到 [0,29)，B=20 不变（T0=0 无扣减）</text>

  <!-- 层 2：n=7 E=3，区间 [0,29)，段 [0,22) 与 [22,29)，B=20 -->
  <text x="70" y="261" font-size="12" fill="#333333" text-anchor="end" class="free">n=7 E=3</text>
  <text x="632" y="230" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle" class="free">B=20</text>
  <rect x="80" y="240" width="607" height="32" fill="#c9dcf0" stroke="#4a6fa5" stroke-width="2.5"/>
  <rect x="687" y="240" width="193" height="32" fill="#f0dcc9" stroke="#c08a2d" stroke-width="1.5"/>
  <text x="383" y="261" font-size="13" fill="#1a1a1a" text-anchor="middle">符号 1（幅度 1）·22 页</text>
  <text x="783" y="261" font-size="13" fill="#1a1a1a" text-anchor="middle">符号 2（幅度 3）·7 页</text>
  <line x1="632" y1="240" x2="632" y2="272" stroke="#c0392b" stroke-width="2"/>
  <polygon points="628,236 636,236 632,244" fill="#c0392b"/>
  <text x="80" y="290" font-size="11" fill="#666666" text-anchor="middle" class="free">0</text>
  <text x="687" y="290" font-size="11" fill="#666666" text-anchor="middle" class="free">22</text>
  <text x="880" y="290" font-size="11" fill="#666666" text-anchor="middle" class="free">29</text>
  <text x="940" y="261" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle" class="free">→ 符号 1</text>
  <text x="80" y="311" font-size="12" fill="#555555" class="free">选中符号 1：区间收缩到 [0,22)，B=20 不变</text>

  <!-- 层 3：n=6 E=3，区间 [0,22)，段 [0,16) 与 [16,22)，B=20 → 符号 2 -->
  <text x="70" y="361" font-size="12" fill="#333333" text-anchor="end" class="free">n=6 E=3</text>
  <text x="807" y="330" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle" class="free">B=20</text>
  <rect x="80" y="340" width="582" height="32" fill="#c9dcf0" stroke="#4a6fa5" stroke-width="1.5"/>
  <rect x="662" y="340" width="218" height="32" fill="#f0dcc9" stroke="#c08a2d" stroke-width="2.5"/>
  <text x="371" y="361" font-size="13" fill="#1a1a1a" text-anchor="middle">符号 1（幅度 1）·16 页</text>
  <text x="771" y="361" font-size="13" fill="#1a1a1a" text-anchor="middle">符号 2（幅度 3）·6 页</text>
  <line x1="807" y1="340" x2="807" y2="372" stroke="#c0392b" stroke-width="2"/>
  <polygon points="803,336 811,336 807,344" fill="#c0392b"/>
  <text x="80" y="390" font-size="11" fill="#666666" text-anchor="middle" class="free">0</text>
  <text x="662" y="390" font-size="11" fill="#666666" text-anchor="middle" class="free">16</text>
  <text x="880" y="390" font-size="11" fill="#666666" text-anchor="middle" class="free">22</text>
  <text x="940" y="361" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle" class="free">→ 符号 2</text>
  <text x="80" y="411" font-size="12" fill="#555555" class="free">选中符号 2：B ≥ 16，扣减 T1 = 16 → B = 4；区间收缩到 [0,6)（n=5, E=2）</text>

  <!-- 层 4：n=5 E=2，区间 [0,6)，段 [0,5) 与 [5,6)，B=4 -->
  <text x="70" y="461" font-size="12" fill="#333333" text-anchor="end" class="free">n=5 E=2</text>
  <text x="613" y="430" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle" class="free">B=4</text>
  <rect x="80" y="440" width="667" height="32" fill="#c9dcf0" stroke="#4a6fa5" stroke-width="2.5"/>
  <rect x="747" y="440" width="133" height="32" fill="#f0dcc9" stroke="#c08a2d" stroke-width="1.5"/>
  <text x="413" y="461" font-size="13" fill="#1a1a1a" text-anchor="middle">符号 1（幅度 1）·5 页</text>
  <text x="813" y="461" font-size="13" fill="#1a1a1a" text-anchor="middle">符号 2 ·1 页</text>
  <line x1="613" y1="440" x2="613" y2="472" stroke="#c0392b" stroke-width="2"/>
  <polygon points="609,436 617,436 613,444" fill="#c0392b"/>
  <text x="80" y="490" font-size="11" fill="#666666" text-anchor="middle" class="free">0</text>
  <text x="747" y="490" font-size="11" fill="#666666" text-anchor="middle" class="free">5</text>
  <text x="880" y="490" font-size="11" fill="#666666" text-anchor="middle" class="free">6</text>
  <text x="940" y="461" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle" class="free">→ 符号 1</text>
  <text x="80" y="511" font-size="12" fill="#555555" class="free">选中符号 1：B=4 不变；后续 n=3,2,1（E=1）分支 2 不可达，恒取符号 1</text>

  <!-- 输出序列区 -->
  <text x="80" y="548" font-size="14" font-weight="bold" fill="#1a1a1a" class="free">输出序列（符号口径）</text>
  <rect x="80"  y="560" width="40" height="32" fill="#c9dcf0" stroke="#4a6fa5" stroke-width="1.5"/>
  <rect x="130" y="560" width="40" height="32" fill="#c9dcf0" stroke="#4a6fa5" stroke-width="1.5"/>
  <rect x="180" y="560" width="40" height="32" fill="#f0dcc9" stroke="#c08a2d" stroke-width="1.5"/>
  <rect x="230" y="560" width="40" height="32" fill="#c9dcf0" stroke="#4a6fa5" stroke-width="1.5"/>
  <rect x="280" y="560" width="40" height="32" fill="#f0dcc9" stroke="#c08a2d" stroke-width="1.5"/>
  <rect x="330" y="560" width="40" height="32" fill="#c9dcf0" stroke="#4a6fa5" stroke-width="1.5"/>
  <rect x="380" y="560" width="40" height="32" fill="#c9dcf0" stroke="#4a6fa5" stroke-width="1.5"/>
  <rect x="430" y="560" width="40" height="32" fill="#c9dcf0" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="100" y="580" font-size="15" fill="#1a1a1a" text-anchor="middle">1</text>
  <text x="150" y="580" font-size="15" fill="#1a1a1a" text-anchor="middle">1</text>
  <text x="200" y="580" font-size="15" fill="#1a1a1a" text-anchor="middle">2</text>
  <text x="250" y="580" font-size="15" fill="#1a1a1a" text-anchor="middle">1</text>
  <text x="300" y="580" font-size="15" fill="#1a1a1a" text-anchor="middle">2</text>
  <text x="350" y="580" font-size="15" fill="#1a1a1a" text-anchor="middle">1</text>
  <text x="400" y="580" font-size="15" fill="#1a1a1a" text-anchor="middle">1</text>
  <text x="450" y="580" font-size="15" fill="#1a1a1a" text-anchor="middle">1</text>
  <text x="100" y="608" font-size="10" fill="#666666" text-anchor="middle" class="free">Δ=0</text>
  <text x="150" y="608" font-size="10" fill="#666666" text-anchor="middle" class="free">Δ=0</text>
  <text x="200" y="608" font-size="10" fill="#666666" text-anchor="middle" class="free">Δ=1</text>
  <text x="250" y="608" font-size="10" fill="#666666" text-anchor="middle" class="free">Δ=0</text>
  <text x="300" y="608" font-size="10" fill="#666666" text-anchor="middle" class="free">Δ=1</text>
  <text x="350" y="608" font-size="10" fill="#666666" text-anchor="middle" class="free">Δ=0</text>
  <text x="400" y="608" font-size="10" fill="#666666" text-anchor="middle" class="free">Δ=0</text>
  <text x="450" y="608" font-size="10" fill="#666666" text-anchor="middle" class="free">Δ=0</text>

  <!-- 底部验证与注记 -->
  <text x="80" y="636" font-size="13" font-weight="bold" fill="#1a6e3c" class="free">能量验证：ΣΔ = 0+0+1+0+1+0+0+0 = 2 ≤ E_max−1 = 2 ✓（残差索引 3−2 = 1 ≥ 1）</text>
  <text x="80" y="664" font-size="12" fill="#333333" class="free">逆路径（解码）：从尾向前把扣减的分支宽度加回——4 与 16 → B=20 → 1 0 1 0 0，与输入一致</text>
  <text x="80" y="686" font-size="12" fill="#333333" class="free">C(8,3)=37 个序列 vs 2<tspan dy="-4" font-size="9">5</tspan>=32 个编号：5 个序列不可达——&lt;1 bit/块的枚举固有浪费（floor 损失）</text>
</svg>
