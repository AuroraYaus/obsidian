<?xml version="1.0" encoding="UTF-8"?>
<!--
  @file    T11.2_LTE_NR_rate_matching_comparison.svg
  @brief   LTE Turbo 与 NR LDPC 速率匹配结构对比：两个环形缓存窗口示意 + 关键差异
  @date    2026-08-04
  @note    v2 重绘：原版"统一字段对比表格"与讲义 Markdown 表格重复，已删除；本图
           补充表格之外的拓扑/结构信息：环形缓存窗口的几何语义、交织与空洞语义的
           空间关系。对比数据仍由讲义 Markdown 表格承载。
           语义色：Turbo=赭金 #B06F2B、LDPC=橄榄 #6C7A2E、Polar=青瓷 #2F6E71、
           中性=石板 #5C6B7C、风险=石榴 #A6403C；浅色填充深色描边。
           依据 T2.1 基准图规格（960 宽、字号层级、Noto CJK 字体栈）。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 710" width="960" height="710" role="img">
  <title>LTE/NR 速率匹配结构对比：环形缓存窗口与空洞语义</title>
  <rect width="960" height="710" fill="#ffffff"/>
  <defs>
    <marker id="ah-turbo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B06F2B"/>
    </marker>
    <marker id="ah-ldpc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6C7A2E"/>
    </marker>
  </defs>
  <style>
    .title { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 18px; font-weight: bold; fill: #111; }
    .label { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 14px; fill: #222; }
    .small { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 12px; fill: #555; }
    .mono { font-family: monospace; font-size: 13px; fill: #333; }
  </style>
  <text x="480" y="30" text-anchor="middle" class="title">LTE / NR 速率匹配结构对比：环形缓存窗口与空洞语义</text>
  <text x="480" y="54" text-anchor="middle" class="small">接收端共同目标：把空口 LLR 流按地址写回母码坐标并合并；差异在交织时机、窗口起点与空洞语义——对比数据见讲义表</text>

  <!-- ============ 左：LTE Turbo 环形缓存 ============ -->
  <rect x="40" y="78" width="435" height="422" rx="10" fill="#FDF8F1" stroke="#B06F2B" stroke-width="1.5"/>
  <text x="62" y="104" class="small" font-weight="bold" fill="#8D5A1E">LTE Turbo：rvidx 窗口环形缓存</text>
  <rect x="70" y="120" width="210" height="34" rx="6" fill="#FFFFFF" stroke="#C98F4E" stroke-width="1.2"/>
  <text x="175" y="141" text-anchor="middle" class="small">空口 rx_llr → 按 rvidx 写回</text>
  <path d="M 175 154 L 175 172" stroke="#B06F2B" stroke-width="1.5" fill="none" marker-end="url(#ah-turbo)"/>
  <rect x="70" y="172" width="230" height="34" rx="6" fill="#FFFFFF" stroke="#C98F4E" stroke-width="1.2"/>
  <text x="185" y="193" text-anchor="middle" class="small">&lt;NULL&gt; 跳过 + 饱和累加</text>
  <path d="M 185 206 L 200 245" stroke="#B06F2B" stroke-width="1.5" fill="none" marker-end="url(#ah-turbo)"/>
  <!-- 环形缓存本体 -->
  <ellipse cx="200" cy="330" rx="120" ry="85" fill="none" stroke="#B06F2B" stroke-width="2.5"/>
  <line x1="200" y1="245" x2="200" y2="255" stroke="#B06F2B" stroke-width="1.5"/>
  <line x1="264.7" y1="269.7" x2="278.5" y2="257.3" stroke="#B06F2B" stroke-width="1.5"/>
  <line x1="304.6" y1="303.7" x2="316.4" y2="300.6" stroke="#B06F2B" stroke-width="1.5"/>
  <line x1="304.6" y1="356.3" x2="316.4" y2="359.4" stroke="#B06F2B" stroke-width="1.5"/>
  <line x1="264.7" y1="399.7" x2="278.5" y2="411.9" stroke="#B06F2B" stroke-width="1.5"/>
  <line x1="200" y1="415" x2="200" y2="425" stroke="#B06F2B" stroke-width="1.5"/>
  <line x1="129.5" y1="399.7" x2="115.7" y2="411.9" stroke="#B06F2B" stroke-width="1.5"/>
  <line x1="85.9" y1="356.3" x2="74.1" y2="359.4" stroke="#B06F2B" stroke-width="1.5"/>
  <line x1="85.9" y1="303.7" x2="74.1" y2="300.6" stroke="#B06F2B" stroke-width="1.5"/>
  <line x1="129.5" y1="261.2" x2="115.7" y2="249.0" stroke="#B06F2B" stroke-width="1.5"/>
  <!-- RV 窗口弧 -->
  <path d="M 200 245 A 120 85 0 0 1 314.1 303.7" stroke="#C98F4E" stroke-width="7" fill="none" opacity="0.9"/>
  <text x="312" y="276" class="small" fill="#8D5A1E">rvidx 窗口</text>
  <line x1="318" y1="304" x2="382" y2="304" stroke="#B06F2B" stroke-width="1.5"/>
  <text x="386" y="308" class="small" fill="#8D5A1E">空口 E bit</text>
  <!-- <NULL> 结构空洞标记 -->
  <rect x="118" y="389" width="22" height="20" rx="3" fill="#FFFFFF" stroke="#A6403C" stroke-width="1.2"/>
  <text x="129" y="401" text-anchor="middle" class="small" fill="#A6403C">×</text>
  <rect x="75" y="294" width="22" height="20" rx="3" fill="#FFFFFF" stroke="#A6403C" stroke-width="1.2"/>
  <text x="86" y="306" text-anchor="middle" class="small" fill="#A6403C">×</text>
  <!-- 环心说明 -->
  <text x="200" y="318" text-anchor="middle" class="small" fill="#8D5A1E">circular buffer (K_w)</text>
  <text x="200" y="338" text-anchor="middle" class="small" fill="#8D5A1E">三路流收集 + rvidx 选窗</text>
  <!-- 输出 -->
  <rect x="60" y="432" width="360" height="36" rx="6" fill="#FFFFFF" stroke="#B06F2B" stroke-width="1.2"/>
  <text x="240" y="454" text-anchor="middle" class="small">拆回三路流 → 32 列反置换 → Turbo 三路 LLR</text>
  <path d="M 200 415 L 200 432" stroke="#B06F2B" stroke-width="1.5" fill="none" marker-end="url(#ah-turbo)"/>

  <!-- ============ 右：NR LDPC 环形缓存 ============ -->
  <rect x="485" y="78" width="435" height="422" rx="10" fill="#F5F8F2" stroke="#6C7A2E" stroke-width="1.5"/>
  <text x="507" y="104" class="small" font-weight="bold" fill="#525F1F">NR LDPC：RV/k0 起点环形缓存</text>
  <rect x="525" y="120" width="270" height="34" rx="6" fill="#FFFFFF" stroke="#93A95A" stroke-width="1.2"/>
  <text x="660" y="141" text-anchor="middle" class="small">空口 rx_llr → 先 Q_m 反交织</text>
  <path d="M 650 154 L 660 172" stroke="#6C7A2E" stroke-width="1.5" fill="none" marker-end="url(#ah-ldpc)"/>
  <rect x="525" y="172" width="270" height="34" rx="6" fill="#FFFFFF" stroke="#93A95A" stroke-width="1.2"/>
  <text x="660" y="193" text-anchor="middle" class="small">RV/k0 + N_cb 取模 + CBG mask</text>
  <path d="M 660 206 L 700 245" stroke="#6C7A2E" stroke-width="1.5" fill="none" marker-end="url(#ah-ldpc)"/>
  <!-- 环形缓存本体 -->
  <ellipse cx="700" cy="330" rx="120" ry="85" fill="none" stroke="#6C7A2E" stroke-width="2.5"/>
  <line x1="700" y1="245" x2="700" y2="255" stroke="#6C7A2E" stroke-width="1.5"/>
  <line x1="764.7" y1="269.7" x2="778.5" y2="257.3" stroke="#6C7A2E" stroke-width="1.5"/>
  <line x1="804.6" y1="303.7" x2="816.4" y2="300.6" stroke="#6C7A2E" stroke-width="1.5"/>
  <line x1="804.6" y1="356.3" x2="816.4" y2="359.4" stroke="#6C7A2E" stroke-width="1.5"/>
  <line x1="764.7" y1="399.7" x2="778.5" y2="411.9" stroke="#6C7A2E" stroke-width="1.5"/>
  <line x1="700" y1="415" x2="700" y2="425" stroke="#6C7A2E" stroke-width="1.5"/>
  <line x1="629.5" y1="399.7" x2="615.7" y2="411.9" stroke="#6C7A2E" stroke-width="1.5"/>
  <line x1="585.9" y1="356.3" x2="574.1" y2="359.4" stroke="#6C7A2E" stroke-width="1.5"/>
  <line x1="585.9" y1="303.7" x2="574.1" y2="300.6" stroke="#6C7A2E" stroke-width="1.5"/>
  <line x1="629.5" y1="261.2" x2="615.7" y2="249.0" stroke="#6C7A2E" stroke-width="1.5"/>
  <!-- RV/k0 窗口弧与起点 -->
  <path d="M 770.5 398.8 A 120 85 0 0 1 585.9 356.3" stroke="#93A95A" stroke-width="7" fill="none" opacity="0.9"/>
  <circle cx="770.5" cy="398.8" r="5" fill="#6C7A2E"/>
  <text x="784" y="414" class="small" fill="#525F1F">k0 起点</text>
  <line x1="663" y1="393" x2="663" y2="407" stroke="#6C7A2E" stroke-width="1.2"/>
  <text x="650" y="390" class="small" fill="#525F1F">RV 窗口</text>
  <!-- filler/shortened 已知约束标记 -->
  <rect x="759" y="251" width="22" height="20" rx="3" fill="#FFFFFF" stroke="#6C7A2E" stroke-width="1.2"/>
  <text x="770" y="263" text-anchor="middle" class="small" fill="#6C7A2E">K</text>
  <rect x="619" y="251" width="22" height="20" rx="3" fill="#FFFFFF" stroke="#6C7A2E" stroke-width="1.2"/>
  <text x="630" y="263" text-anchor="middle" class="small" fill="#6C7A2E">K</text>
  <!-- 环心说明 -->
  <text x="700" y="318" text-anchor="middle" class="small" fill="#525F1F">circular buffer (N_cb)</text>
  <text x="700" y="338" text-anchor="middle" class="small" fill="#525F1F">k0 起点 + mask 控空洞</text>
  <!-- 输出 -->
  <rect x="540" y="432" width="370" height="36" rx="6" fill="#FFFFFF" stroke="#6C7A2E" stroke-width="1.2"/>
  <text x="725" y="454" text-anchor="middle" class="small">母码位置 LLR → LDPC core（filler/shortened 走 mask）</text>
  <path d="M 700 415 L 700 432" stroke="#6C7A2E" stroke-width="1.5" fill="none" marker-end="url(#ah-ldpc)"/>

  <!-- ============ 底部：关键差异三卡片（结构语义，非表格） ============ -->
  <rect x="40" y="525" width="285" height="125" rx="10" fill="#FFFFFF" stroke="#B06F2B" stroke-width="1.5"/>
  <text x="58" y="552" class="small" font-weight="bold" fill="#8D5A1E">空洞语义三态（不混用）</text>
  <rect x="56" y="572" width="16" height="16" rx="3" fill="#B06F2B"/>
  <text x="82" y="585" class="small">× = &lt;NULL&gt;：删除 / 跳过（结构占位）</text>
  <rect x="56" y="596" width="16" height="16" rx="3" fill="#6C7A2E"/>
  <text x="82" y="609" class="small">punctured：unknown，中性 LLR</text>
  <rect x="56" y="620" width="16" height="16" rx="3" fill="#2F6E71"/>
  <text x="82" y="633" class="small">shortened：强已知约束 / mask</text>

  <rect x="345" y="525" width="285" height="125" rx="10" fill="#FFFFFF" stroke="#6C7A2E" stroke-width="1.5"/>
  <text x="363" y="552" class="small" font-weight="bold" fill="#525F1F">交织时机（先后相反）</text>
  <rect x="361" y="572" width="16" height="16" rx="3" fill="#B06F2B"/>
  <text x="387" y="585" class="small">LTE：子块交织 → 入环 → 选窗</text>
  <rect x="361" y="596" width="16" height="16" rx="3" fill="#6C7A2E"/>
  <text x="387" y="609" class="small">NR：选窗 → bit 交织 → 调制</text>
  <rect x="361" y="620" width="16" height="16" rx="3" fill="#5C6B7C"/>
  <text x="387" y="633" class="small">接收端顺序相反：先反交织</text>

  <rect x="650" y="525" width="285" height="125" rx="10" fill="#FFFFFF" stroke="#2F6E71" stroke-width="1.5"/>
  <text x="668" y="552" class="small" font-weight="bold" fill="#1E4E50">RV 语义（窗口选择）</text>
  <rect x="666" y="572" width="16" height="16" rx="3" fill="#B06F2B"/>
  <text x="692" y="585" class="small">rvidx：环上窗口选择（非重传次数）</text>
  <rect x="666" y="596" width="16" height="16" rx="3" fill="#6C7A2E"/>
  <text x="692" y="609" class="small">RV/k0：起点 + N_cb 取模，依 BG</text>
  <rect x="666" y="620" width="16" height="16" rx="3" fill="#2F6E71"/>
  <text x="692" y="633" class="small">Polar 控制：通常非数据 HARQ 语义</text>

  <text x="480" y="696" text-anchor="middle" class="small">协议锚点：TS 36.212 §5.1.4.1 / TS 38.212 §5.4.2.1；接收端恢复是工程反向，非协议逐行强制</text>
</svg>
