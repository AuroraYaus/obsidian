<?xml version="1.0" encoding="UTF-8"?>
<!--
  @file    T8.8_LDPC_numeric_walkthrough.svg
  @brief   Toy LDPC Min-Sum 数值走读全景（兼容合并图，重绘版）
  @date    2026-08-04
  @note    重绘原因：旧版为 part1+part2 纵向拼接（1000x1100），含 H 数值矩阵、
           LLR/CN 消息/posterior 数值表与调试字段对照表；按项目原则数值由讲义
           T8.8 Markdown 表格承载，本图改为 960x720 横向两栏只画结构：
           左栏 Tanner 图拓扑与一轮 CN 消息流向，右栏 posterior 合成链与
           syndrome 早停判定链，底部调试字段四卡。正文引用优先使用两张分图，
           本文件保留兼容引用。语义配色：LDPC 橄榄 #6C7A2E、风险石榴 #A6403C。
           依据 T2.1 基准图规格。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720" role="img">
  <title>Toy LDPC Min-Sum 数值走读（合并全景结构）</title>
  <rect width="960" height="720" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6C7A2E"/>
    </marker>
  </defs>
  <style>
    .title { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 18px; font-weight: bold; fill: #111; }
    .label { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 14px; font-weight: bold; fill: #222; }
    .small { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 12px; fill: #333; }
    .note  { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 11px; fill: #5C6B7C; }
    .node  { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 10px; font-weight: bold; fill: #222; }
    .chip  { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 11px; font-weight: bold; fill: #333; }
  </style>
  <text x="40" y="28" class="title">Toy LDPC Min-Sum 数值走读（合并全景）</text>
  <text x="40" y="50" class="small">本图为兼容引用保留的全景图；所有数值（H、LLR、9 条 r、posterior、syndrome、dump）由讲义 T8.8 表格承载</text>
  <line x1="40" y1="62" x2="920" y2="62" stroke="#C4CC9E" stroke-width="1.5"/>

  <!-- ============ 左栏：Tanner 图与一轮 CN 消息 ============ -->
  <rect x="40" y="72" width="440" height="470" rx="10" fill="#F5F8F2" stroke="#6C7A2E" stroke-width="1.5"/>
  <text x="58" y="96" class="label">第一部分：Tanner 图与一轮 CN 消息</text>
  <line x1="66" y1="212" x2="90" y2="310" stroke="#93A95A" stroke-width="1.2"/>
<line x1="118" y1="212" x2="90" y2="310" stroke="#93A95A" stroke-width="1.2"/>
<line x1="222" y1="212" x2="90" y2="310" stroke="#93A95A" stroke-width="1.2"/>
<line x1="118" y1="212" x2="210" y2="310" stroke="#93A95A" stroke-width="1.2"/>
<line x1="170" y1="212" x2="210" y2="310" stroke="#93A95A" stroke-width="1.2"/>
<line x1="274" y1="212" x2="210" y2="310" stroke="#93A95A" stroke-width="1.2"/>
<line x1="66" y1="212" x2="330" y2="310" stroke="#93A95A" stroke-width="1.2"/>
<line x1="170" y1="212" x2="330" y2="310" stroke="#93A95A" stroke-width="1.2"/>
<line x1="326" y1="212" x2="330" y2="310" stroke="#93A95A" stroke-width="1.2"/>

  <circle cx="66" cy="200" r="12" fill="#EDF2E2" stroke="#6C7A2E" stroke-width="1.5"/>
<text x="66" y="204" text-anchor="middle" class="node">v0</text>
<circle cx="118" cy="200" r="12" fill="#EDF2E2" stroke="#6C7A2E" stroke-width="1.5"/>
<text x="118" y="204" text-anchor="middle" class="node">v1</text>
<circle cx="170" cy="200" r="12" fill="#EDF2E2" stroke="#6C7A2E" stroke-width="1.5"/>
<text x="170" y="204" text-anchor="middle" class="node">v2</text>
<circle cx="222" cy="200" r="12" fill="#EDF2E2" stroke="#6C7A2E" stroke-width="1.5"/>
<text x="222" y="204" text-anchor="middle" class="node">v3</text>
<circle cx="274" cy="200" r="12" fill="#EDF2E2" stroke="#6C7A2E" stroke-width="1.5"/>
<text x="274" y="204" text-anchor="middle" class="node">v4</text>
<circle cx="326" cy="200" r="12" fill="#EDF2E2" stroke="#6C7A2E" stroke-width="1.5"/>
<text x="326" y="204" text-anchor="middle" class="node">v5</text>

  <rect x="62" y="310" width="56" height="24" rx="6" fill="#E2F2E9" stroke="#6C7A2E" stroke-width="1.5"/>
<text x="90" y="327" text-anchor="middle" class="node">c0</text>
<rect x="182" y="310" width="56" height="24" rx="6" fill="#F8E9E7" stroke="#A6403C" stroke-width="1.5"/>
<text x="210" y="327" text-anchor="middle" class="node">c1</text>
<rect x="302" y="310" width="56" height="24" rx="6" fill="#F8E9E7" stroke="#A6403C" stroke-width="1.5"/>
<text x="330" y="327" text-anchor="middle" class="node">c2</text>

  <text x="58" y="376" class="note">c1、c2 初始校验失败（风险色描边），等待消息修正</text>
  <text x="58" y="398" class="note">9 条 r 消息沿边流向：r_i→v_j 排除 v_j 自身输入</text>
  <text x="58" y="420" class="note">示例 r1→v2：只看 v1 与 v4，符号取积、幅度取最小</text>
  <text x="58" y="442" class="note">channel LLR、H 矩阵、9 条 r 数值与初始 syndrome 见讲义</text>
  <text x="58" y="464" class="note">hard0 与 syndrome=[0,1,1] 的逐位计算由讲义承载</text>

  <!-- ============ 右栏：Posterior 合成与早停 ============ -->
  <rect x="500" y="72" width="420" height="470" rx="10" fill="#F5F8F2" stroke="#6C7A2E" stroke-width="1.5"/>
  <text x="518" y="96" class="label">第二部分：Posterior 合成与早停</text>
  <rect x="518" y="140" width="118" height="30" rx="6" fill="#FFFFFF" stroke="#6C7A2E" stroke-width="1.3"/>
  <text x="577" y="160" text-anchor="middle" class="chip">channel LLR</text>
  <path d="M 636 155 L 656 155" stroke="#6C7A2E" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="656" y="132" width="110" height="46" rx="8" fill="#EDF2E2" stroke="#6C7A2E" stroke-width="1.5"/>
  <text x="711" y="152" text-anchor="middle" class="small">求和</text>
  <text x="711" y="170" text-anchor="middle" class="note">+CN 消息</text>
  <path d="M 766 155 L 786 155" stroke="#6C7A2E" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="786" y="140" width="110" height="30" rx="6" fill="#FFFFFF" stroke="#6C7A2E" stroke-width="1.3"/>
  <text x="841" y="160" text-anchor="middle" class="chip">Lpost</text>
  <path d="M 841 170 L 841 196" stroke="#6C7A2E" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="786" y="196" width="110" height="30" rx="6" fill="#FFFFFF" stroke="#6C7A2E" stroke-width="1.3"/>
  <text x="841" y="216" text-anchor="middle" class="chip">hard</text>
  <text x="518" y="252" class="note">6 个 VN 的 sum / Lpost / hard1 逐项数值见讲义表</text>
  <rect x="518" y="276" width="384" height="48" rx="8" fill="#FFFFFF" stroke="#6C7A2E" stroke-width="1.3"/>
  <text x="534" y="300" class="small">syndrome 检查：H·x^T 模 2</text>
  <text x="534" y="316" class="note">全零才满足 LDPC 约束</text>
  <path d="M 710 324 L 710 340" stroke="#6C7A2E" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="518" y="340" width="384" height="48" rx="8" fill="#EDF2E2" stroke="#6C7A2E" stroke-width="1.4"/>
  <text x="534" y="364" class="small">全零 → syndrome early stop</text>
  <text x="534" y="380" class="note">非零 → 继续迭代</text>
  <path d="M 710 388 L 710 404" stroke="#6C7A2E" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="518" y="404" width="384" height="48" rx="8" fill="#EDF1F6" stroke="#5C6B7C" stroke-width="1.3"/>
  <text x="534" y="428" class="small">真实链路：CRC 边界</text>
  <text x="534" y="444" class="note">以 CB/TB CRC 为交付依据</text>
  <text x="518" y="482" class="note">更新后 hard1、syndrome=[0,0,0] 与 dump 数值见讲义</text>

  <!-- ============ 底部：调试字段四卡 ============ -->
  <rect x="40" y="562" width="880" height="140" rx="10" fill="#F5F8F2" stroke="#6C7A2E" stroke-width="1.5"/>
  <text x="58" y="590" class="label">最小调试字段（dump 结构）</text>
  <rect x="56" y="608" width="196" height="30" rx="6" fill="#FFFFFF" stroke="#6C7A2E" stroke-width="1.2"/>
  <text x="154" y="628" text-anchor="middle" class="chip">iteration</text>
  <rect x="268" y="608" width="196" height="30" rx="6" fill="#FFFFFF" stroke="#6C7A2E" stroke-width="1.2"/>
  <text x="366" y="628" text-anchor="middle" class="chip">edge messages</text>
  <rect x="480" y="608" width="196" height="30" rx="6" fill="#FFFFFF" stroke="#6C7A2E" stroke-width="1.2"/>
  <text x="578" y="628" text-anchor="middle" class="chip">posterior LLR</text>
  <rect x="692" y="608" width="196" height="30" rx="6" fill="#FFFFFF" stroke="#6C7A2E" stroke-width="1.2"/>
  <text x="790" y="628" text-anchor="middle" class="chip">syndrome weight</text>
  <text x="58" y="668" class="note">dump 数值（iteration 0→1、edge messages 9 条、posterior 6 个、syndrome weight 2→0）由讲义承载</text>
  <text x="58" y="690" class="note">正文优先引用两张分图；本全景文件仅为历史兼容引用保留</text>
</svg>
