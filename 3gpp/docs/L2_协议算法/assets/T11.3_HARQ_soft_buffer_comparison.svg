<?xml version="1.0" encoding="UTF-8"?>
<!--
  @file    T11.3_HARQ_soft_buffer_comparison.svg
  @brief   LTE/NR HARQ 软缓存对比：统一生命周期 + LTE RV 窗口环 / NR CBG 分区示意
  @date    2026-08-04
  @note    v2 重绘：原版 descriptor 对比表格与讲义 Markdown 表格重复，已删除；本图
           补充表格之外的拓扑/结构信息：四态生命周期的闭环、LTE 同一环形缓存上
           RV0/RV2 窗口重叠的几何语义、NR CBG 分区与保持/合并的空间关系。
           语义色：Turbo=赭金 #B06F2B、LDPC=橄榄 #6C7A2E、中性=石板 #5C6B7C、
           风险=石榴 #A6403C；浅色填充深色描边。
           依据 T2.1 基准图规格（960 宽、字号层级、Noto CJK 字体栈）。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" role="img">
  <title>LTE/NR HARQ 软缓存：生命周期与分区复用</title>
  <rect width="960" height="700" fill="#ffffff"/>
  <defs>
    <marker id="ah-turbo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B06F2B"/>
    </marker>
    <marker id="ah-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6B7C"/>
    </marker>
  </defs>
  <style>
    .title { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 18px; font-weight: bold; fill: #111; }
    .label { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 14px; fill: #222; }
    .small { font-family: "Noto Sans CJK SC", "Droid Sans Fallback", sans-serif; font-size: 12px; fill: #555; }
    .mono { font-family: monospace; font-size: 13px; fill: #333; }
  </style>
  <text x="480" y="30" text-anchor="middle" class="title">LTE / NR HARQ 软缓存：生命周期与分区复用</text>
  <text x="480" y="54" text-anchor="middle" class="small">soft buffer 是译码器状态：fail 保留、pass 释放；NR 用 CBG 把重传粒度从 TB 缩到 CBG——对比数据见讲义表</text>

  <!-- ============ 顶部：统一生命周期四态闭环 ============ -->
  <rect x="40" y="88" width="205" height="44" rx="8" fill="#F8FAFC" stroke="#5C6B7C" stroke-width="1.4"/>
  <text x="54" y="106" class="small" font-weight="bold" fill="#3C4A5C">新数据 / NDI toggled</text>
  <text x="54" y="124" class="small">清空旧 TB/CB 上下文</text>
  <rect x="255" y="88" width="205" height="44" rx="8" fill="#F8FAFC" stroke="#5C6B7C" stroke-width="1.4"/>
  <text x="269" y="106" class="small" font-weight="bold" fill="#3C4A5C">写入 / 合并</text>
  <text x="269" y="124" class="small">按 RV 地址饱和累加</text>
  <rect x="470" y="88" width="205" height="44" rx="8" fill="#F8FAFC" stroke="#5C6B7C" stroke-width="1.4"/>
  <text x="484" y="106" class="small" font-weight="bold" fill="#3C4A5C">译码 + CRC</text>
  <text x="484" y="124" class="small">CB / TB CRC 判定</text>
  <rect x="685" y="88" width="205" height="44" rx="8" fill="#F8FAFC" stroke="#5C6B7C" stroke-width="1.4"/>
  <text x="699" y="106" class="small" font-weight="bold" fill="#3C4A5C">保留 / 释放</text>
  <text x="699" y="124" class="small">fail 保留，pass 释放</text>
  <line x1="245" y1="110" x2="255" y2="110" stroke="#5C6B7C" stroke-width="1.5" marker-end="url(#ah-slate)"/>
  <line x1="460" y1="110" x2="470" y2="110" stroke="#5C6B7C" stroke-width="1.5" marker-end="url(#ah-slate)"/>
  <line x1="675" y1="110" x2="685" y2="110" stroke="#5C6B7C" stroke-width="1.5" marker-end="url(#ah-slate)"/>
  <path d="M 787 132 L 787 150 L 162 150 L 162 132" stroke="#5C6B7C" stroke-width="1.5" fill="none" marker-end="url(#ah-slate)"/>

  <!-- ============ 左：LTE 每 HARQ process 独立软缓存（RV 环窗口） ============ -->
  <rect x="40" y="170" width="435" height="300" rx="10" fill="#FDF8F1" stroke="#B06F2B" stroke-width="1.5"/>
  <text x="62" y="194" class="small" font-weight="bold" fill="#8D5A1E">LTE：每 HARQ process 独立软缓存</text>
  <!-- RV 环：RV0 / RV2 窗口重叠 -->
  <ellipse cx="180" cy="310" rx="95" ry="62" fill="none" stroke="#B06F2B" stroke-width="2.5"/>
  <line x1="180" y1="248" x2="180" y2="264" stroke="#B06F2B" stroke-width="1.5"/>
  <line x1="247.2" y1="266.2" x2="252.8" y2="269.7" stroke="#B06F2B" stroke-width="1.5"/>
  <line x1="275" y1="310" x2="291" y2="310" stroke="#B06F2B" stroke-width="1.5"/>
  <line x1="247.2" y1="353.8" x2="252.8" y2="350.3" stroke="#B06F2B" stroke-width="1.5"/>
  <line x1="180" y1="372" x2="180" y2="388" stroke="#B06F2B" stroke-width="1.5"/>
  <line x1="112.8" y1="353.8" x2="107.2" y2="350.3" stroke="#B06F2B" stroke-width="1.5"/>
  <line x1="85" y1="310" x2="69" y2="310" stroke="#B06F2B" stroke-width="1.5"/>
  <line x1="112.8" y1="266.2" x2="107.2" y2="269.7" stroke="#B06F2B" stroke-width="1.5"/>
  <path d="M 180 248 A 95 62 0 0 1 273.6 299.2" stroke="#C98F4E" stroke-width="6" fill="none" opacity="0.9"/>
  <path d="M 241.1 262.5 A 95 62 0 0 1 262.3 341" stroke="#8D5A1E" stroke-width="6" fill="none" opacity="0.9"/>
  <path d="M 241.1 262.5 A 95 62 0 0 1 273.6 299.2" stroke="#A6403C" stroke-width="6" fill="none" stroke-dasharray="6 5"/>
  <text x="180" y="302" text-anchor="middle" class="small" fill="#8D5A1E">同一 CB 的环形软缓存</text>
  <text x="180" y="322" text-anchor="middle" class="small" fill="#8D5A1E">RV0 / RV2 窗口重叠</text>
  <text x="78" y="236" class="small" fill="#8D5A1E">RV0 窗口</text>
  <text x="288" y="350" class="small" fill="#8D5A1E">RV2 窗口</text>
  <text x="180" y="354" text-anchor="middle" class="small" fill="#A6403C">重叠累加</text>
  <text x="62" y="408" class="small">RV 是环上窗口选择，不是重传次数</text>
  <text x="62" y="428" class="small">RV0/RV2 重叠位置 LLR 饱和累加</text>
  <text x="62" y="448" class="small">soft buffer key：(harq_id, tb_id, cb_id)</text>

  <!-- ============ 右：NR 每 TB/CBG 配置软容量（CBG 分区） ============ -->
  <rect x="485" y="170" width="435" height="300" rx="10" fill="#F5F8F2" stroke="#6C7A2E" stroke-width="1.5"/>
  <text x="507" y="194" class="small" font-weight="bold" fill="#525F1F">NR：TB → CBG 分区的软缓存（TS 38.214 §5.1.7）</text>
  <text x="507" y="230" class="small">CBGTI=[0,1]（MSB → CBG#0）：0 = 不传输保持，1 = 传输合并</text>
  <rect x="505" y="250" width="185" height="72" rx="4" fill="#EFEBE7" stroke="#9A8F84" stroke-width="1.3"/>
  <text x="510" y="260" class="small" font-weight="bold" fill="#6E6258">CBG0</text>
  <rect x="715" y="250" width="185" height="72" rx="4" fill="#EDF2E2" stroke="#6C7A2E" stroke-width="1.3"/>
  <text x="720" y="260" class="small" font-weight="bold" fill="#525F1F">CBG1</text>
  <rect x="510" y="264" width="82" height="48" rx="3" fill="#F7F4F1" stroke="#B9B0A6" stroke-width="1.2"/>
  <text x="551" y="290" text-anchor="middle" class="small">CB0</text>
  <rect x="602" y="264" width="82" height="48" rx="3" fill="#F7F4F1" stroke="#B9B0A6" stroke-width="1.2"/>
  <text x="643" y="290" text-anchor="middle" class="small">CB1</text>
  <rect x="720" y="264" width="82" height="48" rx="3" fill="#E4EBD2" stroke="#93A95A" stroke-width="1.2"/>
  <text x="761" y="290" text-anchor="middle" class="small">CB2</text>
  <rect x="812" y="264" width="82" height="48" rx="3" fill="#E4EBD2" stroke="#93A95A" stroke-width="1.2"/>
  <text x="853" y="290" text-anchor="middle" class="small">CB3</text>
  <text x="510" y="348" class="small">CBG0：mask=0 → 保持旧 LLR</text>
  <text x="720" y="348" class="small">CBG1：mask=1 → 合并 RV/k0</text>
  <text x="507" y="372" class="small">CBGFI=0：旧实例不可合并 → flush / 隔离</text>
  <text x="507" y="396" class="small">未传 CBG 保持：不清零、不覆盖（清零丢证据）</text>
  <text x="507" y="420" class="small">soft buffer key 含 cbg_id：防 CBG / CB 错配</text>
  <text x="507" y="444" class="small">NR 初传：所有 CBG 出现；重传才受 CBGTI 约束</text>

  <!-- ============ 底部：状态动作四芯片 ============ -->
  <rect x="40" y="500" width="205" height="60" rx="8" fill="#F8FAFC" stroke="#5C6B7C" stroke-width="1.4"/>
  <text x="54" y="522" class="small" font-weight="bold" fill="#3C4A5C">NDI toggled</text>
  <text x="54" y="542" class="small">清空旧 TB/CB 上下文</text>
  <rect x="255" y="500" width="205" height="60" rx="8" fill="#FBF1EF" stroke="#A6403C" stroke-width="1.4"/>
  <text x="269" y="522" class="small" font-weight="bold" fill="#8A2F2B">CRC fail</text>
  <text x="269" y="542" class="small">保留 soft buffer 等重传</text>
  <rect x="470" y="500" width="205" height="60" rx="8" fill="#F2F7F0" stroke="#6C7A2E" stroke-width="1.4"/>
  <text x="484" y="522" class="small" font-weight="bold" fill="#525F1F">CRC pass</text>
  <text x="484" y="542" class="small">释放对应 TB/CB 缓存</text>
  <rect x="685" y="500" width="205" height="60" rx="8" fill="#F8FAFC" stroke="#5C6B7C" stroke-width="1.4"/>
  <text x="699" y="522" class="small" font-weight="bold" fill="#3C4A5C">CBGFI = 0</text>
  <text x="699" y="542" class="small">旧实例 flush，禁止合并</text>

  <text x="480" y="590" text-anchor="middle" class="small">定点：LLR 饱和加法 + sat_pos/neg 计数；wrap_guard_error 阻断</text>
  <text x="480" y="614" text-anchor="middle" class="small">释放条件：TB CRC pass 才释放，按 (harq_id, tb_id) key 精确执行</text>
  <text x="480" y="638" text-anchor="middle" class="small">负测试：HARQ process 串扰 / RV mismatch / CBG mask bit order 反 / 饱和回绕</text>
  <text x="480" y="662" text-anchor="middle" class="small">协议锚点：TS 36.212 §5.1.4.1.2 / TS 36.213 §8.3 / TS 38.214 §5.1.7 / TS 38.321 §5.3.2</text>
</svg>
