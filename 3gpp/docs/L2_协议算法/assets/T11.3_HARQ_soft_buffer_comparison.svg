<?xml version="1.0" encoding="UTF-8"?>
<!--
  @file    T11.3_HARQ_soft_buffer_comparison.svg
  @brief   LTE/NR HARQ 软缓存生命周期对比教学图（手绘 SVG V2：布局与配色依据 T11.3 讲义正文语义重设计）
  @date    2026-08-04
  @note    内容保真：生命周期双面板（LTE：新数据 -> RV0 失败保留 -> RV2 重传累加 ->
           TB CRC 通过释放；NR：新数据/NDI -> CRC 失败 CB/CBG 保留 -> CBGTI 部分重传 ->
           CRC 结果释放/保留）、LTE RV ring window（16 地址，RV0 addr 0-5、RV2 addr 4-9、
           addr 4/5 重叠饱和累加）、NR CBG mask 重传粒度（TB0 NDI=old RV=2 CBGTI=[0,1]
           CBGFI=1 -> CBG0 保持 / CBG1 合并 -> CB2 RV2 addr 3-6）、descriptor 对比表五行、
           三个 LLR 累加例子（LTE RV0->RV2 / NR CBG partial / 定点饱和）、读图顺序与
           验证重点四条，均与讲义 T11.3 正文及图 T11.3-1 语义一致。
           视觉设计：LTE=赭金、NR=橄榄；环区 RV0 历史=青瓷、RV2=赭金、重叠=风险。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="2660" viewBox="0 0 1500 2660" role="img" font-family="'Noto Sans CJK SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif">
  <title>T11.3 LTE/NR HARQ Soft Buffer 对比</title>

  <defs>
    <filter id="soft" x="-10%" y="-10%" width="125%" height="135%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#4A4438" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8A8375"/>
    </marker>
  </defs>

  <!-- ============ 页头 ============ -->
  <text x="70" y="44" font-size="22" font-weight="700" class="free" fill="#23272E">T11.3 LTE/NR HARQ Soft Buffer 对比</text>
  <text x="70" y="74" font-size="13" class="free" fill="#646B76">共同点是 LLR soft combining；关键差异是 NR CBG partial retransmission 改变 soft buffer 更新粒度。</text>

  <!-- ============ 生命周期双面板 ============ -->
  <g filter="url(#soft)">
    <rect x="65" y="130" width="640" height="460" rx="16" fill="#F8EEDC" stroke="#B06F2B" stroke-width="1.5"/>
    <rect x="745" y="130" width="640" height="460" rx="16" fill="#EFF1E2" stroke="#6C7A2E" stroke-width="1.5"/>
  </g>
  <text x="89" y="162" font-size="15" font-weight="700" fill="#23272E">LTE HARQ soft buffer 生命周期</text>
  <text x="769" y="162" font-size="15" font-weight="700" fill="#23272E">NR HARQ soft buffer 生命周期</text>

  <g font-size="11.5" fill="#23272E">
    <rect x="90" y="210" width="130" height="150" rx="12" fill="#FFFFFF" stroke="#B06F2B" stroke-width="1.5"/>
    <text x="155" y="244" text-anchor="middle" font-weight="700">新数据</text>
    <text x="155" y="268" text-anchor="middle" fill="#646B76">按HARQ进程</text>
    <text x="155" y="292" text-anchor="middle" fill="#646B76">分配/清缓存</text>
    <rect x="240" y="210" width="130" height="150" rx="12" fill="#FFFFFF" stroke="#B06F2B" stroke-width="1.5"/>
    <text x="305" y="244" text-anchor="middle" font-weight="700">RV0失败</text>
    <text x="305" y="268" text-anchor="middle" fill="#646B76">soft buffer</text>
    <text x="305" y="292" text-anchor="middle" fill="#646B76">保留LLR</text>
    <rect x="390" y="210" width="130" height="150" rx="12" fill="#FFFFFF" stroke="#B06F2B" stroke-width="1.5"/>
    <text x="455" y="244" text-anchor="middle" font-weight="700">RV2重传</text>
    <text x="455" y="268" text-anchor="middle" fill="#646B76">同地址累加</text>
    <text x="455" y="292" text-anchor="middle" fill="#646B76">新地址补证据</text>
    <rect x="540" y="210" width="130" height="150" rx="12" fill="#FFFFFF" stroke="#B06F2B" stroke-width="1.5"/>
    <text x="605" y="244" text-anchor="middle" font-weight="700">TB CRC通过</text>
    <text x="605" y="268" text-anchor="middle" fill="#646B76">释放缓存</text>

    <rect x="770" y="210" width="130" height="150" rx="12" fill="#FFFFFF" stroke="#6C7A2E" stroke-width="1.5"/>
    <text x="835" y="244" text-anchor="middle" font-weight="700">新数据/NDI</text>
    <text x="835" y="268" text-anchor="middle" fill="#646B76">按HARQ/TB</text>
    <text x="835" y="292" text-anchor="middle" fill="#646B76">CBG/CB分配</text>
    <rect x="920" y="210" width="130" height="150" rx="12" fill="#FFFFFF" stroke="#6C7A2E" stroke-width="1.5"/>
    <text x="985" y="244" text-anchor="middle" font-weight="700">CRC失败</text>
    <text x="985" y="268" text-anchor="middle" fill="#646B76">CB/CBG</text>
    <text x="985" y="292" text-anchor="middle" fill="#646B76">状态保留</text>
    <rect x="1070" y="210" width="130" height="150" rx="12" fill="#FFFFFF" stroke="#6C7A2E" stroke-width="1.5"/>
    <text x="1135" y="244" text-anchor="middle" font-weight="700">CBGTI部分重传</text>
    <text x="1135" y="268" text-anchor="middle" fill="#646B76">只更新</text>
    <text x="1135" y="292" text-anchor="middle" fill="#646B76">被调度CBG</text>
    <rect x="1220" y="210" width="130" height="150" rx="12" fill="#FFFFFF" stroke="#6C7A2E" stroke-width="1.5"/>
    <text x="1285" y="244" text-anchor="middle" font-weight="700">CRC结果</text>
    <text x="1285" y="268" text-anchor="middle" fill="#646B76">释放或</text>
    <text x="1285" y="292" text-anchor="middle" fill="#646B76">继续保留</text>
  </g>
  <g stroke="#B06F2B" stroke-width="2" fill="none">
    <path d="M 220 285 H 240" marker-end="url(#arrow)"/>
    <path d="M 370 285 H 390" marker-end="url(#arrow)"/>
    <path d="M 520 285 H 540" marker-end="url(#arrow)"/>
  </g>
  <g stroke="#6C7A2E" stroke-width="2" fill="none">
    <path d="M 900 285 H 920" marker-end="url(#arrow)"/>
    <path d="M 1050 285 H 1070" marker-end="url(#arrow)"/>
    <path d="M 1200 285 H 1220" marker-end="url(#arrow)"/>
  </g>

  <!-- ============ 中部：LTE RV 环 vs NR CBG 粒度 ============ -->
  <g filter="url(#soft)">
    <rect x="60" y="630" width="1400" height="640" rx="14" fill="#FBFAF6" stroke="#CFC8B8" stroke-width="1.5"/>
  </g>
  <text x="90" y="662" font-size="16" font-weight="700" fill="#23272E">LTE: RV 是同一 ring buffer 的窗口</text>
  <text x="770" y="662" font-size="16" font-weight="700" fill="#23272E">NR: CBG mask 改变重传粒度</text>

  <!-- LTE 16 地址环：cx=330 cy=950 r=165 -->
  <g font-size="11" fill="#23272E">
    <rect x="312" y="763" width="36" height="30" rx="6" fill="#E6F0F0" stroke="#2F6E71" stroke-width="1.5"/>
    <text x="330" y="783" text-anchor="middle" font-weight="700">0</text>
    <rect x="377" y="777" width="36" height="30" rx="6" fill="#E6F0F0" stroke="#2F6E71" stroke-width="1.5"/>
    <text x="395" y="797" text-anchor="middle" font-weight="700">1</text>
    <rect x="432" y="813" width="36" height="30" rx="6" fill="#E6F0F0" stroke="#2F6E71" stroke-width="1.5"/>
    <text x="450" y="833" text-anchor="middle" font-weight="700">2</text>
    <rect x="469" y="869" width="36" height="30" rx="6" fill="#E6F0F0" stroke="#2F6E71" stroke-width="1.5"/>
    <text x="487" y="889" text-anchor="middle" font-weight="700">3</text>
    <rect x="482" y="934" width="36" height="30" rx="6" fill="#F8E9E7" stroke="#A6403C" stroke-width="1.5"/>
    <text x="500" y="954" text-anchor="middle" font-weight="700">4</text>
    <rect x="469" y="999" width="36" height="30" rx="6" fill="#F8E9E7" stroke="#A6403C" stroke-width="1.5"/>
    <text x="487" y="1019" text-anchor="middle" font-weight="700">5</text>
    <rect x="432" y="1055" width="36" height="30" rx="6" fill="#F8EEDC" stroke="#B06F2B" stroke-width="1.5"/>
    <text x="450" y="1075" text-anchor="middle" font-weight="700">6</text>
    <rect x="377" y="1091" width="36" height="30" rx="6" fill="#F8EEDC" stroke="#B06F2B" stroke-width="1.5"/>
    <text x="395" y="1111" text-anchor="middle" font-weight="700">7</text>
    <rect x="312" y="1105" width="36" height="30" rx="6" fill="#F8EEDC" stroke="#B06F2B" stroke-width="1.5"/>
    <text x="330" y="1125" text-anchor="middle" font-weight="700">8</text>
    <rect x="247" y="1091" width="36" height="30" rx="6" fill="#F8EEDC" stroke="#B06F2B" stroke-width="1.5"/>
    <text x="265" y="1111" text-anchor="middle" font-weight="700">9</text>
    <rect x="192" y="1055" width="36" height="30" rx="6" fill="#FFFFFF" stroke="#CFC8B8" stroke-width="1.5"/>
    <text x="210" y="1075" text-anchor="middle" font-weight="700">10</text>
    <rect x="155" y="999" width="36" height="30" rx="6" fill="#FFFFFF" stroke="#CFC8B8" stroke-width="1.5"/>
    <text x="173" y="1019" text-anchor="middle" font-weight="700">11</text>
    <rect x="142" y="934" width="36" height="30" rx="6" fill="#FFFFFF" stroke="#CFC8B8" stroke-width="1.5"/>
    <text x="160" y="954" text-anchor="middle" font-weight="700">12</text>
    <rect x="155" y="869" width="36" height="30" rx="6" fill="#FFFFFF" stroke="#CFC8B8" stroke-width="1.5"/>
    <text x="173" y="889" text-anchor="middle" font-weight="700">13</text>
    <rect x="192" y="813" width="36" height="30" rx="6" fill="#FFFFFF" stroke="#CFC8B8" stroke-width="1.5"/>
    <text x="210" y="833" text-anchor="middle" font-weight="700">14</text>
    <rect x="247" y="777" width="36" height="30" rx="6" fill="#FFFFFF" stroke="#CFC8B8" stroke-width="1.5"/>
    <text x="265" y="797" text-anchor="middle" font-weight="700">15</text>
  </g>
  <circle cx="330" cy="950" r="88" fill="none" stroke="#CFC8B8" stroke-width="2"/>
  <text x="330" y="942" font-size="11.5" text-anchor="middle" fill="#646B76">soft</text>
  <text x="330" y="960" font-size="11.5" text-anchor="middle" fill="#646B76">buffer</text>
  <text x="90" y="1185" font-size="12" class="free" fill="#23272E">RV0: addr 0-5；RV2: addr 4-9；addr 4/5 重叠执行 LLR 饱和累加。</text>

  <!-- NR CBG 粒度 -->
  <g font-size="12" fill="#23272E">
    <rect x="785" y="700" width="580" height="62" rx="12" fill="#FFFFFF" stroke="#6C7A2E" stroke-width="1.5"/>
    <text x="1075" y="737" text-anchor="middle" font-weight="700">TB0: NDI=old, RV=2, CBGTI=[0,1], CBGFI=1</text>
    <rect x="805" y="802" width="310" height="88" rx="12" fill="#F0EEF4" stroke="#7A6E8E" stroke-width="1.5"/>
    <text x="960" y="840" text-anchor="middle" font-weight="700">CBG0 mask=0</text>
    <text x="960" y="864" text-anchor="middle" fill="#646B76">CB0/CB1 保持</text>
    <rect x="1145" y="802" width="310" height="88" rx="12" fill="#FFFFFF" stroke="#6C7A2E" stroke-width="1.5"/>
    <text x="1300" y="840" text-anchor="middle" font-weight="700">CBG1 mask=1</text>
    <text x="1300" y="864" text-anchor="middle" fill="#646B76">CB2/CB3 合并</text>
    <rect x="1170" y="930" width="260" height="62" rx="12" fill="#EFF1E2" stroke="#6C7A2E" stroke-width="1.5"/>
    <text x="1300" y="960" text-anchor="middle" font-weight="700">CB2 RV2</text>
    <text x="1300" y="982" text-anchor="middle" fill="#646B76">addr 3-6</text>
    <text x="805" y="1050" fill="#646B76">未传输 CBG 不清零、不覆盖；被传输 CBG 按 RV/k0 写回，</text>
    <text x="805" y="1072" fill="#646B76">CBGFI=1 才可与旧实例合并。</text>
  </g>
  <g stroke="#6C7A2E" stroke-width="2" fill="none">
    <path d="M 940 762 V 802" marker-end="url(#arrow)"/>
    <path d="M 1220 762 V 802" marker-end="url(#arrow)"/>
    <path d="M 1300 890 V 930" marker-end="url(#arrow)"/>
  </g>

  <!-- ============ Descriptor 对比表 ============ -->
  <g filter="url(#soft)">
    <rect x="60" y="1300" width="1380" height="650" rx="14" fill="#FBFAF6" stroke="#CFC8B8" stroke-width="1.5"/>
  </g>
  <text x="90" y="1332" font-size="16" font-weight="700" fill="#23272E">Descriptor 对比表</text>

  <g font-size="12" fill="#23272E">
    <rect x="75" y="1358" width="200" height="46" fill="#F1EDE4" stroke="#CFC8B8" stroke-width="1"/>
    <text x="175" y="1387" text-anchor="middle" font-weight="700">字段</text>
    <rect x="275" y="1358" width="380" height="46" fill="#F8EEDC" stroke="#CFC8B8" stroke-width="1"/>
    <text x="465" y="1387" text-anchor="middle" font-weight="700">LTE Turbo</text>
    <rect x="655" y="1358" width="380" height="46" fill="#EFF1E2" stroke="#CFC8B8" stroke-width="1"/>
    <text x="845" y="1387" text-anchor="middle" font-weight="700">NR LDPC</text>
    <rect x="1035" y="1358" width="380" height="46" fill="#E6F0F0" stroke="#CFC8B8" stroke-width="1"/>
    <text x="1225" y="1387" text-anchor="middle" font-weight="700">译码器检查</text>

    <rect x="75" y="1404" width="200" height="74" fill="#FFFFFF" stroke="#CFC8B8" stroke-width="1"/>
    <text x="175" y="1443" text-anchor="middle" font-weight="700">soft buffer key</text>
    <rect x="275" y="1404" width="380" height="74" fill="#FFFFFF" stroke="#CFC8B8" stroke-width="1"/>
    <text x="465" y="1439" text-anchor="middle">harq_id, tb_id, cb_id</text>
    <rect x="655" y="1404" width="380" height="74" fill="#FFFFFF" stroke="#CFC8B8" stroke-width="1"/>
    <text x="845" y="1439" text-anchor="middle">harq_id, tb_id, cbg_id, cb_id</text>
    <rect x="1035" y="1404" width="380" height="74" fill="#FFFFFF" stroke="#CFC8B8" stroke-width="1"/>
    <text x="1225" y="1439" text-anchor="middle">防止 HARQ 进程串扰</text>

    <rect x="75" y="1478" width="200" height="74" fill="#FFFFFF" stroke="#CFC8B8" stroke-width="1"/>
    <text x="175" y="1517" text-anchor="middle" font-weight="700">RV 字段</text>
    <rect x="275" y="1478" width="380" height="74" fill="#FFFFFF" stroke="#CFC8B8" stroke-width="1"/>
    <text x="465" y="1513" text-anchor="middle">rvidx 选择 Turbo ring 窗口</text>
    <rect x="655" y="1478" width="380" height="74" fill="#FFFFFF" stroke="#CFC8B8" stroke-width="1"/>
    <text x="845" y="1513" text-anchor="middle">RV/k0 选择 LDPC circular buffer 窗口</text>
    <rect x="1035" y="1478" width="380" height="74" fill="#FFFFFF" stroke="#CFC8B8" stroke-width="1"/>
    <text x="1225" y="1513" text-anchor="middle">RV 必须进入地址生成</text>

    <rect x="75" y="1552" width="200" height="74" fill="#FFFFFF" stroke="#CFC8B8" stroke-width="1"/>
    <text x="175" y="1591" text-anchor="middle" font-weight="700">重传粒度</text>
    <rect x="275" y="1552" width="380" height="74" fill="#FFFFFF" stroke="#CFC8B8" stroke-width="1"/>
    <text x="465" y="1587" text-anchor="middle">TB/CB 主线，无 NR-style CBG</text>
    <rect x="655" y="1552" width="380" height="74" fill="#FFFFFF" stroke="#CFC8B8" stroke-width="1"/>
    <text x="845" y="1587" text-anchor="middle">CBG partial retransmission</text>
    <rect x="1035" y="1552" width="380" height="74" fill="#FFFFFF" stroke="#CFC8B8" stroke-width="1"/>
    <text x="1225" y="1587" text-anchor="middle">mask=0 的 CBG 保持</text>

    <rect x="75" y="1626" width="200" height="74" fill="#FFFFFF" stroke="#CFC8B8" stroke-width="1"/>
    <text x="175" y="1665" text-anchor="middle" font-weight="700">new data</text>
    <rect x="275" y="1626" width="380" height="74" fill="#FFFFFF" stroke="#CFC8B8" stroke-width="1"/>
    <text x="465" y="1661" text-anchor="middle">NDI toggled 清旧 TB 上下文</text>
    <rect x="655" y="1626" width="380" height="74" fill="#FFFFFF" stroke="#CFC8B8" stroke-width="1"/>
    <text x="845" y="1661" text-anchor="middle">NDI toggled 清 TB/CBG/CB 上下文</text>
    <rect x="1035" y="1626" width="380" height="74" fill="#FFFFFF" stroke="#CFC8B8" stroke-width="1"/>
    <text x="1225" y="1661" text-anchor="middle">新旧 TB 不能合并</text>

    <rect x="75" y="1700" width="200" height="74" fill="#FFFFFF" stroke="#CFC8B8" stroke-width="1"/>
    <text x="175" y="1739" text-anchor="middle" font-weight="700">CRC fail/pass</text>
    <rect x="275" y="1700" width="380" height="74" fill="#FFFFFF" stroke="#CFC8B8" stroke-width="1"/>
    <text x="465" y="1735" text-anchor="middle">fail 保留，pass 释放</text>
    <rect x="655" y="1700" width="380" height="74" fill="#FFFFFF" stroke="#CFC8B8" stroke-width="1"/>
    <text x="845" y="1735" text-anchor="middle">fail 保留，pass 释放或保留未完成 CBG</text>
    <rect x="1035" y="1700" width="380" height="74" fill="#FFFFFF" stroke="#CFC8B8" stroke-width="1"/>
    <text x="1225" y="1735" text-anchor="middle">释放条件可追溯</text>
  </g>

  <!-- ============ 小型 LLR 累加例子 ============ -->
  <g filter="url(#soft)">
    <rect x="60" y="1980" width="1380" height="360" rx="14" fill="#FBFAF6" stroke="#CFC8B8" stroke-width="1.5"/>
  </g>
  <text x="90" y="2012" font-size="16" font-weight="700" fill="#23272E">小型 LLR 累加例子</text>

  <g font-size="12" fill="#23272E">
    <rect x="70" y="2040" width="420" height="240" rx="14" fill="#F8EEDC" stroke="#B06F2B" stroke-width="1.5"/>
    <text x="280" y="2074" text-anchor="middle" font-weight="700">LTE RV0 -&gt; RV2</text>
    <text x="100" y="2122">RV0 addr0..5，RV2 addr4..9；</text>
    <text x="100" y="2150">addr4: +2.0 + +1.5 = +3.5；</text>
    <text x="100" y="2178">addr6/7/8/9 为新覆盖。</text>
    <rect x="510" y="2040" width="420" height="240" rx="14" fill="#EFF1E2" stroke="#6C7A2E" stroke-width="1.5"/>
    <text x="720" y="2074" text-anchor="middle" font-weight="700">NR CBG partial</text>
    <text x="540" y="2122">CBGTI=[0,1]；CBG0 的 CB0/CB1</text>
    <text x="540" y="2150">本次不写；CBG1 的 CB2/CB3</text>
    <text x="540" y="2178">按 RV2 写回。</text>
    <rect x="950" y="2040" width="420" height="240" rx="14" fill="#F8E9E7" stroke="#A6403C" stroke-width="1.5"/>
    <text x="1160" y="2074" text-anchor="middle" font-weight="700">定点饱和</text>
    <text x="980" y="2122">6 bit signed LLR：</text>
    <text x="980" y="2150">+28 + +10 -&gt; +31；</text>
    <text x="980" y="2178">记录正饱和次数，禁止补码回绕。</text>
  </g>

  <!-- ============ 读图顺序与验证重点 ============ -->
  <g filter="url(#soft)">
    <rect x="60" y="2370" width="1380" height="250" rx="14" fill="#F0EEF4" stroke="#7A6E8E" stroke-width="1.5"/>
  </g>
  <text x="90" y="2402" font-size="16" font-weight="700" fill="#23272E">读图顺序与验证重点</text>
  <g font-size="12.5" fill="#23272E">
    <text x="90" y="2442">1. 先看生命周期：soft buffer 是译码器状态，CRC fail 后保留，CRC pass 后释放。</text>
    <text x="90" y="2482">2. 再看中部对比：LTE RV 是 ring window；NR CBG mask 决定哪些 CB 本次有新 LLR。</text>
    <text x="90" y="2522">3. 表格字段必须进 dump：LTE 查 RV/k0/Ncb；NR 额外查 CBG mask、CBGFI、BG、Zc。</text>
    <text x="90" y="2562">4. 负测试：HARQ process 串扰、RV mismatch、CBG mask bit order 反、定点饱和回绕。</text>
  </g>
</svg>
