    <text x="382" y="146" text-anchor="middle" dominant-baseline="central" class="node-text">T18.1 位宽·缩放·舍入</text>
    <text x="382" y="162" text-anchor="middle" dominant-baseline="central" class="node-text">sys/parity LLR 饱和</text>
  </g>
  <g>
    <rect x="512" y="90" width="215" height="100" rx="8" fill="#eef2ff" stroke="#334155" stroke-width="1.5"/>
