<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" font-family="sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#334155"/>
    </marker>
    <style>
      .title { font-size: 20px; font-weight: bold; fill: #1e293b; }
      .node-title { font-size: 15px; font-weight: bold; fill: #1e293b; }
      .node-text { font-size: 12px; fill: #334155; }
      .note { font-size: 12px; fill: #64748b; }
    </style>
  </defs>

  <rect x="400" y="8" width="440" height="56" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="620" y="36" text-anchor="middle" dominant-baseline="central" class="title">LTE Turbo 定点数据通路（T18.2）</text>

  <!-- 主链 5 节点：y 90..190 -->
  <g>
    <rect x="38" y="90" width="215" height="100" rx="8" fill="#eef2ff" stroke="#334155" stroke-width="1.5"/>
    <text x="145" y="122" text-anchor="middle" dominant-baseline="central" class="node-title">Protocol Vector</text>
    <text x="145" y="146" text-anchor="middle" dominant-baseline="central" class="node-text">K·f1/f2·RV·E·Ncb</text>
    <text x="145" y="162" text-anchor="middle" dominant-baseline="central" class="node-text">d0/d1/d2 三路流</text>
  </g>
  <g>
    <rect x="275" y="90" width="215" height="100" rx="8" fill="#eef2ff" stroke="#334155" stroke-width="1.5"/>
