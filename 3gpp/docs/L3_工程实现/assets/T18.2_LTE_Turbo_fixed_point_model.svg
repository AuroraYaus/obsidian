    <text x="856" y="146" text-anchor="middle" dominant-baseline="central" class="node-text">交织/解交织外信息</text>
    <text x="856" y="162" text-anchor="middle" dominant-baseline="central" class="node-text">LLR 更新</text>
  </g>
  <g>
    <rect x="986" y="90" width="215" height="100" rx="8" fill="#eef2ff" stroke="#334155" stroke-width="1.5"/>
    <text x="1093" y="122" text-anchor="middle" dominant-baseline="central" class="node-title">CRC/Report</text>
    <text x="1093" y="146" text-anchor="middle" dominant-baseline="central" class="node-text">hard bits·CB/TB CRC</text>
    <text x="1093" y="162" text-anchor="middle" dominant-baseline="central" class="node-text">早停·replay</text>
  </g>
  <line x1="253" y1="140" x2="271" y2="140" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="490" y1="140" x2="508" y2="140" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="727" y1="140" x2="745" y2="140" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="964" y1="140" x2="982" y2="140" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- checkpoint 虚线 -->
  <line x1="145" y1="190" x2="145" y2="246" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5,4"/>
  <line x1="382" y1="190" x2="382" y2="246" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5,4"/>
  <line x1="619" y1="190" x2="619" y2="246" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5,4"/>
  <line x1="856" y1="190" x2="856" y2="246" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5,4"/>
  <line x1="1093" y1="190" x2="1093" y2="246" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5,4"/>

  <!-- checkpoint 5 节点：y 250..310 -->
  <g>
    <rect x="38" y="250" width="215" height="72" rx="8" fill="#f5f3ff" stroke="#334155" stroke-width="1.5"/>
    <text x="145" y="274" text-anchor="middle" dominant-baseline="central" class="node-title">Rate recovery</text>
    <text x="145" y="298" text-anchor="middle" dominant-baseline="central" class="node-text">RV/address mismatch</text>
  </g>
  <g>
    <rect x="275" y="250" width="215" height="72" rx="8" fill="#f5f3ff" stroke="#334155" stroke-width="1.5"/>
    <text x="382" y="274" text-anchor="middle" dominant-baseline="central" class="node-title">Branch metric</text>
    <text x="382" y="298" text-anchor="middle" dominant-baseline="central" class="node-text">stream/sign/scale</text>
  </g>
  <g>
    <rect x="512" y="250" width="215" height="72" rx="8" fill="#f5f3ff" stroke="#334155" stroke-width="1.5"/>
    <text x="619" y="274" text-anchor="middle" dominant-baseline="central" class="node-title">Forward/backward</text>
    <text x="619" y="298" text-anchor="middle" dominant-baseline="central" class="node-text">normalization/sat</text>
  </g>
  <g>
    <rect x="749" y="250" width="215" height="72" rx="8" fill="#f5f3ff" stroke="#334155" stroke-width="1.5"/>
    <text x="856" y="274" text-anchor="middle" dominant-baseline="central" class="node-title">Extrinsic</text>
    <text x="856" y="298" text-anchor="middle" dominant-baseline="central" class="node-text">repeated evidence</text>
  </g>
  <g>
    <rect x="986" y="250" width="215" height="72" rx="8" fill="#f5f3ff" stroke="#334155" stroke-width="1.5"/>
    <text x="1093" y="274" text-anchor="middle" dominant-baseline="central" class="node-title">CRC gate</text>
    <text x="1093" y="298" text-anchor="middle" dominant-baseline="central" class="node-text">late first mismatch</text>
  </g>

  <!-- 选项条 -->
  <g>
    <rect x="120" y="380" width="1000" height="68" rx="8" fill="#fef3c7" stroke="#334155" stroke-width="1.5"/>
    <text x="140" y="406" text-anchor="start" dominant-baseline="central" class="node-title">Bitwidth and Algorithm Options</text>
    <text x="140" y="432" text-anchor="start" dominant-baseline="central" class="node-text">LLR width · metric width · posterior/extrinsic width · Log-MAP/Max-Log-MAP · max-star · 归一化 · 饱和计数</text>
  </g>

  <rect x="330" y="500" width="580" height="44" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="620" y="522" text-anchor="middle" dominant-baseline="central" class="note">验收：定点与浮点 bit-exact 对比，BLER 损失在预算内</text>
