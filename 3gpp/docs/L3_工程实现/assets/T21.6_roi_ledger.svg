<?xml version="1.0" encoding="UTF-8"?>
<!--
  T21.6 ROI 同账核算图
  - 上半部：PS 增益侧（AWGN/TDL 实测区间）vs 代价侧（+55% gates/+45% SRAM/+28% 功耗/PA back-off）天平
  - 中部：ROI 按场景结论（AWGN 值得 / TDL 慎重）
  - 下部：570 Mbps 自洽链（TBS x 2000 <-> 285K bit <-> 6.8x 裕量）
  布局网格：所有 text 基线为 distinct 层级，最小间距 12px（规范 >= 8px）
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Noto Sans CJK SC, sans-serif">
  <!-- 背景 -->
  <rect x="0" y="0" width="1280" height="720" fill="#ffffff"/>

  <!-- 标题带 -->
  <text x="40" y="48" font-size="26" font-weight="bold" fill="#1e293b">PS 增益—代价同账核算与 570 Mbps 自洽链</text>
  <text x="40" y="76" font-size="13" fill="#64748b">第 6 章（系列收束）· 素材口径：52PRB / 7nm / 含 PS · 增益与账单放同一张账，按场景算 ROI</text>

  <!-- 天平：支点 + 横梁 + 双盘 -->
  <line x1="640" y1="105" x2="640" y2="152" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="640,152 616,172 664,172" fill="#94a3b8"/>
  <line x1="350" y1="120" x2="930" y2="120" stroke="#94a3b8" stroke-width="4"/>
  <line x1="400" y1="120" x2="400" y2="140" stroke="#94a3b8" stroke-width="3"/>
  <line x1="880" y1="120" x2="880" y2="140" stroke="#94a3b8" stroke-width="3"/>
  <ellipse cx="400" cy="152" rx="45" ry="12" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <ellipse cx="880" cy="152" rx="45" ry="12" fill="#ffe4e6" stroke="#be123c" stroke-width="2"/>
  <text x="380" y="180" font-size="15" font-weight="bold" fill="#0f766e">增益</text>
  <text x="860" y="180" font-size="15" font-weight="bold" fill="#be123c">代价</text>

  <!-- 左侧：增益侧面板 -->
  <rect x="40" y="200" width="520" height="210" rx="8" fill="#f5f7fa" stroke="#c9d4e3" stroke-width="1.5"/>
  <text x="60" y="228" font-size="17" font-weight="bold" fill="#1e293b">增益侧（BLER=1e-2 实测区间）</text>
  <text x="60" y="258" font-size="18" font-weight="bold" fill="#0f766e">AWGN 0.5–1.2 dB</text>
  <text x="60" y="286" font-size="13" fill="#475569">MCS10 0.8–1.2 · MCS20 0.5–0.8 dB</text>
  <text x="60" y="316" font-size="18" font-weight="bold" fill="#b45309">TDL 衰落 0.2–0.6 dB</text>
  <text x="60" y="344" font-size="13" fill="#475569">MCS10 0.3–0.6 · MCS20 0.2–0.4 dB</text>
  <line x1="60" y1="358" x2="540" y2="358" stroke="#c9d4e3" stroke-width="1"/>
  <text x="60" y="380" font-size="13" fill="#475569">公平口径：同 payload · TBS 匹配 ±1% · 固定 MCS · 功率归一</text>
  <text x="60" y="404" font-size="13" fill="#b45309">未做 TBS 匹配的“增益”约 2.4 dB 可由虚优解释</text>

  <!-- 右侧：代价侧面板 -->
  <rect x="720" y="200" width="520" height="210" rx="8" fill="#f5f7fa" stroke="#c9d4e3" stroke-width="1.5"/>
  <text x="740" y="228" font-size="17" font-weight="bold" fill="#1e293b">代价侧（账单不随信道场景变化）</text>
  <text x="740" y="268" font-size="18" font-weight="bold" fill="#be123c">+55% gates</text>
  <text x="740" y="294" font-size="18" font-weight="bold" fill="#be123c">+45% SRAM</text>
  <text x="740" y="326" font-size="18" font-weight="bold" fill="#be123c">+28% 功耗</text>
  <text x="740" y="356" font-size="13" fill="#475569">PA back-off 2–3 dB → 效率损失 5–15%</text>
  <text x="740" y="380" font-size="13" fill="#475569">功率缩放 7–14× · 8 路并行 Cholesky</text>
  <text x="740" y="404" font-size="13" fill="#475569">PS 总计 ~155K gates / ~1.88 MB / ~36 mW</text>

  <!-- 中部：ROI 按场景结论 -->
  <rect x="40" y="430" width="1200" height="100" rx="8" fill="#f8fafc" stroke="#c9d4e3" stroke-width="1.5"/>
  <text x="60" y="458" font-size="17" font-weight="bold" fill="#1e293b">ROI 按场景说话（同账核算）</text>
  <text x="60" y="492" font-size="16" fill="#334155">AWGN MCS10 ✅ 值得　　AWGN MCS20 ✅ 偏正　　TDL-A MCS10 🤔 边际　　TDL-A MCS20 ❌ 慎重</text>
  <text x="60" y="518" font-size="13" fill="#64748b">1 dB @ 3.5 GHz ≈ 20–25% 覆盖半径；账单不变而增益缩水 → 衰落场景先同账核算再上 PS</text>

  <!-- 下部：570 Mbps 自洽链 -->
  <rect x="40" y="550" width="1200" height="150" rx="8" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5"/>
  <text x="60" y="576" font-size="17" font-weight="bold" fill="#1e293b">570 Mbps 自洽链：吞吐与硬件预算的第一道对账</text>
  <text x="352" y="606" font-size="12" fill="#0369a1">×2000 时隙/秒</text>
  <text x="712" y="606" font-size="12" fill="#0369a1">÷2000 反推</text>
  <text x="110" y="618" font-size="16" font-weight="bold" fill="#0c4a6e">TBS ≈ 285K bit/时隙</text>
  <text x="110" y="644" font-size="12" fill="#64748b">= 570 Mbps ÷ 2000</text>
  <text x="470" y="618" font-size="17" font-weight="bold" fill="#0c4a6e">吞吐 = 570 Mbps</text>
  <text x="470" y="644" font-size="12" fill="#64748b">MCS27 · qam256 · 4 层 · 52PRB</text>
  <text x="830" y="618" font-size="16" font-weight="bold" fill="#0c4a6e">LLR 缓冲裕量 = 6.8×</text>
  <text x="830" y="644" font-size="12" fill="#64748b">243.4 KB = 324,480×6 bit = 1.95 Mbit</text>
  <line x1="330" y1="624" x2="440" y2="624" stroke="#0369a1" stroke-width="2"/>
  <path d="M 440 624 L 428 618 L 428 630 Z" fill="#0369a1"/>
  <line x1="690" y1="624" x2="800" y2="624" stroke="#0369a1" stroke-width="2"/>
  <path d="M 800 624 L 788 618 L 788 630 Z" fill="#0369a1"/>
  <text x="60" y="682" font-size="13" fill="#334155">检验三条：TBS×2000 = 吞吐 · 缓冲 ≥ G×6 bit · 裕量 ≥ 6×；任何一条对不上 → 拍脑袋数字</text>
</svg>
