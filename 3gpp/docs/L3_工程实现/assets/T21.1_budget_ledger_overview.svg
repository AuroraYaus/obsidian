<?xml version="1.0" encoding="UTF-8"?>
<!--
  @file    T21.1_budget_ledger_overview.svg
  @brief   T21.1 三本账互锁锚点图：位宽账（24-bit real）/ 周期账（61,440 cycles）/
           存储面积账（6.1 MB ≈ 4.0 mm²）三本账各自的记账对象、锚点推导链，
           以及三条互锁箭头（位宽×元素数=容量、串行÷预算=并行度=面积、存储带宽制约并行度）。
  @date    2026-08-04
  @note    语义色：位宽账 钢蓝 / 周期账 琥珀 / 存储面积账 翠绿 / 互锁箭头 灰蓝 / 底线 浅灰。
           布局：标题带 -> 顶部互锁① -> 三账横排（锚点 + 账内关键行 + 推导链盒）-> 底部互锁②③
           -> 同账核算底线。文字行距 ≥ 8px（同行基线差 24px，跨层差 ≥ 12px）。
           内容（节点、数值、连线关系）与 docs/L3_工程实现/T21.1 讲义及素材 PHY01 §7-10 / analysis 06 一致。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1960" height="890" viewBox="0 0 1960 890" role="img" font-family="'Noto Sans CJK SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif">
  <title>T21.1 Three-Ledger Interlocking Anchors</title>

  <defs>
    <filter id="soft" x="-10%" y="-10%" width="125%" height="135%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#334155" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5B6B82"/>
    </marker>
  </defs>

  <!-- ============ 标题带 ============ -->
  <rect x="40" y="18" width="1880" height="62" rx="6" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="980" y="46" font-size="20" font-weight="700" fill="#152033" text-anchor="middle">T21.1 工程预算总览：位宽 / 周期 / 存储 三本账</text>
  <text x="980" y="70" font-size="12.5" fill="#455A64" text-anchor="middle">三本账互锁锚点图 —— 24-bit real / 61,440 cycles / 6.1 MB ≈ 4.0 mm²</text>

  <!-- ============ 顶部互锁①：位宽账 -> 存储面积账 ============ -->
  <line x1="640" y1="86" x2="1318" y2="86" stroke="#5B6B82" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="980" y="108" font-size="12" fill="#334155" text-anchor="middle" class="free">互锁① 位宽 × 元素数 = 容量：6-bit LLR 把 14-bit 动态范围压进 48-bit 字装 8 个的 4% 缓冲</text>

  <!-- ============ 面板 1：位宽账 ============ -->
  <rect x="70" y="120" width="560" height="580" rx="10" fill="#D9E7F6" stroke="#2F5E94" stroke-width="1.5"/>
  <rect x="84" y="132" width="12" height="12" rx="3" fill="#2F5E94"/>
  <text x="106" y="146" font-size="15" font-weight="700" fill="#152033" text-anchor="start">位宽账（bitwidth ledger）</text>
  <text x="106" y="170" font-size="12" fill="#263238" text-anchor="start">记录每一级定点数据通路需要多少 bit</text>
  <text x="106" y="190" font-size="12" fill="#263238" text-anchor="start">口径：物理上可能的最坏值，不是典型值</text>
  <line x1="84" y1="202" x2="610" y2="202" stroke="#2F5E94" stroke-opacity="0.25" stroke-width="1"/>
  <text x="106" y="226" font-size="11.5" font-weight="700" fill="#2F5E94" text-anchor="start">锚点 · 全链路最大确定性位宽</text>
  <text x="106" y="262" font-size="26" font-weight="700" fill="#152033" text-anchor="start">24-bit real</text>
  <text x="106" y="288" font-size="12" fill="#263238" text-anchor="start">Rhh = HᴴH：每 RE 的信道 Gram 矩阵，PS+MIMO 解调预处理</text>
  <line x1="84" y1="318" x2="610" y2="318" stroke="#2F5E94" stroke-opacity="0.25" stroke-width="1"/>
  <text x="106" y="340" font-size="12" font-weight="700" fill="#152033" text-anchor="start">账内关键行</text>
  <text x="106" y="366" font-size="12" fill="#263238" text-anchor="start">TX 14 级 + RX 18 级位宽表（增长根源：累加 / 缩放 / 动态范围转移）</text>
  <text x="106" y="390" font-size="12" fill="#263238" text-anchor="start">无界危险点：MMSE 归一化除法 0/0、∞ —— 必须硬限幅</text>
  <text x="106" y="414" font-size="12" fill="#263238" text-anchor="start">安全裁剪点：LLR ±31（6-bit 有符号）—— 裁剪管范围、量化管精度</text>
  <text x="106" y="438" font-size="12" fill="#263238" text-anchor="start">读法：追踪最大值而非 RMS 值；+1 bit 收益边际递减（0.1~0.2 dB）</text>
  <text x="106" y="462" font-size="12" fill="#263238" text-anchor="start">位宽决策树：QAM 16 → PS +3 → 层 +2 → TDL +2 → 23→24-bit I/Q</text>
  <rect x="84" y="488" width="526" height="150" rx="8" fill="#FFFFFF" stroke="#2F5E94" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="106" y="512" font-size="11.5" font-weight="700" fill="#2F5E94" text-anchor="start">24-bit 从哪来（推导链，第 2 章展开）</text>
  <text x="106" y="536" font-size="12" fill="#263238" text-anchor="start">16-bit H 元素 → 复乘积 |H|² 统计有界 ≈ 2²²（信道归一化）</text>
  <text x="106" y="560" font-size="12" fill="#263238" text-anchor="start">→ Nrx=4 次累加：2²² × 4 = 2²⁴ → 24-bit real 恰好覆盖</text>
  <text x="106" y="584" font-size="12" fill="#263238" text-anchor="start">不是 16×16×4=36 的机械累加：归一化信道下满幅 2³² 不可达</text>
  <text x="106" y="608" font-size="12" fill="#263238" text-anchor="start">8×8 / 32×32 MIMO → 累加次数翻倍 → 再 +1~2 bit</text>

  <!-- ============ 面板 2：周期账 ============ -->
  <rect x="700" y="120" width="560" height="580" rx="10" fill="#F8E8C8" stroke="#A8781E" stroke-width="1.5"/>
  <rect x="714" y="132" width="12" height="12" rx="3" fill="#A8781E"/>
  <text x="736" y="146" font-size="15" font-weight="700" fill="#152033" text-anchor="start">周期账（cycle ledger）</text>
  <text x="736" y="170" font-size="12" fill="#263238" text-anchor="start">记录每个处理阶段需要多少时钟周期</text>
  <text x="736" y="190" font-size="12" fill="#263238" text-anchor="start">口径：串行需求 ÷ 时隙预算 = 所需并行度</text>
  <line x1="714" y1="202" x2="1240" y2="202" stroke="#A8781E" stroke-opacity="0.25" stroke-width="1"/>
  <text x="736" y="226" font-size="11.5" font-weight="700" fill="#A8781E" text-anchor="start">锚点 · 时隙硬时限</text>
  <text x="736" y="262" font-size="26" font-weight="700" fill="#152033" text-anchor="start">61,440 cycles</text>
  <text x="736" y="288" font-size="12" fill="#263238" text-anchor="start">= 122.88 MHz × 0.5 ms（30 kHz SCS，每秒 2,000 时隙）</text>
  <line x1="714" y1="318" x2="1240" y2="318" stroke="#A8781E" stroke-opacity="0.25" stroke-width="1"/>
  <text x="736" y="340" font-size="12" font-weight="700" fill="#152033" text-anchor="start">账内关键行（52PRB 峰值配置，串行口径）</text>
  <text x="736" y="366" font-size="12" fill="#263238" text-anchor="start">LDPC 解码 ~5.1M = 预算 81× → 专用引擎（第一瓶颈）</text>
  <text x="736" y="390" font-size="12" fill="#263238" text-anchor="start">Rhh + Cholesky ~486,720 = 7.9× → ≥8 路（第二瓶颈）</text>
  <text x="736" y="414" font-size="12" fill="#263238" text-anchor="start">MMSE ~162,240 → ≥4 路；FFT ~20,480 → 4 引擎</text>
  <text x="736" y="438" font-size="12" fill="#263238" text-anchor="start">Gold 324,480 → 32 路 → 10,140 cycles（几乎免费）</text>
  <text x="736" y="462" font-size="12" fill="#263238" text-anchor="start">ESS 编码 ~30,000 / 解码 ~1,500（per-TB 非实时路径）</text>
  <rect x="714" y="488" width="526" height="150" rx="8" fill="#FFFFFF" stroke="#A8781E" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="736" y="512" font-size="11.5" font-weight="700" fill="#A8781E" text-anchor="start">61,440 从哪来（第 4 章展开）</text>
  <text x="736" y="536" font-size="12" fill="#263238" text-anchor="start">61,440 = 122.88×10⁶ × 0.5×10⁻³ —— 周期 = 时钟 × 时隙时长</text>
  <text x="736" y="560" font-size="12" fill="#263238" text-anchor="start">273PRB：时钟 ×2 → 245.76 MHz → 每时隙 122,880 cycles</text>
  <text x="736" y="584" font-size="12" fill="#263238" text-anchor="start">并行化本质 = 用面积换周期：每个并行引擎都是面积表的一行</text>
  <text x="736" y="608" font-size="12" fill="#263238" text-anchor="start">并行收益不均匀：线性结构最便宜（Gold）、迭代依赖最贵（LDPC）</text>

  <!-- ============ 面板 3：存储面积账 ============ -->
  <rect x="1330" y="120" width="560" height="580" rx="10" fill="#D3EBDD" stroke="#177A5A" stroke-width="1.5"/>
  <rect x="1344" y="132" width="12" height="12" rx="3" fill="#177A5A"/>
  <text x="1366" y="146" font-size="15" font-weight="700" fill="#152033" text-anchor="start">存储面积账（storage &amp; area ledger）</text>
  <text x="1366" y="170" font-size="12" fill="#263238" text-anchor="start">记录每个子系统多少 SRAM / 逻辑门，换算成芯片面积</text>
  <text x="1366" y="190" font-size="12" fill="#263238" text-anchor="start">口径：52PRB 含 PS；7nm 密度换算器（30 Mbit/mm²、3 M gates/mm²）</text>
  <line x1="1344" y1="202" x2="1870" y2="202" stroke="#177A5A" stroke-opacity="0.25" stroke-width="1"/>
  <text x="1366" y="226" font-size="11.5" font-weight="700" fill="#177A5A" text-anchor="start">锚点 · 全系统总量</text>
  <text x="1366" y="262" font-size="26" font-weight="700" fill="#152033" text-anchor="start">6.1 MB ≈ 4.0 mm²</text>
  <text x="1366" y="288" font-size="12" fill="#263238" text-anchor="start">= SRAM 1.63 + 逻辑 2.47 ≈ 4.1 mm²，素材汇总口径取 ~4.0</text>
  <line x1="1344" y1="318" x2="1870" y2="318" stroke="#177A5A" stroke-opacity="0.25" stroke-width="1"/>
  <text x="1366" y="340" font-size="12" font-weight="700" fill="#152033" text-anchor="start">账内关键行（52PRB 含 PS）</text>
  <text x="1366" y="366" font-size="12" fill="#263238" text-anchor="start">MIMO 26% + 信道估计 20% + PS 16% = 62%（每 RE 矩阵与信道状态）</text>
  <text x="1366" y="390" font-size="12" fill="#263238" text-anchor="start">LDPC 仅 8%、LLR 仅 4% —— 译码器视角在 Modem 尺度上反转</text>
  <text x="1366" y="414" font-size="12" fill="#263238" text-anchor="start">面积两本账：SRAM 40% / 逻辑 60%；28nm SRAM 密度 10× 差距</text>
  <text x="1366" y="438" font-size="12" fill="#263238" text-anchor="start">LLR 缓冲 0.24 MB：6-bit ↔ 48-bit 字装 8 个；6→8 bit 即 +33%</text>
  <text x="1366" y="462" font-size="12" fill="#263238" text-anchor="start">273PRB 外推 ≈ 19 mm²（存储比 28.7/6.1 ≈ 4.7×）</text>
  <rect x="1344" y="488" width="526" height="150" rx="8" fill="#FFFFFF" stroke="#177A5A" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="1366" y="512" font-size="11.5" font-weight="700" fill="#177A5A" text-anchor="start">6.1 MB → 4.0 mm² 从哪来（第 5 章展开）</text>
  <text x="1366" y="536" font-size="12" fill="#263238" text-anchor="start">容量 = 元素数 × 位宽：逐缓冲区加总 6.14 ≈ 6.1 MB</text>
  <text x="1366" y="560" font-size="12" fill="#263238" text-anchor="start">SRAM：6.1 MB×8 ÷ 30 Mbit/mm² ≈ 1.63 mm²</text>
  <text x="1366" y="584" font-size="12" fill="#263238" text-anchor="start">逻辑：7.4M gates ÷ 3 M gates/mm² ≈ 2.47 mm²</text>
  <text x="1366" y="608" font-size="12" fill="#263238" text-anchor="start">合计 ≈ 4.1 → 素材汇总口径 ≈ 4.0 mm²（40% / 60%）</text>

  <!-- ============ 底部互锁②③：周期账 <-> 存储面积账 ============ -->
  <line x1="900" y1="716" x2="1318" y2="716" stroke="#5B6B82" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1115" y="736" font-size="12" fill="#334155" text-anchor="middle" class="free">互锁② 串行 cycles ÷ 61,440 = 并行度 = 面积（81× → 3.0M gates → 1.5 mm²）</text>
  <line x1="1318" y1="752" x2="900" y2="752" stroke="#5B6B82" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1115" y="772" font-size="12" fill="#334155" text-anchor="middle" class="free">互锁③ 存储带宽制约并行度：LDPC 受迭代依赖 + 消息存储带宽双重制约</text>

  <!-- ============ 同账核算底线 ============ -->
  <rect x="70" y="806" width="1820" height="64" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="980" y="830" font-size="15" font-weight="700" fill="#152033" text-anchor="middle">三本账同账核算：位宽 / 周期 / 存储面积是同一份架构规格书的三个投影</text>
  <text x="980" y="854" font-size="12.5" fill="#455A64" text-anchor="middle">24-bit real（最坏位宽）× 61,440 cycles（硬时限）× 6.1 MB ≈ 4.0 mm²（总账单）—— 瓶颈排序 = 面积排序</text>
</svg>
