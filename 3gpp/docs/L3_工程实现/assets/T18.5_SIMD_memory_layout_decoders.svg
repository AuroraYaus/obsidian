  <text x="313" y="252" text-anchor="start" dominant-baseline="central" class="node-text">256-bit SIMD = 16 × 16-bit lane（lane 0-11 有效）</text>
  <text x="866" y="252" text-anchor="middle" dominant-baseline="central" class="node-text">padding</text>
  <rect x="330" y="310" width="580" height="36" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="620" y="328" text-anchor="middle" dominant-baseline="central" class="note">无效 lane 浪费向量吞吐：16 个 lane 只有 12 个参与计算</text>
  <g><rect x="60" y="370" width="560" height="110" rx="8" fill="#ecfdf5" stroke="#334155" stroke-width="1.5"/>
    <text x="340" y="398" text-anchor="middle" dominant-baseline="central" class="node-title">好布局</text>
    <text x="340" y="422" text-anchor="middle" dominant-baseline="central" class="node-text">连续 load · 预取器跟上 · stride=1</text>
    <text x="340" y="438" text-anchor="middle" dominant-baseline="central" class="node-text">lane 全有效 · 同一类计算</text>
    <text x="340" y="454" text-anchor="middle" dominant-baseline="central" class="node-text">hot/cold 分离 · 无 false sharing</text></g>
  <g><rect x="640" y="370" width="560" height="110" rx="8" fill="#fef2f2" stroke="#334155" stroke-width="1.5"/>
    <text x="920" y="398" text-anchor="middle" dominant-baseline="central" class="node-title">坏布局</text>
    <text x="920" y="422" text-anchor="middle" dominant-baseline="central" class="node-text">随机 gather · cache line 利用率低</text>
    <text x="920" y="438" text-anchor="middle" dominant-baseline="central" class="node-text">大量 padding · 无效 path</text>
    <text x="920" y="454" text-anchor="middle" dominant-baseline="central" class="node-text">debug trace 与热数组同 cache line</text></g>
  <rect x="330" y="520" width="580" height="44" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="620" y="542" text-anchor="middle" dominant-baseline="central" class="note">SoA 优先：同字段连续排列，便于 SIMD load 与 cache 预取</text>
