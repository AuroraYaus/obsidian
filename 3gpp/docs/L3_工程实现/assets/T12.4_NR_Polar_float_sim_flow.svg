<?xml version="1.0" encoding="UTF-8"?>
<!--
  @file    T12.4_NR_Polar_float_sim_flow.svg
  @brief   T12.4 NR Polar 浮点仿真流程图：从可靠性序列、UCI/DCI 构造、Polar 编码、速率匹配到
           AWGN+LLR 的仿真管线，以及 SC/SCL/CA-SCL 列表大小扫描、实验矩阵和工程检测点。
  @date    2026-08-04
  @note    本次重绘自定语义色（不沿用 PIL 脚本色系）：
           Protocol Config 钢蓝 / UCI/DCI Builder 琥珀 / Polar Constructor 紫罗兰 /
           Polar Encoder 橄榄 / Rate Match 青绿 / AWGN 翠绿 / Decoder Sweep 玫红 /
           CRC/RNTI+Metrics 淡蓝灰 / Failure Replay Archive 冷灰。
           布局为蛇形重设计：上行三节点（左向右）-> 下行三节点（右向左）->
           译码扫描链（下行折返向左）-> 实验矩阵 -> Engineering Checks。
           内容（节点、数值、连线关系）与 docs/L3_工程实现/T17.4 讲义及原 PIL 图语义一致；
           替代 docs/L3_工程实现/assets/T12.4_NR_Polar_float_sim_flow.png。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1470" viewBox="0 0 1700 1470" role="img" font-family="'Noto Sans CJK SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif">
  <title>T12.4 NR Polar Floating-Point Simulation Plan</title>

  <defs>
    <filter id="soft" x="-10%" y="-10%" width="125%" height="135%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#334155" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5B6B82"/>
    </marker>
  </defs>

  <!-- ============ 标题带 ============ -->
  <rect x="40" y="18" width="1620" height="64" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="850" y="42" font-size="20" font-weight="700" fill="#152033" text-anchor="middle">T12.4 NR Polar Floating-Point Simulation Plan</text>
  <text x="850" y="68" font-size="12.5" fill="#455A64" text-anchor="middle">Reliability sequence, rate recovery, SC/SCL/CA-SCL, list-size sweep, latency proxy and replay evidence</text>

  <!-- ============ 上行三节点 ============ -->
  <rect x="70" y="110" width="500" height="160" rx="10" fill="#D9E7F6" stroke="#2F5E94" stroke-width="1.5"/>
  <rect x="84" y="124" width="12" height="12" rx="3" fill="#2F5E94"/>
  <text x="106" y="138" font-size="15" font-weight="700" fill="#152033" text-anchor="start">Protocol Config</text>
  <line x1="84" y1="150" x2="550" y2="150" stroke="#2F5E94" stroke-opacity="0.25" stroke-width="1"/>
  <text x="106" y="176" font-size="12" fill="#263238" text-anchor="start">TS 38.212 refs, channel, A/K/E/N, CRC mode,</text>
  <text x="106" y="200" font-size="12" fill="#263238" text-anchor="start">RNTI context, list sizes and seed.</text>

  <rect x="620" y="110" width="500" height="160" rx="10" fill="#F8E8C8" stroke="#A8781E" stroke-width="1.5"/>
  <rect x="634" y="124" width="12" height="12" rx="3" fill="#A8781E"/>
  <text x="656" y="138" font-size="15" font-weight="700" fill="#152033" text-anchor="start">UCI/DCI Builder</text>
  <line x1="634" y1="150" x2="1100" y2="150" stroke="#A8781E" stroke-opacity="0.25" stroke-width="1"/>
  <text x="656" y="176" font-size="12" fill="#263238" text-anchor="start">Payload, CRC bits, RNTI mask,</text>
  <text x="656" y="200" font-size="12" fill="#263238" text-anchor="start">frozen/information field metadata.</text>

  <rect x="1170" y="110" width="500" height="160" rx="10" fill="#E3DCF2" stroke="#59419C" stroke-width="1.5"/>
  <rect x="1184" y="124" width="12" height="12" rx="3" fill="#59419C"/>
  <text x="1206" y="138" font-size="15" font-weight="700" fill="#152033" text-anchor="start">Polar Constructor</text>
  <line x1="1184" y1="150" x2="1650" y2="150" stroke="#59419C" stroke-opacity="0.25" stroke-width="1"/>
  <text x="1206" y="176" font-size="12" fill="#263238" text-anchor="start">Reliability sequence, information set,</text>
  <text x="1206" y="200" font-size="12" fill="#263238" text-anchor="start">frozen set, PC bits and transform size.</text>

  <!-- ============ 下行三节点（右向左） ============ -->
  <rect x="1170" y="330" width="500" height="160" rx="10" fill="#E5EDD1" stroke="#5E7A24" stroke-width="1.5"/>
  <rect x="1184" y="344" width="12" height="12" rx="3" fill="#5E7A24"/>
  <text x="1206" y="358" font-size="15" font-weight="700" fill="#152033" text-anchor="start">Polar Encoder</text>
  <line x1="1184" y1="370" x2="1650" y2="370" stroke="#5E7A24" stroke-opacity="0.25" stroke-width="1"/>
  <text x="1206" y="396" font-size="12" fill="#263238" text-anchor="start">Polar transform reference, bit order,</text>
  <text x="1206" y="420" font-size="12" fill="#263238" text-anchor="start">codeword position and expected bits.</text>

  <rect x="620" y="330" width="500" height="160" rx="10" fill="#CFE9E2" stroke="#15705C" stroke-width="1.5"/>
  <rect x="634" y="344" width="12" height="12" rx="3" fill="#15705C"/>
  <text x="656" y="358" font-size="15" font-weight="700" fill="#152033" text-anchor="start">Rate Match</text>
  <line x1="634" y1="370" x2="1100" y2="370" stroke="#15705C" stroke-opacity="0.25" stroke-width="1"/>
  <text x="656" y="396" font-size="12" fill="#263238" text-anchor="start">Sub-block interleaver, bit selection,</text>
  <text x="656" y="420" font-size="12" fill="#263238" text-anchor="start">repetition, puncturing, shortening.</text>

  <rect x="70" y="330" width="500" height="160" rx="10" fill="#D3EBDD" stroke="#177A5A" stroke-width="1.5"/>
  <rect x="84" y="344" width="12" height="12" rx="3" fill="#177A5A"/>
  <text x="106" y="358" font-size="15" font-weight="700" fill="#152033" text-anchor="start">AWGN + LLR</text>
  <line x1="84" y1="370" x2="550" y2="370" stroke="#177A5A" stroke-opacity="0.25" stroke-width="1"/>
  <text x="106" y="396" font-size="12" fill="#263238" text-anchor="start">Eb/N0 sweep, effective rate, demapper</text>
  <text x="106" y="420" font-size="12" fill="#263238" text-anchor="start">LLR, POS_ZERO and archived seeds.</text>

  <!-- ============ 译码扫描链：Decoder Sweep -> CRC/RNTI+Metrics -> Archive（左向右） ============ -->
  <rect x="70" y="560" width="500" height="160" rx="10" fill="#F6DEE3" stroke="#A8425C" stroke-width="1.5"/>
  <rect x="84" y="574" width="12" height="12" rx="3" fill="#A8425C"/>
  <text x="106" y="588" font-size="15" font-weight="700" fill="#152033" text-anchor="start">Decoder Sweep</text>
  <line x1="84" y1="600" x2="550" y2="600" stroke="#A8425C" stroke-opacity="0.25" stroke-width="1"/>
  <text x="106" y="626" font-size="12" fill="#263238" text-anchor="start">SC, SCL and CA-SCL; list-size sweep</text>
  <text x="106" y="650" font-size="12" fill="#263238" text-anchor="start">L=1/2/4/8/16 with PM and node counts.</text>

  <rect x="620" y="560" width="500" height="160" rx="10" fill="#DDE6F0" stroke="#4A6178" stroke-width="1.5"/>
  <rect x="634" y="574" width="12" height="12" rx="3" fill="#4A6178"/>
  <text x="656" y="588" font-size="15" font-weight="700" fill="#152033" text-anchor="start">CRC/RNTI + Metrics</text>
  <line x1="634" y1="600" x2="1100" y2="600" stroke="#4A6178" stroke-opacity="0.25" stroke-width="1"/>
  <text x="656" y="626" font-size="12" fill="#263238" text-anchor="start">candidate CRC, RNTI check, selected path,</text>
  <text x="656" y="650" font-size="12" fill="#263238" text-anchor="start">BLER, FER, avg list ops and latency proxy.</text>

  <rect x="1170" y="560" width="500" height="160" rx="10" fill="#EDF1F5" stroke="#6B7A8A" stroke-width="1.5"/>
  <rect x="1184" y="574" width="12" height="12" rx="3" fill="#6B7A8A"/>
  <text x="1206" y="588" font-size="15" font-weight="700" fill="#152033" text-anchor="start">Failure Replay Archive</text>
  <line x1="1184" y1="600" x2="1650" y2="600" stroke="#6B7A8A" stroke-opacity="0.25" stroke-width="1"/>
  <text x="1206" y="626" font-size="12" fill="#263238" text-anchor="start">resolved config, seeds, vector.json,</text>
  <text x="1206" y="650" font-size="12" fill="#263238" text-anchor="start">LLR arrays, path traces, CRC evidence and plots.</text>

  <!-- ============ 实验矩阵表格 ============ -->
  <rect x="130" y="800" width="1460" height="380" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="160" y="834" font-size="16" font-weight="700" fill="#152033" text-anchor="start">Experiment Matrix Example</text>
  <line x1="150" y1="846" x2="1570" y2="846" stroke="#94A3B8" stroke-opacity="0.25" stroke-width="1"/>
  <!-- 表头 870..910 -->
  <rect x="150" y="870" width="140" height="40" fill="#E3E9F0" stroke="#8A97A6" stroke-width="1"/>
  <text x="220" y="895" font-size="12.5" font-weight="700" fill="#102027" text-anchor="middle">Case</text>
  <rect x="290" y="870" width="240" height="40" fill="#E3E9F0" stroke="#8A97A6" stroke-width="1"/>
  <text x="410" y="895" font-size="12.5" font-weight="700" fill="#102027" text-anchor="middle">Decoder</text>
  <rect x="530" y="870" width="380" height="40" fill="#E3E9F0" stroke="#8A97A6" stroke-width="1"/>
  <text x="720" y="895" font-size="12.5" font-weight="700" fill="#102027" text-anchor="middle">Protocol params</text>
  <rect x="910" y="870" width="200" height="40" fill="#E3E9F0" stroke="#8A97A6" stroke-width="1"/>
  <text x="1010" y="895" font-size="12.5" font-weight="700" fill="#102027" text-anchor="middle">Sweep</text>
  <rect x="1110" y="870" width="460" height="40" fill="#E3E9F0" stroke="#8A97A6" stroke-width="1"/>
  <text x="1340" y="895" font-size="12.5" font-weight="700" fill="#102027" text-anchor="middle">Saved evidence</text>
  <!-- 行 1 910..966 -->
  <rect x="150" y="910" width="140" height="56" fill="#FFFFFF" stroke="#C7D0DB" stroke-width="1"/>
  <text x="220" y="938" font-size="12" fill="#263238" text-anchor="middle">smoke</text>
  <rect x="290" y="910" width="240" height="56" fill="#FFFFFF" stroke="#C7D0DB" stroke-width="1"/>
  <text x="410" y="938" font-size="12" fill="#263238" text-anchor="middle">SC + CA-SCL</text>
  <rect x="530" y="910" width="380" height="56" fill="#FFFFFF" stroke="#C7D0DB" stroke-width="1"/>
  <text x="720" y="938" font-size="12" fill="#263238" text-anchor="middle">DCI small A, CRC24, rv0</text>
  <rect x="910" y="910" width="200" height="56" fill="#FFFFFF" stroke="#C7D0DB" stroke-width="1"/>
  <text x="1010" y="938" font-size="12" fill="#263238" text-anchor="middle">L=1,4</text>
  <rect x="1110" y="910" width="460" height="56" fill="#FFFFFF" stroke="#C7D0DB" stroke-width="1"/>
  <text x="1340" y="938" font-size="12" fill="#263238" text-anchor="middle">metrics + first failures</text>
  <!-- 行 2 966..1022 -->
  <rect x="150" y="966" width="140" height="56" fill="#FFFFFF" stroke="#C7D0DB" stroke-width="1"/>
  <text x="220" y="994" font-size="12" fill="#263238" text-anchor="middle">uci</text>
  <rect x="290" y="966" width="240" height="56" fill="#FFFFFF" stroke="#C7D0DB" stroke-width="1"/>
  <text x="410" y="994" font-size="12" fill="#263238" text-anchor="middle">CA-SCL</text>
  <rect x="530" y="966" width="380" height="56" fill="#FFFFFF" stroke="#C7D0DB" stroke-width="1"/>
  <text x="720" y="994" font-size="12" fill="#263238" text-anchor="middle">UCI CRC6/11, PUCCH/PUSCH</text>
  <rect x="910" y="966" width="200" height="56" fill="#FFFFFF" stroke="#C7D0DB" stroke-width="1"/>
  <text x="1010" y="994" font-size="12" fill="#263238" text-anchor="middle">L=2,4,8</text>
  <rect x="1110" y="966" width="460" height="56" fill="#FFFFFF" stroke="#C7D0DB" stroke-width="1"/>
  <text x="1340" y="994" font-size="12" fill="#263238" text-anchor="middle">CRC/path traces</text>
  <!-- 行 3 1022..1078 -->
  <rect x="150" y="1022" width="140" height="56" fill="#FFFFFF" stroke="#C7D0DB" stroke-width="1"/>
  <text x="220" y="1050" font-size="12" fill="#263238" text-anchor="middle">dci</text>
  <rect x="290" y="1022" width="240" height="56" fill="#FFFFFF" stroke="#C7D0DB" stroke-width="1"/>
  <text x="410" y="1050" font-size="12" fill="#263238" text-anchor="middle">CA-SCL</text>
  <rect x="530" y="1022" width="380" height="56" fill="#FFFFFF" stroke="#C7D0DB" stroke-width="1"/>
  <text x="720" y="1050" font-size="12" fill="#263238" text-anchor="middle">DCI CRC24/RNTI</text>
  <rect x="910" y="1022" width="200" height="56" fill="#FFFFFF" stroke="#C7D0DB" stroke-width="1"/>
  <text x="1010" y="1050" font-size="12" fill="#263238" text-anchor="middle">L=4,8,16</text>
  <rect x="1110" y="1022" width="460" height="56" fill="#FFFFFF" stroke="#C7D0DB" stroke-width="1"/>
  <text x="1340" y="1050" font-size="12" fill="#263238" text-anchor="middle">RNTI + selected path</text>
  <!-- 行 4 1078..1134 -->
  <rect x="150" y="1078" width="140" height="56" fill="#FFFFFF" stroke="#C7D0DB" stroke-width="1"/>
  <text x="220" y="1106" font-size="12" fill="#263238" text-anchor="middle">edge</text>
  <rect x="290" y="1078" width="240" height="56" fill="#FFFFFF" stroke="#C7D0DB" stroke-width="1"/>
  <text x="410" y="1106" font-size="12" fill="#263238" text-anchor="middle">SCL</text>
  <rect x="530" y="1078" width="380" height="56" fill="#FFFFFF" stroke="#C7D0DB" stroke-width="1"/>
  <text x="720" y="1106" font-size="12" fill="#263238" text-anchor="middle">puncture/short/repeat</text>
  <rect x="910" y="1078" width="200" height="56" fill="#FFFFFF" stroke="#C7D0DB" stroke-width="1"/>
  <text x="1010" y="1106" font-size="12" fill="#263238" text-anchor="middle">fixed SNR</text>
  <rect x="1110" y="1078" width="460" height="56" fill="#FFFFFF" stroke="#C7D0DB" stroke-width="1"/>
  <text x="1340" y="1106" font-size="12" fill="#263238" text-anchor="middle">full decoder dump</text>

  <!-- ============ Engineering Checks 说明框 ============ -->
  <rect x="130" y="1240" width="1460" height="150" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="160" y="1268" font-size="16" font-weight="700" fill="#152033" text-anchor="start">Engineering Checks</text>
  <line x1="150" y1="1280" x2="1570" y2="1280" stroke="#94A3B8" stroke-opacity="0.25" stroke-width="1"/>
  <g fill="#37474F">
    <text x="160" y="1306" font-size="12.5" text-anchor="start">Record reliability sequence version, information/frozen sets, CRC/RNTI mode, rate recovery state and list size.</text>
    <text x="160" y="1330" font-size="12.5" text-anchor="start">Use identical payload/noise seeds when sweeping list size; otherwise CA-SCL performance is not comparable.</text>
    <text x="160" y="1354" font-size="12.5" text-anchor="start">Protocol evidence constrains construction and rate recovery; latency proxy and thresholds are engineering goals.</text>
  </g>

  <!-- ============ 箭头（10 条，path 终点落在盒边上） ============ -->
  <g stroke="#5B6B82" stroke-width="2" fill="none">
    <path d="M 570 190 L 620 190" marker-end="url(#arrow)"/>
    <path d="M 1120 190 L 1170 190" marker-end="url(#arrow)"/>
    <path d="M 1420 270 L 1420 330" marker-end="url(#arrow)"/>
    <path d="M 1170 410 L 1120 410" marker-end="url(#arrow)"/>
    <path d="M 620 410 L 570 410" marker-end="url(#arrow)"/>
    <path d="M 320 490 L 320 560" marker-end="url(#arrow)"/>
    <path d="M 570 640 L 620 640" marker-end="url(#arrow)"/>
    <path d="M 1120 640 L 1170 640" marker-end="url(#arrow)"/>
  </g>
</svg>
