    <line x1="475" y1="510" x2="475" y2="556" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="765" y1="510" x2="765" y2="556" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
