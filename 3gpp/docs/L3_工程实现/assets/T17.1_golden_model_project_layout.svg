  <rect x="330" y="638" width="580" height="44" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="620" y="660" text-anchor="middle" dominant-baseline="central" class="note">审计边界：报告必须包含 source hash · script version · command · seed · 未运行项</text>
