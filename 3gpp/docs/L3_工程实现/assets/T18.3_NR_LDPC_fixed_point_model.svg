    <text x="619" y="146" text-anchor="middle" dominant-baseline="central" class="node-text">sign·min1/min2</text>
    <text x="619" y="162" text-anchor="middle" dominant-baseline="central" class="node-text">MS/NMS/OMS 饱和</text>
  </g>
  <g>
    <rect x="749" y="90" width="215" height="100" rx="8" fill="#eef2ff" stroke="#334155" stroke-width="1.5"/>
