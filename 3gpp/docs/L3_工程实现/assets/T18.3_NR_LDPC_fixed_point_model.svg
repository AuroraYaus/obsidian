    <text x="382" y="146" text-anchor="middle" dominant-baseline="central" class="node-text">Q 格式·符号·裁剪</text>
    <text x="382" y="162" text-anchor="middle" dominant-baseline="central" class="node-text">soft-combine 饱和</text>
  </g>
  <g>
    <rect x="512" y="90" width="215" height="100" rx="8" fill="#eef2ff" stroke="#334155" stroke-width="1.5"/>
