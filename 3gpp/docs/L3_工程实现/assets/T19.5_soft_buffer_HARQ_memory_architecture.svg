<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" font-family="sans-serif">
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#334155"/></marker><style>
      .title { font-size: 20px; font-weight: bold; fill: #1e293b; }
      .node-title { font-size: 15px; font-weight: bold; fill: #1e293b; }
      .node-text { font-size: 12px; fill: #334155; }
      .note { font-size: 12px; fill: #64748b; }
    </style></defs>
  <rect x="400" y="8" width="440" height="56" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="620" y="36" text-anchor="middle" dominant-baseline="central" class="title">Soft Buffer HARQ 内存架构（T19.5）</text>
  <g><rect x="60" y="100" width="340" height="120" rx="8" fill="#eef2ff" stroke="#334155" stroke-width="1.5"/>
    <text x="230" y="132" text-anchor="middle" dominant-baseline="central" class="node-title">LTE Turbo context</text>
    <text x="230" y="156" text-anchor="middle" dominant-baseline="central" class="node-text">Key: harq_id·codeword·TB epoch·CB id</text>
    <text x="230" y="172" text-anchor="middle" dominant-baseline="central" class="node-text">per-CB 循环缓存·NIR/Ncb·E·rvidx</text></g>
  <g><rect x="450" y="100" width="340" height="120" rx="8" fill="#fef3c7" stroke="#334155" stroke-width="1.5"/>
    <text x="620" y="132" text-anchor="middle" dominant-baseline="central" class="node-title">Soft Buffer Manager</text>
    <text x="620" y="156" text-anchor="middle" dominant-baseline="central" class="node-text">查逻辑证据·开 RMW 事务</text>
    <text x="620" y="172" text-anchor="middle" dominant-baseline="central" class="node-text">NDI/epoch/CRC 策略·release 决策</text></g>
  <g><rect x="840" y="100" width="340" height="120" rx="8" fill="#eef2ff" stroke="#334155" stroke-width="1.5"/>
    <text x="1010" y="132" text-anchor="middle" dominant-baseline="central" class="node-title">NR LDPC context</text>
    <text x="1010" y="156" text-anchor="middle" dominant-baseline="central" class="node-text">Key 扩展 CBG id·CBGTI/CBGFI</text>
    <text x="1010" y="172" text-anchor="middle" dominant-baseline="central" class="node-text">per-CB k0/RV·E_r·CBGTI 掩码</text></g>
  <line x1="400" y1="160" x2="446" y2="160" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="790" y1="160" x2="754" y2="160" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g><rect x="120" y="280" width="1000" height="68" rx="8" fill="#f5f3ff" stroke="#334155" stroke-width="1.5"/>
    <text x="140" y="306" text-anchor="start" dominant-baseline="central" class="node-title">Transaction Journal</text>
    <text x="140" y="332" text-anchor="start" dominant-baseline="central" class="node-text">prepare → write-combine → commit；reset/timeout/abort 回滚部分写或标记无效</text></g>
  <g><rect x="120" y="368" width="1000" height="68" rx="8" fill="#f5f3ff" stroke="#334155" stroke-width="1.5"/>
    <text x="140" y="394" text-anchor="start" dominant-baseline="central" class="node-title">Saturation Unit</text>
    <text x="140" y="420" text-anchor="start" dominant-baseline="central" class="node-text">同码位地址 old LLR + new LLR，clamp 到符号范围并计数饱和事件</text></g>
  <g><rect x="120" y="456" width="1000" height="68" rx="8" fill="#f5f3ff" stroke="#334155" stroke-width="1.5"/>
    <text x="140" y="482" text-anchor="start" dominant-baseline="central" class="node-title">Banked LLR SRAM（实现示例）</text>
    <text x="140" y="508" text-anchor="start" dominant-baseline="central" class="node-text">bank = hash(harq,cb,addr) mod B · row = floor(addr/(B×lanes)) · lane = addr mod lanes</text></g>
  <rect x="280" y="560" width="680" height="44" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="620" y="582" text-anchor="middle" dominant-baseline="central" class="note">Read Order：ContextKey → AddrKey → old/new LLR → saturation → commit → lifecycle</text>
</svg>