<?xml version="1.0" encoding="UTF-8"?>
<!--
  @file    T13.1_fixed_point_decoder_requirements.svg
  @brief   T13.1 定点译码器需求图：从浮点 LLR 实验到可审计位宽、饱和、损失预算与位精确需求的
           完整需求封闭流程，含需求模板表格、Q 格式示例和审查关卡。
  @date    2026-08-04
  @note    本次重绘自定语义色（不沿用 PIL 脚本色系）：
           Float Baseline 钢蓝 / Quantization Contract 琥珀 / Fixed Model 紫罗兰 /
           Regression Evidence 翠绿 / Q Format 白卡灰边 / 需求模板白底表格 /
           审查五卡橄榄绿。布局：标题带 -> 四卡需求链 + Q 格式示例 -> 需求模板表格
           -> Checkpoints and Review Gates 五卡 -> 底线规则。
           内容（节点、数值、连线关系）与 docs/L3_工程实现/T18.1 讲义及原 PIL 图语义一致；
           替代 docs/L3_工程实现/assets/T13.1_fixed_point_decoder_requirements.png。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1960" height="1240" viewBox="0 0 1960 1240" role="img" font-family="'Noto Sans CJK SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif">
  <title>T13.1 Fixed-Point Decoder Requirements</title>

  <defs>
    <filter id="soft" x="-10%" y="-10%" width="125%" height="135%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#334155" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5B6B82"/>
    </marker>
  </defs>

  <!-- ============ 标题带 ============ -->
  <rect x="40" y="18" width="1880" height="64" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="980" y="42" font-size="20" font-weight="700" fill="#152033" text-anchor="middle">T13.1 Fixed-Point Decoder Requirements</text>
  <text x="980" y="68" font-size="12.5" fill="#455A64" text-anchor="middle">Turn floating LLR experiments into auditable bitwidth, saturation, loss-budget and bit-exact requirements</text>

  <!-- ============ 顶部：四卡需求链 + Q 格式示例 ============ -->
  <rect x="70" y="110" width="380" height="170" rx="10" fill="#D9E7F6" stroke="#2F5E94" stroke-width="1.5"/>
  <rect x="84" y="124" width="12" height="12" rx="3" fill="#2F5E94"/>
  <text x="106" y="138" font-size="15" font-weight="700" fill="#152033" text-anchor="start">Float Baseline</text>
  <line x1="84" y1="150" x2="430" y2="150" stroke="#2F5E94" stroke-opacity="0.25" stroke-width="1"/>
  <text x="106" y="176" font-size="12" fill="#263238" text-anchor="start">T12 metrics, LLR histograms, first</text>
  <text x="106" y="200" font-size="12" fill="#263238" text-anchor="start">failures and protocol descriptors define</text>
  <text x="106" y="224" font-size="12" fill="#263238" text-anchor="start">the starting point.</text>

  <rect x="480" y="110" width="380" height="170" rx="10" fill="#F8E8C8" stroke="#A8781E" stroke-width="1.5"/>
  <rect x="494" y="124" width="12" height="12" rx="3" fill="#A8781E"/>
  <text x="516" y="138" font-size="15" font-weight="700" fill="#152033" text-anchor="start">Quantization Contract</text>
  <line x1="494" y1="150" x2="840" y2="150" stroke="#A8781E" stroke-opacity="0.25" stroke-width="1"/>
  <text x="516" y="176" font-size="12" fill="#263238" text-anchor="start">Choose width, Q format, clipping,</text>
  <text x="516" y="200" font-size="12" fill="#263238" text-anchor="start">scaling, rounding, saturation and sign</text>
  <text x="516" y="224" font-size="12" fill="#263238" text-anchor="start">convention.</text>

  <rect x="890" y="110" width="380" height="170" rx="10" fill="#E3DCF2" stroke="#59419C" stroke-width="1.5"/>
  <rect x="904" y="124" width="12" height="12" rx="3" fill="#59419C"/>
  <text x="926" y="138" font-size="15" font-weight="700" fill="#152033" text-anchor="start">Fixed Model</text>
  <line x1="904" y1="150" x2="1250" y2="150" stroke="#59419C" stroke-opacity="0.25" stroke-width="1"/>
  <text x="926" y="176" font-size="12" fill="#263238" text-anchor="start">C/C++ uses integer arithmetic, saturating</text>
  <text x="926" y="200" font-size="12" fill="#263238" text-anchor="start">adders, explicit checkpoints and trace</text>
  <text x="926" y="224" font-size="12" fill="#263238" text-anchor="start">dumps.</text>

  <rect x="1300" y="110" width="380" height="170" rx="10" fill="#D3EBDD" stroke="#177A5A" stroke-width="1.5"/>
  <rect x="1314" y="124" width="12" height="12" rx="3" fill="#177A5A"/>
  <text x="1336" y="138" font-size="15" font-weight="700" fill="#152033" text-anchor="start">Regression Evidence</text>
  <line x1="1314" y1="150" x2="1660" y2="150" stroke="#177A5A" stroke-opacity="0.25" stroke-width="1"/>
  <text x="1336" y="176" font-size="12" fill="#263238" text-anchor="start">Compare against Python fixed reference,</text>
  <text x="1336" y="200" font-size="12" fill="#263238" text-anchor="start">record BLER loss, bit-exact pass/fail and</text>
  <text x="1336" y="224" font-size="12" fill="#263238" text-anchor="start">replay paths.</text>

  <!-- Q Format Example -->
  <rect x="1710" y="110" width="220" height="170" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="1740" y="138" font-size="15" font-weight="700" fill="#152033" text-anchor="start">Q Format Example</text>
  <line x1="1730" y1="150" x2="1910" y2="150" stroke="#94A3B8" stroke-opacity="0.25" stroke-width="1"/>
  <g fill="#263238">
    <text x="1740" y="178" font-size="12" text-anchor="start">Q4.2, W=6</text>
    <text x="1740" y="202" font-size="12" text-anchor="start">scale = 2^2 = 4</text>
    <text x="1740" y="226" font-size="12" text-anchor="start">q = round(4L)</text>
    <text x="1740" y="250" font-size="12" text-anchor="start">raw range [-32, 31]</text>
    <text x="1740" y="274" font-size="12" text-anchor="start">example uses [-31, 31]</text>
  </g>

  <!-- ============ 需求模板表格 ============ -->
  <rect x="80" y="340" width="1800" height="560" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="110" y="374" font-size="16" font-weight="700" fill="#152033" text-anchor="start">Requirement Template: What Must Be Fixed Before C/C++</text>
  <line x1="100" y1="386" x2="1860" y2="386" stroke="#94A3B8" stroke-opacity="0.25" stroke-width="1"/>
  <!-- 表头 400..440 -->
  <rect x="110" y="400" width="300" height="40" fill="#E3E9F0" stroke="#8A97A6" stroke-width="1"/>
  <text x="260" y="425" font-size="12.5" font-weight="700" fill="#102027" text-anchor="middle">Decision</text>
  <rect x="410" y="400" width="470" height="40" fill="#E3E9F0" stroke="#8A97A6" stroke-width="1"/>
  <text x="645" y="425" font-size="12.5" font-weight="700" fill="#102027" text-anchor="middle">Required Fields</text>
  <rect x="880" y="400" width="470" height="40" fill="#E3E9F0" stroke="#8A97A6" stroke-width="1"/>
  <text x="1115" y="425" font-size="12.5" font-weight="700" fill="#102027" text-anchor="middle">Evidence</text>
  <rect x="1350" y="400" width="500" height="40" fill="#E3E9F0" stroke="#8A97A6" stroke-width="1"/>
  <text x="1600" y="425" font-size="12.5" font-weight="700" fill="#102027" text-anchor="middle">Failure if Missing</text>
  <!-- 行 1 440..528 -->
  <rect x="110" y="440" width="300" height="88" fill="#FFFFFF" stroke="#C7D0DB" stroke-width="1"/>
  <text x="260" y="484" font-size="12" fill="#263238" text-anchor="middle">LLR format</text>
  <rect x="410" y="440" width="470" height="88" fill="#FFFFFF" stroke="#C7D0DB" stroke-width="1"/>
  <text x="645" y="484" font-size="12" fill="#263238" text-anchor="middle">width, frac, sign convention, clip</text>
  <rect x="880" y="440" width="470" height="88" fill="#FFFFFF" stroke="#C7D0DB" stroke-width="1"/>
  <text x="1115" y="484" font-size="12" fill="#263238" text-anchor="middle">histogram + no-noise vector</text>
  <rect x="1350" y="440" width="500" height="88" fill="#FFFFFF" stroke="#C7D0DB" stroke-width="1"/>
  <text x="1600" y="484" font-size="12" fill="#263238" text-anchor="middle">wrong hard decisions</text>
  <!-- 行 2 528..616 -->
  <rect x="110" y="528" width="300" height="88" fill="#FFFFFF" stroke="#C7D0DB" stroke-width="1"/>
  <text x="260" y="572" font-size="12" fill="#263238" text-anchor="middle">Internal messages</text>
  <rect x="410" y="528" width="470" height="88" fill="#FFFFFF" stroke="#C7D0DB" stroke-width="1"/>
  <text x="645" y="572" font-size="12" fill="#263238" text-anchor="middle">metric width, guard bits, scale</text>
  <rect x="880" y="528" width="470" height="88" fill="#FFFFFF" stroke="#C7D0DB" stroke-width="1"/>
  <text x="1115" y="572" font-size="12" fill="#263238" text-anchor="middle">per-stage max/min trace</text>
  <rect x="1350" y="528" width="500" height="88" fill="#FFFFFF" stroke="#C7D0DB" stroke-width="1"/>
  <text x="1600" y="572" font-size="12" fill="#263238" text-anchor="middle">iteration saturation</text>
  <!-- 行 3 616..704 -->
  <rect x="110" y="616" width="300" height="88" fill="#FFFFFF" stroke="#C7D0DB" stroke-width="1"/>
  <text x="260" y="660" font-size="12" fill="#263238" text-anchor="middle">Arithmetic</text>
  <rect x="410" y="616" width="470" height="88" fill="#FFFFFF" stroke="#C7D0DB" stroke-width="1"/>
  <text x="645" y="660" font-size="12" fill="#263238" text-anchor="middle">rounding, saturation, extension</text>
  <rect x="880" y="616" width="470" height="88" fill="#FFFFFF" stroke="#C7D0DB" stroke-width="1"/>
  <text x="1115" y="660" font-size="12" fill="#263238" text-anchor="middle">edge-codeword tests</text>
  <rect x="1350" y="616" width="500" height="88" fill="#FFFFFF" stroke="#C7D0DB" stroke-width="1"/>
  <text x="1600" y="660" font-size="12" fill="#263238" text-anchor="middle">wraparound sign flip</text>
  <!-- 行 4 704..792 -->
  <rect x="110" y="704" width="300" height="88" fill="#FFFFFF" stroke="#C7D0DB" stroke-width="1"/>
  <text x="260" y="748" font-size="12" fill="#263238" text-anchor="middle">Loss budget</text>
  <rect x="410" y="704" width="470" height="88" fill="#FFFFFF" stroke="#C7D0DB" stroke-width="1"/>
  <text x="645" y="748" font-size="12" fill="#263238" text-anchor="middle">float baseline, fixed budget, CI</text>
  <rect x="880" y="704" width="470" height="88" fill="#FFFFFF" stroke="#C7D0DB" stroke-width="1"/>
  <text x="1115" y="748" font-size="12" fill="#263238" text-anchor="middle">BER/BLER report</text>
  <rect x="1350" y="704" width="500" height="88" fill="#FFFFFF" stroke="#C7D0DB" stroke-width="1"/>
  <text x="1600" y="748" font-size="12" fill="#263238" text-anchor="middle">unprovable performance claim</text>
  <!-- 行 5 792..880 -->
  <rect x="110" y="792" width="300" height="88" fill="#FFFFFF" stroke="#C7D0DB" stroke-width="1"/>
  <text x="260" y="836" font-size="12" fill="#263238" text-anchor="middle">Compare policy</text>
  <rect x="410" y="792" width="470" height="88" fill="#FFFFFF" stroke="#C7D0DB" stroke-width="1"/>
  <text x="645" y="836" font-size="12" fill="#263238" text-anchor="middle">bit-exact checkpoints, tolerance</text>
  <rect x="880" y="792" width="470" height="88" fill="#FFFFFF" stroke="#C7D0DB" stroke-width="1"/>
  <text x="1115" y="836" font-size="12" fill="#263238" text-anchor="middle">replay bundle</text>
  <rect x="1350" y="792" width="500" height="88" fill="#FFFFFF" stroke="#C7D0DB" stroke-width="1"/>
  <text x="1600" y="836" font-size="12" fill="#263238" text-anchor="middle">C/RTL mismatch triage stalls</text>

  <!-- ============ Checkpoints and Review Gates ============ -->
  <rect x="80" y="960" width="1800" height="44" rx="10" fill="#E5EDD1" stroke="#5E7A24" stroke-width="1.5"/>
  <rect x="94" y="974" width="12" height="12" rx="3" fill="#5E7A24"/>
  <text x="116" y="988" font-size="16" font-weight="700" fill="#152033" text-anchor="start">Checkpoints and Review Gates</text>
  <!-- 五张检查卡 1020..1130 -->
  <g fill="#263238">
    <rect x="110" y="1020" width="330" height="110" rx="8" fill="#E5EDD1" stroke="#5E7A24" stroke-width="1.5"/>
    <text x="140" y="1048" font-size="14" font-weight="700" fill="#152033" text-anchor="start">Input</text>
    <text x="140" y="1076" font-size="12" text-anchor="start">LLR sign, width, fraction, clip,</text>
    <text x="140" y="1100" font-size="12" text-anchor="start">histogram</text>

    <rect x="465" y="1020" width="330" height="110" rx="8" fill="#E5EDD1" stroke="#5E7A24" stroke-width="1.5"/>
    <text x="495" y="1048" font-size="14" font-weight="700" fill="#152033" text-anchor="start">Soft Buffer</text>
    <text x="495" y="1076" font-size="12" text-anchor="start">HARQ accumulation, saturation count,</text>
    <text x="495" y="1100" font-size="12" text-anchor="start">repeat merge</text>

    <rect x="820" y="1020" width="330" height="110" rx="8" fill="#E5EDD1" stroke="#5E7A24" stroke-width="1.5"/>
    <text x="850" y="1048" font-size="14" font-weight="700" fill="#152033" text-anchor="start">Core</text>
    <text x="850" y="1076" font-size="12" text-anchor="start">branch metric, CN/VN message, PM</text>
    <text x="850" y="1100" font-size="12" text-anchor="start">update</text>

    <rect x="1175" y="1020" width="330" height="110" rx="8" fill="#E5EDD1" stroke="#5E7A24" stroke-width="1.5"/>
    <text x="1205" y="1048" font-size="14" font-weight="700" fill="#152033" text-anchor="start">Output</text>
    <text x="1205" y="1076" font-size="12" text-anchor="start">hard bits, CRC, syndrome, false-pass</text>
    <text x="1205" y="1100" font-size="12" text-anchor="start">flags</text>

    <rect x="1530" y="1020" width="330" height="110" rx="8" fill="#E5EDD1" stroke="#5E7A24" stroke-width="1.5"/>
    <text x="1560" y="1048" font-size="14" font-weight="700" fill="#152033" text-anchor="start">Report</text>
    <text x="1560" y="1076" font-size="12" text-anchor="start">fixed loss budget, CI overlap, replay</text>
    <text x="1560" y="1100" font-size="12" text-anchor="start">command</text>
  </g>
  <!-- 底线规则 -->
  <rect x="80" y="1168" width="1800" height="44" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="980" y="1196" font-size="12.5" fill="#37474F" text-anchor="middle">Requirement rule: if a field affects integer value, saturation, ordering or pass/fail status, it must be in the descriptor and in the replay bundle.</text>

  <!-- ============ 箭头 ============ -->
  <g stroke="#5B6B82" stroke-width="2" fill="none">
    <path d="M 450 195 L 480 195" marker-end="url(#arrow)"/>
    <path d="M 860 195 L 890 195" marker-end="url(#arrow)"/>
    <path d="M 1270 195 L 1300 195" marker-end="url(#arrow)"/>
    <path d="M 1680 195 L 1710 195" marker-end="url(#arrow)"/>
    <path d="M 440 1075 L 465 1075" marker-end="url(#arrow)"/>
    <path d="M 795 1075 L 820 1075" marker-end="url(#arrow)"/>
    <path d="M 1150 1075 L 1175 1075" marker-end="url(#arrow)"/>
    <path d="M 1505 1075 L 1530 1075" marker-end="url(#arrow)"/>
  </g>
</svg>
