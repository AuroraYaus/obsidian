<?xml version="1.0" encoding="UTF-8"?>
<!--
  @file    T12.2_LTE_Turbo_float_sim_flow.svg
  @brief   T12.2 LTE Turbo 浮点仿真流程图：从协议参数、TB/CB 构造、Turbo 编码、速率匹配、
           AWGN 加噪到译码器输出的完整仿真管线，含实验矩阵表格与工程检测点。
  @date    2026-08-04
  @note    本次重绘自定语义色（不沿用 PIL 脚本色系）：
           Protocol Config 钢蓝 / TB/CB Builder 琥珀 / Turbo Encoder 紫罗兰 /
           Rate Matching 橄榄 / AWGN 翠绿 / Decoder 玫红 / Decoder Outputs 石板灰 /
           Trace 淡蓝灰 / Outputs 青绿 / Archive 冷灰。
           布局为蛇形重设计：上行三节点（左向右）-> 下行三节点（右向左）-> 全宽
           Decoder Outputs -> 三输出扇出 -> 实验矩阵 -> Engineering Checks。
           内容（节点、数值、连线关系）与 docs/L3/T17.2 讲义及原 PIL 图语义一致；
           替代 docs/L3/assets/T12.2_LTE_Turbo_float_sim_flow.png。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1440" viewBox="0 0 1700 1440" role="img" font-family="'Noto Sans CJK SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif">
  <title>T12.2 LTE Turbo Floating-Point Simulation Plan</title>

  <defs>
    <filter id="soft" x="-10%" y="-10%" width="125%" height="135%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#334155" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5B6B82"/>
    </marker>
  </defs>

  <!-- ============ 标题带 ============ -->
  <rect x="40" y="18" width="1620" height="64" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="850" y="42" font-size="20" font-weight="700" fill="#152033" text-anchor="middle">T12.2 LTE Turbo Floating-Point Simulation Plan</text>
  <text x="850" y="68" font-size="12.5" fill="#455A64" text-anchor="middle">Protocol parameters, deterministic seeds, decoder variants, BLER outputs and failure traces</text>

  <!-- ============ 上行三节点：Protocol Config -> TB/CB Builder -> Turbo Encoder ============ -->
  <rect x="70" y="110" width="500" height="160" rx="10" fill="#D9E7F6" stroke="#2F5E94" stroke-width="1.5"/>
  <rect x="84" y="124" width="12" height="12" rx="3" fill="#2F5E94"/>
  <text x="106" y="138" font-size="15" font-weight="700" fill="#152033" text-anchor="start">Protocol Config</text>
  <line x1="84" y1="150" x2="550" y2="150" stroke="#2F5E94" stroke-opacity="0.25" stroke-width="1"/>
  <text x="106" y="176" font-size="12" fill="#263238" text-anchor="start">TS 36.212 refs, TB size, CRC, K/f1/f2,</text>
  <text x="106" y="200" font-size="12" fill="#263238" text-anchor="start">RV, max_iter, Log-MAP mode.</text>

  <rect x="620" y="110" width="500" height="160" rx="10" fill="#F8E8C8" stroke="#A8781E" stroke-width="1.5"/>
  <rect x="634" y="124" width="12" height="12" rx="3" fill="#A8781E"/>
  <text x="656" y="138" font-size="15" font-weight="700" fill="#152033" text-anchor="start">TB/CB Builder</text>
  <line x1="634" y1="150" x2="1100" y2="150" stroke="#A8781E" stroke-opacity="0.25" stroke-width="1"/>
  <text x="656" y="176" font-size="12" fill="#263238" text-anchor="start">Payload, TB CRC, CB segmentation,</text>
  <text x="656" y="200" font-size="12" fill="#263238" text-anchor="start">filler, CB CRC metadata.</text>

  <rect x="1170" y="110" width="500" height="160" rx="10" fill="#E3DCF2" stroke="#59419C" stroke-width="1.5"/>
  <rect x="1184" y="124" width="12" height="12" rx="3" fill="#59419C"/>
  <text x="1206" y="138" font-size="15" font-weight="700" fill="#152033" text-anchor="start">Turbo Encoder</text>
  <line x1="1184" y1="150" x2="1650" y2="150" stroke="#59419C" stroke-opacity="0.25" stroke-width="1"/>
  <text x="1206" y="176" font-size="12" fill="#263238" text-anchor="start">RSC pair, internal interleaver,</text>
  <text x="1206" y="200" font-size="12" fill="#263238" text-anchor="start">systematic/parity/tail streams.</text>

  <!-- ============ 下行三节点：Rate Matching -> AWGN -> Decoder（右向左） ============ -->
  <rect x="1170" y="330" width="500" height="160" rx="10" fill="#E5EDD1" stroke="#5E7A24" stroke-width="1.5"/>
  <rect x="1184" y="344" width="12" height="12" rx="3" fill="#5E7A24"/>
  <text x="1206" y="358" font-size="15" font-weight="700" fill="#152033" text-anchor="start">Rate Matching + RV</text>
  <line x1="1184" y1="370" x2="1650" y2="370" stroke="#5E7A24" stroke-opacity="0.25" stroke-width="1"/>
  <text x="1206" y="396" font-size="12" fill="#263238" text-anchor="start">Sub-block interleaving, circular buffer,</text>
  <text x="1206" y="420" font-size="12" fill="#263238" text-anchor="start">rvidx, E and received positions.</text>

  <rect x="620" y="330" width="500" height="160" rx="10" fill="#D3EBDD" stroke="#177A5A" stroke-width="1.5"/>
  <rect x="634" y="344" width="12" height="12" rx="3" fill="#177A5A"/>
  <text x="656" y="358" font-size="15" font-weight="700" fill="#152033" text-anchor="start">AWGN + LLR</text>
  <line x1="634" y1="370" x2="1100" y2="370" stroke="#177A5A" stroke-opacity="0.25" stroke-width="1"/>
  <text x="656" y="396" font-size="12" fill="#263238" text-anchor="start">Eb/N0 sweep, noise seed, BPSK/QPSK</text>
  <text x="656" y="420" font-size="12" fill="#263238" text-anchor="start">demap, POS_ZERO LLR.</text>

  <rect x="70" y="330" width="500" height="160" rx="10" fill="#F6DEE3" stroke="#A8425C" stroke-width="1.5"/>
  <rect x="84" y="344" width="12" height="12" rx="3" fill="#A8425C"/>
  <text x="106" y="358" font-size="15" font-weight="700" fill="#152033" text-anchor="start">Decoder</text>
  <line x1="84" y1="370" x2="550" y2="370" stroke="#A8425C" stroke-opacity="0.25" stroke-width="1"/>
  <text x="106" y="396" font-size="12" fill="#263238" text-anchor="start">Rate recovery, deinterleaving,</text>
  <text x="106" y="420" font-size="12" fill="#263238" text-anchor="start">Log-MAP or Max-Log-MAP, CRC checks.</text>

  <!-- ============ Decoder Outputs（全宽汇聚框） ============ -->
  <rect x="80" y="560" width="1540" height="80" rx="10" fill="#D8E0E8" stroke="#3E4F63" stroke-width="1.5"/>
  <rect x="94" y="574" width="12" height="12" rx="3" fill="#3E4F63"/>
  <text x="116" y="588" font-size="15" font-weight="700" fill="#152033" text-anchor="start">Decoder Outputs</text>
  <line x1="94" y1="600" x2="1600" y2="600" stroke="#3E4F63" stroke-opacity="0.25" stroke-width="1"/>
  <text x="116" y="624" font-size="12" fill="#263238" text-anchor="start">One decoded result fans out to trace, metrics and reproducible evidence archive.</text>

  <!-- ============ 三输出扇出（关于 x=850 对称） ============ -->
  <rect x="125" y="710" width="450" height="160" rx="10" fill="#DDE6F0" stroke="#4A6178" stroke-width="1.5"/>
  <rect x="139" y="724" width="12" height="12" rx="3" fill="#4A6178"/>
  <text x="161" y="738" font-size="15" font-weight="700" fill="#152033" text-anchor="start">Trace Fields</text>
  <line x1="139" y1="750" x2="555" y2="750" stroke="#4A6178" stroke-opacity="0.25" stroke-width="1"/>
  <text x="161" y="776" font-size="12" fill="#263238" text-anchor="start">frame_id, cb_index, K, K_plus/minus, filler,</text>
  <text x="161" y="800" font-size="12" fill="#263238" text-anchor="start">rv, iter_used, crc_pass, first_mismatch.</text>

  <rect x="625" y="710" width="450" height="160" rx="10" fill="#CFE9E2" stroke="#15705C" stroke-width="1.5"/>
  <rect x="639" y="724" width="12" height="12" rx="3" fill="#15705C"/>
  <text x="661" y="738" font-size="15" font-weight="700" fill="#152033" text-anchor="start">BLER/BER Outputs</text>
  <line x1="639" y1="750" x2="1055" y2="750" stroke="#15705C" stroke-opacity="0.25" stroke-width="1"/>
  <text x="661" y="776" font-size="12" fill="#263238" text-anchor="start">metrics.csv with snr_db, frames, error_blocks,</text>
  <text x="661" y="800" font-size="12" fill="#263238" text-anchor="start">BER, BLER, avg_iter, saved_failures.</text>

  <rect x="1125" y="710" width="450" height="160" rx="10" fill="#EDF1F5" stroke="#6B7A8A" stroke-width="1.5"/>
  <rect x="1139" y="724" width="12" height="12" rx="3" fill="#6B7A8A"/>
  <text x="1161" y="738" font-size="15" font-weight="700" fill="#152033" text-anchor="start">Reproducible Archive</text>
  <line x1="1139" y1="750" x2="1555" y2="750" stroke="#6B7A8A" stroke-opacity="0.25" stroke-width="1"/>
  <text x="1161" y="776" font-size="12" fill="#263238" text-anchor="start">resolved config, command, seeds, frames.jsonl,</text>
  <text x="1161" y="800" font-size="12" fill="#263238" text-anchor="start">failures, plots, evidence.md.</text>

  <!-- ============ 实验矩阵表格 ============ -->
  <rect x="130" y="940" width="1460" height="300" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="160" y="974" font-size="16" font-weight="700" fill="#152033" text-anchor="start">Experiment Matrix Example</text>
  <line x1="150" y1="986" x2="1570" y2="986" stroke="#94A3B8" stroke-opacity="0.25" stroke-width="1"/>
  <!-- 表头 1010..1050 -->
  <rect x="150" y="1010" width="150" height="40" fill="#E3E9F0" stroke="#8A97A6" stroke-width="1"/>
  <text x="225" y="1035" font-size="12.5" font-weight="700" fill="#102027" text-anchor="middle">Case</text>
  <rect x="300" y="1010" width="260" height="40" fill="#E3E9F0" stroke="#8A97A6" stroke-width="1"/>
  <text x="430" y="1035" font-size="12.5" font-weight="700" fill="#102027" text-anchor="middle">Decoder</text>
  <rect x="560" y="1010" width="300" height="40" fill="#E3E9F0" stroke="#8A97A6" stroke-width="1"/>
  <text x="710" y="1035" font-size="12.5" font-weight="700" fill="#102027" text-anchor="middle">Eb/N0 sweep</text>
  <rect x="860" y="1010" width="350" height="40" fill="#E3E9F0" stroke="#8A97A6" stroke-width="1"/>
  <text x="1035" y="1035" font-size="12.5" font-weight="700" fill="#102027" text-anchor="middle">Stop rule</text>
  <rect x="1210" y="1010" width="360" height="40" fill="#E3E9F0" stroke="#8A97A6" stroke-width="1"/>
  <text x="1390" y="1035" font-size="12.5" font-weight="700" fill="#102027" text-anchor="middle">Saved evidence</text>
  <!-- 行 1 1050..1106 -->
  <rect x="150" y="1050" width="150" height="56" fill="#FFFFFF" stroke="#C7D0DB" stroke-width="1"/>
  <text x="225" y="1078" font-size="12" fill="#263238" text-anchor="middle">smoke</text>
  <rect x="300" y="1050" width="260" height="56" fill="#FFFFFF" stroke="#C7D0DB" stroke-width="1"/>
  <text x="430" y="1078" font-size="12" fill="#263238" text-anchor="middle">Max-Log-MAP</text>
  <rect x="560" y="1050" width="300" height="56" fill="#FFFFFF" stroke="#C7D0DB" stroke-width="1"/>
  <text x="710" y="1078" font-size="12" fill="#263238" text-anchor="middle">0.0:2.0:0.5</text>
  <rect x="860" y="1050" width="350" height="56" fill="#FFFFFF" stroke="#C7D0DB" stroke-width="1"/>
  <text x="1035" y="1078" font-size="12" fill="#263238" text-anchor="middle">min 100 frames or 20 errors</text>
  <rect x="1210" y="1050" width="360" height="56" fill="#FFFFFF" stroke="#C7D0DB" stroke-width="1"/>
  <text x="1390" y="1078" font-size="12" fill="#263238" text-anchor="middle">metrics + first 5 failures</text>
  <!-- 行 2 1106..1162 -->
  <rect x="150" y="1106" width="150" height="56" fill="#FFFFFF" stroke="#C7D0DB" stroke-width="1"/>
  <text x="225" y="1134" font-size="12" fill="#263238" text-anchor="middle">reference</text>
  <rect x="300" y="1106" width="260" height="56" fill="#FFFFFF" stroke="#C7D0DB" stroke-width="1"/>
  <text x="430" y="1134" font-size="12" fill="#263238" text-anchor="middle">Log-MAP</text>
  <rect x="560" y="1106" width="300" height="56" fill="#FFFFFF" stroke="#C7D0DB" stroke-width="1"/>
  <text x="710" y="1134" font-size="12" fill="#263238" text-anchor="middle">0.5:2.5:0.5</text>
  <rect x="860" y="1106" width="350" height="56" fill="#FFFFFF" stroke="#C7D0DB" stroke-width="1"/>
  <text x="1035" y="1134" font-size="12" fill="#263238" text-anchor="middle">min 1000 frames or 100 errors</text>
  <rect x="1210" y="1106" width="360" height="56" fill="#FFFFFF" stroke="#C7D0DB" stroke-width="1"/>
  <text x="1390" y="1134" font-size="12" fill="#263238" text-anchor="middle">metrics + all config</text>
  <!-- 行 3 1162..1218 -->
  <rect x="150" y="1162" width="150" height="56" fill="#FFFFFF" stroke="#C7D0DB" stroke-width="1"/>
  <text x="225" y="1190" font-size="12" fill="#263238" text-anchor="middle">edge</text>
  <rect x="300" y="1162" width="260" height="56" fill="#FFFFFF" stroke="#C7D0DB" stroke-width="1"/>
  <text x="430" y="1190" font-size="12" fill="#263238" text-anchor="middle">Max-Log-MAP</text>
  <rect x="560" y="1162" width="300" height="56" fill="#FFFFFF" stroke="#C7D0DB" stroke-width="1"/>
  <text x="710" y="1190" font-size="12" fill="#263238" text-anchor="middle">fixed 1.0</text>
  <rect x="860" y="1162" width="350" height="56" fill="#FFFFFF" stroke="#C7D0DB" stroke-width="1"/>
  <text x="1035" y="1190" font-size="12" fill="#263238" text-anchor="middle">10 injected failures</text>
  <rect x="1210" y="1162" width="360" height="56" fill="#FFFFFF" stroke="#C7D0DB" stroke-width="1"/>
  <text x="1390" y="1190" font-size="12" fill="#263238" text-anchor="middle">full trace + replay command</text>

  <!-- ============ Engineering Checks 说明框 ============ -->
  <rect x="130" y="1290" width="1460" height="120" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="160" y="1318" font-size="16" font-weight="700" fill="#152033" text-anchor="start">Engineering Checks</text>
  <line x1="150" y1="1330" x2="1570" y2="1330" stroke="#94A3B8" stroke-opacity="0.25" stroke-width="1"/>
  <g fill="#37474F">
    <text x="160" y="1356" font-size="12.5" text-anchor="start">All SNR points must record seed, frame count, error count and decoder mode.</text>
    <text x="160" y="1380" font-size="12.5" text-anchor="start">Every saved failure must replay from archived LLR and descriptor, not regenerate hidden inputs.</text>
    <text x="160" y="1404" font-size="12.5" text-anchor="start">Protocol evidence constrains CRC/segmentation/rate matching; BLER thresholds are engineering goals.</text>
  </g>

  <!-- ============ 箭头（9 条，path 终点落在盒边上） ============ -->
  <g stroke="#5B6B82" stroke-width="2" fill="none">
    <path d="M 570 190 L 620 190" marker-end="url(#arrow)"/>
    <path d="M 1120 190 L 1170 190" marker-end="url(#arrow)"/>
    <path d="M 1420 270 L 1420 330" marker-end="url(#arrow)"/>
    <path d="M 1170 410 L 1120 410" marker-end="url(#arrow)"/>
    <path d="M 620 410 L 570 410" marker-end="url(#arrow)"/>
    <path d="M 320 490 L 320 560" marker-end="url(#arrow)"/>
    <path d="M 350 640 L 350 710" marker-end="url(#arrow)"/>
    <path d="M 850 640 L 850 710" marker-end="url(#arrow)"/>
    <path d="M 1350 640 L 1350 710" marker-end="url(#arrow)"/>
  </g>
</svg>
