<?xml version="1.0" encoding="UTF-8"?>
<!--
  @file    T13.6_bit_exact_regression_harness.svg
  @brief   T13.6 位精确回归测试框架管道图：Python 浮点/定点、C/C++ 定点、RTL 输出与
           CI/失败回放闭环，含对比规则表与译码器检查点清单。
  @date    2026-08-04
  @note    本次重绘自定语义色（不沿用 PIL 脚本色系）：
           Protocol Vector 钢蓝 / Python Float 翠绿 / Python Fixed 琥珀 /
           C/C++ Fixed 紫罗兰 / RTL Output 玫红 / Compare Core 石板灰 /
           CI Gate 青绿 / Failure Bundle 珊瑚红 / 表格白底 / 底线规则灰边。
           布局：标题带 -> 五卡管线 -> Compare Core（三路汇入）-> CI Gate + Failure Bundle
           -> 对比规则表 -> Decoder Checkpoint Manifest -> 底线规则。
           内容（节点、数值、连线关系）与 docs/L3/T18.6 讲义及原 PIL 图语义一致；
           替代 docs/L3/assets/T13.6_bit_exact_regression_harness.png。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1960" height="1480" viewBox="0 0 1960 1480" role="img" font-family="'Noto Sans CJK SC','Source Han Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif">
  <title>T13.6 Bit-Exact Regression Harness</title>

  <defs>
    <filter id="soft" x="-10%" y="-10%" width="125%" height="135%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#334155" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5B6B82"/>
    </marker>
  </defs>

  <!-- ============ 标题带 ============ -->
  <rect x="40" y="18" width="1880" height="64" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="980" y="42" font-size="20" font-weight="700" fill="#152033" text-anchor="middle">T13.6 Bit-Exact Regression Harness</text>
  <text x="980" y="68" font-size="12.5" fill="#455A64" text-anchor="middle">One vector schema drives Python float/fixed, C/C++ fixed, RTL compare, CI and failure replay.</text>

  <!-- ============ 五卡管线 ============ -->
  <rect x="70" y="110" width="360" height="170" rx="10" fill="#D9E7F6" stroke="#2F5E94" stroke-width="1.5"/>
  <rect x="84" y="124" width="12" height="12" rx="3" fill="#2F5E94"/>
  <text x="106" y="138" font-size="15" font-weight="700" fill="#152033" text-anchor="start">Protocol Vector</text>
  <line x1="84" y1="150" x2="410" y2="150" stroke="#2F5E94" stroke-opacity="0.25" stroke-width="1"/>
  <text x="106" y="176" font-size="12" fill="#263238" text-anchor="start">TS evidence, seed, LLR, RV, code-block</text>
  <text x="106" y="200" font-size="12" fill="#263238" text-anchor="start">order and descriptor hashes.</text>

  <rect x="460" y="110" width="360" height="170" rx="10" fill="#D3EBDD" stroke="#177A5A" stroke-width="1.5"/>
  <rect x="474" y="124" width="12" height="12" rx="3" fill="#177A5A"/>
  <text x="496" y="138" font-size="15" font-weight="700" fill="#152033" text-anchor="start">Python Float</text>
  <line x1="474" y1="150" x2="800" y2="150" stroke="#177A5A" stroke-opacity="0.25" stroke-width="1"/>
  <text x="496" y="176" font-size="12" fill="#263238" text-anchor="start">Numerical reference for BLER curves and</text>
  <text x="496" y="200" font-size="12" fill="#263238" text-anchor="start">algorithm sanity checks.</text>

  <rect x="850" y="110" width="360" height="170" rx="10" fill="#F8E8C8" stroke="#A8781E" stroke-width="1.5"/>
  <rect x="864" y="124" width="12" height="12" rx="3" fill="#A8781E"/>
  <text x="886" y="138" font-size="15" font-weight="700" fill="#152033" text-anchor="start">Python Fixed</text>
  <line x1="864" y1="150" x2="1190" y2="150" stroke="#A8781E" stroke-opacity="0.25" stroke-width="1"/>
  <text x="886" y="176" font-size="12" fill="#263238" text-anchor="start">Integer reference with the same rounding,</text>
  <text x="886" y="200" font-size="12" fill="#263238" text-anchor="start">saturation and trace schema.</text>

  <rect x="1240" y="110" width="360" height="170" rx="10" fill="#E3DCF2" stroke="#59419C" stroke-width="1.5"/>
  <rect x="1254" y="124" width="12" height="12" rx="3" fill="#59419C"/>
  <text x="1276" y="138" font-size="15" font-weight="700" fill="#152033" text-anchor="start">C/C++ Fixed</text>
  <line x1="1254" y1="150" x2="1580" y2="150" stroke="#59419C" stroke-opacity="0.25" stroke-width="1"/>
  <text x="1276" y="176" font-size="12" fill="#263238" text-anchor="start">Production-style fixed model with layout</text>
  <text x="1276" y="200" font-size="12" fill="#263238" text-anchor="start">version and checkpoint dumps.</text>

  <rect x="1630" y="110" width="300" height="170" rx="10" fill="#F6DEE3" stroke="#A8425C" stroke-width="1.5"/>
  <rect x="1644" y="124" width="12" height="12" rx="3" fill="#A8425C"/>
  <text x="1666" y="138" font-size="15" font-weight="700" fill="#152033" text-anchor="start">RTL Output</text>
  <line x1="1644" y1="150" x2="1910" y2="150" stroke="#A8425C" stroke-opacity="0.25" stroke-width="1"/>
  <text x="1666" y="176" font-size="12" fill="#263238" text-anchor="start">Cycle-aligned traces, valid masks,</text>
  <text x="1666" y="200" font-size="12" fill="#263238" text-anchor="start">saturation counters and status bits.</text>

  <!-- ============ Compare Core（三路汇入） ============ -->
  <rect x="660" y="340" width="640" height="160" rx="10" fill="#D8E0E8" stroke="#3E4F63" stroke-width="1.5"/>
  <rect x="674" y="354" width="12" height="12" rx="3" fill="#3E4F63"/>
  <text x="696" y="368" font-size="16" font-weight="700" fill="#152033" text-anchor="start">Compare Core</text>
  <line x1="674" y1="380" x2="1280" y2="380" stroke="#3E4F63" stroke-opacity="0.25" stroke-width="1"/>
  <text x="696" y="406" font-size="12" fill="#263238" text-anchor="start">Validate metadata and hashes first, then compare checkpoints,</text>
  <text x="696" y="430" font-size="12" fill="#263238" text-anchor="start">final bits, CRC or syndrome, saturation counts and BLER budgets.</text>

  <!-- ============ CI Gate + Failure Bundle ============ -->
  <rect x="130" y="580" width="520" height="150" rx="10" fill="#CFE9E2" stroke="#15705C" stroke-width="1.5"/>
  <rect x="144" y="594" width="12" height="12" rx="3" fill="#15705C"/>
  <text x="166" y="608" font-size="15" font-weight="700" fill="#152033" text-anchor="start">CI Gate</text>
  <line x1="144" y1="620" x2="630" y2="620" stroke="#15705C" stroke-opacity="0.25" stroke-width="1"/>
  <text x="166" y="646" font-size="12" fill="#263238" text-anchor="start">Smoke, directed, random, nightly and replay</text>
  <text x="166" y="670" font-size="12" fill="#263238" text-anchor="start">suites run with fixed seeds and frozen</text>
  <text x="166" y="694" font-size="12" fill="#263238" text-anchor="start">policy versions.</text>

  <rect x="1310" y="580" width="520" height="150" rx="10" fill="#F9DDD5" stroke="#B24A33" stroke-width="1.5"/>
  <rect x="1324" y="594" width="12" height="12" rx="3" fill="#B24A33"/>
  <text x="1346" y="608" font-size="15" font-weight="700" fill="#152033" text-anchor="start">Failure Bundle</text>
  <line x1="1324" y1="620" x2="1810" y2="620" stroke="#B24A33" stroke-opacity="0.25" stroke-width="1"/>
  <text x="1346" y="646" font-size="12" fill="#263238" text-anchor="start">Manifest, vector, inputs, traces, diff, logs</text>
  <text x="1346" y="670" font-size="12" fill="#263238" text-anchor="start">and optional waveform are archived for</text>
  <text x="1346" y="694" font-size="12" fill="#263238" text-anchor="start">first mismatch replay.</text>

  <!-- ============ 对比规则表 ============ -->
  <rect x="130" y="800" width="1700" height="360" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="160" y="834" font-size="16" font-weight="700" fill="#152033" text-anchor="start">Compare Rules</text>
  <line x1="150" y1="846" x2="1810" y2="846" stroke="#94A3B8" stroke-opacity="0.25" stroke-width="1"/>
  <!-- 表头 860..900 -->
  <rect x="150" y="860" width="420" height="40" fill="#E3E9F0" stroke="#8A97A6" stroke-width="1"/>
  <text x="360" y="885" font-size="12.5" font-weight="700" fill="#102027" text-anchor="middle">Layer</text>
  <rect x="570" y="860" width="610" height="40" fill="#E3E9F0" stroke="#8A97A6" stroke-width="1"/>
  <text x="875" y="885" font-size="12.5" font-weight="700" fill="#102027" text-anchor="middle">Compare Rule</text>
  <rect x="1180" y="860" width="620" height="40" fill="#E3E9F0" stroke="#8A97A6" stroke-width="1"/>
  <text x="1490" y="885" font-size="12.5" font-weight="700" fill="#102027" text-anchor="middle">Failure Evidence</text>
  <!-- 行 1 900..960 -->
  <rect x="150" y="900" width="420" height="60" fill="#FFFFFF" stroke="#C7D0DB" stroke-width="1"/>
  <text x="360" y="930" font-size="12" fill="#263238" text-anchor="middle">Float vs fixed</text>
  <rect x="570" y="900" width="610" height="60" fill="#FFFFFF" stroke="#C7D0DB" stroke-width="1"/>
  <text x="875" y="930" font-size="12" fill="#263238" text-anchor="middle">Tolerance or BLER budget</text>
  <rect x="1180" y="900" width="620" height="60" fill="#FFFFFF" stroke="#C7D0DB" stroke-width="1"/>
  <text x="1490" y="930" font-size="12" fill="#263238" text-anchor="middle">metric diff + curve ref</text>
  <!-- 行 2 960..1020 -->
  <rect x="150" y="960" width="420" height="60" fill="#FFFFFF" stroke="#C7D0DB" stroke-width="1"/>
  <text x="360" y="990" font-size="12" fill="#263238" text-anchor="middle">Python fixed vs C/C++</text>
  <rect x="570" y="960" width="610" height="60" fill="#FFFFFF" stroke="#C7D0DB" stroke-width="1"/>
  <text x="875" y="990" font-size="12" fill="#263238" text-anchor="middle">Exact integer equality</text>
  <rect x="1180" y="960" width="620" height="60" fill="#FFFFFF" stroke="#C7D0DB" stroke-width="1"/>
  <text x="1490" y="990" font-size="12" fill="#263238" text-anchor="middle">first mismatch trace</text>
  <!-- 行 3 1020..1080 -->
  <rect x="150" y="1020" width="420" height="60" fill="#FFFFFF" stroke="#C7D0DB" stroke-width="1"/>
  <text x="360" y="1050" font-size="12" fill="#263238" text-anchor="middle">C/C++ vs RTL</text>
  <rect x="570" y="1020" width="610" height="60" fill="#FFFFFF" stroke="#C7D0DB" stroke-width="1"/>
  <text x="875" y="1050" font-size="12" fill="#263238" text-anchor="middle">Exact with latency align</text>
  <rect x="1180" y="1020" width="620" height="60" fill="#FFFFFF" stroke="#C7D0DB" stroke-width="1"/>
  <text x="1490" y="1050" font-size="12" fill="#263238" text-anchor="middle">trace + waveform</text>
  <!-- 行 4 1080..1140 -->
  <rect x="150" y="1080" width="420" height="60" fill="#FFFFFF" stroke="#C7D0DB" stroke-width="1"/>
  <text x="360" y="1110" font-size="12" fill="#263238" text-anchor="middle">Metadata</text>
  <rect x="570" y="1080" width="610" height="60" fill="#FFFFFF" stroke="#C7D0DB" stroke-width="1"/>
  <text x="875" y="1110" font-size="12" fill="#263238" text-anchor="middle">Hash equality required</text>
  <rect x="1180" y="1080" width="620" height="60" fill="#FFFFFF" stroke="#C7D0DB" stroke-width="1"/>
  <text x="1490" y="1110" font-size="12" fill="#263238" text-anchor="middle">schema/version diff</text>

  <!-- ============ Decoder Checkpoint Manifest ============ -->
  <rect x="130" y="1180" width="1700" height="200" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="160" y="1214" font-size="16" font-weight="700" fill="#152033" text-anchor="start">Decoder Checkpoint Manifest</text>
  <line x1="150" y1="1226" x2="1810" y2="1226" stroke="#94A3B8" stroke-opacity="0.25" stroke-width="1"/>
  <!-- 表头 1240..1270 -->
  <rect x="150" y="1240" width="300" height="30" fill="#E3E9F0" stroke="#8A97A6" stroke-width="1"/>
  <text x="300" y="1260" font-size="12.5" font-weight="700" fill="#102027" text-anchor="middle">Decoder</text>
  <rect x="450" y="1240" width="1350" height="30" fill="#E3E9F0" stroke="#8A97A6" stroke-width="1"/>
  <text x="1125" y="1260" font-size="12.5" font-weight="700" fill="#102027" text-anchor="middle">Required Checkpoints</text>
  <!-- 行 1 1270..1300 -->
  <rect x="150" y="1270" width="300" height="30" fill="#FFFFFF" stroke="#C7D0DB" stroke-width="1"/>
  <text x="300" y="1290" font-size="12" fill="#263238" text-anchor="middle">Turbo</text>
  <rect x="450" y="1270" width="1350" height="30" fill="#FFFFFF" stroke="#C7D0DB" stroke-width="1"/>
  <text x="1125" y="1290" font-size="12" fill="#263238" text-anchor="middle">rate recovery, branch metric, alpha/beta, extrinsic, hard bits, CB/TB CRC</text>
  <!-- 行 2 1300..1330 -->
  <rect x="150" y="1300" width="300" height="30" fill="#FFFFFF" stroke="#C7D0DB" stroke-width="1"/>
  <text x="300" y="1320" font-size="12" fill="#263238" text-anchor="middle">LDPC</text>
  <rect x="450" y="1300" width="1350" height="30" fill="#FFFFFF" stroke="#C7D0DB" stroke-width="1"/>
  <text x="1125" y="1320" font-size="12" fill="#263238" text-anchor="middle">rate recovery, quantized LLR, CN min1/min2, layer trace, posterior, syndrome, CRC</text>
  <!-- 行 3 1330..1360 -->
  <rect x="150" y="1330" width="300" height="30" fill="#FFFFFF" stroke="#C7D0DB" stroke-width="1"/>
  <text x="300" y="1350" font-size="12" fill="#263238" text-anchor="middle">Polar</text>
  <rect x="450" y="1330" width="1350" height="30" fill="#FFFFFF" stroke="#C7D0DB" stroke-width="1"/>
  <text x="1125" y="1350" font-size="12" fill="#263238" text-anchor="middle">rate recovery, frozen mask, f/g LLR, partial sums, PM, prune order, CRC/RNTI</text>

  <!-- 底线规则 -->
  <rect x="130" y="1380" width="1700" height="44" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="980" y="1408" font-size="12.5" fill="#37474F" text-anchor="middle">Rule: final CRC pass is not enough. A passing vector must preserve protocol metadata, deterministic seed, layout hash, checkpoint policy and failure replay evidence.</text>

  <!-- ============ 箭头（9 条，path 终点落在盒边上） ============ -->
  <g stroke="#5B6B82" stroke-width="2" fill="none">
    <path d="M 430 195 L 460 195" marker-end="url(#arrow)"/>
    <path d="M 820 195 L 850 195" marker-end="url(#arrow)"/>
    <path d="M 1210 195 L 1240 195" marker-end="url(#arrow)"/>
    <path d="M 1600 195 L 1630 195" marker-end="url(#arrow)"/>
    <path d="M 1030 280 L 1030 340" marker-end="url(#arrow)"/>
    <path d="M 1270 280 L 1270 340" marker-end="url(#arrow)"/>
    <path d="M 1290 280 L 1290 340" marker-end="url(#arrow)"/>
    <path d="M 400 500 L 400 580" marker-end="url(#arrow)"/>
    <path d="M 1560 500 L 1560 580" marker-end="url(#arrow)"/>
  </g>
</svg>
